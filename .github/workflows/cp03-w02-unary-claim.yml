name: CP03 W02 Unary Claim

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frontier and acquire non-conflicting claim
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          claim_path=Path('sessions/20260921-w02-unary-inference/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          assert claim['canonical_task']=='W02-10'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          task=tasks['W02-10']
          assert graph['first_executable_task']=='W02-10'
          assert task['status']=='READY'
          assert all(tasks[d]['status']=='COMPLETE' for d in task['depends_on'])
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646

          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          latest={}
          scopes={}
          for row in rows:
              cid=row.get('claim_id')
              if not cid:
                  continue
              latest[cid]=row.get('status', latest.get(cid))
              if 'scope' in row:
                  scopes.setdefault(cid,set()).update(row['scope'])
          ours=claim['claim_id']
          new_scope=set(claim['scope'])
          conflicts=[]
          for cid,status in latest.items():
              if cid==ours or status!='ACTIVE':
                  continue
              overlap=sorted(new_scope & scopes.get(cid,set()))
              if overlap:
                  conflicts.append((cid,overlap))
          assert not conflicts, f'active claim conflict: {conflicts}'
          if not any(row.get('claim_id')==ours for row in rows):
              compact=dict(claim)
              compact.pop('base_head',None)
              with ledger.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(compact,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          git diff --check
      - name: CAS persist claim
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m 'state(cp03-w02): acquire W02-10 unary inference claim'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
