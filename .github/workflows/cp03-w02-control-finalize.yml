name: CP03 W02 Correlation Registry Finalize

on:
  push:
    branches: [wave/cp03/w02-correlation-registry]
    paths:
      - 'scripts/cp03/finalize_w02_control.py'
      - 'tests/test_cp03_w02_control_finalizer.py'
      - '.github/workflows/cp03-w02-control-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-control-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: d9f15212566e016a055bc16fb490240c0b6127c2
      EVIDENCE_DIR: evidence/cp03/cp03-w02/W02-05
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Expand claim for evidence/state transaction and validate pre-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          text=ledger.read_text(encoding='utf-8')
          claim='CLAIM-CP03-W02-CONTROL-002'
          if claim not in text:
              raise SystemExit('W02-05 product claim was not materialized')
          row={
            'schema_version':1,'date':'2026-09-09','claim_id':claim,'event':'SCOPE_AMENDED',
            'wave_id':'CP03-W02-CONTROL-20260909-B','parent_wave':'CP03-W02','owner':'chatgpt-gpt-5.6-sol',
            'scope':['scripts/cp03/finalize_w02_control.py','tests/test_cp03_w02_control_finalizer.py','.github/workflows/cp03-w02-control-finalize.yml','iterations/03/waves/CP03-W02/TASK_GRAPH.json','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','HANDOFF.md','evidence/cp03/cp03-w02/W02-05/**','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'],
            'coordination':'Evidence/state finalization only after exact-head W02-05 reproof. May close W02-05; W02-04 remains frontier and W02-06 remains blocked until G1 teardown closes.'
          }
          marker='"event":"SCOPE_AMENDED","wave_id":"CP03-W02-CONTROL-20260909-B"'
          if marker not in text:
              with ledger.open('a', encoding='utf-8') as f:
                  f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python -m unittest tests.test_cp03_w02_control_finalizer -v
      - name: Install contract runtime and verify port source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          python scripts/cp03/w02_control_port.py -- --check
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          export CLEVER_TEST_PYTHON="$(command -v python)"
          echo "CLEVER_TEST_PYTHON=$CLEVER_TEST_PYTHON" >> "$GITHUB_ENV"
      - name: Reproduce 12 historical RED cases
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/red"
          git worktree add --detach /tmp/w02-control-red "$BASE_SHA"
          cp kernel/crates/clever-kernel/tests/control_regressions.rs /tmp/w02-control-red/kernel/crates/clever-kernel/tests/
          cp kernel/crates/clever-kernel/tests/fixtures/control_peer.py /tmp/w02-control-red/kernel/crates/clever-kernel/tests/fixtures/
          cases=(
            unrelated_health_is_rejected unrelated_cancel_is_rejected unrelated_shutdown_is_rejected
            unspecified_health_is_rejected false_green_health_is_rejected timeout_prevents_stale_connection_reuse
            protocol_failure_prevents_reuse malformed_body_is_rejected wrong_runtime_is_rejected
            registry_invalid_tail_is_atomic registry_duplicate_batch_is_rejected registry_existing_conflict_is_atomic
          )
          count=0
          for case in "${cases[@]}"; do
            set +e
            CLEVER_TEST_PYTHON="$CLEVER_TEST_PYTHON" cargo test --locked --manifest-path /tmp/w02-control-red/kernel/Cargo.toml -p clever-kernel --test control_regressions "$case" -- --exact --nocapture >"$EVIDENCE_DIR/red/$case.log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "historical case unexpectedly passed: $case"
              exit 1
            fi
            count=$((count+1))
          done
          test "$count" -eq 12
          python - <<'PY'
          import json
          from pathlib import Path
          Path('evidence/cp03/cp03-w02/W02-05/red-summary.json').write_text(json.dumps({'expected_failures':12,'status':'PASS'},sort_keys=True)+'\n')
          PY
      - name: GREEN 15 cases and five retests
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test control_regressions -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/green.log"
          grep -F '15 passed; 0 failed; 0 ignored' "$EVIDENCE_DIR/green.log"
          : > "$EVIDENCE_DIR/retest.log"
          for iteration in 1 2 3 4 5; do
            echo "=== retest $iteration ===" | tee -a "$EVIDENCE_DIR/retest.log"
            cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test control_regressions 2>&1 | tee -a "$EVIDENCE_DIR/retest.log"
          done
          test "$(grep -c '15 passed; 0 failed; 0 ignored' "$EVIDENCE_DIR/retest.log")" -eq 5
      - name: Regress W02-03 and full fake supervisor then Clippy
        run: |
          set -euo pipefail
          for case in inbound_frame_queue_is_bounded_under_flood inbound_wire_byte_budget_is_enforced_before_decode outbound_write_timeout_poison_session_when_peer_stops_reading; do
            cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor "$case" -- --exact --nocapture
          done
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor -- --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion 2>&1 | tee "$EVIDENCE_DIR/adapter-regression.log"
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/clippy.log"
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Compile exact evidence report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          report={
            'schema_version':1,'status':'PASS','scope':'W02-05_CORRELATION_ATOMIC_REGISTRY_NOT_INFERENCE',
            'validated_head':os.environ['GITHUB_SHA'],'historical_red_failures':12,'green_tests':15,
            'retest_executions':75,'w02_03_regression':'PASS','clippy':'PASS','parity_promotions':0,
            'K':47,'global_denominator':7565,'openjarvis_obligations':646
          }
          Path(os.environ['EVIDENCE_DIR'],'report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          git diff --check
      - name: Upload exact W02-05 proof
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w02-control-atomic-${{ github.sha }}
          path: evidence/cp03/cp03-w02/W02-05/
          if-no-files-found: error
          retention-days: 30
      - name: Finalize W02-05 only
        env:
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
          ARTIFACT_DIGEST_RAW: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          DIGEST="$ARTIFACT_DIGEST_RAW"
          case "$DIGEST" in sha256:*) ;; *) DIGEST="sha256:$DIGEST" ;; esac
          python scripts/cp03/finalize_w02_control.py \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$DIGEST"
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
      - name: Restrict finalizer mutation and CAS persist
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_prefix='evidence/cp03/cp03-w02/W02-05/'
          allowed={
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json','ledgers/CLAIM_LEDGER.ndjson',
            'ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson',
            'HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected={p for p in paths if p not in allowed and not p.startswith(allowed_prefix)}
          assert not unexpected, f'out-of-scope W02-05 finalizer mutation: {sorted(unexpected)}'
          assert 'iterations/03/waves/CP03-W02/TASK_GRAPH.json' in paths
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-correlation-registry | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/cp03/cp03-w02/W02-05 iterations/03/waves/CP03-W02/TASK_GRAPH.json ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'test(cp03-w02): persist W02-05 correlation and atomic registry evidence'
          git push origin HEAD:wave/cp03/w02-correlation-registry
