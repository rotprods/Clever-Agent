name: CP03 W02 Egress Finalize

on:
  push:
    branches: [wave/cp03/w02-egress-budget-20260921]
    paths:
      - 'scripts/cp03/finalize_w02_egress.py'
      - 'tests/test_cp03_w02_egress_finalizer.py'
      - 'tests/test_cp03_w02_plan.py'
      - '.github/workflows/cp03-w02-egress-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-egress-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python prerequisites
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
      - name: Exact-head W02-07 security gauntlet
        run: |
          set -euo pipefail
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security -- --nocapture
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel -- --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Pre-transition regression and durable-state validation
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cp03_w02_egress \
            tests.test_cp03_w02_egress_finalizer \
            tests.test_cp03_w02_inference_contract \
            tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          task={item['id']:item for item in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-07'
          assert task['W02-06']['status']=='COMPLETE' and task['W02-06']['proof']
          assert task['W02-07']['status']=='READY' and not task['W02-07']['proof']
          assert task['W02-08']['status']=='BLOCKED'
          assert task['W02-09']['status']=='BLOCKED'
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          PY
      - name: Persist W02-07 evidence and frontier
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_egress.py \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --prior-pr-run-id 35543092978
          python scripts/context/build_context_pack.py
      - name: Post-transition regression and gauntlet
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cp03_w02_egress \
            tests.test_cp03_w02_egress_finalizer \
            tests.test_cp03_w02_inference_contract \
            tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          task={item['id']:item for item in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-08'
          assert task['W02-07']['status']=='COMPLETE' and task['W02-07']['proof']
          assert task['W02-08']['status']=='READY'
          assert task['W02-09']['status']=='BLOCKED'
          assert task['W02-10']['status']=='BLOCKED'
          proof=task['W02-07']['proof'][-1]
          assert proof['result']=='PASS'
          assert proof['parity_promotions']==0
          assert proof['validated_head']==__import__('os').environ['GITHUB_SHA']
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-07/report.json').read_text())
          assert report['status']=='PASS'
          assert report['model_executions']==0
          assert report['provider_egress_executions']==0
          assert report['parity_promotions']==0
          PY
          git diff --check
      - name: Restrict finalization mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'evidence/cp03/cp03-w02/W02-07/report.json',
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'ledgers/CLAIM_LEDGER.ndjson',
            'ledgers/EVIDENCE_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson',
            'ledgers/DECISION_LEDGER.ndjson',
            'ledgers/RISK_LEDGER.ndjson',
            'HANDOFF.md',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-07 finalization mutation: {sorted(unexpected)}'
          required={
            'evidence/cp03/cp03-w02/W02-07/report.json',
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'ledgers/CLAIM_LEDGER.ndjson',
            'ledgers/EVIDENCE_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson',
            'ledgers/DECISION_LEDGER.ndjson',
            'ledgers/RISK_LEDGER.ndjson',
            'HANDOFF.md',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          missing=required-paths
          assert not missing, f'missing required W02-07 finalization mutation: {sorted(missing)}'
          PY
      - name: CAS persist W02-07 transition
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-egress-budget-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/cp03/cp03-w02/W02-07/report.json \
            iterations/03/waves/CP03-W02/TASK_GRAPH.json \
            ledgers/CLAIM_LEDGER.ndjson \
            ledgers/EVIDENCE_LEDGER.ndjson \
            ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson \
            ledgers/DECISION_LEDGER.ndjson \
            ledgers/RISK_LEDGER.ndjson \
            HANDOFF.md \
            .agentic/context/CURRENT_CONTEXT.json \
            .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): finalize W02-07 egress evidence'
          git push origin HEAD:wave/cp03/w02-egress-budget-20260921
