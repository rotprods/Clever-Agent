name: CP03 W02 Real Cancellation Claim

on:
  push:
    branches: [wave/cp03/w02-real-cancel-20260921]
    paths:
      - '.github/workflows/cp03-w02-cancel-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-real-cancel-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Acquire non-conflicting W02-12 claim
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          claim_id = 'CLAIM-CP03-W02-CANCEL-20260921'
          scope = [
              'adapters/openjarvis/cancellation.py',
              'adapters/openjarvis/sidecar.py',
              'kernel/crates/clever-kernel/src/adapter.rs',
              'kernel/crates/clever-kernel/tests/adapter_supervisor.rs',
              'tests/test_cp03_w02_cancellation.py',
              'tests/test_cp03_w02_plan.py',
              'scripts/cp03/w02_cancel_patch.py',
              'scripts/cp03/finalize_w02_cancel.py',
              '.github/workflows/cp03-w02-cancel.yml',
              '.github/workflows/cp03-w02-cancel-finalize.yml',
              'sessions/20260921-w02-cancel/**',
              'evidence/cp03/cp03-w02/W02-12/**',
              'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
              'STATE.md', 'HANDOFF.md',
              'ledgers/CLAIM_LEDGER.ndjson', 'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson', 'ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson', 'ledgers/RISK_LEDGER.ndjson',
              '.agentic/context/CURRENT_CONTEXT.json', '.agentic/context/CURRENT_CONTEXT.md',
          ]
          ledger = Path('ledgers/CLAIM_LEDGER.ndjson')
          rows = [json.loads(line) for line in ledger.read_text(encoding='utf-8').splitlines() if line.strip()]
          latest = {}
          for row in rows:
              latest[row['claim_id']] = row
          active = [row for row in latest.values() if row.get('status') == 'ACTIVE']
          if active:
              raise SystemExit(f'active claims present; refusing overlap guess: {[r.get("claim_id") for r in active]}')
          if claim_id in latest and latest[claim_id].get('status') == 'ACTIVE':
              raise SystemExit('claim already active')
          claim = {
              'schema_version': 1,
              'date': '2026-09-21',
              'event': 'CLAIM',
              'claim_id': claim_id,
              'wave_id': 'CP03-W02-CANCEL-20260921',
              'parent_wave': 'CP03-W02',
              'canonical_task': 'W02-12',
              'checkpoint': 'CP03',
              'project_id': 'CLEVER-JARVIS-001',
              'owner': 'chatgpt-gpt-5.6-sol',
              'scope': scope,
              'coordination': 'W02-12 only. Prove real single-flight cancellation over the W02-11 streaming lane using a killable worker process, explicit request/attempt targeting, distinct cancel ACK and CANCELLED terminal, bounded terminate->kill fallback, and UNKNOWN remote-effect semantics. No W02-13 typed/tool execution, W02-14 fallback, provider egress, parity promotion, denominator mutation, or W02 closure.',
              'status': 'ACTIVE',
          }
          with ledger.open('a', encoding='utf-8') as handle:
              handle.write(json.dumps(claim, sort_keys=True, separators=(',', ':')) + '\n')
          session = Path('sessions/20260921-w02-cancel')
          session.mkdir(parents=True, exist_ok=True)
          (session / 'CLAIM.json').write_text(json.dumps(claim, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          run = {
              'schema_version': 1, 'date': '2026-09-21', 'event': 'WORK_STARTED',
              'event_id': 'RUN-W02-CANCEL-START-20260921', 'goal_id': 'CLEVER-JARVIS-001',
              'checkpoint': 'CP03', 'iteration': 'I03', 'wave_id': 'CP03-W02-CANCEL-20260921',
              'canonical_task': 'W02-12', 'head': __import__('os').environ['EXPECTED_HEAD'],
              'status': 'IN_PROGRESS'
          }
          with Path('ledgers/RUN_LOG.ndjson').open('a', encoding='utf-8') as handle:
              handle.write(json.dumps(run, sort_keys=True, separators=(',', ':')) + '\n')
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-real-cancel-20260921 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson sessions/20260921-w02-cancel/CLAIM.json
          git commit -m 'chore(cp03-w02): claim W02-12 real cancellation'
          git push origin HEAD:wave/cp03/w02-real-cancel-20260921
