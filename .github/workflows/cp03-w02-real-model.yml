name: CP03 W02 Real Model Lane

on:
  push:
    branches: [wave/cp03/w02-real-model-lane-20260921]
    paths:
      - 'inventory/cp03/W02_REAL_MODEL_LANE.json'
      - 'scripts/cp03/w02_real_model.py'
      - 'tests/test_cp03_w02_real_model.py'
      - '.github/workflows/cp03-w02-real-model.yml'
  pull_request:
    branches: [main]
    paths:
      - 'inventory/cp03/W02_REAL_MODEL_LANE.json'
      - 'scripts/cp03/w02_real_model.py'
      - 'tests/test_cp03_w02_real_model.py'
      - '.github/workflows/cp03-w02-real-model.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-real-model-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENJARVIS_PIN: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  MODEL_PATH: /tmp/clever-w02-09/Qwen_Qwen3-0.6B-Q4_K_M.gguf

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate state, context and W02-09 manifest
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          python scripts/cp03/w02_real_model.py validate-manifest
          python -m unittest tests.test_cp03_w02_real_model -v
          git diff --check
      - name: RED characterization — absent weights are BLOCKED
        run: |
          set +e
          python scripts/cp03/w02_real_model.py verify --artifact /tmp/definitely-missing-w02-09.gguf >/tmp/missing.json
          code=$?
          set -e
          test "$code" -eq 3
          python - <<'PY'
          import json
          row=json.load(open('/tmp/missing.json'))
          assert row['status']=='BLOCKED'
          assert row['reason']=='ARTIFACT_MISSING'
          assert row['model_executions']==0
          assert row['parity_promotions']==0
          PY

  real_weights:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove pinned OpenJarvis catalog identity
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis-w02-09
          git init -q /tmp/openjarvis-w02-09
          git -C /tmp/openjarvis-w02-09 remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis-w02-09 fetch -q --depth=1 origin "$OPENJARVIS_PIN"
          test "$(git -C /tmp/openjarvis-w02-09 rev-parse FETCH_HEAD)" = "$OPENJARVIS_PIN"
          git -C /tmp/openjarvis-w02-09 checkout -q --detach FETCH_HEAD
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/openjarvis-w02-09/src/openjarvis/intelligence/model_catalog.py').read_text()
          marker='model_id="qwen3:0.6b"'
          start=src.index(marker)
          block=src[start:start+700]
          assert '"llamacpp"' in block, block
          assert '"hf_repo": "Qwen/Qwen3-0.6B"' in block, block
          PY
      - name: Controlled acquisition of immutable real weights
        env:
          CLEVER_ALLOW_MODEL_ACQUISITION: '1'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          python scripts/cp03/w02_real_model.py acquire --artifact "$MODEL_PATH" --receipt /tmp/w02-09-acquire.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/w02-09-acquire.json'))
          assert row['status']=='PASS', row
          assert row['reason'] in {'ACQUIRED_AND_VERIFIED','ALREADY_PRESENT_AND_VERIFIED'}
          assert row['observed_size_bytes']==484220320
          assert row['observed_sha256']=='9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14'
          assert row['observed_magic_hex']=='47475546'
          assert row['model_executions']==0
          assert row['provider_egress_executions']==0
          assert row['parity_promotions']==0
          PY
      - name: Offline verification under network none
        run: |
          set -euo pipefail
          docker pull -q python:3.12.11-slim-bookworm >/dev/null
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "/tmp/clever-w02-09:/weights:ro" \
            -w /repo \
            python:3.12.11-slim-bookworm \
            python scripts/cp03/w02_real_model.py verify \
              --artifact /weights/Qwen_Qwen3-0.6B-Q4_K_M.gguf \
            > /tmp/w02-09-offline.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/w02-09-offline.json'))
          assert row['status']=='PASS', row
          assert row['reason']=='PINNED_REAL_WEIGHTS_VERIFIED'
          assert row['model_executions']==0
          assert row['provider_egress_executions']==0
          assert row['parity_promotions']==0
          assert row['verified_capabilities']==0
          assert row['global_denominator']==7565
          assert row['openjarvis_obligations']==646
          PY
      - name: Regression and gauntlet
        run: |
          set -euo pipefail
          python -m unittest tests.test_cp03_w02_real_model tests.test_cp03_w02_model_bridge_finalizer -v
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Build evidence receipt
        run: |
          python - <<'PY'
          import json, os
          a=json.load(open('/tmp/w02-09-acquire.json'))
          o=json.load(open('/tmp/w02-09-offline.json'))
          out={
            'schema_version':1,
            'project_id':'CLEVER-JARVIS-001',
            'checkpoint':'CP03',
            'parent_wave':'CP03-W02',
            'task':'W02-09',
            'status':'PASS',
            'validated_head':os.environ['GITHUB_SHA'],
            'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'openjarvis_commit':os.environ['OPENJARVIS_PIN'],
            'engine':'llamacpp',
            'runtime_repository':'ggml-org/llama.cpp',
            'runtime_commit':'391fac16460f15233a7740550d858ac96df3419d',
            'runtime_executed':False,
            'model_id':'qwen3:0.6b',
            'base_model_revision':'66b95ce14c07166297fcbfb54aa20441af8f9d75',
            'license':'Apache-2.0',
            'artifact_repository':a['artifact_repository'],
            'artifact_revision':a['artifact_revision'],
            'artifact_filename':a['artifact_filename'],
            'artifact_size_bytes':a['observed_size_bytes'],
            'artifact_sha256':a['observed_sha256'],
            'offline_verification':'PASS',
            'model_executions':o['model_executions'],
            'provider_egress_executions':o['provider_egress_executions'],
            'parity_promotions':o['parity_promotions'],
            'verified_capabilities':o['verified_capabilities'],
            'global_denominator':o['global_denominator'],
            'openjarvis_obligations':o['openjarvis_obligations'],
          }
          open('/tmp/w02-09-receipt.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Upload evidence receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-real-model-${{ github.sha }}
          path: /tmp/w02-09-receipt.json
          retention-days: 14
          if-no-files-found: error

  finalize:
    if: github.event_name == 'push'
    needs: real_weights
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cp03-w02-real-model-${{ github.sha }}
          path: /tmp/w02-09-evidence
      - name: Exact-head finalize W02-09 and open only W02-10
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/cp03/finalize_w02_real_model.py \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --receipt /tmp/w02-09-evidence/w02-09-receipt.json
          python scripts/context/build_context_pack.py
      - name: Post-transition regression and gauntlet
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_cp03_w02_real_model \
            tests.test_cp03_w02_real_model_finalizer \
            tests.test_cp03_w02_plan -v
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Restrict durable transition mutation
        run: |
          python - <<'PY'
          import subprocess
          allowed_prefixes=(
              'evidence/cp03/cp03-w02/W02-09/',
              'sessions/20260921-w02-real-model/',
          )
          allowed_exact={
              'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson',
              'ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson',
              'ledgers/RISK_LEDGER.ndjson',
              'HANDOFF.md',
              '.agentic/context/CURRENT_CONTEXT.json',
              '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected={p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefixes)}
          assert not unexpected, f'out-of-scope W02-09 transition mutation: {sorted(unexpected)}'
          required={
              'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'HANDOFF.md',
              '.agentic/context/CURRENT_CONTEXT.json',
          }
          missing=required-paths
          assert not missing, f'missing durable W02-09 transition surfaces: {sorted(missing)}'
          PY
      - name: CAS persist exact-head W02-09 transition
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/wave/cp03/w02-real-model-lane-20260921 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            iterations/03/waves/CP03-W02/TASK_GRAPH.json \
            evidence/cp03/cp03-w02/W02-09 \
            sessions/20260921-w02-real-model \
            ledgers/CLAIM_LEDGER.ndjson \
            ledgers/EVIDENCE_LEDGER.ndjson \
            ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson \
            ledgers/DECISION_LEDGER.ndjson \
            ledgers/RISK_LEDGER.ndjson \
            HANDOFF.md \
            .agentic/context/CURRENT_CONTEXT.json \
            .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): complete W02-09 real-model materialization'
          git push origin HEAD:wave/cp03/w02-real-model-lane-20260921
