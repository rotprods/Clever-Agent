name: CP01 Full Compiler Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp01-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python tooling
        run: python -m compileall -q scripts tests
      - name: Run complete CP01 unit/regression suite
        run: python -m unittest discover -s tests -v
      - name: W01 acquire exact upstream object stores
        run: python -m scripts.upstream.sync_upstreams
      - name: W01 verify immutable pins
        run: python -m scripts.upstream.verify_pins
      - name: W01 materialize source-only projections
        run: python -m scripts.upstream.source_projection
      - name: W02 compile complete-tree structural inventories
        run: python -m scripts.inventory.batch
      - name: W03 compile behavioral/public surfaces
        run: python -m scripts.cp01.w03
      - name: W04 compile capability denominator
        run: python -m scripts.cp01.capabilities
      - name: W05 compile baseline availability matrix
        run: python -m scripts.cp01.baselines
      - name: W06 compile license/NOTICE/supply-chain evidence
        run: python -m scripts.cp01.supply_chain
      - name: W07 build capability graph and COS20D completeness gauntlet
        run: python -m scripts.cp01.graph_gauntlet
      - name: W08 compile CP01 release candidate and CP02 requirements
        run: python -m scripts.cp01.release --candidate-sha "$SOURCE_SHA"
      - name: Assert CP01 denominator remains source-derived
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          denominator = json.loads(Path('reports/cp01/capability_denominator.json').read_text())
          ledger_lines = [line for line in Path('ledgers/CAPABILITY_LEDGER.jsonl').read_text().splitlines() if line.strip()]
          assert denominator['denominator'] == len(ledger_lines) == 7565
          assert denominator['verified'] == 0
          assert denominator['by_repo']['openjarvis'] == 646
          PY
      - name: Upload complete CP01 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: cp01-replay-${{ env.SOURCE_SHA }}
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/cp01/**
            inventory/upstreams/*.json
            inventory/surfaces/*.jsonl
            ledgers/CAPABILITY_LEDGER.jsonl
            graphs/capability_graph.json
            reports/cp01/*.json
            reports/CP01_CAPABILITY_REPORT.md
            reports/CP02_CONTRACT_REQUIREMENTS.md
            licenses/UPSTREAM_NOTICES.md
