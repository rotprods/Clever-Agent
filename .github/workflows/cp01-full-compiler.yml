name: CP01 Full Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - wave/cp01/i01-w01-graphify-cosgraph
    paths:
      - 'scripts/cp01/**'
      - 'scripts/upstream/**'
      - 'scripts/inventory/**'
      - 'inventory/schemas/**'
      - 'tests/**'
      - 'UPSTREAM_LEDGER.yaml'
      - '.github/workflows/cp01-full-compiler.yml'
  pull_request:
    paths:
      - 'scripts/cp01/**'
      - 'scripts/upstream/**'
      - 'scripts/inventory/**'
      - 'inventory/schemas/**'
      - 'tests/**'
      - 'UPSTREAM_LEDGER.yaml'

permissions:
  contents: read

jobs:
  cp01-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Assert checkout matches source candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "source candidate: $SOURCE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python tooling
        run: python -m compileall -q scripts tests
      - name: Run complete CP01 unit/regression suite
        run: python -m unittest discover -s tests -v
      - name: W01 acquire exact upstream object stores
        run: python -m scripts.upstream.sync_upstreams
      - name: W01 verify immutable pins
        run: python -m scripts.upstream.verify_pins
      - name: W01 materialize source-only projections
        run: python -m scripts.upstream.source_projection
      - name: W02 compile complete-tree structural inventories
        run: python -m scripts.inventory.batch
      - name: W03 compile behavioral/public surfaces
        run: python -m scripts.cp01.w03
      - name: W04 compile capability denominator
        run: python -m scripts.cp01.capabilities
      - name: W05 compile baseline availability matrix
        run: python -m scripts.cp01.baselines
      - name: W06 compile license/NOTICE/supply-chain evidence
        run: python -m scripts.cp01.supply_chain
      - name: W07 build capability graph and COS20D completeness gauntlet
        run: python -m scripts.cp01.graph_gauntlet
      - name: W08 compile CP01 release candidate and CP02 requirements
        run: python -m scripts.cp01.release --candidate-sha "$SOURCE_SHA"
      - name: Assert CP01 release invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path('evidence/cp01/CP01_RELEASE_CANDIDATE.json').read_text())
          denominator = json.loads(Path('reports/cp01/capability_denominator.json').read_text())
          w03 = json.loads(Path('reports/cp01/w03_surface_summary.json').read_text())
          w04 = json.loads(Path('evidence/cp01/gauntlet/w04_denominator.json').read_text())
          w05 = json.loads(Path('evidence/cp01/baselines/baseline_matrix.json').read_text())
          w06 = json.loads(Path('evidence/cp01/supply_chain.json').read_text())
          w07 = json.loads(Path('evidence/cp01/gauntlet/w07_complete.json').read_text())
          ledger_lines = [line for line in Path('ledgers/CAPABILITY_LEDGER.jsonl').read_text().splitlines() if line.strip()]
          assert candidate['status'] == 'PASS', candidate
          assert candidate['cp01_ready_for_state_transition'] is True
          assert candidate['candidate_sha'] == os.environ['SOURCE_SHA']
          assert candidate['hard_invariants']['migration_authorized'] is False
          assert candidate['hard_invariants']['cp01_parity_claimed_complete'] is False
          assert candidate['hard_invariants']['not_run_is_not_pass'] is True
          assert candidate['hard_invariants']['candidate_definition_is_not_capability'] is True
          assert candidate['hard_invariants']['cross_repo_auto_dedupe'] is False
          assert denominator['denominator'] == len(ledger_lines) > 0
          assert denominator['source_surface_count'] == w03['surface_summary']['surface_count']
          assert denominator['source_surface_count'] == denominator['denominator'] + denominator['deferred_candidate_surface_count']
          assert denominator['verified'] == 0
          assert set(denominator['by_repo']) == {'openjarvis','openclaw','omi','clicky'}
          assert all(v > 0 for v in denominator['by_repo'].values())
          assert w04['status'] == w05['status'] == w06['status'] == w07['status'] == 'PASS'
          assert w04['eligible_surface_count'] == denominator['denominator']
          assert all(row['execution_status'] != 'PASS' for row in w05['baselines'])
          clicky = next(row for row in w05['sources'] if row['source_repo'] == 'clicky')
          assert clicky['classifications'].get('PLATFORM_GATED', 0) >= 1
          assert w07['counts']['relations'].get('registered_via', 0) < denominator['denominator']
          assert w07['invariants']['registered_via_requires_registration_surface'] is True
          assert Path('reports/CP01_CAPABILITY_REPORT.md').stat().st_size > 0
          assert Path('reports/CP02_CONTRACT_REQUIREMENTS.md').stat().st_size > 0
          PY
      - name: Upload complete CP01 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: cp01-release-candidate-${{ env.SOURCE_SHA }}
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/cp01/**
            inventory/upstreams/*.json
            inventory/surfaces/*.jsonl
            ledgers/CAPABILITY_LEDGER.jsonl
            graphs/capability_graph.json
            reports/cp01/*.json
            reports/CP01_CAPABILITY_REPORT.md
            reports/CP02_CONTRACT_REQUIREMENTS.md
            licenses/UPSTREAM_NOTICES.md
