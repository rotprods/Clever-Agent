name: CP03 W02 P01 Performance Claim

on:
  push:
    branches: [wave/cp03/w02-performance-baseline-20260922]
    paths:
      - '.github/workflows/cp03-w02-performance-claim.yml'
      - 'sessions/20260922-w02-performance-baseline/CLAIM.json'

permissions:
  contents: write

concurrency:
  group: cp03-w02-p01-performance-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Activate proposed claim exactly once
        shell: bash
        run: |
          set -euo pipefail
          status="$(python -c "import json; print(json.load(open('sessions/20260922-w02-performance-baseline/CLAIM.json'))['status'])")"
          if [ "$status" != "PROPOSED" ]; then
            echo "claim already transitioned: $status; bootstrap is an intentional no-op"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-performance-baseline-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8"
          test "$(git merge-base HEAD origin/main)" = "9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8"
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-performance-baseline/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PERFORMANCE-20260922'
          assert claim['status']=='PROPOSED' and claim['canonical_task']=='W02-16'
          assert claim['base_head']=='9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-16']['depends_on']==['W02-15'] and tasks['W02-15']['status']=='COMPLETE'
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if x.strip()]
          latest={}
          for row in rows:
              if row.get('claim_id'): latest[row['claim_id']]=row
          target=set(claim['scope'])
          for cid,row in latest.items():
              if row.get('status')!='ACTIVE': continue
              assert row.get('canonical_task')!='W02-16', f'conflicting active W02-16 claim: {cid}'
              overlap=target & set(row.get('scope',[]))
              assert not overlap, f'exact scope collision with {cid}: {sorted(overlap)}'
          prior=json.loads(Path('evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json').read_text())
          assert prior['result']=='PASS' and prior['performance_baseline_same_host']=='NOT_RUN'
          assert prior['repetitions_executed']==20 and prior['failed_invocations']==0
          claim['event']='CLAIM'; claim['status']='ACTIVE'
          Path('sessions/20260922-w02-performance-baseline/CLAIM.json').write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
          with Path('ledgers/CLAIM_LEDGER.ndjson').open('a',encoding='utf-8') as h:
              h.write(json.dumps(claim,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={'sessions/20260922-w02-performance-baseline/CLAIM.json','ledgers/CLAIM_LEDGER.ndjson','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}
          changed={x[3:] for x in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if x}
          assert changed <= allowed, sorted(changed-allowed)
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-performance-baseline-20260922 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260922-w02-performance-baseline/CLAIM.json ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'coord(cp03-w02): claim W02-16 P01 performance baseline'
          git push origin HEAD:wave/cp03/w02-performance-baseline-20260922
