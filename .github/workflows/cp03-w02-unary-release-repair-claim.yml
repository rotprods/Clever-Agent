name: CP03 W02 Unary Postmerge Release

on:
  push:
    branches: [repair/cp03-w02-unary-postmerge-release-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-release-repair-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-postmerge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Release W02-10 convergence claim after canonical merge qualification
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c5c7397f936d612a47af1ca6592c89cfcc12d7e8 HEAD
          python - <<'PY'
          import json
          from pathlib import Path

          claim_id = 'CLAIM-CP03-W02-UNARY-RELEASE-REPAIR-20260921'
          wave_id = 'CP03-W02-UNARY-RELEASE-REPAIR-20260921'
          ledger = Path('ledgers/CLAIM_LEDGER.ndjson')
          rows = [json.loads(line) for line in ledger.read_text(encoding='utf-8').splitlines() if line.strip()]
          latest = None
          for row in rows:
              if row.get('claim_id') == claim_id and row.get('status'):
                  latest = row['status']
          assert latest == 'ACTIVE', f'expected active convergence claim, got {latest!r}'

          graph = json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text(encoding='utf-8'))
          tasks = {task['id']: task for task in graph['tasks']}
          assert tasks['W02-10']['status'] == 'COMPLETE'
          assert tasks['W02-11']['status'] == 'READY'
          assert graph['global_denominator'] == 7565
          assert graph['openjarvis_obligations'] == 646

          release = {
              'schema_version': 1,
              'date': '2026-09-21',
              'claim_id': claim_id,
              'event': 'RELEASE',
              'wave_id': wave_id,
              'owner': 'chatgpt-gpt-5.6-sol',
              'status': 'RELEASED',
              'release_evidence_id': 'EVID-W02-UNARY-INFERENCE-20260921',
              'postmerge_head': 'c5c7397f936d612a47af1ca6592c89cfcc12d7e8',
              'postmerge_agentic_run_id': 35585540665,
              'coordination': 'Canonical W02-10 merge and post-merge Agentic Contract passed; release repair claim closed. W02-11 remains READY and unclaimed. No parity or denominator mutation.'
          }
          with ledger.open('a', encoding='utf-8') as handle:
              handle.write(json.dumps(release, sort_keys=True, separators=(',', ':')) + '\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          git diff --check
      - name: CAS persist released claim and ContextPack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/repair/cp03-w02-unary-postmerge-release-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m 'release(cp03-w02): close unary convergence claim'
          git push origin HEAD:repair/cp03-w02-unary-postmerge-release-20260921
