name: CP03 W02 Unary Release Repair Claim

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-release-repair-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-release-repair-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize non-conflicting release claim
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260921-w02-unary-release-repair/CLAIM.json').read_text())
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          latest={}
          scopes={}
          for row in rows:
              cid=row.get('claim_id')
              if cid:
                  if row.get('scope'):
                      scopes.setdefault(cid,set()).update(row['scope'])
                  if row.get('status'):
                      latest[cid]=row['status']
          active={cid for cid,status in latest.items() if status=='ACTIVE' and cid != claim['claim_id']}
          overlap=[]
          wanted=set(claim['scope'])
          for cid in sorted(active):
              shared=wanted & scopes.get(cid,set())
              if shared:
                  overlap.append((cid,sorted(shared)))
          assert not overlap, f'overlapping active claims: {overlap}'
          if not any(row.get('claim_id')==claim['claim_id'] for row in rows):
              with ledger.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(claim,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          git diff --check
      - name: CAS persist claim and ContextPack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m 'claim(cp03-w02): activate unary release regression repair'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
