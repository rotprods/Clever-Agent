name: CP03 W02 IO Finalize

on:
  push:
    branches: [wave/cp03/w02-io-backpressure]
    paths:
      - 'scripts/cp03/finalize_w02_io.py'
      - 'tests/test_cp03_w02_io_finalizer.py'
      - '.github/workflows/cp03-w02-io-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w02-io-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconcile exact pre-transition authority
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.cp03.w02_scope_lock
          python scripts/cp03/w02_io_harness.py --check
          python -m unittest discover -s tests -p 'test_cp03_w02_io_finalizer.py' -v

      - name: Re-prove W02-03 adversarial behavior
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          export CLEVER_TEST_PYTHON="$(command -v python)"
          ROOT='evidence/cp03/cp03-w02/W02-03'
          mkdir -p "$ROOT/tests"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact --nocapture 2>&1 | tee "$ROOT/tests/inbound_frame_queue_is_bounded_under_flood.log"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact --nocapture 2>&1 | tee "$ROOT/tests/inbound_wire_byte_budget_is_enforced_before_decode.log"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor outbound_write_timeout_poison_session_when_peer_stops_reading -- --exact --nocapture 2>&1 | tee "$ROOT/tests/outbound_write_timeout_poison_session_when_peer_stops_reading.log"
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "$ROOT/clippy.log"
          python -m scripts.parity.ledger --check --source-repo openjarvis | tee "$ROOT/parity.json"

      - name: Compile exact-head evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import xml.etree.ElementTree as ET

          root = Path('evidence/cp03/cp03-w02/W02-03')
          tests = [
              'inbound_frame_queue_is_bounded_under_flood',
              'inbound_wire_byte_budget_is_enforced_before_decode',
              'outbound_write_timeout_poison_session_when_peer_stops_reading',
          ]
          for test_id in tests:
              text = (root / 'tests' / f'{test_id}.log').read_text(encoding='utf-8')
              expected = 'test result: ok. 1 passed; 0 failed; 0 ignored'
              if expected not in text:
                  raise SystemExit(f'exact test evidence missing one executed PASS: {test_id}')
          parity = json.loads((root / 'parity.json').read_text(encoding='utf-8'))
          if parity.get('source_repo') != 'openjarvis' or parity.get('total') != 646 or parity.get('verified') != 0:
              raise SystemExit(f'parity drift in W02-03 proof: {parity}')
          report = {
              'schema_version': 1,
              'status': 'PASS',
              'scope': 'CP03-W02-IO-BOUNDARIES-NOT-PARITY',
              'validated_head': os.environ['GITHUB_SHA'],
              'required_test_ids': tests,
              'executed_test_ids': tests,
              'executed_count': len(tests),
              'failed': 0,
              'ignored': 0,
              'parity_promotions': 0,
          }
          (root / 'report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          suite = ET.Element('testsuite', name='cp03-w02-io', tests='3', failures='0', skipped='0')
          for test_id in tests:
              ET.SubElement(suite, 'testcase', classname='adapter_supervisor', name=test_id)
          ET.ElementTree(suite).write(root / 'results.junit.xml', encoding='unicode', xml_declaration=False)
          PY
          python -m scripts.cp03.finalize_w02_io --help >/dev/null

      - name: Upload exact-head W02-03 proof
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-io-final-${{ github.sha }}
          path: evidence/cp03/cp03-w02/W02-03/
          if-no-files-found: error
          retention-days: 30

      - name: Apply evidence-backed W02-03 transition
        run: |
          set -euo pipefail
          python -m scripts.cp03.finalize_w02_io \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --artifact-id '${{ steps.proof.outputs.artifact-id }}' \
            --artifact-digest 'sha256:${{ steps.proof.outputs.artifact-digest }}'
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Restrict durable transition surface
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson',
              'ledgers/WAVE_LEDGER.ndjson',
              'HANDOFF.md',
              '.agentic/context/CURRENT_CONTEXT.json',
              '.agentic/context/CURRENT_CONTEXT.md',
          }
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-uall'], text=True).splitlines()
          paths = {line[3:] for line in raw if line}
          evidence_prefix = 'evidence/cp03/cp03-w02/W02-03/'
          unexpected = {p for p in paths if p not in allowed and not p.startswith(evidence_prefix)}
          assert not unexpected, f'out-of-scope W02-03 finalizer mutation: {sorted(unexpected)}'
          assert paths & allowed, 'W02-03 finalizer produced no durable transition'
          PY

      - name: Compare-and-swap persist W02-03 transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-io-backpressure | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): persist W02-03 evidence and open W02-04/W02-05'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:wave/cp03/w02-io-backpressure
