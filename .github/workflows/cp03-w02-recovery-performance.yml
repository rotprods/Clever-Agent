name: CP03 W02 Recovery Retest

on:
  push:
    branches:
      - wave/cp03/w02-recovery-performance-20260922
    paths:
      - '.github/workflows/cp03-w02-recovery-performance.yml'
      - 'scripts/cp03/w02_recovery_retest.py'
      - 'scripts/cp03/finalize_w02_recovery_retest.py'
      - 'tests/test_cp03_w02_recovery_retest.py'

permissions:
  contents: write

concurrency:
  group: cp03-w02-recovery-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned Python contract runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt

      - name: Exact-head, base, claim and DAG guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-recovery-performance-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-recovery-performance/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-RECOVERY-PERF-20260922'
          assert claim['canonical_task']=='W02-16' and claim['status']=='ACTIVE'
          assert claim['base_head']=='4b8923973a3d6bb2a74d8d846e00db79c8aabec3'
          ledger=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in ledger:
              latest[row['claim_id']]=row
          active=latest.get(claim['claim_id'])
          assert active and active.get('status')=='ACTIVE', active
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-16']['depends_on']==['W02-15']
          assert tasks['W02-15']['status']=='COMPLETE'
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          PY
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-recovery-performance/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m unittest -v tests.test_cp03_w02_plan tests.test_cp03_w02_recovery_retest
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis

      - name: Compile recovery target once
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor --no-run

      - name: Run fixed 20x cancel-flood-restart matrix
        env:
          CLEVER_TEST_PYTHON: ${{ env.pythonLocation }}/bin/python
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python scripts/cp03/w02_recovery_retest.py run --out /tmp/w02-16-recovery-report.json

      - name: Preserve recovery report even on gate failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-recovery-retest-${{ github.sha }}
          path: /tmp/w02-16-recovery-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Targeted clean retest and regression gauntlet
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python scripts/cp03/w02_recovery_retest.py validate --report /tmp/w02-16-recovery-report.json
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor cancellation_
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor crash_restart_budget_is_bounded -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor stream_
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor fallback_transport_
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m unittest -v tests.test_cp03_w02_plan tests.test_cp03_w02_recovery_retest tests.test_cp03_openjarvis_sidecar
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Persist partial W02-16 evidence and release bounded claim
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          W02_RECOVERY_REPORT: /tmp/w02-16-recovery-report.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_recovery_retest.py
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m unittest -v tests.test_cp03_w02_plan tests.test_cp03_w02_recovery_retest
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json').read_text())
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert report['result']=='PASS' and report['repetitions_executed']==20
          assert report['invocations_executed']==80 and report['failed_invocations']==0
          assert report['all_results_retained'] is True and report['best_rerun_selection'] is False
          assert report['performance_baseline_same_host']=='NOT_RUN' and report['performance_claims']==0
          assert report['provider_egress_executions']==0 and report['model_executions']==0 and report['tool_executions']==0
          assert report['parity_promotions']==0
          claim=json.loads(Path('sessions/20260922-w02-recovery-performance/CLAIM.json').read_text())
          assert claim['status']=='RELEASED'
          PY
          git diff --check

      - name: Restrict durable mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'HANDOFF.md',
              'sessions/20260922-w02-recovery-performance/CLAIM.json',
              'sessions/20260922-w02-recovery-performance/RESULT.json',
              'evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson',
              'ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson',
              'ledgers/RISK_LEDGER.ndjson',
              '.agentic/context/CURRENT_CONTEXT.json',
              '.agentic/context/CURRENT_CONTEXT.md',
          }
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          assert changed <= allowed, f'out-of-scope W02-16 persistence mutation: {sorted(changed-allowed)}'
          required={
              'HANDOFF.md',
              'sessions/20260922-w02-recovery-performance/CLAIM.json',
              'sessions/20260922-w02-recovery-performance/RESULT.json',
              'evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson',
              'ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson',
              'ledgers/RISK_LEDGER.ndjson',
          }
          assert required <= changed, f'missing durable W02-16 persistence: {sorted(required-changed)}'
          PY

      - name: CAS persist exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-recovery-performance-20260922 | cut -f1)" = "$expected_head"
          git fetch origin main
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-recovery-performance/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HANDOFF.md sessions/20260922-w02-recovery-performance/CLAIM.json sessions/20260922-w02-recovery-performance/RESULT.json evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'test(cp03-w02): persist W02-16 recovery retest evidence'
          git push origin HEAD:wave/cp03/w02-recovery-performance-20260922
