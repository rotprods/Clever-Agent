name: CP03 W02 Model Bridge Release Finalize

on:
  push:
    branches: [release/cp03-w02-model-bridge-20260921]
    paths:
      - '.github/workflows/cp03-w02-model-bridge-release-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-model-bridge-release-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head release-claim preflight
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/cp03-w02-model-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          claim_id='CLAIM-CP03-W02-MODEL-BRIDGE-RELEASE-20260921'
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          claim=latest[claim_id]
          assert claim['status']=='ACTIVE', claim
          conflicts=[cid for cid,row in latest.items() if cid!=claim_id and row.get('status')=='ACTIVE']
          assert not conflicts, conflicts
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-09'
          assert tasks['W02-08']['status']=='COMPLETE' and tasks['W02-08']['proof']
          assert tasks['W02-09']['status']=='READY' and not tasks['W02-09']['proof']
          assert tasks['W02-10']['status']=='BLOCKED'
          PY
      - name: Install deterministic Python prerequisites
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'jsonschema==4.25.1'
      - name: Re-prove W02-08 lifecycle and regressions
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_openjarvis_sidecar \
            tests.test_cp03_w02_model_bridge_finalizer \
            tests.test_cp03_w02_inference_contract \
            tests.test_cp03_w02_egress \
            tests.test_cp03_w02_plan
          python -m py_compile adapters/openjarvis/model_bridge.py scripts/cp03/finalize_w02_model_bridge.py
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel -- --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Re-prove pinned native catalog without network or inference
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-openjarvis-w02-08-release-base:$GITHUB_SHA" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-w02-08-release-context
          docker build \
            --build-arg "BASE_IMAGE=clever-openjarvis-w02-08-release-base:$GITHUB_SHA" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-openjarvis-w02-08-release:$GITHUB_SHA" \
            /tmp/openjarvis-w02-08-release-context
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/config \
            -e XDG_DATA_HOME=/tmp/data \
            -e PYTHONHASHSEED=0 \
            -e PYTHONPATH=/clever:/src/src \
            -v "$GITHUB_WORKSPACE:/clever:ro" \
            "clever-openjarvis-w02-08-release:$GITHUB_SHA" \
            'exec /src/.venv/bin/python /clever/adapters/openjarvis/model_bridge.py --dump-catalog' \
            > /tmp/w02-08-release-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/w02-08-release-catalog.json').read_text())
          assert data['upstream_commit']=='72033b8ec288aa067ce4530ff9d96bf231e9c4e5'
          assert data['engine_count']==15, data
          assert data['model_count']==69, data
          assert data['import_failures']==[], data
          assert data['upstream_execution'] is False
          assert data['model_executions']==0
          assert data['provider_egress_executions']==0
          assert data['parity_promotions']==0
          assert all(row['state']=='REGISTERED' for row in data['engines'])
          assert all(row['state']=='REGISTERED' for row in data['models'])
          PY
      - name: State, ContextPack and parity gauntlet
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-09'
          assert tasks['W02-08']['status']=='COMPLETE' and tasks['W02-08']['proof']
          proof=tasks['W02-08']['proof'][-1]
          assert proof['parity_promotions']==0 and proof['model_executions']==0 and proof['provider_egress_executions']==0
          assert tasks['W02-09']['status']=='READY' and not tasks['W02-09']['proof']
          assert tasks['W02-10']['status']=='BLOCKED' and not tasks['W02-10']['proof']
          PY
          git diff --check
      - name: Persist release evidence and release claim
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/cp03-w02-model-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-MODEL-BRIDGE-RELEASE-20260921'
          claim_id='CLAIM-CP03-W02-MODEL-BRIDGE-RELEASE-20260921'
          wave_id='CP03-W02-MODEL-BRIDGE-RELEASE-20260921'
          head=os.environ['GITHUB_SHA']
          run_id=int(os.environ['GITHUB_RUN_ID'])
          catalog=json.loads(Path('/tmp/w02-08-release-catalog.json').read_text())

          evidence={
              'schema_version':1,'date':'2026-09-21','evidence_id':evidence_id,
              'status':'VERIFIED','type':'cp03_w02_model_bridge_release_reconciliation',
              'wave_id':'CP03-W02','support_wave':wave_id,
              'claim':'Finalized W02-08 is re-proven at exact release head: lifecycle/catalog behavior, pinned native catalog, W02-07 security, kernel regression, state/ContextPack and parity invariants all pass. The release gate now validates the persisted W02-09 frontier rather than stale pre-finalization W02-08 READY state.',
              'github_actions_run_id':run_id,'validated_head':head,
              'global_denominator':7565,'openjarvis_obligations':646,'w02_proof_units':47,
              'native_engine_count':catalog['engine_count'],'native_model_count':catalog['model_count'],
              'model_executions':0,'provider_egress_executions':0,'parity_promotions':0,
              'prior_red_pr_run_id':35554377801,'green_release_run_id':35554668177,
              'root_cause':'release workflow asserted pre-finalization W02-08 READY/W02-09 BLOCKED after durable finalizer had already transitioned W02-08 COMPLETE/W02-09 READY'
          }
          ep=Path('ledgers/EVIDENCE_LEDGER.ndjson')
          existing=[json.loads(x) for x in ep.read_text().splitlines() if x.strip()]
          assert evidence_id not in {row.get('evidence_id') for row in existing}
          with ep.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps(evidence,sort_keys=True,separators=(',',':'))+'\n')
          out=Path('evidence/cp03/cp03-w02/W02-08/release_reconciliation.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(evidence,sort_keys=True,indent=2)+'\n',encoding='utf-8')

          dp=Path('ledgers/DECISION_LEDGER.ndjson')
          decisions=[json.loads(x) for x in dp.read_text().splitlines() if x.strip()]
          assert 'D-0014' not in {row.get('decision_id') for row in decisions}
          with dp.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','decision_id':'D-0014','status':'ACCEPTED',
                  'decision':'Release and PR gates validate the durable post-finalization DAG frontier; staging-only READY/BLOCKED assertions may not be reused after an exact-head finalizer advances task state.',
                  'context':'PR #41 exposed a false-negative release gate after W02-08 was already evidence-backed COMPLETE. The behavioral, security and parity lanes were green; only stale frontier assertions failed.',
                  'evidence_id':evidence_id
              },sort_keys=True,separators=(',',':'))+'\n')

          rp=Path('ledgers/RISK_LEDGER.ndjson')
          risks=[json.loads(x) for x in rp.read_text().splitlines() if x.strip()]
          assert 'RISK-0008' not in {row.get('risk_id') for row in risks}
          with rp.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','risk_id':'RISK-0008','status':'CLOSED','severity':'MEDIUM',
                  'risk':'A release workflow can drift behind durable task transitions and falsely reject a completed wave, blocking convergence despite valid behavioral evidence.',
                  'mitigation':'W02-08 release gate now asserts the finalized W02-09 frontier plus persisted W02-08 proof and zero-execution/parity invariants; the exact-head release finalizer re-proves the full gate.',
                  'evidence_id':evidence_id
              },sort_keys=True,separators=(',',':'))+'\n')

          cp=Path('ledgers/CLAIM_LEDGER.ndjson')
          with cp.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','claim_id':claim_id,'event':'RELEASE',
                  'wave_id':wave_id,'owner':'chatgpt-gpt-5.6-sol','status':'RELEASED','release_evidence_id':evidence_id
              },sort_keys=True,separators=(',',':'))+'\n')
          wp=Path('ledgers/WAVE_LEDGER.ndjson')
          with wp.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','checkpoint':'CP03','iteration':'I03',
                  'event':'RELEASE_RECONCILIATION','event_id':'WAVE-W02-MODEL-BRIDGE-RELEASE-20260921',
                  'wave_id':wave_id,'parent_wave':'CP03-W02','canonical_task':'W02-08','status':'COMPLETE',
                  'evidence_id':evidence_id,'next_task':'W02-09'
              },sort_keys=True,separators=(',',':'))+'\n')
          run=Path('ledgers/RUN_LOG.ndjson')
          with run.open('a',encoding='utf-8') as handle:
              handle.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','event':'WORK_COMPLETED',
                  'event_id':'RUN-W02-MODEL-BRIDGE-RELEASE-COMPLETE-20260921',
                  'goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02',
                  'wave_id':wave_id,'canonical_task':'W02-08','head':head,'github_actions_run_id':run_id,
                  'evidence_id':evidence_id,'next_task':'W02-09','parity_promotions':0
              },sort_keys=True,separators=(',',':'))+'\n')

          session=Path('sessions/20260921-w02-model-bridge-release/CLAIM.json')
          session_data=json.loads(session.read_text())
          session_data['status']='RELEASED'
          session_data['release_evidence_id']=evidence_id
          session_data['validated_head']=head
          session.write_text(json.dumps(session_data,sort_keys=True,indent=2)+'\n',encoding='utf-8')

          handoff=Path('HANDOFF.md')
          text=handoff.read_text()
          marker='## W02-08 release reconciliation — 2026-09-21'
          assert marker not in text
          text += f'''\n\n{marker}\n\n- PR #41 release gate exposed one stale state assertion: it expected W02-08 `READY` / W02-09 `BLOCKED` after the exact-head finalizer had already persisted W02-08 `COMPLETE` / W02-09 `READY`.\n- The failing PR run `35554377801` was RED only in the durable-state assertion; lifecycle, pinned native catalog, W02-07 security, Rust regression and Clippy were green.\n- The release gate now validates the finalized frontier and exact-head release finalizer run `{run_id}` re-proved lifecycle/catalog, pinned OpenJarvis (15 engines / 69 models), security/kernel/state/ContextPack/parity with model executions = 0, provider egress executions = 0 and parity promotions = 0.\n- Evidence: `{evidence_id}`. Claim `{claim_id}` is RELEASED.\n- Canonical next task remains **W02-09 — Lane con modelo y pesos reales**; this release wave did not begin W02-09.\n'''
          handoff.write_text(text,encoding='utf-8')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist release reconciliation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/cp03-w02-model-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/cp03/cp03-w02/W02-08/release_reconciliation.json \
            ledgers/CLAIM_LEDGER.ndjson \
            ledgers/EVIDENCE_LEDGER.ndjson \
            ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson \
            ledgers/DECISION_LEDGER.ndjson \
            ledgers/RISK_LEDGER.ndjson \
            sessions/20260921-w02-model-bridge-release/CLAIM.json \
            HANDOFF.md \
            .agentic/context/CURRENT_CONTEXT.json \
            .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): finalize W02-08 release reconciliation'
          git push origin HEAD:release/cp03-w02-model-bridge-20260921
