name: CP03 W02 G1 Remediation

on:
  push:
    branches: [fix/cp03-w02-g1-remediation-20260914]
    paths:
      - 'scripts/review/g1_remediation.py'
      - '.github/workflows/cp03-w02-g1-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp03-w02-g1-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-prove:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic G1 remediations
        run: |
          set -euo pipefail
          python scripts/review/g1_remediation.py apply
          cargo fmt --manifest-path kernel/Cargo.toml --all
          python scripts/review/g1_remediation.py check
          git diff --check
      - name: Prove review and lifecycle remediations
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python -m unittest tests.test_cp03_w02_g1_review -v
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_lifecycle -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test review_g1_adversarial -- --nocapture
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Restrict remediation mutation
        run: |
          python - <<'PY'
          import subprocess
          allowed_prefixes=(
            '.github/workflows/',
            'kernel/crates/clever-kernel/src/adapter.rs',
            'kernel/crates/clever-kernel/tests/adapter_lifecycle.rs',
            'kernel/crates/clever-kernel/tests/review_g1_adversarial.rs',
            'reports/reviews/CP03_W02_G1_FINDINGS.json',
            'docs/reviews/2026-09-14_CP03_W02_G1_ARCHITECTURE_SECURITY_QA.md',
            'tests/test_cp03_w02_g1_review.py',
          )
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'], text=True).splitlines() if line}
          unexpected=[p for p in changed if not any(p == prefix or (prefix.endswith('/') and p.startswith(prefix)) for prefix in allowed_prefixes)]
          assert changed, 'remediation produced no delta'
          assert not unexpected, f'out-of-scope remediation paths: {unexpected}'
          PY
      - name: Compare-and-swap persist code remediation only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/cp03-w02-g1-remediation-20260914 | cut -f1)" = "$GITHUB_SHA"
          # Workflow mutations are proven above, but GITHUB_TOKEN cannot write workflow files.
          # Restore workflow/report surfaces and persist only the Rust cleanup remediation.
          git checkout HEAD -- .github/workflows reports/reviews/CP03_W02_G1_FINDINGS.json docs/reviews/2026-09-14_CP03_W02_G1_ARCHITECTURE_SECURITY_QA.md tests/test_cp03_w02_g1_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_lifecycle.rs kernel/crates/clever-kernel/tests/review_g1_adversarial.rs
          git commit -m 'fix(cp03-w02): surface external cleanup failures'
          git push origin HEAD:fix/cp03-w02-g1-remediation-20260914
