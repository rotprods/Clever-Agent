name: CP03 W02 Parity Graph Claim

on:
  push:
    branches: [wave/cp03/w02-parity-graph-20260922]
    paths:
      - '.github/workflows/cp03-w02-parity-graph-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-parity-graph-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "465fe294e28fd683c7683aaca1e0acfcb03052a9"
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['base_head']=='465fe294e28fd683c7683aaca1e0acfcb03052a9'
          assert claim['status']=='ACTIVE'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='READY' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if not line.strip(): continue
              row=json.loads(line); cid=row.get('claim_id')
              if cid: latest[cid]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert not active, active
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Register claim and IN_PROGRESS frontier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          graph_path=Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json')
          graph=json.loads(graph_path.read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17' and tasks['W02-17']['status']=='READY'
          tasks['W02-17']['status']='IN_PROGRESS'
          graph_path.write_text(json.dumps(graph,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          state=Path('STATE.md').read_text()
          old='- Canonical task frontier: `W02-17 — Paridad y grafo W02` (`READY`)'
          new='- Canonical task frontier: `W02-17 — Paridad y grafo W02` (`IN_PROGRESS`)'
          assert old in state
          Path('STATE.md').write_text(state.replace(old,new,1))
          claim_record={k:claim[k] for k in ['schema_version','project_id','checkpoint','parent_wave','canonical_task','wave_id','claim_id','owner','date','base_head','status','coordination','scope']}
          claim_record['event']='CLAIM'
          run={
            'schema_version':1,'event':'WORK_STARTED','event_id':'RUN-W02-PARITY-GRAPH-START-20260922',
            'date':'2026-09-22','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03',
            'canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':claim['claim_id'],
            'owner':claim['owner'],'branch':'wave/cp03/w02-parity-graph-20260922','base_head':claim['base_head'],
            'status':'IN_PROGRESS','parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646
          }
          wave={
            'schema_version':1,'event':'WAVE_IN_PROGRESS','event_id':'WAVE-W02-PARITY-GRAPH-START-20260922',
            'date':'2026-09-22','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03',
            'canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':claim['claim_id'],
            'gate':'G6','K':47,'owned':37,'shared':10,'parity_promotions':0,'status':'IN_PROGRESS'
          }
          for rel,row in [('ledgers/CLAIM_LEDGER.ndjson',claim_record),('ledgers/RUN_LOG.ndjson',run),('ledgers/WAVE_LEDGER.ndjson',wave)]:
              p=Path(rel)
              with p.open('a',encoding='utf-8') as f: f.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          handoff=Path('HANDOFF.md').read_text()
          note='## W02-17 parity/graph — IN_PROGRESS\n\n- Claim `CLAIM-CP03-W02-PARITY-GRAPH-20260922` acquired from exact base `465fe294e28fd683c7683aaca1e0acfcb03052a9`.\n- Scope is G6 proof-plane compilation/validation only; parity promotions remain 0, denominator 7565 and OpenJarvis obligations 646 remain immutable. W02-18/W02-19 remain BLOCKED.\n'
          assert 'CLAIM-CP03-W02-PARITY-GRAPH-20260922' not in handoff
          Path('HANDOFF.md').write_text(handoff.rstrip()+'\n\n'+note)
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist claim
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-parity-graph-20260922 | cut -f1)" = "$expected"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "465fe294e28fd683c7683aaca1e0acfcb03052a9"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json STATE.md HANDOFF.md ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: acquire parity graph claim'
          git push origin HEAD:wave/cp03/w02-parity-graph-20260922
