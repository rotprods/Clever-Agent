name: CP03 W02 Plan Integrity

on:
  push:
    paths:
      - 'iterations/03/waves/CP03-W02/**'
      - 'scripts/cp03/validate_w02_plan.py'
      - 'tests/test_cp03_w02_plan.py'
      - '.github/workflows/cp03-w02-plan.yml'
  pull_request:
    paths:
      - 'iterations/03/waves/CP03-W02/**'
      - 'scripts/cp03/validate_w02_plan.py'
      - 'tests/test_cp03_w02_plan.py'
      - '.github/workflows/cp03-w02-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test planning invariants, not runtime parity
        run: python -m unittest discover -s tests -p 'test_cp03_w02_plan.py' -v
      - name: Validate subordinate task graph and COS20D mapping
        run: python scripts/cp03/validate_w02_plan.py
      - name: Confirm canonical state and context remain coherent
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          git diff --check
