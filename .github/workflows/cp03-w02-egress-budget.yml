name: CP03 W02 Egress Budget

on:
  push:
    branches: [wave/cp03/w02-egress-budget]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp03-w02-egress-budget-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile canonical frontier and claim
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python - <<'PY'
          import json
          from pathlib import Path
          latest={}
          for raw in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if raw.strip():
                  row=json.loads(raw)
                  if row.get('claim_id'):
                      merged=dict(latest.get(row['claim_id'], {})); merged.update(row); latest[row['claim_id']]=merged
          row=latest.get('CLAIM-CP03-W02-EGRESS-BUDGET-001')
          if row is None:
              raise SystemExit('W02-07 claim missing')
          if row.get('status') not in {'ACTIVE','RELEASED'}:
              raise SystemExit(f"unexpected W02-07 claim state: {row.get('status')}")
          PY
      - name: Run W02-07 structural and inherited contract regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python -m unittest \
            tests.test_cp03_w02_egress_budget \
            tests.test_cp03_w02_inference_contract \
            tests.test_cp03_w02_plan -v
          git diff --check
      - name: Rust adversarial admission tests
        run: |
          set -euo pipefail
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_policy -- --nocapture
      - name: Touched-family kernel regression and clippy
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Preserve parity denominator and OpenJarvis ledger
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert graph['global_denominator'] == 7565
          assert graph['openjarvis_obligations'] == 646
          assert goal['parity']['total'] == 7565
          assert goal['parity']['verified'] == 0
          PY
