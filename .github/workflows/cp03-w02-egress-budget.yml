name: CP03 W02 Egress Budget

on:
  push:
    branches: [wave/cp03/w02-egress-budget-20260921]
    paths:
      - 'kernel/crates/clever-kernel/src/inference_security.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/tests/inference_security.rs'
      - 'tests/test_cp03_w02_egress.py'
      - 'scripts/cp03/w02_egress_evidence.py'
      - '.github/workflows/cp03-w02-egress-budget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kernel/crates/clever-kernel/src/inference_security.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/tests/inference_security.rs'
      - 'tests/test_cp03_w02_egress.py'
      - 'scripts/cp03/w02_egress_evidence.py'
      - '.github/workflows/cp03-w02-egress-budget.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-egress-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-gauntlet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Format check
        run: cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
      - name: Install Python test prerequisites
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
      - name: W02-07 adversarial security tests
        run: cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security -- --nocapture
      - name: Kernel regression (hermetic lane)
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel -- \
            --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion \
            --skip real_openjarvis_unary_inference_uses_pinned_llamacpp_lane
      - name: Preserve native-lane classification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          task={item['id']:item for item in graph['tasks']}['W02-02']
          assert task['status']=='COMPLETE'
          proof=task['proof'][-1]
          assert proof['result']=='PASS'
          assert proof['native_executed']==1
          assert proof.get('parity_promotions', 0)==0
          PY
      - name: Clippy fail closed
        run: cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Planning and durable-state regression
        run: |
          set -euo pipefail
          python -m unittest tests.test_cp03_w02_egress tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
      - name: Protect parity denominator and legal W02 frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          task_graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert task_graph['global_denominator']==7565
          assert task_graph['openjarvis_obligations']==646
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          task={item['id']:item for item in task_graph['tasks']}
          assert task['W02-07']['status']=='COMPLETE' and task['W02-07']['proof']
          assert task['W02-07']['proof'][-1]['result']=='PASS'
          frontier_id=task_graph['first_executable_task']
          frontier=task[frontier_id]
          assert frontier['status'] in {'READY','IN_PROGRESS'}
          assert all(task[dep]['status']=='COMPLETE' and task[dep]['proof'] for dep in frontier['depends_on'])
          PY
