name: CP03 W02 Cancellation Finalizer Diagnostic

on:
  push:
    branches:
      - diag/cp03-w02-cancellation-finalizer-20260921
    paths:
      - '.github/workflows/cp03-w02-cancellation-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build diagnostic receipt
        run: |
          python - <<'PY'
          import json, os
          receipt={
            'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-12','gate':'G4','status':'PASS',
            'validated_head':os.environ['GITHUB_SHA'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'runtime_head':os.environ['GITHUB_SHA'],
            'cancel_before_first_chunk':'PASS','cancel_during_stream':'PASS','cancel_after_terminal':'REJECTED','ack_without_termination':'FAIL_CLOSED',
            'requested_ack_terminal_distinct':'PASS','single_flight':'PASS','local_worker_cessation':'PASS','remote_provider_cancellation_effect':'UNKNOWN',
            'provider_egress_executions':0,'tool_executions':0,'parity_promotions':0,'verified_capabilities':0,
            'global_denominator':7565,'openjarvis_obligations':646,'w02_proof_units':47,
          }
          open('/tmp/w02-12-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: 01 finalizer
        continue-on-error: true
        run: python scripts/cp03/finalize_w02_cancellation.py --receipt /tmp/w02-12-receipt.json
      - name: 02 build ContextPack
        continue-on-error: true
        run: python scripts/context/build_context_pack.py
      - name: 03 validate W02 plan
        continue-on-error: true
        run: python scripts/cp03/validate_w02_plan.py
      - name: 04 validate agentic state
        continue-on-error: true
        run: python scripts/validate_agentic_state.py
      - name: 05 validate ContextPack
        continue-on-error: true
        run: python scripts/context/validate_context_pack.py
      - name: 06 deterministic ContextPack check
        continue-on-error: true
        run: python scripts/context/build_context_pack.py --check
      - name: 07 parity ledger
        continue-on-error: true
        run: python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: 08 transition assertions
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-12']['status']=='COMPLETE' and tasks['W02-12']['proof']
          assert tasks['W02-13']['status']=='READY' and not tasks['W02-13']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          PY
      - name: 09 diff check
        continue-on-error: true
        run: git diff --check
