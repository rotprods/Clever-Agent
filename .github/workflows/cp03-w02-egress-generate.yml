name: CP03 W02 Egress Generate

on:
  push:
    branches: [wave/cp03/w02-egress-budget-20260921]
    paths:
      - '.github/workflows/cp03-w02-egress-generate.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-egress-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.72.0'
      - name: Apply exact RED fixes and regenerate canonical SDKs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('kernel/crates/clever-kernel/src/inference_security.rs')
          text = path.read_text(encoding='utf-8')
          old = '#[derive(Clone, PartialEq, Eq)]\npub struct ExternalInferenceGrant {'
          new = '#[derive(Clone, PartialEq)]\npub struct ExternalInferenceGrant {'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Eq derive to repair, found {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path kernel/Cargo.toml --all
          buf format -d --exit-code
          buf lint
          buf generate
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          python -m scripts.contracts.build_wire_fixture
          python -m scripts.contracts.generated_manifest
          git diff --check
      - name: Prove persisted generation regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check jsonschema==4.25.1 referencing
          python -m unittest tests.test_cp03_w02_inference_contract tests.test_cp03_adapter_contract tests.test_contract_versioning -v
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.validate_fixtures
          python -m scripts.contracts.generated_manifest --check
          cargo test --locked --manifest-path contracts/sdk/rust/Cargo.toml
          cd contracts/sdk/typescript
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Restrict generated repair scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              'contracts/sdk/python/gen/',
              'contracts/sdk/typescript/src/gen/',
              'contracts/sdk/rust/src/gen/',
              'contracts/sdk/swift/Sources/CleverContracts/Gen/',
              'contracts/fixtures/wire/',
          )
          allowed_exact = {
              'contracts/generated_manifest.json',
              'kernel/crates/clever-kernel/src/inference_security.rs',
          }
          changed = [
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--porcelain=v1', '-uall'], text=True).splitlines()
              if line
          ]
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f'out-of-scope generated repair: {unexpected}')
          if not any(path.startswith('contracts/sdk/') for path in changed):
              raise SystemExit('expected generated SDK delta is absent')
          if 'contracts/fixtures/wire/inference-request.bin' not in changed:
              raise SystemExit('expected persisted inference wire fixture delta is absent')
          if any(path.startswith('contracts/proto/') for path in changed):
              raise SystemExit('proto authority mutation is forbidden in W02-07 prerequisite repair')
          PY
      - name: Compare-and-swap persist generated repair
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-egress-budget-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kernel/crates/clever-kernel/src/inference_security.rs \
            contracts/sdk/python/gen \
            contracts/sdk/typescript/src/gen \
            contracts/sdk/rust/src/gen \
            contracts/sdk/swift/Sources/CleverContracts/Gen \
            contracts/fixtures/wire \
            contracts/generated_manifest.json
          git commit -m 'fix(cp03-w02): persist v1.2 generated inference outputs'
          git push origin HEAD:wave/cp03/w02-egress-budget-20260921
