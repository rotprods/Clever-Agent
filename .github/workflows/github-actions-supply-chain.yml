name: GitHub Actions Supply Chain

on:
  pull_request:
    branches: [main, wave/cp03/w02-teardown-cleanup]
    paths:
      - '.github/workflows/**'
      - 'scripts/security/audit_github_actions.py'
      - 'tests/test_github_actions_supply_chain.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/security/audit_github_actions.py'
      - 'tests/test_github_actions_supply_chain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-action-refs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reject mutable external action references
        run: |
          set -euo pipefail
          python scripts/security/audit_github_actions.py
          python -m unittest tests.test_github_actions_supply_chain -v
