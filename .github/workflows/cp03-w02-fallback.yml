name: CP03 W02 Fallback Core

on:
  push:
    branches:
      - wave/cp03/w02-fallback-20260922
    paths:
      - '.github/workflows/cp03-w02-fallback.yml'
      - 'sessions/20260922-w02-fallback/**'
      - 'kernel/crates/clever-kernel/src/inference_fallback.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/tests/inference_fallback.rs'
      - 'scripts/cp03/finalize_w02_fallback_core.py'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
      - 'STATE.md'
      - 'HANDOFF.md'
      - 'evidence/cp03/cp03-w02/W02-14/**'
      - 'ledgers/**'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cp03-w02-fallback-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-claim:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact base and active claim
        run: |
          set -euo pipefail
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-fallback/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-fallback/CLAIM.json').read_text())
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          matching=[row for row in rows if row.get('claim_id')==claim['claim_id'] and row.get('status')]
          latest=matching[-1].get('status') if matching else None
          if latest is None:
              row=dict(claim)
              row['event']='CLAIM'
              with ledger.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
              rows.append(row)
          elif latest != 'ACTIVE':
              raise SystemExit(f'unexpected W02-14 claim state: {latest!r}')

          def amendment_key(row):
              return (
                  row.get('claim_id'),
                  row.get('event'),
                  row.get('red_run_id'),
                  row.get('old_base_head'),
                  row.get('new_base_head'),
                  tuple(row.get('scope', [])),
              )

          for amendment_path in sorted(Path('sessions/20260922-w02-fallback').glob('CLAIM_AMENDMENT-*.json')):
              amendment=json.loads(amendment_path.read_text())
              if amendment.get('claim_id') != claim['claim_id'] or amendment.get('status') != 'ACTIVE':
                  raise SystemExit(f'invalid W02-14 claim amendment: {amendment_path}')
              if amendment.get('event') not in {'SCOPE_AMENDED','BASE_REANCHORED'}:
                  raise SystemExit(f'unsupported W02-14 claim amendment event: {amendment.get("event")!r}')
              if not any(amendment_key(row)==amendment_key(amendment) for row in rows):
                  with ledger.open('a',encoding='utf-8') as handle:
                      handle.write(json.dumps(amendment,sort_keys=True,separators=(',',':'))+'\n')
                  rows.append(amendment)
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist claim and derived context
        run: |
          set -euo pipefail
          if git diff --quiet -- ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md; then
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'claim(cp03-w02): reconcile W02-14 claim scope'
          git push origin HEAD:wave/cp03/w02-fallback-20260922

  verify-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Targeted W02-14 fallback tests
        run: cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_fallback
      - name: Touched kernel regression
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
      - name: Clippy gauntlet
        run: cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Durable-state and parity regression
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

  repair-release-gate:
    if: github.event_name == 'push'
    needs: [reconcile-claim, verify-core]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wave/cp03/w02-fallback-20260922
          fetch-depth: 0
          persist-credentials: true
      - name: Prove scope amendment and repair stale structured frontier assertions
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-fallback/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$expected_head"
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          assert any(
              row.get('claim_id')=='CLAIM-CP03-W02-FALLBACK-20260922'
              and row.get('event')=='SCOPE_AMENDED'
              and row.get('red_run_id')==35699738880
              and '.github/workflows/cp03-w02-structured.yml' in row.get('scope',[])
              and row.get('status')=='ACTIVE'
              for row in rows
          )
          path=Path('.github/workflows/cp03-w02-structured.yml')
          text=path.read_text(encoding='utf-8')
          old="assert tasks['W02-14']['status']=='READY' and not tasks['W02-14']['proof']"
          new="assert tasks['W02-14']['status'] in {'READY','IN_PROGRESS'} and not tasks['W02-14']['proof']"
          old_count=text.count(old)
          new_count=text.count(new)
          assert (old_count,new_count) in {(2,0),(0,2)}, f'unexpected structured frontier assertion counts: old={old_count} new={new_count}'
          if old_count:
              path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist stale-gate repair
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/cp03-w02-structured.yml; then
            exit 0
          fi
          expected_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$expected_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp03-w02-structured.yml
          git commit -m 'fix(cp03-w02): accept active W02-14 frontier in structured gate'
          git push origin HEAD:wave/cp03/w02-fallback-20260922

  persist-core:
    if: github.event_name == 'push'
    needs: [reconcile-claim, verify-core]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: wave/cp03/w02-fallback-20260922
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: state
        name: Resolve persistence state
        shell: bash
        run: |
          if test -f evidence/cp03/cp03-w02/W02-14/core_policy_report.json; then
            echo 'persisted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'persisted=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Exact-head pre-persistence guard
        if: steps.state.outputs.persisted == 'false'
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-fallback/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$expected_head"
      - name: Persist evidence, state, handoff, decision and risk
        if: steps.state.outputs.persisted == 'false'
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_fallback_core.py
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Restrict persistence mutation
        if: steps.state.outputs.persisted == 'false'
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'sessions/20260922-w02-fallback/CLAIM.json',
            'sessions/20260922-w02-fallback/RESULT.json',
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'STATE.md',
            'HANDOFF.md',
            'evidence/cp03/cp03-w02/W02-14/core_policy_report.json',
            'ledgers/EVIDENCE_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson',
            'ledgers/DECISION_LEDGER.ndjson',
            'ledgers/RISK_LEDGER.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-14 persistence mutation: {sorted(unexpected)}'
          assert paths, 'W02-14 persistence produced no delta'
          PY
      - name: CAS persist partial W02-14 state
        if: steps.state.outputs.persisted == 'false'
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$expected_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260922-w02-fallback/CLAIM.json sessions/20260922-w02-fallback/RESULT.json iterations/03/waves/CP03-W02/TASK_GRAPH.json STATE.md HANDOFF.md evidence/cp03/cp03-w02/W02-14/core_policy_report.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): persist verified W02-14 fallback core'
          git push origin HEAD:wave/cp03/w02-fallback-20260922
