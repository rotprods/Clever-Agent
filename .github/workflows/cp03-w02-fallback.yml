name: CP03 W02 Fallback Core

on:
  push:
    branches:
      - wave/cp03/w02-fallback-20260922
    paths:
      - '.github/workflows/cp03-w02-fallback.yml'
      - 'sessions/20260922-w02-fallback/**'
      - 'kernel/crates/clever-kernel/src/inference_fallback.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/tests/inference_fallback.rs'
      - 'scripts/cp03/finalize_w02_fallback_core.py'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
      - 'STATE.md'
      - 'HANDOFF.md'
      - 'evidence/cp03/cp03-w02/W02-14/**'
      - 'ledgers/**'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cp03-w02-fallback-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-claim:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact base and active claim
        run: |
          set -euo pipefail
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-fallback/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-fallback/CLAIM.json').read_text())
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          matching=[row for row in rows if row.get('claim_id')==claim['claim_id'] and row.get('status')]
          latest=matching[-1].get('status') if matching else None
          if latest is None:
              row=dict(claim)
              row['event']='CLAIM'
              with ledger.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          elif latest != 'ACTIVE':
              raise SystemExit(f'unexpected W02-14 claim state: {latest!r}')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist claim and derived context
        run: |
          set -euo pipefail
          if git diff --quiet -- ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md; then
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'claim(cp03-w02): register active W02-14 claim'
          git push origin HEAD:wave/cp03/w02-fallback-20260922
