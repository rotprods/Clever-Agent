name: CP03 W02 Fallback

on:
  push:
    branches:
      - wave/cp03-w02-fallback-20260922
  pull_request:
    branches: [main]
    paths:
      - 'kernel/crates/clever-kernel/src/inference_fallback.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py'
      - 'tests/test_cp03_w02_fallback.py'
      - 'scripts/cp03/w02_fallback_evidence.py'
      - 'scripts/cp03/finalize_w02_fallback.py'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
      - 'sessions/20260922-w02-fallback/**'
      - 'evidence/cp03/cp03-w02/W02-14/**'
      - 'STATE.md'
      - 'HANDOFF.md'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
      - '.github/workflows/cp03-w02-fallback.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-fallback-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fallback_core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head and DAG guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']: row for row in graph['tasks']}
          claim=json.loads(Path('sessions/20260922-w02-fallback/CLAIM.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert graph['first_executable_task']=='W02-14'
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert tasks['W02-14']['status']=='READY' and not tasks['W02-14']['proof']
          assert tasks['W02-11']['status']=='COMPLETE' and tasks['W02-11']['proof']
          assert tasks['W02-12']['status']=='COMPLETE' and tasks['W02-12']['proof']
          assert all(tasks[dep]['status']=='COMPLETE' and tasks[dep]['proof'] for dep in tasks['W02-14']['depends_on'])
          assert tasks['W02-15']['status']=='BLOCKED' and not tasks['W02-15']['proof']
          assert claim['claim_id']=='CLAIM-CP03-W02-FALLBACK-20260922'
          assert claim['status']=='ACTIVE'
          required={'kernel/crates/clever-kernel/src/inference_fallback.rs','kernel/crates/clever-kernel/src/lib.rs'}
          assert required.issubset(set(claim['scope']))
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          PY
      - name: Agentic and planning regression
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
      - name: Fallback policy focused tests
        run: |
          set -euo pipefail
          cargo test --manifest-path kernel/Cargo.toml -p clever-kernel inference_fallback -- --nocapture
      - name: Kernel regression and clippy
        run: |
          set -euo pipefail
          cargo test --manifest-path kernel/Cargo.toml -p clever-kernel
          cargo clippy --manifest-path kernel/Cargo.toml -p clever-kernel --all-targets -- -D warnings
      - name: W02 invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-14'
          tasks={row['id']:row for row in graph['tasks']}
          assert tasks['W02-14']['status']=='READY' and not tasks['W02-14']['proof']
          assert tasks['W02-15']['status']=='BLOCKED' and not tasks['W02-15']['proof']
          PY
