name: CP03 W02 Teardown Cleanup

on:
  push:
    branches: [wave/cp03/w02-teardown-cleanup]
    paths:
      - 'scripts/cp03/w02_teardown_port.py'
      - '.github/workflows/cp03-w02-teardown.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_lifecycle.rs'
      - 'kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py'
      - 'scripts/cp03/w02_teardown_port.py'
      - '.github/workflows/cp03-w02-teardown.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-teardown-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: f7f30badc9f1852c6f42117c528f9f32dad74bd7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize W02-04 claim before product mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260909-w02-teardown/CLAIM.json').read_text())
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          text=ledger.read_text(encoding='utf-8')
          if claim['claim_id'] not in text:
              with ledger.open('a', encoding='utf-8') as handle:
                  handle.write(json.dumps(claim,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
      - name: Apply deterministic bounded teardown slice
        run: |
          set -euo pipefail
          python scripts/cp03/w02_teardown_port.py --apply
          cargo fmt --manifest-path kernel/Cargo.toml --all
          python scripts/cp03/w02_teardown_port.py --check
          python -m py_compile scripts/cp03/w02_teardown_port.py kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py
          sha256sum kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs kernel/crates/clever-kernel/tests/adapter_lifecycle.rs kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py > /tmp/first.sha
          python scripts/cp03/w02_teardown_port.py --apply
          cargo fmt --manifest-path kernel/Cargo.toml --all
          sha256sum kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs kernel/crates/clever-kernel/tests/adapter_lifecycle.rs kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
          git diff --check
      - name: Install generated Python runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: RED — historical shutdown and descendant-pipe teardown hang
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/w02-teardown-red "$BASE_SHA"
          cp kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs /tmp/w02-teardown-red/kernel/crates/clever-kernel/tests/
          cp kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py /tmp/w02-teardown-red/kernel/crates/clever-kernel/tests/fixtures/
          set +e
          CLEVER_TEST_PYTHON="$CLEVER_TEST_PYTHON" timeout --signal=KILL 7s cargo test --locked --manifest-path /tmp/w02-teardown-red/kernel/Cargo.toml -p clever-kernel --test lifecycle_legacy_regressions shutdown_stopping_without_exit_is_bounded_and_forced -- --exact --nocapture >/tmp/red-shutdown.log 2>&1
          shutdown_rc=$?
          set -e
          test "$shutdown_rc" -eq 137 || test "$shutdown_rc" -eq 124
          rm -f /tmp/w02-red-grandchild.pid
          set +e
          CLEVER_TEST_PYTHON="$CLEVER_TEST_PYTHON" CLEVER_LIFECYCLE_PID_FILE=/tmp/w02-red-grandchild.pid timeout --signal=KILL 7s cargo test --locked --manifest-path /tmp/w02-teardown-red/kernel/Cargo.toml -p clever-kernel --test lifecycle_legacy_regressions drop_kills_descendant_retaining_stdout_pipe -- --exact --nocapture >/tmp/red-descendant.log 2>&1
          descendant_rc=$?
          set -e
          test "$descendant_rc" -eq 137 || test "$descendant_rc" -eq 124
          if [ -s /tmp/w02-red-grandchild.pid ]; then kill -9 "$(cat /tmp/w02-red-grandchild.pid)" 2>/dev/null || true; fi
      - name: GREEN — bounded process-group lifecycle and external cleanup
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test lifecycle_legacy_regressions -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_lifecycle -- --nocapture
          for iteration in 1 2 3; do
            cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test lifecycle_legacy_regressions --quiet
            cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_lifecycle --quiet
          done
      - name: Regress W02-03 and W02-05 then Clippy
        run: |
          set -euo pipefail
          for case in inbound_frame_queue_is_bounded_under_flood inbound_wire_byte_budget_is_enforced_before_decode outbound_write_timeout_poison_session_when_peer_stops_reading; do
            cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor "$case" -- --exact --nocapture
          done
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test control_regressions -- --nocapture
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
      - name: Restrict mutation and CAS persist tested teardown source
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'kernel/crates/clever-kernel/src/adapter.rs',
            'kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs',
            'kernel/crates/clever-kernel/tests/adapter_lifecycle.rs',
            'kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py',
            'ledgers/CLAIM_LEDGER.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-04 mutation: {sorted(unexpected)}'
          required={
            'kernel/crates/clever-kernel/src/adapter.rs',
            'kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs',
            'kernel/crates/clever-kernel/tests/adapter_lifecycle.rs',
            'kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py',
            'ledgers/CLAIM_LEDGER.ndjson',
          }
          assert required <= paths, f'missing expected W02-04 mutations: {sorted(required-paths)}'
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-teardown-cleanup | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/lifecycle_legacy_regressions.rs kernel/crates/clever-kernel/tests/adapter_lifecycle.rs kernel/crates/clever-kernel/tests/fixtures/lifecycle_peer.py ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'feat(cp03-w02): bound shutdown and clean adapter workloads'
          git push origin HEAD:wave/cp03/w02-teardown-cleanup

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only W02-04 reproof
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python scripts/cp03/w02_teardown_port.py --check
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test lifecycle_legacy_regressions -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_lifecycle -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test control_regressions -- --nocapture
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
