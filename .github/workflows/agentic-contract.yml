name: Agentic Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-agentic-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical agentic state
        run: python scripts/validate_agentic_state.py
      - name: Validate executable next-action DAG
        run: python scripts/context/validate_next_actions.py
      - name: Validate ledger-backed COS V2 ContextPack
        run: python scripts/context/validate_context_pack.py
      - name: Verify deterministic ContextPack bytes
        run: python scripts/context/build_context_pack.py --check
