name: CP03 W01 Rust Supervisor and Registry Bridge

on:
  push:
    branches:
      - wave/cp03/w01-transport-registry
    paths:
      - 'kernel/crates/clever-kernel/**'
      - 'scripts/cp03/validate_w01_supervisor.py'
      - '.github/workflows/cp03-w01-supervisor.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w01-supervisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supervisor-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.sha }}
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: must-not-leak-to-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare Python contract runtime and exact OpenJarvis image
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-openjarvis-base:$SOURCE_SHA" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-sidecar-context
          docker build \
            --build-arg "BASE_IMAGE=clever-openjarvis-base:$SOURCE_SHA" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-openjarvis-w01:$SOURCE_SHA" \
            /tmp/openjarvis-sidecar-context
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CLEVER_OPENJARVIS_IMAGE=clever-openjarvis-w01:$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Update the existing lockfile only for the new direct prost edge
        shell: bash
        run: |
          set -euo pipefail
          cp kernel/Cargo.lock /tmp/kernel-Cargo.lock.before
          cargo check --manifest-path kernel/Cargo.toml
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/kernel-Cargo.lock.before').read_text()
          after=Path('kernel/Cargo.lock').read_text()
          needle='[[package]]\nname = "clever-kernel"\nversion = "0.1.0"\ndependencies = [\n "clever-contracts",\n'
          assert before.count(needle)==1, 'unexpected pre-existing clever-kernel lock block'
          expected=before.replace(needle, needle+' "prost",\n', 1)
          assert after==expected, 'Cargo.lock changed beyond the single direct prost dependency edge'
          PY
      - name: Format, test and clippy the supervisor against fake and real sidecars
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Reconcile contract, parity and durable registry proof
        run: |
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.generated_manifest --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          git diff --check
      - name: Compile W01 supervisor evidence
        run: |
          python scripts/cp03/validate_w01_supervisor.py --run-id "$GITHUB_RUN_ID" --source-sha "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('reports/cp03/OPENJARVIS_W01_SUPERVISOR.json').read_text())
          assert report['status']=='PASS'
          assert report['real_openjarvis_registry_entries']==230
          assert report['openjarvis_verified_after_w01']==0
          PY
      - name: Advance W01 to W02 only after all supervisor gates pass
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.agentic.advance \
            --checkpoint CP03 \
            --iteration I03 \
            --complete-task CP03-001 \
            --complete-wave CP03-W01 \
            --complete-subcheckpoint I03.1 \
            --next-task CP03-002 \
            --next-wave CP03-W02 \
            --next-wave-name 'Models engines and inference behavior' \
            --next-subcheckpoint I03.2 \
            --evidence-id EVID-0014 \
            --evidence-claim 'Clever v1.1 adapter transport is polyglot-compatible; Rust supervisor enforces bounded BE32 framing, exact pin handshake, deadlines, ambient-secret stripping and bounded restart; real OpenJarvis exposes 230 deterministic registry entries that bridge idempotently into the kernel as UNAVAILABLE with zero capability parity promotion.' \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$SOURCE_SHA" \
            --date 2026-09-02
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Upload W01 final evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp03-w01-supervisor-${{ env.SOURCE_SHA }}
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/cp03/cp03-w01/supervisor-gate.json
            reports/cp03/OPENJARVIS_W01_SUPERVISOR.json
      - name: Persist W01 evidence, lock repair and transition with CAS
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kernel/Cargo.lock reports/cp03/OPENJARVIS_W01_SUPERVISOR.json evidence/cp03/cp03-w01/supervisor-gate.json \
            GOAL_STATE.json EXECUTION_STATE.json STATE.md HANDOFF.md TASKS.md iterations/03/STATE.json .agentic/CONFIG.yaml \
            .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md .agentic/context/NEXT_ACTIONS.json \
            ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RUN_LOG.ndjson
          git commit -m 'test(cp03): prove OpenJarvis supervisor and open W02'
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          git push origin "HEAD:${GITHUB_REF_NAME}"
