name: CP03 W02 Security Regression

on:
  push:
    branches:
      - wave/cp03/w02-security-20260922
    paths:
      - '.github/workflows/cp03-w02-security.yml'
      - 'scripts/cp03/w02_security_patch.py'
      - 'scripts/cp03/finalize_w02_security.py'
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'kernel/crates/clever-kernel/tests/inference_security.rs'
      - 'tests/test_cp03_openjarvis_sidecar.py'

permissions:
  contents: write

concurrency:
  group: cp03-w02-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned Python contract runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt

      - name: Exact-head, base, claim and DAG guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-security-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-security/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-SECURITY-20260922'
          assert claim['canonical_task']=='W02-15' and claim['status']=='ACTIVE'
          assert claim['base_head']=='9dee62f1493e1529a71e7dd705bd0acdbcf2d653'
          ledger=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in ledger:
              latest[row['claim_id']]=row
          active=latest.get(claim['claim_id'])
          assert active and active.get('status')=='ACTIVE', active
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-15'
          assert tasks['W02-15']['status'] in {'READY','IN_PROGRESS'} and not tasks['W02-15']['proof']
          assert tasks['W02-16']['status']=='BLOCKED' and not tasks['W02-16']['proof']
          for dep in ('W02-07','W02-12','W02-13','W02-14'):
              assert tasks[dep]['status']=='COMPLETE', (dep,tasks[dep]['status'])
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          PY
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-security/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis

      - name: Detect security implementation state
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'standalone_cancel_rejects_cross_principal_before_transport' kernel/crates/clever-kernel/tests/adapter_supervisor.rs \
             && grep -q 'last_inference_authority: Option<InferenceAuthority>' kernel/crates/clever-kernel/src/adapter.rs; then
            echo 'code_changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'code_changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Reproduce RED unauthorized cancellation gap
        if: steps.patch.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python scripts/cp03/w02_security_patch.py --red
          cargo fmt --manifest-path kernel/Cargo.toml --all
          set +e
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor standalone_cancel_without_authority_context_must_fail_closed -- --exact > /tmp/w02-security-red.log 2>&1
          red_exit=$?
          set -e
          cat /tmp/w02-security-red.log
          test "$red_exit" -ne 0
          grep -q 'standalone cancellation without authority unexpectedly reached transport' /tmp/w02-security-red.log
          python - "$red_exit" <<'PY'
          import json,sys,os
          from pathlib import Path
          payload={
              'schema_version':1,
              'date':'2026-09-22',
              'task':'W02-15',
              'test':'standalone_cancel_without_authority_context_must_fail_closed',
              'classification':'SECURITY_REGRESSION_REPRODUCED',
              'exit_code':int(sys.argv[1]),
              'source_head':os.environ['GITHUB_SHA'],
              'finding':'Standalone cancel accepted request/attempt identifiers without any caller principal/session authority context and reached canonical transport.',
          }
          path=Path('sessions/20260922-w02-security/RED.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Apply minimal cancellation-authority fix
        if: steps.patch.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp03/w02_security_patch.py --fix
          cargo fmt --manifest-path kernel/Cargo.toml --all
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          git diff --check

      - name: Targeted G5 security tests
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor standalone_cancel_rejects_cross_principal_before_transport -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor cancellation_
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test kernel capability_registry_requires_typed_security_fields_and_rejects_reserved_metadata -- --exact
          python -m unittest -v tests.test_cp03_openjarvis_sidecar

      - name: Regression and gauntlet
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor stream_
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor fallback_transport_
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Restrict code mutation
        if: steps.patch.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'kernel/crates/clever-kernel/src/adapter.rs',
              'kernel/crates/clever-kernel/tests/adapter_supervisor.rs',
              'sessions/20260922-w02-security/RED.json',
          }
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          assert changed <= allowed, f'out-of-scope security code mutation: {sorted(changed-allowed)}'
          assert allowed <= changed, f'missing expected security code mutation: {sorted(allowed-changed)}'
          PY

      - name: CAS persist verified security code
        if: steps.patch.outputs.code_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-security-20260922 | cut -f1)" = "$expected_head"
          git fetch origin main
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-security/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_supervisor.rs sessions/20260922-w02-security/RED.json
          git commit -m 'security(cp03-w02): bind standalone cancel to request authority'
          git push origin HEAD:wave/cp03/w02-security-20260922

      - name: Persist W02-15 evidence and DAG transition
        if: steps.patch.outputs.code_changed == 'false'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -f sessions/20260922-w02-security/RED.json
          python scripts/cp03/finalize_w02_security.py
          python scripts/context/build_context_pack.py
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-15']['status']=='COMPLETE' and len(tasks['W02-15']['proof'])==1
          assert tasks['W02-15']['proof'][0]['result']=='PASS'
          assert tasks['W02-15']['proof'][0]['real_openjarvis_fallback_model_execution']=='NOT_RUN'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-15/security_regression_report.json').read_text())
          assert report['cross_principal_cancel']=='FAIL_CLOSED_PRE_TRANSPORT'
          assert report['egress_injection_ssrf']=='PASS'
          assert report['secret_canary_redaction']=='PASS'
          assert report['privileged_registry_metadata']=='FILTERED'
          assert report['inbound_flood_bounds']=='PASS'
          assert report['provider_egress_executions']==0
          assert report['model_executions']==0
          assert report['tool_executions']==0
          assert report['real_openjarvis_fallback_model_execution']=='NOT_RUN'
          PY
          git diff --check

      - name: Restrict durable state mutation
        if: steps.patch.outputs.code_changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
              'STATE.md',
              'HANDOFF.md',
              'sessions/20260922-w02-security/CLAIM.json',
              'sessions/20260922-w02-security/RESULT.json',
              'evidence/cp03/cp03-w02/W02-15/security_regression_report.json',
              'ledgers/CLAIM_LEDGER.ndjson',
              'ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson',
              'ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson',
              'ledgers/RISK_LEDGER.ndjson',
              '.agentic/context/CURRENT_CONTEXT.json',
              '.agentic/context/CURRENT_CONTEXT.md',
          }
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=changed-allowed
          assert not unexpected, f'out-of-scope W02-15 persistence mutation: {sorted(unexpected)}'
          required=allowed-{'HANDOFF.md','.agentic/context/CURRENT_CONTEXT.md'}
          missing=required-changed
          assert not missing, f'missing expected W02-15 persistence delta: {sorted(missing)}'
          PY

      - name: CAS persist exact verified W02-15 state
        if: steps.patch.outputs.code_changed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-security-20260922 | cut -f1)" = "$expected_head"
          git fetch origin main
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-security/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json STATE.md HANDOFF.md sessions/20260922-w02-security/CLAIM.json sessions/20260922-w02-security/RESULT.json evidence/cp03/cp03-w02/W02-15/security_regression_report.json ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): complete W02-15 security regression'
          git push origin HEAD:wave/cp03/w02-security-20260922
