name: CP02 Contract Gate

on:
  push:
    paths:
      - 'contracts/**'
      - 'scripts/contracts/**'
      - 'tests/test_cp02_contracts.py'
      - 'buf.yaml'
      - '.github/workflows/cp02-contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/contracts/**'
      - 'tests/test_cp02_contracts.py'
      - 'buf.yaml'

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structural contract tests
        run: |
          python -m compileall -q scripts/contracts tests/test_cp02_contracts.py
          python -m unittest discover -s tests -p 'test_cp02_contracts.py' -v
          python -m scripts.contracts.validate_manifest
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
      - name: Protobuf format/lint/build
        run: |
          buf format -d --exit-code
          buf lint
          buf build -o /tmp/clever-contracts.binpb
      - name: Validate canonical JSON fixtures
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
          python -m scripts.contracts.validate_fixtures
