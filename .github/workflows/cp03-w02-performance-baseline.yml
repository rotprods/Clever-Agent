name: CP03 W02 P01 Same-Host Performance

on:
  push:
    branches: [wave/cp03/w02-performance-baseline-20260922]
    paths:
      - '.github/workflows/cp03-w02-performance-baseline.yml'
      - 'scripts/cp03/w02_performance_baseline.py'
      - 'scripts/cp03/finalize_w02_performance_baseline.py'
      - 'tests/test_cp03_w02_performance_baseline.py'

permissions:
  contents: write

concurrency:
  group: cp03-w02-p01-performance-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  LLAMACPP_SHA: 391fac16460f15233a7740550d858ac96df3419d
  MODEL_PATH: /tmp/clever-w02-16/Qwen_Qwen3-0.6B-Q4_K_M.gguf
  LLAMACPP_HOST: http://127.0.0.1:8080

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded Python runtime dependencies
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1'
      - name: Exact-head, claim, DAG and denominator guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-performance-baseline-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-performance-baseline/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PERFORMANCE-20260922' and claim['status']=='ACTIVE'
          assert claim['base_head']=='9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-16']['depends_on']==['W02-15'] and tasks['W02-15']['status']=='COMPLETE'
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          p02=json.loads(Path('evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json').read_text())
          assert p02['result']=='PASS' and p02['repetitions_executed']==20 and p02['failed_invocations']==0
          assert p02['all_results_retained'] is True and p02['best_rerun_selection'] is False
          assert p02['performance_baseline_same_host']=='NOT_RUN'
          PY
          test "$(git rev-parse origin/main)" = "9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8"
          test "$(git merge-base HEAD origin/main)" = "9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8"
          python -m unittest -v tests.test_cp03_w02_performance_baseline tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Fetch exact pinned OpenJarvis source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis-w02-16
          git init -q /tmp/openjarvis-w02-16
          git -C /tmp/openjarvis-w02-16 remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis-w02-16 fetch -q --depth=1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis-w02-16 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis-w02-16 rev-parse HEAD)" = "$OPENJARVIS_SHA"
          PYTHONPATH=/tmp/openjarvis-w02-16/src python - <<'PY'
          import openjarvis.engine
          import openjarvis.intelligence as intelligence
          from openjarvis.core.registry import EngineRegistry, ModelRegistry
          intelligence.register_builtin_models()
          assert EngineRegistry.contains('llamacpp')
          assert 'llamacpp' in tuple(ModelRegistry.get('qwen3:0.6b').supported_engines)
          PY
      - name: Fetch and build exact pinned llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/llama.cpp-w02-16
          git init -q /tmp/llama.cpp-w02-16
          git -C /tmp/llama.cpp-w02-16 remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp-w02-16 fetch -q --depth=1 origin "$LLAMACPP_SHA"
          git -C /tmp/llama.cpp-w02-16 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp-w02-16 rev-parse HEAD)" = "$LLAMACPP_SHA"
          cmake -S /tmp/llama.cpp-w02-16 -B /tmp/llama.cpp-w02-16/build -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp-w02-16/build --target llama-server -j2
          test -x /tmp/llama.cpp-w02-16/build/bin/llama-server
      - name: Controlled acquire and attest exact W02-09 model
        env:
          CLEVER_ALLOW_MODEL_ACQUISITION: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          python scripts/cp03/w02_real_model.py acquire --artifact "$MODEL_PATH" --receipt /tmp/w02-16-acquire.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/w02-16-acquire.json'))
          assert row['status']=='PASS'
          assert row['observed_size_bytes']==484220320
          assert row['observed_sha256']=='9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14'
          assert row['model_executions']==0 and row['parity_promotions']==0
          PY
      - name: Start same-host local llama.cpp server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp-w02-16/build/bin/llama-server --model "$MODEL_PATH" --alias 'qwen3:0.6b' --host 127.0.0.1 --port 8080 --ctx-size 2048 --threads 2 --parallel 1 >/tmp/w02-16-llama.log 2>&1 &
          echo $! >/tmp/w02-16-llama.pid
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/v1/models >/tmp/w02-16-models.json 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/w02-16-llama.log; exit 1; fi
          kill -0 "$(cat /tmp/w02-16-llama.pid)"
      - name: P01 fixed-budget direct vs adapted same-host baseline
        env:
          CLEVER_OPENJARVIS_SRC: /tmp/openjarvis-w02-16/src
          CLEVER_W02_MODEL_PATH: /tmp/clever-w02-16/Qwen_Qwen3-0.6B-Q4_K_M.gguf
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/contracts/sdk/python/gen:$CLEVER_OPENJARVIS_SRC"
          export CLEVER_W02_LLAMA_PID="$(cat /tmp/w02-16-llama.pid)"
          python scripts/cp03/w02_performance_baseline.py run --out /tmp/w02-16-performance-report.json
          python scripts/cp03/w02_performance_baseline.py validate --report /tmp/w02-16-performance-report.json
          cat /tmp/w02-16-performance-report.json
      - name: Preserve P01 report and runtime logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-p01-performance-${{ github.sha }}
          path: |
            /tmp/w02-16-performance-report.json
            /tmp/w02-16-llama.log
            /tmp/w02-16-models.json
            /tmp/w02-16-acquire.json
          if-no-files-found: warn
          retention-days: 14
      - name: Targeted regression and G5 gauntlet
        shell: bash
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          python scripts/cp03/w02_performance_baseline.py validate --report /tmp/w02-16-performance-report.json
          python scripts/cp03/w02_recovery_retest.py validate --report evidence/cp03/cp03-w02/W02-16/recovery_retest_report.json
          python -m unittest -v tests.test_cp03_w02_performance_baseline tests.test_cp03_w02_plan tests.test_cp03_w02_streaming tests.test_cp03_openjarvis_sidecar
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor cancellation_
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor crash_restart_budget_is_bounded -- --exact
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Exact-head W02-16 durable transition
        env:
          W02_PERFORMANCE_REPORT: /tmp/w02-16-performance-report.json
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_performance_baseline.py
          python scripts/context/build_context_pack.py
          python -m unittest -v tests.test_cp03_w02_performance_baseline tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-16/performance_baseline_report.json').read_text())
          claim=json.loads(Path('sessions/20260922-w02-performance-baseline/CLAIM.json').read_text())
          assert tasks['W02-16']['status']=='COMPLETE' and tasks['W02-16']['proof']
          assert graph['first_executable_task']=='W02-17' and tasks['W02-17']['status']=='READY' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert report['result']=='PASS' and report['performance_threshold']=='MEASUREMENT_ONLY_NO_POST_HOC_THRESHOLD'
          assert claim['status']=='RELEASED'
          PY
          git diff --check
      - name: Restrict durable transition mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json','STATE.md','HANDOFF.md',
            'sessions/20260922-w02-performance-baseline/CLAIM.json','sessions/20260922-w02-performance-baseline/RESULT.json',
            'evidence/cp03/cp03-w02/W02-16/performance_baseline_report.json',
            'ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          }
          changed={x[3:] for x in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if x}
          assert changed <= allowed, sorted(changed-allowed)
          required={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','STATE.md','HANDOFF.md','sessions/20260922-w02-performance-baseline/CLAIM.json','sessions/20260922-w02-performance-baseline/RESULT.json','evidence/cp03/cp03-w02/W02-16/performance_baseline_report.json','ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson','.agentic/context/CURRENT_CONTEXT.json'}
          assert required <= changed, sorted(required-changed)
          PY
      - name: CAS persist exact-head P01 evidence and frontier transition
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-performance-baseline-20260922 | cut -f1)" = "$expected"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9d5d283c1c4e9e1bcd662a7b35bdbbf9120fa6b8"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json STATE.md HANDOFF.md sessions/20260922-w02-performance-baseline/CLAIM.json sessions/20260922-w02-performance-baseline/RESULT.json evidence/cp03/cp03-w02/W02-16/performance_baseline_report.json ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'test(cp03-w02): close W02-16 with fixed P01 baseline'
          git push origin HEAD:wave/cp03/w02-performance-baseline-20260922
      - name: Stop local runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/w02-16-llama.pid ]; then kill "$(cat /tmp/w02-16-llama.pid)" 2>/dev/null || true; fi
