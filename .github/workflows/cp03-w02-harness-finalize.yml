name: CP03 W02 Harness Finalize

on:
  push:
    branches: [wave/cp03/w02-harness-hardening]
    paths:
      - 'scripts/cp03/finalize_w02_harness.py'
      - 'tests/test_cp03_w02_harness_finalizer.py'
      - '.github/workflows/cp03-w02-harness-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w02-harness-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: must-not-leak-to-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Revalidate state, scope and finalizer guards
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.cp03.w02_scope_lock
          python -m unittest discover -s tests -p 'test_cp03_w02_harness.py' -v
          python -m unittest discover -s tests -p 'test_cp03_w02_harness_finalizer.py' -v

      - name: Re-prove fake mandatory lane
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          mkdir -p evidence/cp03/cp03-w02/W02-02/red
          git show ad45a297922d7f98ec67f6ff0fa6230acbb79ee5:kernel/crates/clever-kernel/tests/adapter_supervisor.rs > /tmp/adapter_supervisor.before.rs
          if python scripts/cp03/w02_harness.py --audit-source /tmp/adapter_supervisor.before.rs > evidence/cp03/cp03-w02/W02-02/red/audit.log 2>&1; then
            echo 'historical source unexpectedly passed false-green audit' >&2
            exit 1
          fi
          grep -q 'silent return paths' evidence/cp03/cp03-w02/W02-02/red/audit.log
          CLEVER_TEST_PYTHON="$(command -v python)" python scripts/cp03/w02_harness.py --mode fake --out evidence/cp03/cp03-w02/W02-02/fake

      - name: Build exact pinned OpenJarvis native image
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-w02-finalize-base:${GITHUB_SHA}" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-sidecar-context
          docker build \
            --build-arg "BASE_IMAGE=clever-w02-finalize-base:${GITHUB_SHA}" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-w02-finalize-native:${GITHUB_SHA}" \
            /tmp/openjarvis-sidecar-context
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CLEVER_OPENJARVIS_IMAGE=clever-w02-finalize-native:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Re-prove native and fake retest lanes
        run: |
          set -euo pipefail
          python scripts/cp03/w02_harness.py --mode native --out evidence/cp03/cp03-w02/W02-02/native
          python scripts/cp03/w02_harness.py --mode fake --out evidence/cp03/cp03-w02/W02-02/retest
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m scripts.parity.ledger --check --source-repo openjarvis

      - name: Upload exact-head harness proof
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-harness-final-${{ github.sha }}
          path: evidence/cp03/cp03-w02/W02-02/
          if-no-files-found: error
          retention-days: 30

      - name: Apply subordinate evidence-backed transition
        run: |
          set -euo pipefail
          python -m scripts.cp03.finalize_w02_harness \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --artifact-id '${{ steps.proof.outputs.artifact-id }}' \
            --artifact-digest 'sha256:${{ steps.proof.outputs.artifact-digest }}'
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Restrict durable transition surface
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'ledgers/EVIDENCE_LEDGER.ndjson','ledgers/CLAIM_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','HANDOFF.md',
            '.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          }
          raw=subprocess.check_output(['git','status','--porcelain=v1','-unormal'],text=True).splitlines()
          paths={line[3:] for line in raw if line}
          generated_prefix='evidence/cp03/cp03-w02/W02-02/'
          unexpected={p for p in paths if p not in allowed and not p.startswith(generated_prefix)}
          assert not unexpected, f'out-of-scope finalizer mutation: {sorted(unexpected)}'
          assert paths & allowed, 'finalizer produced no durable state transition'
          PY

      - name: Compare-and-swap persist transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-harness-hardening | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): persist W02-02 harness evidence and open W02-03'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:wave/cp03/w02-harness-hardening
