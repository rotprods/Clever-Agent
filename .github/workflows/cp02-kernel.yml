name: CP02 Rust Kernel

on:
  push:
    branches:
      - wave/cp02/canonical-contracts-kernel
    paths:
      - 'kernel/**'
      - '.github/workflows/cp02-kernel.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp02-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-gate:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Generate deterministic kernel lock
        run: cargo generate-lockfile --manifest-path kernel/Cargo.toml
      - name: Rust format
        run: cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
      - name: Rust clippy
        run: cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path kernel/Cargo.toml --workspace --all-targets
      - name: Advance W03 to W04 from kernel evidence
        run: |
          python -m scripts.agentic.advance_wave \
            --complete-task CP02-003 \
            --complete-wave CP02-W03 \
            --complete-subcheckpoint I02.3 \
            --next-task CP02-004 \
            --next-wave CP02-W04 \
            --next-wave-name 'Action receipts idempotency lifecycle and audit' \
            --next-subcheckpoint I02.4 \
            --evidence-id EVID-0009 \
            --evidence-claim 'Rust control-plane kernel compiles lint-clean and tests identity/version event routing capability registration and deny-by-default policy boundaries without provider-specific coupling.' \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$SOURCE_SHA"
      - name: Validate post-transition state
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          git diff --check
      - name: Persist kernel lock and W03 transition
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/Cargo.lock GOAL_STATE.json EXECUTION_STATE.json STATE.md HANDOFF.md TASKS.md iterations/02/STATE.json .agentic/CONFIG.yaml .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md .agentic/context/NEXT_ACTIONS.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RUN_LOG.ndjson
          git commit -m 'feat(cp02): persist Rust kernel scaffold and advance to action plane'
          python scripts/validate_agentic_state.py
          git push origin "HEAD:${GITHUB_REF_NAME}"
