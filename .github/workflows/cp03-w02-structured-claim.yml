name: CP03 W02 Structured Claim

on:
  push:
    branches:
      - wave/cp03/w02-structured-data-20260921
    paths:
      - '.github/workflows/cp03-w02-structured-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-structured-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-main and no-conflict preflight
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'c46aca03854e227e236f421d784c05e50691aee9'
          test "$(git merge-base HEAD origin/main)" = 'c46aca03854e227e236f421d784c05e50691aee9'
          python - <<'PY'
          import json
          from pathlib import Path

          claim = json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          assert claim['canonical_task'] == 'W02-13'
          assert claim['base_head'] == 'c46aca03854e227e236f421d784c05e50691aee9'
          graph = json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks = {row['id']: row for row in graph['tasks']}
          assert graph['first_executable_task'] == 'W02-13'
          assert graph['global_denominator'] == 7565 and graph['openjarvis_obligations'] == 646
          assert tasks['W02-13']['status'] == 'READY' and tasks['W02-13']['depends_on'] == ['W02-11']
          assert tasks['W02-11']['status'] == 'COMPLETE' and tasks['W02-11']['proof']
          assert all(tasks[row]['status'] == 'BLOCKED' for row in ('W02-14','W02-15','W02-16','W02-17','W02-18','W02-19'))

          latest = {}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              row = json.loads(line)
              latest[row['claim_id']] = row
          active = [row for row in latest.values() if row.get('status') == 'ACTIVE']
          assert not active, f'pre-existing active claims: {[row["claim_id"] for row in active]}'
          PY
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
      - name: Append claim and WORK_STARTED durably
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          claim_path = Path('sessions/20260921-w02-structured/CLAIM.json')
          claim = json.loads(claim_path.read_text())
          claim_id = claim['claim_id']
          ledger = Path('ledgers/CLAIM_LEDGER.ndjson')
          rows = [json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          if any(row.get('claim_id') == claim_id for row in rows):
              raise SystemExit('claim already exists; refusing duplicate registration')
          entry = {
              'schema_version': 1,
              'date': '2026-09-21',
              'event': 'CLAIM',
              'project_id': 'CLEVER-JARVIS-001',
              'checkpoint': 'CP03',
              'parent_wave': 'CP03-W02',
              'canonical_task': 'W02-13',
              'claim_id': claim_id,
              'wave_id': claim['wave_id'],
              'owner': claim['owner'],
              'coordination': claim['coordination'],
              'scope': claim['scope'],
              'status': 'ACTIVE',
              'base_head': claim['base_head'],
              'coordination_issue': claim['coordination_issue'],
          }
          with ledger.open('a', encoding='utf-8') as fh:
              fh.write(json.dumps(entry, sort_keys=True, separators=(',', ':')) + '\n')

          run = {
              'schema_version': 1,
              'date': '2026-09-21',
              'event': 'WORK_STARTED',
              'event_id': 'RUN-W02-STRUCTURED-DATA-START-20260921',
              'goal_id': 'CLEVER-JARVIS-001',
              'checkpoint': 'CP03',
              'iteration': 'I03',
              'parent_wave': 'CP03-W02',
              'canonical_task': 'W02-13',
              'wave_id': claim['wave_id'],
              'claim_id': claim_id,
              'head': claim['base_head'],
              'parity_promotions': 0,
          }
          with Path('ledgers/RUN_LOG.ndjson').open('a', encoding='utf-8') as fh:
              fh.write(json.dumps(run, sort_keys=True, separators=(',', ':')) + '\n')

          wave = {
              'schema_version': 1,
              'date': '2026-09-21',
              'event': 'SUBWAVE_STARTED',
              'goal_id': 'CLEVER-JARVIS-001',
              'checkpoint': 'CP03',
              'iteration': 'I03',
              'parent_wave': 'CP03-W02',
              'canonical_task': 'W02-13',
              'wave_id': claim['wave_id'],
              'objective': 'Fail-closed data-only structured output and tool-call fragment assembly/validation without execution authority.',
              'status': 'IN_PROGRESS',
          }
          with Path('ledgers/WAVE_LEDGER.ndjson').open('a', encoding='utf-8') as fh:
              fh.write(json.dumps(wave, sort_keys=True, separators=(',', ':')) + '\n')

          claim['status'] = 'ACTIVE'
          claim['registered_head'] = '${{ github.sha }}'
          claim_path.write_text(json.dumps(claim, indent=2, sort_keys=True) + '\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Restrict claim transaction
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'ledgers/CLAIM_LEDGER.ndjson', 'ledgers/RUN_LOG.ndjson', 'ledgers/WAVE_LEDGER.ndjson',
              'sessions/20260921-w02-structured/CLAIM.json',
              '.agentic/context/CURRENT_CONTEXT.json', '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'], text=True).splitlines() if line}
          assert paths and not paths - allowed, f'out-of-scope claim mutation: {sorted(paths - allowed)}'
          assert {'ledgers/CLAIM_LEDGER.ndjson','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}.issubset(paths)
          PY
      - name: CAS persist active claim
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/wave/cp03/w02-structured-data-20260921 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson sessions/20260921-w02-structured/CLAIM.json .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'claim(cp03-w02): register active W02-13 claim'
          git push origin HEAD:wave/cp03/w02-structured-data-20260921
