name: CP02 Security Recovery Gauntlet Replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
      - name: Install JSON validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Replay CP02 contract and Rust gauntlet without state mutation
        run: |
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.validate_fixtures
          python -m unittest discover -s tests -p 'test_cp02_gauntlet.py' -v
          python -m unittest discover -s tests -p 'test_generated_manifest.py' -v
          buf format -d --exit-code
          buf lint
          buf build -o /tmp/clever-contracts.binpb
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path kernel/Cargo.toml --workspace --all-targets
          python -m scripts.contracts.generated_manifest --check
