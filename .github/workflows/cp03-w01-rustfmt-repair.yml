name: CP03 W01 Rustfmt Repair

on:
  push:
    branches:
      - wave/cp03/w01-transport-registry
    paths:
      - '.github/workflows/cp03-w01-rustfmt-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w01-rustfmt-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rustfmt-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Apply exact rustfmt and remove proven unused import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('kernel/crates/clever-kernel/src/adapter.rs')
          text=path.read_text()
          old='adapter_frame, AdapterCancel, AdapterFrame, AdapterHealthRequest, AdapterHello,\n'
          new='adapter_frame, AdapterCancel, AdapterFrame, AdapterHealthRequest,\n'
          assert old in text, 'expected unused AdapterHello import not found'
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --manifest-path kernel/Cargo.toml --all
          git diff --check
      - name: Guard semantic scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'kernel/crates/clever-kernel/src/adapter.rs',
            'kernel/crates/clever-kernel/tests/adapter_supervisor.rs',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed, 'rustfmt repair produced no changes'
          unexpected=changed-allowed
          assert not unexpected, f'unexpected rustfmt changes: {sorted(unexpected)}'
          print('rustfmt repair scope:', sorted(changed))
          PY
      - name: Persist canonical formatting with CAS
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_supervisor.rs
          git commit -m 'style(cp03): apply canonical rustfmt to W01 supervisor'
          git push origin "HEAD:${GITHUB_REF_NAME}"
