name: CP03 W02 Real Model Scope Amendment

on:
  push:
    branches: [wave/cp03/w02-real-model-lane-20260921]
    paths:
      - '.github/workflows/cp03-w02-real-model-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-real-model-scope-amend
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Persist non-conflicting plan-regression scope amendment
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cid='CLAIM-CP03-W02-REAL-MODEL-20260921'
          extra='tests/test_cp03_w02_plan.py'
          cp=Path('sessions/20260921-w02-real-model/CLAIM.json')
          claim=json.loads(cp.read_text())
          assert claim['claim_id']==cid and claim['status']=='ACTIVE'
          if extra not in claim['scope']:
              claim['scope'].append(extra)
          claim['coordination'] += ' Scope amended before mutation of the stale planning-regression assertion so the W02-09 COMPLETE → W02-10 READY transition is tested without overlapping runtime scope.'
          cp.write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
          lp=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(x) for x in lp.read_text().splitlines() if x.strip()]
          if not any(r.get('claim_id')==cid and r.get('event')=='SCOPE_AMENDED' and extra in r.get('scope',[]) for r in rows):
              row={
                'schema_version':1,'date':'2026-09-21','claim_id':cid,
                'event':'SCOPE_AMENDED','wave_id':'CP03-W02-REAL-MODEL-20260921',
                'parent_wave':'CP03-W02','canonical_task':'W02-09','owner':'chatgpt-gpt-5.6-sol',
                'scope':[extra],
                'coordination':'Planning-regression assertion only, required by the W02-09 durable transition. No W02-10 implementation, inference, parity or denominator mutation.',
                'status':'ACTIVE'
              }
              with lp.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(row,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/validate_agentic_state.py
          git diff --check
      - name: CAS commit amendment
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-real-model-lane-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-real-model/CLAIM.json ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): amend W02-09 planning regression scope'
          git push origin HEAD:wave/cp03/w02-real-model-lane-20260921
