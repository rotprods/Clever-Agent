name: CP03 W02 Egress Budget Claim

on:
  push:
    branches: [wave/cp03/w02-egress-budget]
    paths:
      - 'scripts/cp03/w02_egress_budget_claim.py'
      - '.github/workflows/cp03-w02-egress-budget-claim.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w02-egress-budget-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile branch against canonical main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          python scripts/cp03/validate_w02_plan.py
      - name: Acquire non-conflicting W02-07 claim
        run: |
          set -euo pipefail
          python scripts/cp03/w02_egress_budget_claim.py
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          git diff --check
      - name: Exact-head CAS persist claim
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/wave/cp03/w02-egress-budget | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          if git diff --quiet -- ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md; then
            echo 'claim already persisted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): activate W02-07 egress budget claim'
          git push origin HEAD:wave/cp03/w02-egress-budget
