name: CP03 W02 Harness Integrity

on:
  push:
    branches: [wave/cp03/w02-harness-hardening]
    paths:
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'scripts/cp03/w02_harness.py'
      - 'tests/test_cp03_w02_harness.py'
      - '.github/workflows/cp03-w02-harness.yml'
  pull_request:
    paths:
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'scripts/cp03/w02_harness.py'
      - 'tests/test_cp03_w02_harness.py'
      - '.github/workflows/cp03-w02-harness.yml'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp03-w02-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: ad45a297922d7f98ec67f6ff0fa6230acbb79ee5
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: must-not-leak-to-adapter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate canonical state and W02 scope lock
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.cp03.w02_scope_lock

      - name: Unit-test anti-false-green harness
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cp03_w02_harness.py' -v

      - name: RED — prove historical mandatory tests could silently return
        run: |
          set -euo pipefail
          mkdir -p evidence/cp03/cp03-w02/W02-02/red
          git show "$BASE_SHA:kernel/crates/clever-kernel/tests/adapter_supervisor.rs" > /tmp/adapter_supervisor.before.rs
          if python scripts/cp03/w02_harness.py --audit-source /tmp/adapter_supervisor.before.rs > evidence/cp03/cp03-w02/W02-02/red/audit.log 2>&1; then
            echo 'historical source unexpectedly passed false-green audit' >&2
            exit 1
          fi
          grep -q 'silent return paths' evidence/cp03/cp03-w02/W02-02/red/audit.log

      - name: GREEN — audit current source and run mandatory fake lane
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          python scripts/cp03/w02_harness.py --audit-source kernel/crates/clever-kernel/tests/adapter_supervisor.rs
          CLEVER_TEST_PYTHON="$(command -v python)" python scripts/cp03/w02_harness.py \
            --mode fake \
            --out evidence/cp03/cp03-w02/W02-02/fake

      - name: Build exact pinned OpenJarvis native lane
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-w02-harness-base:${GITHUB_SHA}" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-sidecar-context
          docker build \
            --build-arg "BASE_IMAGE=clever-w02-harness-base:${GITHUB_SHA}" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-w02-harness-native:${GITHUB_SHA}" \
            /tmp/openjarvis-sidecar-context
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CLEVER_OPENJARVIS_IMAGE=clever-w02-harness-native:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: GREEN — mandatory pinned native lane
        run: |
          set -euo pipefail
          python scripts/cp03/w02_harness.py \
            --mode native \
            --out evidence/cp03/cp03-w02/W02-02/native

      - name: Retest exact mandatory fake lane
        run: |
          set -euo pipefail
          python scripts/cp03/w02_harness.py \
            --mode fake \
            --out evidence/cp03/cp03-w02/W02-02/retest
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Validate evidence shape and unchanged parity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/cp03/cp03-w02/W02-02')
          expected={'fake':6,'native':1,'retest':6}
          for lane,count in expected.items():
              report=json.loads((root/lane/'report.json').read_text())
              assert report['status']=='PASS'
              assert report['executed_count']==count
              assert report['executed_test_ids']==report['required_test_ids']
              assert report['failed']==0 and report['ignored']==0
              assert report['parity_promotions']==0
              junit=(root/lane/'results.junit.xml').read_text()
              assert f'tests="{count}"' in junit and 'failures="0"' in junit and 'skipped="0"' in junit
          PY
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          git diff --check

      - name: Upload W02-02 proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-harness-${{ github.sha }}
          path: evidence/cp03/cp03-w02/W02-02/
          if-no-files-found: error
          retention-days: 30
