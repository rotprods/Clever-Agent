name: CP03 W02 Control Integrity
on:
  push:
    branches: [wave/cp03/w02-supervisor-hardening]
    paths:
      - 'kernel/crates/clever-kernel/**'
      - 'adapters/openjarvis/**'
      - 'scripts/cp03/control_gate.py'
      - 'tests/test_cp03_control*.py'
      - '.github/workflows/cp03-w02-control.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cp03-w02-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == 'refs/heads/wave/cp03/w02-supervisor-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
      BASE_SHA: 7feba0d207413b67f6a612e81fc16c04cc4c51da
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: control-test-canary-not-a-real-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Mandatory boot and preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
      - name: Normalize formatting only before creating tested source commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path kernel/Cargo.toml --all
          python - <<'PY'
          import subprocess
          allowed={'kernel/crates/clever-kernel/src/adapter.rs','kernel/crates/clever-kernel/src/capabilities.rs','kernel/crates/clever-kernel/tests/control_regressions.rs'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/src/capabilities.rs kernel/crates/clever-kernel/tests/control_regressions.rs
            git commit -m 'style(cp03-w02): normalize control patch before validation'
          fi
          echo "VALIDATED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Python control and anti-false-green regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cp03/cp03-w02/control
          python -m unittest discover -s tests -p 'test_cp03_control*.py' -v 2>&1 | tee evidence/cp03/cp03-w02/control/python.txt
          python -m unittest discover -s tests -p 'test_cp03_openjarvis_sidecar.py' -v
      - name: RED against exact historical implementation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/clever-control-red "$BASE_SHA"
          cp kernel/crates/clever-kernel/tests/control_regressions.rs /tmp/clever-control-red/kernel/crates/clever-kernel/tests/
          cp kernel/crates/clever-kernel/tests/fixtures/control_peer.py /tmp/clever-control-red/kernel/crates/clever-kernel/tests/fixtures/
          python scripts/cp03/control_gate.py --root /tmp/clever-control-red --mode red --out evidence/cp03/cp03-w02/control/red
      - name: GREEN and repeated retest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp03/control_gate.py --mode green --out evidence/cp03/cp03-w02/control/green
          python scripts/cp03/control_gate.py --mode green --repeat 5 --out evidence/cp03/cp03-w02/control/retest
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Prepare exact native upstream and secret-free source mount
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/control-openjarvis
          git -C /tmp/control-openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/control-openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          test "$(git -C /tmp/control-openjarvis rev-parse FETCH_HEAD)" = "$OPENJARVIS_SHA"
          mkdir -p /tmp/control-oj-src /tmp/control-clever-src /tmp/control-sidecar-build
          git -C /tmp/control-openjarvis archive FETCH_HEAD | tar -x -C /tmp/control-oj-src
          git archive HEAD | tar -x -C /tmp/control-clever-src
          test ! -e /tmp/control-clever-src/.git
          docker build -f scripts/cp03/Dockerfile.baseline -t "clever-control-base:$SOURCE_SHA" /tmp/control-oj-src
          docker build --build-arg "BASE_IMAGE=clever-control-base:$SOURCE_SHA" -f scripts/cp03/Dockerfile.openjarvis-sidecar -t "clever-control:$SOURCE_SHA" /tmp/control-sidecar-build
          echo "CLEVER_OPENJARVIS_IMAGE=clever-control:$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=/tmp/control-clever-src" >> "$GITHUB_ENV"
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
      - name: Full kernel regression including mandatory native OpenJarvis
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLEVER_TEST_PYTHON"
          test -n "$CLEVER_OPENJARVIS_IMAGE"
          test -d "$CLEVER_REPO_ROOT"
          test -x "$CLEVER_DOCKER_BIN"
          cargo test --locked --manifest-path kernel/Cargo.toml --workspace --all-targets 2>&1 | tee evidence/cp03/cp03-w02/control/kernel.txt
          grep -F 'test real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion ... ok' evidence/cp03/cp03-w02/control/kernel.txt
          python -m scripts.contracts.generated_manifest --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Record scope-limited evidence and release support claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,datetime
          root=Path('.'); folder=root/'evidence/cp03/cp03-w02/control'
          reports={name:json.loads((folder/name/'report.json').read_text()) for name in ['red','green','retest']}
          assert all(r['status']=='PASS' for r in reports.values())
          assert reports['red']['executions']==11 and reports['green']['executions']==15 and reports['retest']['executions']==75
          assert reports['green']['source_sha']==os.environ['VALIDATED_SOURCE_SHA']
          assert reports['retest']['source_hashes']==reports['green']['source_hashes']
          goal=json.loads(Path('GOAL_STATE.json').read_text()); assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          evidence_id='EVID-W02-CONTROL-20260907'
          summary={'schema_version':1,'evidence_id':evidence_id,'status':'PASS','scope':'CONTROL_INTEGRITY_NOT_INFERENCE_PARITY','source_sha':os.environ['VALIDATED_SOURCE_SHA'],'trigger_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'red_assertions':11,'green_cases':15,'retest_executions':75,'python_new_tests':25,'native_openjarvis_registry_replay':'PASS','parity_promotions':0,'remaining':['aggregate queue bounds','write and teardown deadlines','process group and container-ID cleanup','inference execution','model lane'],'artifacts':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.rglob('*')) if p.is_file()}}
          (folder/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          def append(path,row):
              with Path(path).open('a') as f: f.write(json.dumps(row,sort_keys=True)+'\n')
          date=datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          append('ledgers/EVIDENCE_LEDGER.ndjson',{'schema_version':1,'date':date,'evidence_id':evidence_id,'status':'VERIFIED','type':'control_regression_slice','validated_head':os.environ['VALIDATED_SOURCE_SHA'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'paths':['evidence/cp03/cp03-w02/control/summary.json'],'claim':'11 historical assertion failures become 15 passing control tests with 75 retests, Python protocol/harness tests and pinned native registry replay. Not inference, resource-bound transport, or capability parity.'})
          append('ledgers/RUN_LOG.ndjson',{'schema_version':1,'date':date,'event':'CONTROL_REGRESSION_ADVANCED','wave_id':'CP03-W02-CONTROL','parent_wave':'CP03-W02','status':'ADVANCED','evidence_id':evidence_id,'next':'W02-01 obligations and W02-03 bounded I/O; W02-04 cleanup remains open'})
          append('ledgers/WAVE_LEDGER.ndjson',{'schema_version':1,'date':date,'wave_id':'CP03-W02-CONTROL','parent_wave':'CP03-W02','status':'COMPLETE','evidence_id':evidence_id,'scope':'support slice only; canonical W02 remains open'})
          append('ledgers/CLAIM_LEDGER.ndjson',{'schema_version':1,'date':date,'claim_id':'CLAIM-W02-CONTROL-20260907','wave_id':'CP03-W02-CONTROL','status':'RELEASED','release_evidence_id':evidence_id})
          Path('HANDOFF.md').write_text('# HANDOFF — CP03-W02\n\nCompleted support slice: CP03-W02-CONTROL. Evidence: '+evidence_id+' at evidence/cp03/cp03-w02/control/summary.json.\n\nCanonical task CP03-002 / CP03-W02 remains open. Control correlation, poisoned connections, atomic registry and mandatory named tests now have evidence. No inference or parity promotion.\n\nNext: reconcile W02-00 against this CI environment receipt, compile W02-01 obligations, then W02-03 bounded queues/write deadlines and W02-04 process/container cleanup. Do not mark G1 complete. Read iterations/03/waves/CP03-W02/METAPROMPT.md.\n')
          Path('sessions/20260907-w02-control/RESULT.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          git diff --check
      - name: Preserve logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w02-control-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: evidence/cp03/cp03-w02/control/
      - name: Publish tested formatting and evidence with compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$SOURCE_SHA"
          git add evidence/cp03/cp03-w02/control sessions/20260907-w02-control/RESULT.json HANDOFF.md ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'test(cp03-w02): persist control regression proof without advancing inference'
          git push origin "HEAD:${GITHUB_REF_NAME}"
