name: CP03 W02 Structured State Finalize

on:
  push:
    branches:
      - state/cp03-w02-structured-core-20260921
    paths:
      - '.github/workflows/cp03-w02-structured-state-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-structured-state-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: state/cp03-w02-structured-core-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
      - name: Exact-head precondition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Targeted W02-13 tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m py_compile adapters/openjarvis/structured_output.py adapters/openjarvis/streaming_inference.py tests/test_cp03_w02_structured_output.py
          python -m unittest -v tests.test_cp03_w02_structured_output
      - name: W02 streaming cancellation and contract regression
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_w02_plan
      - name: Kernel security and library gauntlet
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Pre-transition durable-state gauntlet
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
      - name: Build exact-head partial receipt
        run: |
          python - <<'PY'
          import json, os
          receipt = {
            'project_id': 'CLEVER-JARVIS-001',
            'checkpoint': 'CP03',
            'parent_wave': 'CP03-W02',
            'task': 'W02-13',
            'gate': 'G4',
            'status': 'PARTIAL_PASS',
            'validated_head': os.environ['GITHUB_SHA'],
            'github_actions_run_id': int(os.environ['GITHUB_RUN_ID']),
            'red_run_id': 35648078142,
            'fragmented_tool_arguments': 'PASS',
            'invalid_tool_arguments': 'FAIL_CLOSED',
            'malicious_tool_name_execution': 'ZERO_EXECUTION',
            'structured_json_schema_validation': 'PASS',
            'invalid_structured_json': 'FAIL_CLOSED',
            'canonical_typed_transport': 'NOT_RUN',
            'provider_egress_executions': 0,
            'tool_executions': 0,
            'parity_promotions': 0,
            'verified_capabilities': 0,
            'global_denominator': 7565,
            'openjarvis_obligations': 646,
            'w02_proof_units': 47,
          }
          with open('/tmp/w02-13-partial-receipt.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
      - name: Persist W02-13 partial transition
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_structured.py --receipt /tmp/w02-13-partial-receipt.json
          python scripts/context/build_context_pack.py
      - name: Post-transition gauntlet
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-13']['status']=='IN_PROGRESS'
          assert tasks['W02-13']['proof']==[]
          assert tasks['W02-14']['status']=='BLOCKED'
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-13/report.json').read_text())
          assert report['canonical_typed_transport']=='NOT_RUN'
          assert report['parity_promotions']==0
          PY
          git diff --check
      - name: Commit durable state with fast-forward CAS
        run: |
          set -euo pipefail
          git config user.name 'Clever-Agent State Finalizer'
          git config user.email '261643698+rotprods@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json \
                  evidence/cp03/cp03-w02/W02-13 \
                  sessions/20260921-w02-structured \
                  ledgers/CLAIM_LEDGER.ndjson \
                  ledgers/EVIDENCE_LEDGER.ndjson \
                  ledgers/RUN_LOG.ndjson \
                  ledgers/WAVE_LEDGER.ndjson \
                  ledgers/DECISION_LEDGER.ndjson \
                  ledgers/RISK_LEDGER.ndjson \
                  STATE.md HANDOFF.md \
                  .agentic/context/CURRENT_CONTEXT.json \
                  .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --exit-code && { echo 'Expected durable state delta is empty'; exit 1; } || true
          git commit -m 'state(cp03-w02): persist W02-13 structured core partial evidence [skip ci]'
          git push origin HEAD:state/cp03-w02-structured-core-20260921
