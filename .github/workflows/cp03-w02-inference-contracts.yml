name: CP03 W02 Inference Contracts

on:
  push:
    branches: [wave/cp03/w02-inference-contracts-20260915]
  pull_request:
    branches: [wave/cp03/w02-teardown-cleanup]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generate-and-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.72.0'
      - name: Validate additive contract and generate bindings
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt jsonschema==4.25.1
          python -m unittest tests.test_cp03_w02_inference_contract tests.test_cp03_adapter_contract tests.test_contract_versioning -v
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.validate_fixtures
          buf format -d --exit-code
          buf lint
          buf build -o /tmp/clever-contracts.binpb
          buf generate
          python -m scripts.contracts.build_wire_fixture
      - name: Python decode and deterministic fixture check
        run: |
          set -euo pipefail
          PYTHONPATH=contracts/sdk/python/gen python - <<'PY'
          from pathlib import Path
          from clever.v1 import inference_pb2
          payload=Path('contracts/fixtures/wire/inference-request.bin').read_bytes()
          request=inference_pb2.InferenceRequest.FromString(payload)
          assert request.request_id == 'req_contract_001'
          assert request.attempt_id == 'att_contract_001'
          assert request.SerializeToString(deterministic=True) == payload
          PY
      - name: TypeScript round trips
        working-directory: contracts/sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Rust round trips
        run: cargo test --locked --manifest-path contracts/sdk/rust/Cargo.toml
      - name: Build generated manifest and evidence artifact
        run: |
          python -m scripts.contracts.generated_manifest
          python scripts/security/audit_github_actions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cp03-w02-inference-contracts-${{ env.SOURCE_SHA }}
          retention-days: 7
          if-no-files-found: error
          path: |
            contracts/sdk/python/gen/clever/
            contracts/sdk/typescript/src/gen/
            contracts/sdk/rust/src/gen/
            contracts/sdk/swift/Sources/CleverContracts/Gen/
            contracts/fixtures/wire/
            contracts/generated_manifest.json

  swift-roundtrip:
    needs: generate-and-roundtrip
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cp03-w02-inference-contracts-${{ env.SOURCE_SHA }}
          path: .
      - name: Swift historical and inference round trips
        run: swift test --package-path contracts/sdk/swift
