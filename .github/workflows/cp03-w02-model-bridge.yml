name: CP03 W02 Model Engine Bridge

on:
  push:
    branches: [wave/cp03/w02-model-engine-bridge-20260921]
    paths:
      - 'adapters/openjarvis/model_bridge.py'
      - 'adapters/openjarvis/sidecar.py'
      - 'tests/test_cp03_w02_model_bridge.py'
      - 'tests/test_cp03_openjarvis_sidecar.py'
      - '.github/workflows/cp03-w02-model-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/openjarvis/model_bridge.py'
      - 'adapters/openjarvis/sidecar.py'
      - 'tests/test_cp03_w02_model_bridge.py'
      - 'tests/test_cp03_openjarvis_sidecar.py'
      - '.github/workflows/cp03-w02-model-bridge.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-model-bridge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge-gauntlet:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install deterministic Python prerequisites
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'jsonschema==4.25.1'
      - name: W02-08 lifecycle RED GREEN contract
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_model_bridge tests.test_cp03_openjarvis_sidecar
          python -m py_compile adapters/openjarvis/model_bridge.py
      - name: Build exact pinned OpenJarvis catalog image
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-openjarvis-w02-08-base:$GITHUB_SHA" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-w02-08-context
          docker build \
            --build-arg "BASE_IMAGE=clever-openjarvis-w02-08-base:$GITHUB_SHA" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-openjarvis-w02-08:$GITHUB_SHA" \
            /tmp/openjarvis-w02-08-context
      - name: Native catalog smoke with runtime network disabled
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/config \
            -e XDG_DATA_HOME=/tmp/data \
            -e PYTHONHASHSEED=0 \
            -e PYTHONPATH=/clever:/src/src \
            -v "$GITHUB_WORKSPACE:/clever:ro" \
            "clever-openjarvis-w02-08:$GITHUB_SHA" \
            'exec /src/.venv/bin/python /clever/adapters/openjarvis/model_bridge.py --dump-catalog' \
            > /tmp/w02-08-native-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/w02-08-native-catalog.json').read_text())
          assert data['upstream_commit']=='72033b8ec288aa067ce4530ff9d96bf231e9c4e5'
          assert data['engine_count'] > 0, data
          assert data['model_count'] > 0, data
          assert data['upstream_execution'] is False
          assert data['model_executions'] == 0
          assert data['provider_egress_executions'] == 0
          assert data['parity_promotions'] == 0
          assert all(row['state']=='REGISTERED' for row in data['engines'])
          assert all(row['state']=='REGISTERED' for row in data['models'])
          print(json.dumps({
              'engine_count': data['engine_count'],
              'model_count': data['model_count'],
              'import_failures': data['import_failures'],
              'model_executions': data['model_executions'],
              'provider_egress_executions': data['provider_egress_executions'],
          }, sort_keys=True))
          PY
      - name: Regression and W02-07 security gauntlet
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_inference_contract \
            tests.test_cp03_w02_egress \
            tests.test_cp03_w02_plan
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel -- --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Durable-state and parity invariant gauntlet
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-08'
          assert tasks['W02-06']['status']=='COMPLETE'
          assert tasks['W02-07']['status']=='COMPLETE'
          assert tasks['W02-08']['status']=='READY'
          assert tasks['W02-09']['status']=='BLOCKED'
          assert not tasks['W02-08']['proof']
          PY
          git diff --check
