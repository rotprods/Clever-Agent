name: CP03 W02 Unary Workflow Repair

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-workflow-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Repair materialize job permission and verify exact block
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/cp03-w02-unary-inference.yml')
          text=p.read_text()
          old="  materialize:\n    permissions:\n      contents: $" + "{{ github.event_name == 'push' && 'write' || 'read' }}\n"
          new="  materialize:\n    permissions:\n      contents: write\n"
          if old in text:
              assert text.count(old)==1, f'materialize permission anchor count={text.count(old)}'
              text=text.replace(old,new,1)
              p.write_text(text)
          else:
              assert text.count(new)==1, f'materialize static permission block count={text.count(new)}'
          PY
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/cp03-w02-unary-inference.yml').read_text()
          expected="  materialize:\n    permissions:\n      contents: write\n"
          assert text.count(expected)==1, f'materialize static permission block count={text.count(expected)}'
          PY
          git diff --check
      - name: CAS persist workflow repair
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          if git diff --quiet -- .github/workflows/cp03-w02-unary-inference.yml; then
            echo 'workflow already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp03-w02-unary-inference.yml
          git commit -m 'fix(cp03-w02): use static materialize contents permission'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
