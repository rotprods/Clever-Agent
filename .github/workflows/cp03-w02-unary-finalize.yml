name: CP03 W02 Unary Finalizer Dependency Repair

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-finalizer-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: RED root cause and deterministic finalizer repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/cp03-w02-unary-inference.yml')
          text=path.read_text(encoding='utf-8')
          old="""      - name: Post-transition regression and gauntlet
        run: |
          set -euo pipefail
          python -m unittest tests.test_cp03_w02_plan tests.test_cp03_w02_unary_inference -v
"""
          new="""      - name: Post-transition regression and gauntlet
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          python -m unittest tests.test_cp03_w02_plan tests.test_cp03_w02_unary_inference -v
"""
          if new not in text:
              count=text.count(old)
              assert count == 1, f'expected one finalizer regression anchor, found {count}'
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          final=path.read_text(encoding='utf-8')
          assert final.count(new)==1
          assert "python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt" in final
          PY
          git diff --check
      - name: CAS persist finalizer dependency repair
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp03-w02-unary-inference.yml
          if git diff --cached --quiet; then
            echo 'finalizer dependency already repaired'
            exit 0
          fi
          git commit -m 'fix(cp03-w02): install protobuf before finalizer regression'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
