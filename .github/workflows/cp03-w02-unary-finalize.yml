name: CP03 W02 Unary Driver Repair

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-unary-driver-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: RED root cause and deterministic driver repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/cp03-w02-unary-driver.yml')
          text=path.read_text(encoding='utf-8')
          old='python scripts/cp03/w02_unary_patch.py --check'
          new='python sessions/20260921-w02-unary-inference/check_applied.py'
          count=text.count(old)
          if count:
              assert count == 2, count
              text=text.replace(old,new)
              path.write_text(text,encoding='utf-8')
          assert path.read_text(encoding='utf-8').count(new)==2
          PY
          python -m py_compile sessions/20260921-w02-unary-inference/check_applied.py
          git diff --check
      - name: CAS persist workflow repair
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp03-w02-unary-driver.yml
          if git diff --cached --quiet; then
            echo 'driver already repaired'
            exit 0
          fi
          git commit -m 'fix(cp03-w02): use format-stable unary source check'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
