name: CP03 W02 Inference Claim

on:
  push:
    branches: [wave/cp03/w02-inference-contracts-20260920]
    paths:
      - 'scripts/cp03/claim_w02_inference_contracts.py'
      - '.github/workflows/cp03-w02-inference-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-inference-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preflight durable state
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
      - name: Acquire W02-06 claim and WORK_STARTED
        run: |
          set -euo pipefail
          python scripts/cp03/claim_w02_inference_contracts.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          git diff --check
      - name: Restrict claim transaction
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'ledgers/CLAIM_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
            'sessions/20260920-w02-inference-contracts/CLAIM.json',
          }
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'], text=True).splitlines() if line}
          unexpected=changed-allowed
          assert not unexpected, f'out-of-scope claim mutation: {sorted(unexpected)}'
          assert {'ledgers/CLAIM_LEDGER.ndjson','ledgers/RUN_LOG.ndjson'}.issubset(changed), f'missing claim transaction surfaces: {sorted(changed)}'
          PY
      - name: CAS persist claim
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/${GITHUB_REF_NAME} | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md sessions/20260920-w02-inference-contracts/CLAIM.json
          git commit -m 'chore(cp03-w02): claim W02-06 inference contracts'
          git push origin HEAD:${GITHUB_REF_NAME}
