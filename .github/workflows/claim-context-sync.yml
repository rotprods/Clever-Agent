name: Claim Context Sync

on:
  push:
    paths:
      - 'ledgers/CLAIM_LEDGER.ndjson'
      - '.github/workflows/claim-context-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claim-context-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild context from claim ledger
        run: |
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
      - name: Restrict mutation to derived ContextPack
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'ContextPack already synchronized; no persistence commit required.'
            exit 0
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              .agentic/context/CURRENT_CONTEXT.json|.agentic/context/CURRENT_CONTEXT.md) ;;
              *) echo "unexpected mutation: $path" >&2; exit 1 ;;
            esac
          done
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Persist derived context only
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(agentic): sync ContextPack after claim change'
          git push origin "HEAD:${GITHUB_REF_NAME}"
