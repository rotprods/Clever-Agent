name: CP02 Release Compiler

on:
  push:
    branches:
      - wave/cp02/canonical-contracts-kernel
    paths:
      - 'scripts/cp02/release.py'
      - 'scripts/cp02/finalize.py'
      - 'scripts/cp03/obligations.py'
      - 'scripts/parity/**'
      - 'inventory/schemas/parity_record.schema.json'
      - 'iterations/03/**'
      - 'tests/test_cp02_release.py'
      - 'tests/test_cp03_obligations.py'
      - 'tests/test_parity_ledger.py'
      - '.github/workflows/cp02-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp02-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
      - name: Install JSON validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Test release compiler parity overlay and obligation freeze
        run: |
          python -m unittest discover -s tests -p 'test_cp02_release.py' -v
          python -m unittest discover -s tests -p 'test_parity_ledger.py' -v
          python -m unittest discover -s tests -p 'test_cp03_obligations.py' -v
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Re-prove canonical contracts
        run: |
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.validate_fixtures
          python -m unittest discover -s tests -p 'test_contract_versioning.py' -v
          python -m unittest discover -s tests -p 'test_cp02_gauntlet.py' -v
          python -m unittest discover -s tests -p 'test_generated_manifest.py' -v
          buf format -d --exit-code
          buf lint
          buf build -o /tmp/clever-contracts.binpb
          python -m scripts.contracts.generated_manifest --check
      - name: Re-prove Rust kernel action security and recovery
        run: |
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --manifest-path kernel/Cargo.toml --workspace --all-targets
      - name: Build CP02 release evidence
        run: python -m scripts.cp02.release --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Finalize CP02 and bootstrap CP03
        run: python -m scripts.cp02.finalize --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Validate post-transition state
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          test "$(wc -l < inventory/cp03/openjarvis_obligations.jsonl)" -eq 646
          git diff --check
      - name: Persist CP02 release and CP03 bootstrap
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            evidence/cp02/release reports/cp02/CP02_RELEASE_REPORT.md \
            inventory/cp03 reports/cp03 \
            CHECKPOINT_REGISTRY.json GOAL_STATE.json EXECUTION_STATE.json STATE.md HANDOFF.md TASKS.md CHECKPOINTS.md CHANGELOG.md \
            iterations/02/STATE.json iterations/03/STATE.json \
            .agentic/CONFIG.yaml .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md .agentic/context/NEXT_ACTIONS.json \
            ledgers/EVIDENCE_LEDGER.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RUN_LOG.ndjson
          git commit -m 'release(cp02): close contracts kernel checkpoint and enter OpenJarvis adapter'
          python scripts/validate_agentic_state.py
          git push origin "HEAD:${GITHUB_REF_NAME}"
