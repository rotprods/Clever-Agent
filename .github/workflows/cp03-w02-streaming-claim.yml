name: CP03 W02 Streaming Claim

on:
  push:
    branches: [wave/cp03/w02-streaming-20260921]
    paths:
      - '.github/workflows/cp03-w02-streaming-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-streaming-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile frontier, release stale claim, acquire W02-11
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "c5c7397f936d612a47af1ca6592c89cfcc12d7e8"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c5c7397f936d612a47af1ca6592c89cfcc12d7e8"
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT=Path('.')
          graph=json.loads((ROOT/'iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-11'
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert tasks['W02-11']['status']=='READY' and not tasks['W02-11']['proof']
          assert tasks['W02-11']['depends_on']==['W02-10']
          assert tasks['W02-10']['status']=='COMPLETE' and tasks['W02-10']['proof']

          claim_path=ROOT/'sessions/20260921-w02-streaming/CLAIM.json'
          claim=json.loads(claim_path.read_text())
          assert claim['canonical_task']=='W02-11'
          assert claim['base_head']=='c5c7397f936d612a47af1ca6592c89cfcc12d7e8'

          ledger=ROOT/'ledgers/CLAIM_LEDGER.ndjson'
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          latest={}
          scopes={}
          for row in rows:
              cid=row.get('claim_id')
              if not cid:
                  continue
              if row.get('scope'):
                  scopes.setdefault(cid,set()).update(row['scope'])
              if row.get('status'):
                  latest[cid]=row['status']

          stale='CLAIM-CP03-W02-UNARY-RELEASE-REPAIR-20260921'
          if latest.get(stale)=='ACTIVE':
              release={
                  'schema_version':1,'date':'2026-09-21','claim_id':stale,
                  'event':'RELEASE','wave_id':'CP03-W02-UNARY-RELEASE-REPAIR-20260921',
                  'owner':'chatgpt-gpt-5.6-sol','status':'RELEASED',
                  'release_evidence_id':'EVID-W02-UNARY-INFERENCE-20260921',
                  'postmerge_head':'c5c7397f936d612a47af1ca6592c89cfcc12d7e8',
                  'postmerge_agentic_run_id':35585540665,
                  'coordination':'Canonical W02-10 merge and exact main Agentic Contract passed; stale release-repair claim closed before W02-11. No parity or denominator mutation.'
              }
              rows.append(release)
              latest[stale]='RELEASED'

          def overlaps(a: str, b: str) -> bool:
              if a==b: return True
              for left,right in ((a,b),(b,a)):
                  if left.endswith('/**') and right.startswith(left[:-3].rstrip('/')+'/'):
                      return True
              return False

          wanted=set(claim['scope'])
          conflicts=[]
          for cid,status in latest.items():
              if status!='ACTIVE' or cid in {stale, claim['claim_id']}:
                  continue
              shared=[]
              for a in wanted:
                  for b in scopes.get(cid,set()):
                      if overlaps(a,b): shared.append((a,b))
              if shared: conflicts.append((cid,shared))
          assert not conflicts, f'active claim conflict: {conflicts}'

          active=dict(claim)
          active.pop('base_head',None)
          active['status']='ACTIVE'
          active['event']='CLAIM'
          rows.append(active)
          ledger.write_text('\n'.join(json.dumps(row,sort_keys=True,separators=(',',':')) for row in rows)+'\n')

          claim['status']='ACTIVE'
          claim_path.write_text(json.dumps(claim,indent=2,sort_keys=False)+'\n')

          with (ROOT/'ledgers/WAVE_LEDGER.ndjson').open('a',encoding='utf-8') as h:
              h.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','event_id':'WAVE-W02-STREAMING-20260921-START',
                  'wave_id':'CP03-W02-STREAMING-20260921','parent_wave':'CP03-W02','canonical_task':'W02-11',
                  'checkpoint':'CP03','iteration':'I03','event':'CLAIMED','status':'IN_PROGRESS',
                  'base_head':'c5c7397f936d612a47af1ca6592c89cfcc12d7e8','parity_promotions':0
              },sort_keys=True,separators=(',',':'))+'\n')
          with (ROOT/'ledgers/RUN_LOG.ndjson').open('a',encoding='utf-8') as h:
              h.write(json.dumps({
                  'schema_version':1,'date':'2026-09-21','event_id':'RUN-W02-STREAMING-20260921-START',
                  'event':'WORK_STARTED','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03',
                  'wave_id':'CP03-W02','support_wave':'CP03-W02-STREAMING-20260921','canonical_task':'W02-11',
                  'base_head':'c5c7397f936d612a47af1ca6592c89cfcc12d7e8','parity_promotions':0
              },sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          git diff --check
      - name: CAS persist claim and reconciled ContextPack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-streaming-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-streaming/CLAIM.json ledgers/CLAIM_LEDGER.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RUN_LOG.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m 'claim(cp03-w02): acquire W02-11 streaming scope'
          git push origin HEAD:wave/cp03/w02-streaming-20260921
