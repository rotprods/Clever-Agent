          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          g=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          t={x['id']:x for x in g['tasks']}
          assert g['first_executable_task']=='W02-17'
          assert t['W02-17']['status']=='IN_PROGRESS'
          assert t['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(t[d]['status']=='COMPLETE' and t[d]['proof'] for d in t['W02-17']['depends_on'])
          assert t['W02-18']['status']=='BLOCKED' and t['W02-19']['status']=='BLOCKED'
          assert g['global_denominator']==7565 and g['openjarvis_obligations']==646 and g['w02_obligation_count']==47
          c=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert c['claim_id']==os.environ['CLAIM_ID'] and c['wave_id']==os.environ['WAVE_ID'] and c['canonical_task']=='W02-17' and c['status']=='ACTIVE'
          for p in ('.github/workflows/cp03-w02-parity-graph.yml','tests/test_cp03_w02_parity_graph.py','inventory/cp03/w02_evidence_bindings.jsonl','evidence/cp03/cp03-w02/W02-17/**','STATE.md','HANDOFF.md'):
              assert p in c['scope']
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=latest[os.environ['CLAIM_ID']]
          assert active['status']=='ACTIVE' and active['wave_id']==os.environ['WAVE_ID'] and active['owner']=='chatgpt-gpt-5.6-sol'
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          cctx=next(x for x in ctx['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert cctx['status']=='ACTIVE' and cctx['wave_id']==os.environ['WAVE_ID']
          s=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert s['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':22,'UNBOUND':25}
          assert s['verified_capabilities']==0 and s['parity_promotions']==0 and s['global_denominator']==7565 and s['openjarvis_obligations']==646
          m=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in m if x['capability_id']==os.environ['CAPABILITY_ID'])
          assert target['name']=='POST /v1/cloud/reload' and target['surface_kind']=='http_route'
          assert target['source_path']=='src/openjarvis/server/routes.py' and target['source_line']==1219
          assert target['ownership']=='OWNED' and target['terminal_eligible_in_w02'] is True
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None and target['canonical_parity_status']=='UNVERIFIED' and target['verified'] is False
          afm=next(x for x in m if x['capability_id']=='cap_ac38bf813e130d14927723d8'); assert afm['w02_evidence_state']=='UNBOUND'
          start=next(x for x in m if x['capability_id']=='cap_a97068215f50aeff0353f6e9'); assert start['w02_evidence_state']=='UNBOUND' and start['binding'] is None
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph
          git diff --check

      - name: Source probe RED binding GREEN and persistence
