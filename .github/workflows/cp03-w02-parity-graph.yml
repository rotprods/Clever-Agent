              'executed_test_id':os.environ['TEST_ID'],'source_probe_path':str(probe),'source_probe_sha256':hashlib.sha256(probe.read_bytes()).hexdigest(),
              'source_execution':False,'inference_end_event_runtime_execution':'NOT_RUN','bindings_added_this_slice':1,'bindings_validated_total':23,'unbound_remaining':24,
              'global_denominator':7565,'openjarvis_obligations':646,'verified_capabilities':0,'parity_promotions':0,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,
              'afm_inprocess_execution':'NOT_RUN','real_openjarvis_fallback_model_execution':'NOT_RUN','inference_start_event_binding':'UNBOUND_UNTOUCHED',
              'next_slice':'Continue W02-17 with another non-conflicting proof unit only when capability-specific executed or exact pinned-source evidence can be paired with an existing completed-task PASS receipt. AFM/fallback stay NOT_RUN and InferenceStartEvent remains outside this slice.'
