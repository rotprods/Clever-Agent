          marker='PROVIDER_SAVINGS_PROTOCOL_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_provider_savings_protocol_binding_is_capability_specific_and_source_backed"\n)\n'; assert marker in t
          t=t.replace(marker,marker+'INFERENCE_END_EVENT_PROTOCOL_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_inference_end_event_protocol_binding_is_capability_specific_and_source_backed"\n)\n',1)
          t=t.replace('def test_current_matrix_has_twenty_two_candidates_and_no_parity_promotion','def test_current_matrix_has_twenty_three_candidates_and_no_parity_promotion',1)
          assert '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 22)' in t and '== "UNBOUND" for row in rows), 25)' in t
          t=t.replace('== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 22)','== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 23)',1)
          t=t.replace('== "UNBOUND" for row in rows), 25)','== "UNBOUND" for row in rows), 24)',1)
          tail='CLI_SERVE_COMMAND_CAPABILITY_ID, PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID},'; assert tail in t
          t=t.replace(tail,'CLI_SERVE_COMMAND_CAPABILITY_ID, PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID, INFERENCE_END_EVENT_PROTOCOL_CAPABILITY_ID},',1)
          block='        provider_savings_protocol = candidates[PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID]\n        self.assertEqual(provider_savings_protocol["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(provider_savings_protocol["binding"]["terminal"])\n'; assert block in t
          t=t.replace(block,block+'        inference_end_event_protocol = candidates[INFERENCE_END_EVENT_PROTOCOL_CAPABILITY_ID]\n        self.assertEqual(inference_end_event_protocol["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(inference_end_event_protocol["binding"]["terminal"])\n',1)
