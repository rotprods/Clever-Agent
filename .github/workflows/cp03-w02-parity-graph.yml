name: CP03 W02 G6 ProviderSavings protocol binding

on:
  push:
    branches: [wave/cp03/w02-parity-provider-savings-20260924]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 239b6f37ec5488522ae75f6def9541e3f3c85d32
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_56d79a86da34eeeacdf49427
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-PROVIDER-SAVINGS-PROTOCOL-20260924
  DECISION_ID: DEC-W02-G6-PROVIDER-SAVINGS-PROTOCOL-BINDING-20260924
  SOURCE_EVIDENCE_ID: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_EVIDENCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_provider_savings_protocol_binding_is_capability_specific_and_source_backed

jobs:
  bind-provider-savings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and durable-state preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          g=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          t={x['id']:x for x in g['tasks']}
          assert g['first_executable_task']=='W02-17'
          assert t['W02-17']['status']=='IN_PROGRESS'
          assert t['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(t[d]['status']=='COMPLETE' and t[d]['proof'] for d in t['W02-17']['depends_on'])
          assert t['W02-18']['status']=='BLOCKED' and t['W02-19']['status']=='BLOCKED'
          assert g['global_denominator']==7565 and g['openjarvis_obligations']==646 and g['w02_obligation_count']==47
          c=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert c['claim_id']==os.environ['CLAIM_ID'] and c['wave_id']==os.environ['WAVE_ID']
          assert c['canonical_task']=='W02-17' and c['status']=='ACTIVE'
          for p in ('tests/test_cp03_w02_parity_graph.py','inventory/cp03/w02_evidence_bindings.jsonl','evidence/cp03/cp03-w02/W02-17/**','STATE.md','HANDOFF.md'):
              assert p in c['scope']
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=latest[os.environ['CLAIM_ID']]
          assert active['status']=='ACTIVE' and active['wave_id']==os.environ['WAVE_ID'] and active['owner']=='chatgpt-gpt-5.6-sol'
          s=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert s['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':21,'UNBOUND':26}
          assert s['verified_capabilities']==0 and s['parity_promotions']==0
          assert s['global_denominator']==7565 and s['openjarvis_obligations']==646
          m=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in m if x['capability_id']==os.environ['CAPABILITY_ID'])
          assert target['name']=='ProviderSavings' and target['surface_kind']=='protocol_contract'
          assert target['source_path']=='frontend/src/types/index.ts' and target['source_line']==167
          assert target['ownership']=='OWNED' and target['terminal_eligible_in_w02'] is True
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None
          assert target['canonical_parity_status']=='UNVERIFIED' and target['verified'] is False and target['parity_promotion'] is False
          afm=next(x for x in m if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          start=next(x for x in m if x['capability_id']=='cap_a97068215f50aeff0353f6e9')
          assert start['w02_evidence_state']=='UNBOUND' and start['binding'] is None
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph
          git diff --check

      - name: Probe exact pinned source and build RED test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          src=Path('/tmp/openjarvis/frontend/src/types/index.ts')
          raw=src.read_bytes(); text=raw.decode('utf-8')
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='45e499e92306e7387ab99b2ee52f89fe18a63dd3f8bc8d33b7325582bf24e242'
          line=next(i+1 for i,x in enumerate(text.splitlines()) if x.strip()=='export interface ProviderSavings {')
          assert line==167
          match=re.search(r'export interface ProviderSavings \{\n(?P<body>.*?)\n\}', text, flags=re.S); assert match
          fields=[]
          for item in match.group('body').splitlines():
              q=re.fullmatch(r'\s*([A-Za-z_][A-Za-z0-9_]*):\s*([^;]+);\s*', item)
              if q: fields.append({'name':q.group(1),'type':q.group(2)})
          expected=[{'name':'provider','type':'string'},{'name':'label','type':'string'},{'name':'input_cost','type':'number'},{'name':'output_cost','type':'number'},{'name':'total_cost','type':'number'},{'name':'energy_wh','type':'number'},{'name':'energy_joules','type':'number'},{'name':'flops','type':'number'}]
          assert fields==expected
          probe={'schema_version':1,'date':'2026-09-24','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6','capability_id':os.environ['CAPABILITY_ID'],'capability_name':'ProviderSavings','surface_kind':'protocol_contract','ownership':'OWNED','terminal_eligible_in_w02':True,'upstream_commit':os.environ['UPSTREAM_COMMIT'],'source_path':'frontend/src/types/index.ts','source_line':line,'source_sha256':sha,'source_probe':'PASS','source_execution':False,'interface_fields':fields,'provider_savings_runtime_execution':'NOT_RUN','model_executions':0,'provider_egress_executions':0,'tool_executions':0,'canonical_parity_status':'UNVERIFIED','parity_promotions':0}
          Path('evidence/cp03/cp03-w02/W02-17/binding_provider_savings_protocol_source_probe.json').write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          p=Path('tests/test_cp03_w02_parity_graph.py'); t=p.read_text(encoding='utf-8')
          assert 'PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID' not in t
          old='MODEL_INFO_PROTOCOL_CAPABILITY_ID = "cap_048295582ec38991a9519378"\n'; assert old in t
          t=t.replace(old,old+'PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID = "cap_56d79a86da34eeeacdf49427"\n',1)
          marker='MODEL_INFO_PROTOCOL_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_model_info_protocol_binding_is_capability_specific_and_source_backed"\n)\n'; assert marker in t
          t=t.replace(marker,marker+'PROVIDER_SAVINGS_PROTOCOL_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_provider_savings_protocol_binding_is_capability_specific_and_source_backed"\n)\n',1)
          t=t.replace('def test_current_matrix_has_twenty_one_candidates_and_no_parity_promotion','def test_current_matrix_has_twenty_two_candidates_and_no_parity_promotion',1)
          assert '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 21)' in t and '== "UNBOUND" for row in rows), 26)' in t
          t=t.replace('== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 21)','== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 22)',1).replace('== "UNBOUND" for row in rows), 26)','== "UNBOUND" for row in rows), 25)',1)
          tail='CLI_MODEL_CONVERT_COMMAND_CAPABILITY_ID, CLI_SERVE_COMMAND_CAPABILITY_ID},'; assert tail in t
          t=t.replace(tail,'CLI_MODEL_CONVERT_COMMAND_CAPABILITY_ID, CLI_SERVE_COMMAND_CAPABILITY_ID, PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID},',1)
          block='        model_info_protocol = candidates[MODEL_INFO_PROTOCOL_CAPABILITY_ID]\n        self.assertEqual(model_info_protocol["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(model_info_protocol["binding"]["terminal"])\n'; assert block in t
          t=t.replace(block,block+'        provider_savings_protocol = candidates[PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID]\n        self.assertEqual(provider_savings_protocol["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(provider_savings_protocol["binding"]["terminal"])\n',1)
          method='''    def test_provider_savings_protocol_binding_is_capability_specific_and_source_backed(self) -> None:
        row = next(row for row in self.result["rows"] if row["capability_id"] == PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID)
        self.assertEqual(row["ownership"], "OWNED")
        self.assertEqual(row["surface_kind"], "protocol_contract")
        self.assertEqual(row["source_path"], "frontend/src/types/index.ts")
        self.assertEqual(row["source_line"], 167)
        self.assertEqual(row["name"], "ProviderSavings")
        self.assertTrue(row["terminal_eligible_in_w02"])
        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")
        self.assertEqual(row["w02_evidence_state"], "EVIDENCE_BACKED_CANDIDATE")
        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")
        self.assertFalse(row["verified"]); self.assertFalse(row["parity_promotion"])
        binding=row["binding"]
        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")
        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")
        self.assertEqual(binding["test_id"], PROVIDER_SAVINGS_PROTOCOL_TEST_ID); self.assertFalse(binding["terminal"])
        receipt=graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")["EVID-W02-MODEL-BRIDGE-20260921"]
        self.assertEqual(receipt["status"], "VERIFIED"); self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")
        self.assertEqual(receipt["native_engine_count"],15); self.assertEqual(receipt["native_import_failure_count"],0); self.assertEqual(receipt["native_model_count"],69)
        self.assertEqual(receipt["model_executions"],0); self.assertEqual(receipt["provider_egress_executions"],0); self.assertEqual(receipt["parity_promotions"],0)
        probe=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_provider_savings_protocol_source_probe.json").read_text(encoding="utf-8"))
        self.assertEqual(probe["capability_id"], PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID); self.assertEqual(probe["source_line"],167); self.assertEqual(probe["source_probe"],"PASS")
        self.assertFalse(probe["source_execution"]); self.assertEqual(probe["provider_savings_runtime_execution"],"NOT_RUN")
        self.assertEqual(probe["interface_fields"],[{"name":"provider","type":"string"},{"name":"label","type":"string"},{"name":"input_cost","type":"number"},{"name":"output_cost","type":"number"},{"name":"total_cost","type":"number"},{"name":"energy_wh","type":"number"},{"name":"energy_joules","type":"number"},{"name":"flops","type":"number"}])
        self.assertEqual(probe["model_executions"],0); self.assertEqual(probe["provider_egress_executions"],0); self.assertEqual(probe["tool_executions"],0); self.assertEqual(probe["parity_promotions"],0)

'''
          insert='    def test_cli_model_list_command_binding_is_capability_specific_and_source_backed(self) -> None:\n'; assert insert in t
          t=t.replace(insert,method+insert,1); p.write_text(t,encoding='utf-8')
          PY

      - name: Prove RED then add evidence binding
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest -v "$TEST_ID" > /tmp/red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq 'AssertionError|EVIDENCE_BACKED_CANDIDATE|NoneType' /tmp/red.log
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('inventory/cp03/w02_evidence_bindings.jsonl'); rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==21 and all(x['capability_id']!=os.environ['CAPABILITY_ID'] for x in rows)
          rows.append({'capability_id':os.environ['CAPABILITY_ID'],'evidence_id':os.environ['SOURCE_EVIDENCE_ID'],'test_id':os.environ['TEST_ID'],'validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],'expected_fields':{'status':'VERIFIED','native_engine_count':15,'native_import_failure_count':0,'native_model_count':69,'model_executions':0,'provider_egress_executions':0,'parity_promotions':0},'terminal':False})
          p.write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in rows),encoding='utf-8')
          PY
          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert s['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':22,'UNBOUND':25}
          assert s['verified_capabilities']==0 and s['parity_promotions']==0 and s['global_denominator']==7565 and s['openjarvis_obligations']==646
          PY

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          def append_once(path,key,value,row):
              p=Path(path); rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
              assert all(x.get(key)!=value for x in rows), (path,key,value)
              with p.open('a',encoding='utf-8') as f: f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          probe=Path('evidence/cp03/cp03-w02/W02-17/binding_provider_savings_protocol_source_probe.json')
          report={'schema_version':1,'date':'2026-09-24','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6','claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'PASS','validated_base_head':os.environ['EXPECTED_MAIN'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'binding_capability_id':os.environ['CAPABILITY_ID'],'binding_capability_name':'ProviderSavings','binding_surface_kind':'protocol_contract','binding_ownership':'OWNED','terminal_eligible_in_w02':True,'binding_source_evidence_id':os.environ['SOURCE_EVIDENCE_ID'],'binding_source_validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],'binding_source_run_id':35552788123,'executed_test_id':os.environ['TEST_ID'],'source_probe_path':str(probe),'source_probe_sha256':hashlib.sha256(probe.read_bytes()).hexdigest(),'source_execution':False,'provider_savings_runtime_execution':'NOT_RUN','bindings_added_this_slice':1,'bindings_validated_total':22,'unbound_remaining':25,'global_denominator':7565,'openjarvis_obligations':646,'verified_capabilities':0,'parity_promotions':0,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'afm_inprocess_execution':'NOT_RUN','real_openjarvis_fallback_model_execution':'NOT_RUN','inference_start_event_binding':'UNBOUND_UNTOUCHED','next_slice':'Continue W02-17 with another non-conflicting proof unit only when capability-specific executed or exact pinned-source evidence can be paired with an existing completed-task PASS receipt. AFM and fallback remain blocked/NOT_RUN; InferenceStartEvent remains untouched.'}
          rp=Path('evidence/cp03/cp03-w02/W02-17/binding_provider_savings_protocol_report.json'); rp.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',os.environ['EVIDENCE_ID'],{**report,'type':'CP03_W02_G6_CAPABILITY_BINDING','path':str(rp)})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',os.environ['DECISION_ID'],{'schema_version':1,'date':'2026-09-24','decision_id':os.environ['DECISION_ID'],'status':'ACCEPTED','checkpoint':'CP03','task':'W02-17','decision':'Bind the frozen OpenJarvis ProviderSavings protocol contract as a non-terminal EVIDENCE_BACKED_CANDIDATE only.','context':'Exact pinned source proves the TypeScript interface shape. W02-08 supplies the completed model-registration bridge receipt used by the G6 compiler. This does not prove runtime savings accounting, provider telemetry semantics or behavioral parity.','evidence_id':os.environ['EVIDENCE_ID'],'parity_promotions':0})
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924',{'schema_version':1,'date':'2026-09-24','event':'CP03_W02_G6_CAPABILITY_BINDING','event_id':'RUN-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'ADVANCED','bindings_validated_total':22,'unbound_remaining':25,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924',{'schema_version':1,'date':'2026-09-24','event':'WAVE_PROGRESS','event_id':'WAVE-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':os.environ['WAVE_ID'],'canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':os.environ['EVIDENCE_ID'],'status':'IN_PROGRESS','bindings_validated_total':22,'unbound_remaining':25,'parity_promotions':0})
          append_once('ledgers/RISK_LEDGER.ndjson','event_id','RISK-UPDATE-W02-G6-K47-BINDINGS-PROVIDER-SAVINGS-20260924',{'schema_version':1,'date':'2026-09-24','event_id':'RISK-UPDATE-W02-G6-K47-BINDINGS-PROVIDER-SAVINGS-20260924','risk_id':'RISK-W02-G6-K47-BINDINGS-PENDING-20260922','severity':'P1','status':'OPEN','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],'risk':'G6 remains incomplete: 25/47 frozen W02 proof units are UNBOUND. Source-backed ProviderSavings evidence does not prove runtime provider-savings accounting, energy/FLOP semantics or behavioral parity.','mitigation':'Keep W02-17 IN_PROGRESS, VERIFIED=0 and W02-18 BLOCKED; require capability-specific runtime evidence before terminal parity.'})
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id','CLAIM-CONTINUE-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924',{'schema_version':1,'date':'2026-09-24','event':'CONTINUE','event_id':'CLAIM-CONTINUE-W02-G6-PROVIDER-SAVINGS-PROTOCOL-20260924','claim_id':os.environ['CLAIM_ID'],'checkpoint':'CP03','canonical_task':'W02-17','wave_id':os.environ['WAVE_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':os.environ['EXPECTED_MAIN'],'coordination':'Continue the existing non-conflicting W02-17 G6 claim for one OWNED ProviderSavings source-proof unit only; runtime savings behavior stays NOT_RUN, terminal attribution remains false, and parity/denominators/task frontier do not advance.'})
          state=Path('STATE.md'); s=state.read_text(); old='- G6 explicit binding progress: `21/47` evidence-backed candidates; `26` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'; new='- G6 explicit binding progress: `22/47` evidence-backed candidates; `25` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'; assert old in s; state.write_text(s.replace(old,new,1))
          hand=Path('HANDOFF.md'); h=hand.read_text().rstrip(); marker='## W02-17 ProviderSavings protocol binding — source-backed partial verified'; assert marker not in h
          note=f'''\n\n{marker}\n\n- `{os.environ['EVIDENCE_ID']}`: `cap_56d79a86da34eeeacdf49427` (`ProviderSavings`, OWNED protocol contract at `frontend/src/types/index.ts:167`) is now a non-terminal `EVIDENCE_BACKED_CANDIDATE`.\n- Exact pinned source `{os.environ['UPSTREAM_COMMIT']}` was probed: fields are `provider:string`, `label:string`, `input_cost:number`, `output_cost:number`, `total_cost:number`, `energy_wh:number`, `energy_joules:number`, `flops:number`. Source execution and runtime provider-savings behavior remain `NOT_RUN`.\n- Formal G6 binding is anchored to completed W02-08 `{os.environ['SOURCE_EVIDENCE_ID']}` at exact SHA `{os.environ['SOURCE_EVIDENCE_HEAD']}` plus `{os.environ['TEST_ID']}`. Candidate evidence only: no terminal attribution, VERIFIED parity or promotion.\n- G6 is now 22 `EVIDENCE_BACKED_CANDIDATE` / 25 `UNBOUND`; VERIFIED 0; parity promotions 0; denominator 7565 and OpenJarvis obligations 646 unchanged. AFM/fallback remain `NOT_RUN`; W02-18/W02-19 stay `BLOCKED`; InferenceStartEvent remains untouched.\n- Exact next slice: another W02-17 proof unit with capability-specific executed or exact pinned-source evidence plus a completed-task receipt; do not infer runtime savings/accounting behavior from this source contract.\n'''
          hand.write_text(h+note)
          cp=Path('sessions/20260922-w02-parity-graph/CLAIM.json'); c=json.loads(cp.read_text()); c['continuation_base_head']=os.environ['EXPECTED_MAIN']; cp.write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/cp03/w02_parity_graph.py --write
          python scripts/context/build_context_pack.py

      - name: Full regression gauntlet and exact-head CAS commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
