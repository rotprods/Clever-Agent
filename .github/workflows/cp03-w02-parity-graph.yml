name: CP03 W02 G6 CLI model info command binding

on:
  push:
    branches: [wave/cp03/w02-parity-cli-model-info-command-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 12c6bca7b44ecbe4164da84d76046240a6037389
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_075a2380f9db372754f08116
  SOURCE_EVIDENCE: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  UPSTREAM_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_cli_model_info_command_binding_is_capability_specific_and_runtime_backed
  PROBE_PATH: evidence/cp03/cp03-w02/W02-17/binding_cli_model_info_command_runtime_probe.json
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl

jobs:
  verify-bind-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head boot claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path

          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          required=[
              'inventory/cp03/w02_evidence_bindings.jsonl',
              'tests/test_cp03_w02_parity_graph.py',
              '.github/workflows/cp03-w02-parity-graph.yml',
              'evidence/cp03/cp03-w02/W02-17/**',
              'STATE.md','HANDOFF.md','ledgers/EVIDENCE_LEDGER.ndjson',
              '.agentic/context/CURRENT_CONTEXT.json',
          ]
          for path in required:
              assert path in claim['scope'], path

          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47

          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active

          bindings=[json.loads(line) for line in Path('inventory/cp03/w02_evidence_bindings.jsonl').read_text().splitlines() if line.strip()]
          assert len(bindings)==14, len(bindings)
          assert not any(row.get('capability_id')=='cap_075a2380f9db372754f08116' for row in bindings)
          matrix=[json.loads(line) for line in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if line.strip()]
          target=next(r for r in matrix if r['capability_id']=='cap_075a2380f9db372754f08116')
          assert target['ownership']=='OWNED'
          assert target['surface_kind']=='cli_command'
          assert target['source_path']=='src/openjarvis/cli/model.py'
          assert target['source_line']==87
          assert target['name']=='info'
          assert target['w02_evidence_state']=='UNBOUND'
          assert target['canonical_parity_status']=='UNVERIFIED'
          afm=next(r for r in matrix if r['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Execute pinned upstream CLI model info under network-none
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis /tmp/w02-cli-info-probe.py /tmp/w02-cli-info-runtime.json
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_SHA"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_SHA"

          docker build \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" \
            -t "clever-openjarvis-w02-g6-cli-info:$GITHUB_SHA" \
            /tmp/openjarvis

          cat >/tmp/w02-cli-info-probe.py <<'PY'
          import hashlib
          import json
          import os
          from click.testing import CliRunner
          from openjarvis.cli.model import model

          target='qwen3:0.6b'
          result=CliRunner().invoke(model,['info',target],catch_exceptions=True)
          payload={
              'schema_version':1,
              'command':['model','info',target],
              'command_execution':'PASS' if result.exit_code==0 else 'FAIL',
              'exit_code':result.exit_code,
              'output_contains_model_id':target in result.output,
              'output_sha256':hashlib.sha256(result.output.encode('utf-8')).hexdigest(),
              'output_length':len(result.output),
              'exception_type':type(result.exception).__name__ if result.exception else None,
              'network_mode':'none',
              'model_executions':0,
              'provider_egress_executions':0,
              'tool_executions':0,
              'parity_promotions':0,
          }
          print(json.dumps(payload,sort_keys=True))
          if result.exit_code != 0:
              raise SystemExit(f'CLI info failed: {result.exception!r}\n{result.output}')
          if target not in result.output:
              raise SystemExit('CLI info output omitted target model id')
          PY

          timeout 120s docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/config \
            -e XDG_DATA_HOME=/tmp/data \
            -e PYTHONHASHSEED=0 \
            -e PYTHONPATH=/src/src \
            -v /tmp/w02-cli-info-probe.py:/probe.py:ro \
            "clever-openjarvis-w02-g6-cli-info:$GITHUB_SHA" \
            'exec /src/.venv/bin/python /probe.py' \
            > /tmp/w02-cli-info-runtime.json

          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          runtime=json.loads(Path('/tmp/w02-cli-info-runtime.json').read_text())
          assert runtime['command_execution']=='PASS'
          assert runtime['exit_code']==0
          assert runtime['output_contains_model_id'] is True
          assert runtime['network_mode']=='none'
          assert runtime['model_executions']==0
          assert runtime['provider_egress_executions']==0
          assert runtime['tool_executions']==0
          assert runtime['parity_promotions']==0

          source=Path('/tmp/openjarvis/src/openjarvis/cli/model.py')
          raw=source.read_bytes(); tree=ast.parse(raw.decode('utf-8'))
          info=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='info')
          calls=[]
          for node in ast.walk(info):
              if isinstance(node,ast.Call):
                  if isinstance(node.func,ast.Name): name=node.func.id
                  elif isinstance(node.func,ast.Attribute): name=node.func.attr
                  else: continue
                  calls.append((node.lineno,name))
          assert any(name=='register_builtin_models' for _,name in calls)
          assert any(name=='discover_engines' for _,name in calls)
          assert any(name=='contains' for _,name in calls)
          assert any(name=='get' for _,name in calls)
          probe={
              'schema_version':1,
              'date':'2026-09-23',
              'project_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03',
              'task':'W02-17',
              'gate':'G6',
              'capability_id':os.environ['CAPABILITY_ID'],
              'capability_name':'info',
              'surface_kind':'cli_command',
              'source_path':'src/openjarvis/cli/model.py',
              'source_line':87,
              'upstream_commit':os.environ['UPSTREAM_SHA'],
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'runtime':runtime,
              'runtime_isolation':{
                  'network':'none','read_only':True,'cap_drop':'ALL',
                  'no_new_privileges':True,'pids_limit':256,'memory':'2g','cpus':2,
              },
              'model_executions':0,
              'provider_egress_executions':0,
              'tool_executions':0,
              'parity_promotions':0,
              'canonical_parity_status':'UNVERIFIED',
          }
          out=Path(os.environ['PROBE_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Add one capability-specific non-terminal G6 binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          bindings_path=Path(os.environ['BINDINGS_PATH'])
          rows=[json.loads(line) for line in bindings_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows)==14
          cid=os.environ['CAPABILITY_ID']
          assert not any(r.get('capability_id')==cid for r in rows)
          rows.append({
              'capability_id':cid,
              'evidence_id':os.environ['SOURCE_EVIDENCE'],
              'test_id':os.environ['TEST_ID'],
              'validated_head':os.environ['SOURCE_HEAD'],
              'expected_fields':{
                  'status':'VERIFIED',
                  'native_engine_count':15,
                  'native_import_failure_count':0,
                  'native_model_count':69,
                  'model_executions':0,
                  'provider_egress_executions':0,
                  'parity_promotions':0,
              },
              'terminal':False,
          })
          bindings_path.write_text(''.join(json.dumps(r,separators=(',',':'))+'\n' for r in rows),encoding='utf-8')

          p=Path('tests/test_cp03_w02_parity_graph.py')
          text=p.read_text(encoding='utf-8')
          needle='AFM_INPROCESS_CAPABILITY_ID = "cap_ac38bf813e130d14927723d8"\n'
          assert needle in text
          text=text.replace(needle,needle+'CLI_MODEL_INFO_COMMAND_CAPABILITY_ID = "cap_075a2380f9db372754f08116"\n',1)

          serve_test='''CLI_SERVE_REGISTER_BUILTIN_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_serve_register_builtin_binding_is_capability_specific_and_evidence_backed"\n)\n'''
          assert serve_test in text
          text=text.replace(serve_test,serve_test+'''CLI_MODEL_INFO_COMMAND_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_model_info_command_binding_is_capability_specific_and_runtime_backed"\n)\n''',1)

          assert 'def test_current_matrix_has_fourteen_candidates_and_no_parity_promotion' in text
          text=text.replace('def test_current_matrix_has_fourteen_candidates_and_no_parity_promotion','def test_current_matrix_has_fifteen_candidates_and_no_parity_promotion',1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 14)','self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 15)',1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 33)','self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 32)',1)
          set_tail='CLI_SERVE_REGISTER_BUILTIN_CAPABILITY_ID},'
          assert set_tail in text
          text=text.replace(set_tail,'CLI_SERVE_REGISTER_BUILTIN_CAPABILITY_ID, CLI_MODEL_INFO_COMMAND_CAPABILITY_ID},',1)

          prior='''        cli_serve_register_builtin = candidates[CLI_SERVE_REGISTER_BUILTIN_CAPABILITY_ID]\n        self.assertEqual(cli_serve_register_builtin["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_serve_register_builtin["binding"]["terminal"])\n'''
          assert prior in text
          text=text.replace(prior,prior+'''        cli_model_info_command = candidates[CLI_MODEL_INFO_COMMAND_CAPABILITY_ID]\n        self.assertEqual(cli_model_info_command["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_model_info_command["binding"]["terminal"])\n''',1)

          marker='    def test_afm_inprocess_registry_remains_unbound_when_only_shim_catalog_is_observed(self) -> None:\n'
          assert marker in text
          method='''    def test_cli_model_info_command_binding_is_capability_specific_and_runtime_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == CLI_MODEL_INFO_COMMAND_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "cli_command")\n        self.assertEqual(row["source_path"], "src/openjarvis/cli/model.py")\n        self.assertEqual(row["source_line"], 87)\n        self.assertEqual(row["name"], "info")\n        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding = row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(binding["test_id"], CLI_MODEL_INFO_COMMAND_TEST_ID)\n        self.assertFalse(binding["terminal"])\n\n        receipt = graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")["EVID-W02-MODEL-BRIDGE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(receipt["native_engine_count"], 15)\n        self.assertEqual(receipt["native_import_failure_count"], 0)\n        self.assertEqual(receipt["native_model_count"], 69)\n        self.assertEqual(receipt["model_executions"], 0)\n        self.assertEqual(receipt["provider_egress_executions"], 0)\n        self.assertEqual(receipt["parity_promotions"], 0)\n\n        probe = json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_cli_model_info_command_runtime_probe.json").read_text(encoding="utf-8"))\n        self.assertEqual(probe["capability_id"], CLI_MODEL_INFO_COMMAND_CAPABILITY_ID)\n        self.assertEqual(probe["upstream_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(probe["source_path"], "src/openjarvis/cli/model.py")\n        self.assertEqual(probe["source_line"], 87)\n        self.assertEqual(probe["runtime"]["command"], ["model", "info", "qwen3:0.6b"])\n        self.assertEqual(probe["runtime"]["command_execution"], "PASS")\n        self.assertEqual(probe["runtime"]["exit_code"], 0)\n        self.assertTrue(probe["runtime"]["output_contains_model_id"])\n        self.assertEqual(probe["runtime"]["network_mode"], "none")\n        self.assertEqual(probe["model_executions"], 0)\n        self.assertEqual(probe["provider_egress_executions"], 0)\n        self.assertEqual(probe["tool_executions"], 0)\n        self.assertEqual(probe["parity_promotions"], 0)\n        self.assertEqual(probe["canonical_parity_status"], "UNVERIFIED")\n\n'''
          text=text.replace(marker,method+marker,1)
          p.write_text(text,encoding='utf-8')
          PY

          python scripts/cp03/w02_parity_graph.py --write
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          assert summary['w02_proof_units']==47
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          matrix=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          assert sum(r['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE' for r in matrix)==15
          assert sum(r['w02_evidence_state']=='UNBOUND' for r in matrix)==32
          target=next(r for r in matrix if r['capability_id']=='cap_075a2380f9db372754f08116')
          assert target['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE'
          assert target['canonical_parity_status']=='UNVERIFIED'
          assert target['verified'] is False and target['parity_promotion'] is False
          afm=next(r for r in matrix if r['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['binding'] is None
          PY
          git diff --check

      - name: Regression and G6 adversarial gauntlet before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Commit capability proof and binding under exact-head CAS
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BINDINGS_PATH" "$PROBE_PATH" tests/test_cp03_w02_parity_graph.py reports/cp03/w02_parity graphs/cp03/w02_parity
          git commit -m 'CP03 W02-17: add runtime-backed CLI model info G6 binding'
          head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Exact-head retest of binding commit
        shell: bash
        env:
          BINDING_HEAD: ${{ steps.binding.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BINDING_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        env:
          BINDING_HEAD: ${{ steps.binding.outputs.head }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          evidence_id='EVID-W02-PARITY-BINDING-CLI-MODEL-INFO-COMMAND-20260923'
          decision_id='DEC-W02-G6-CLI-MODEL-INFO-COMMAND-BINDING-20260923'
          risk_id='RISK-W02-G6-K47-BINDINGS-PENDING-20260922'
          head=os.environ['BINDING_HEAD']; main=os.environ['EXPECTED_MAIN']; run_id=int(os.environ['GITHUB_RUN_ID'])
          cid=os.environ['CAPABILITY_ID']; test_id=os.environ['TEST_ID']

          def rows(path):
              p=Path(path)
              return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(x.get(key)==value for x in rows(path)):
                  return
              with Path(path).open('a',encoding='utf-8') as h:
                  h.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=main
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n')
          claim_event={
              'schema_version':1,'date':'2026-09-23','event':'CONTINUATION',
              'event_id':'CLAIM-CONT-W02-G6-CLI-MODEL-INFO-COMMAND-20260923',
              'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02',
              'canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922',
              'claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE',
              'base_head':main,'scope':claim['scope'],
              'coordination':'Continue the sole W02-17 G6 claim from exact main. Execute and bind only the owned CLI model info proof unit using a network-none pinned OpenJarvis runtime probe plus completed W02-08 registration evidence. No model/provider/tool execution, parity promotion, denominator mutation, AFM promotion, or W02-18 opening.'
          }
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',claim_event['event_id'],claim_event)

          probe_path=Path(os.environ['PROBE_PATH']); probe=json.loads(probe_path.read_text())
          probe_sha=hashlib.sha256(probe_path.read_bytes()).hexdigest()
          result={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001',
