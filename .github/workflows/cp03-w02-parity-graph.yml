name: CP03 W02 G6 Completed Task Proof Guard

on:
  push:
    branches: [wave/cp03/w02-parity-completed-proof-guard-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 066c4a339f7c0dd5a96fac44ddabf5f02b0ded4a
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  EVIDENCE_ID: EVID-W02-G6-COMPLETED-PROOF-GUARD-20260923
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_in_progress_task_proof_cannot_back_binding

jobs:
  verify-fix-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          for path in [
              '.github/workflows/cp03-w02-parity-graph.yml',
              'scripts/cp03/w02_parity_graph.py',
              'tests/test_cp03_w02_parity_graph.py',
              'STATE.md','HANDOFF.md',
              'ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson',
              'ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson',
              'ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson',
              '.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          ]:
              assert path in claim['scope'], path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          w14=tasks['W02-14']['proof'][-1]
          assert w14['real_openjarvis_fallback_model_execution']=='NOT_RUN'
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':39,'EVIDENCE_BACKED_CANDIDATE':8}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Reproduce RED incomplete-task proof acceptance gap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_cp03_w02_parity_graph.py')
          text=path.read_text(encoding='utf-8')
          marker='    def test_forged_evidence_id_is_rejected(self) -> None:\n'
          assert marker in text
          method='''    def test_in_progress_task_proof_cannot_back_binding(self) -> None:\n        cid = self.result["rows"][0]["capability_id"]\n        evidence_id = "EVID-SYNTHETIC-IN-PROGRESS"\n        head = "a" * 40\n        task_proofs = graph.task_proofs_by_evidence(\n            {\n                "tasks": [\n                    {\n                        "id": "W02-17",\n                        "status": "IN_PROGRESS",\n                        "proof": [\n                            {\n                                "evidence_id": evidence_id,\n                                "result": "PASS",\n                                "validated_head": head,\n                            }\n                        ],\n                    }\n                ]\n            }\n        )\n        self.assertNotIn(evidence_id, task_proofs)\n        binding = {\n            "capability_id": cid,\n            "evidence_id": evidence_id,\n            "test_id": "synthetic.in_progress.must_not_bind",\n            "validated_head": head,\n            "expected_fields": {"status": "VERIFIED"},\n            "terminal": False,\n        }\n        evidence = {\n            evidence_id: {\n                "evidence_id": evidence_id,\n                "status": "VERIFIED",\n                "validated_head": head,\n            }\n        }\n        with self.assertRaisesRegex(graph.ParityGraphError, "completed task proof"):\n            graph.validate_binding(\n                binding,\n                proof_unit_ids={cid},\n                shared_ids=set(),\n                evidence_catalog=evidence,\n                task_proofs=task_proofs,\n            )\n\n'''
          assert 'def test_in_progress_task_proof_cannot_back_binding' not in text
          path.write_text(text.replace(marker,method+marker,1),encoding='utf-8')
          PY
          set +e
          python -m unittest -v "$TEST_ID" > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q 'FAIL' /tmp/red.log

      - name: Fix completed-task evidence authority and turn GREEN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/cp03/w02_parity_graph.py')
          text=path.read_text(encoding='utf-8')
          old='''    for task in task_graph.get("tasks", []):\n        for proof in task.get("proof", []):\n'''
          new='''    for task in task_graph.get("tasks", []):\n        if task.get("status") != "COMPLETE":\n            continue\n        for proof in task.get("proof", []):\n'''
          assert old in text
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':39,'EVIDENCE_BACKED_CANDIDATE':8}
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          PY
          git diff --check

      - name: Regression and G6 gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check

      - name: Commit guard fix under exact-head CAS
        id: code
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/cp03/w02_parity_graph.py tests/test_cp03_w02_parity_graph.py
          git commit -m 'CP03 W02-17: require completed task proofs for G6 bindings'
          code_head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$code_head"
          echo "head=$code_head" >> "$GITHUB_OUTPUT"

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        env:
          CODE_HEAD: ${{ steps.code.outputs.head }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence_id=os.environ['EVIDENCE_ID']
          code_head=os.environ['CODE_HEAD']
          run_id=int(os.environ['GITHUB_RUN_ID'])
          claim_id=os.environ['CLAIM_ID']

          def rows(path):
              p=Path(path)
              return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []

          def append_once(path,key,value,obj):
              existing=rows(path)
              if any(row.get(key)==value for row in existing):
                  return
              with Path(path).open('a',encoding='utf-8') as h:
                  h.write(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          continuation_id='CLAIM-CONT-W02-G6-COMPLETED-PROOF-GUARD-20260923'
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',continuation_id,{
              'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':continuation_id,
              'claim_id':claim_id,'owner':'chatgpt-gpt-5.6-sol','project_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03','parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922',
              'canonical_task':'W02-17','status':'ACTIVE','base_head':os.environ['EXPECTED_MAIN'],
              'coordination':'Continue the sole W02-17 G6 claim from exact main. Harden evidence authority so only proofs attached to COMPLETE tasks can satisfy capability bindings. No new binding, parity promotion, denominator mutation, W02-18 opening, provider egress or tool execution.'
          })

          evidence={
              'schema_version':1,'date':'2026-09-23','evidence_id':evidence_id,'status':'VERIFIED',
              'type':'cp03_w02_g6_completed_task_proof_authority_guard','wave_id':'CP03-W02',
              'support_wave':'CP03-W02-PARITY-GRAPH-20260922','validated_head':code_head,
              'github_actions_run_id':run_id,
              'claim':'G6 binding authority now ignores proofs attached to non-COMPLETE tasks. A RED regression reproduced the prior acceptance gap using a synthetic IN_PROGRESS W02-17 PASS proof; the patched compiler fails that evidence closed while preserving all eight existing completed-task-backed candidates.',
              'executed_test_id':os.environ['TEST_ID'],'red_reproduced':True,'green_after_fix':True,
              'bindings_validated_total':8,'unbound_remaining':39,'verified_capabilities':0,'parity_promotions':0,
              'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,
              'provider_egress_executions':0,'tool_executions':0,
              'real_openjarvis_fallback_model_execution':'NOT_RUN'
          }
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',evidence_id,evidence)
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-COMPLETED-PROOF-GUARD-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_COMPLETED_PROOF_GUARD_ADVANCED',
              'event_id':'RUN-W02-G6-COMPLETED-PROOF-GUARD-20260923','goal_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17',
              'claim_id':claim_id,'evidence_id':evidence_id,'status':'ADVANCED','bindings_validated_total':8,
              'unbound_remaining':39,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-COMPLETED-PROOF-GUARD-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'IMPLEMENTATION_VERIFICATION',
              'event_id':'WAVE-W02-G6-COMPLETED-PROOF-GUARD-20260923','checkpoint':'CP03','iteration':'I03',
              'parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17',
              'claim_id':claim_id,'gate':'G6','evidence_id':evidence_id,'status':'IN_PROGRESS',
              'bindings_validated_total':8,'unbound_remaining':39,'parity_promotions':0})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id','DEC-W02-G6-COMPLETED-PROOF-GUARD-20260923',{
              'schema_version':1,'date':'2026-09-23','decision_id':'DEC-W02-G6-COMPLETED-PROOF-GUARD-20260923',
              'status':'ACCEPTED','task':'W02-17','evidence_id':evidence_id,
              'decision':'A capability binding may consume task proof only when the task carrying that proof is COMPLETE. PASS-looking proof on READY, IN_PROGRESS or BLOCKED tasks is non-authoritative and is omitted from the G6 proof catalog.',
              'context':'The compiler error text already promised completed-task proof, but task_proofs_by_evidence previously indexed proofs regardless of task status. The RED test demonstrated that an IN_PROGRESS task could therefore become a false evidence authority.'})
          append_once('ledgers/RISK_LEDGER.ndjson','risk_id','RISK-W02-G6-INCOMPLETE-TASK-PROOF-AUTHORITY-20260923',{
              'schema_version':1,'date':'2026-09-23','risk_id':'RISK-W02-G6-INCOMPLETE-TASK-PROOF-AUTHORITY-20260923',
              'severity':'P0','status':'MITIGATED','evidence_id':evidence_id,
              'risk':'G6 could accept an evidence receipt merely because it appeared in a task proof array even when that task was not COMPLETE, allowing future self-referential or premature parity evidence.',
              'mitigation':'Filter the proof authority catalog to COMPLETE tasks only and retain a RED-to-GREEN regression that proves IN_PROGRESS proofs cannot satisfy validate_binding.'})

          result={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03',
              'wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17','gate':'G6',
              'claim_id':claim_id,'evidence_id':evidence_id,'validated_head':code_head,'github_actions_run_id':run_id,
              'status':'ADVANCED','red_reproduced':True,'green_after_fix':True,'bindings_validated_total':8,
              'unbound_remaining':39,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,
              'openjarvis_obligations':646,'real_openjarvis_fallback_model_execution':'NOT_RUN',
              'next_slice':'Bind the next W02 capability only when a capability-specific executed test can be traced to an exact PASS proof carried by a COMPLETE task.'
          }
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('evidence/cp03/cp03-w02/W02-17/completed_task_proof_guard_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          state=Path('STATE.md')
          text=state.read_text(encoding='utf-8')
          guard='- G6 evidence authority guard: only `COMPLETE`-task PASS proofs may back explicit capability bindings; non-complete task proofs fail closed.\n'
          if guard not in text:
              anchor='- G6 explicit binding progress: `8/47` evidence-backed candidates; `39` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.\n'
              assert anchor in text
              text=text.replace(anchor,anchor+guard,1)
              state.write_text(text,encoding='utf-8')

          handoff=Path('HANDOFF.md')
          text=handoff.read_text(encoding='utf-8').rstrip()
          marker='## W02-17 completed-task proof authority guard — verified'
          if marker not in text:
              text += f'''\n\n{marker}\n\n- `{evidence_id}` closes a G6 false-authority gap: `task_proofs_by_evidence` no longer indexes proof from tasks whose status is not `COMPLETE`.\n- RED reproduced first with `{os.environ['TEST_ID']}`: a synthetic `IN_PROGRESS` task carrying a PASS-looking exact-head proof was incorrectly admitted to the proof catalog before the fix. The same test is GREEN after the fix.\n- Existing G6 bindings remain exactly 8 `EVIDENCE_BACKED_CANDIDATE` / 39 `UNBOUND`; VERIFIED remains 0 and parity promotions remain 0. Denominator 7565 and OpenJarvis obligations 646 are unchanged.\n- `NOT_RUN`, `BLOCKED`, `PLATFORM_GATED` and waivers remain non-proof. Real OpenJarvis fallback model execution remains `NOT_RUN`. W02-17 stays `IN_PROGRESS`; W02-18/W02-19 stay `BLOCKED`.\n- Exact next slice: bind another W02 capability only from a capability-specific executed test whose evidence receipt is attached to a `COMPLETE` task proof.\n'''
              handoff.write_text(text+'\n',encoding='utf-8')
          PY

          python scripts/cp03/w02_parity_graph.py --write
          python scripts/context/build_context_pack.py
          python scripts/cp03/w02_parity_graph.py --check
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert tasks['W02-14']['proof'][-1]['real_openjarvis_fallback_model_execution']=='NOT_RUN'
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':39,'EVIDENCE_BACKED_CANDIDATE':8}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          assert os.environ['EVIDENCE_ID'] in context.get('evidence_ids',[])
          PY
          git diff --check

      - name: Commit persisted state under exact-head CAS
        shell: bash
        env:
          CODE_HEAD: ${{ steps.code.outputs.head }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$CODE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sessions/20260922-w02-parity-graph/RESULT.json \
            evidence/cp03/cp03-w02/W02-17/completed_task_proof_guard_report.json \
            reports/cp03/w02_parity graphs/cp03/w02_parity \
            STATE.md HANDOFF.md \
            ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson \
            .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: persist completed-proof guard evidence'
          final_head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$final_head"
          echo "final_head=$final_head"
