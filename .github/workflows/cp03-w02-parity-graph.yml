name: CP03 W02 G6 Secondary Model Register Value Binding

on:
  push:
    branches: [wave/cp03/w02-parity-model-register-value-secondary-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 066c4a339f7c0dd5a96fac44ddabf5f02b0ded4a
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl
  CAPABILITY_ID: cap_d0bb7e74057a2b59835f2143
  SOURCE_EVIDENCE: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_secondary_model_register_value_binding_is_capability_specific_and_evidence_backed

jobs:
  verify-bind-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head boot claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          for path in ['inventory/cp03/w02_evidence_bindings.jsonl','tests/test_cp03_w02_parity_graph.py','.github/workflows/cp03-w02-parity-graph.yml','STATE.md','HANDOFF.md']:
              assert path in claim['scope'], path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Add capability-specific RED test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_cp03_w02_parity_graph.py')
          text=p.read_text(encoding='utf-8')
          needle='MODEL_REGISTER_VALUE_CAPABILITY_ID = "cap_1d68bea6da6cb4c552cee405"\n'
          assert needle in text
          text=text.replace(needle,needle+'SECONDARY_MODEL_REGISTER_VALUE_CAPABILITY_ID = "cap_d0bb7e74057a2b59835f2143"\n',1)
          prior='''MODEL_REGISTER_VALUE_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_model_register_value_binding_is_capability_specific_and_evidence_backed"\n)\n'''
          assert prior in text
          text=text.replace(prior,prior+'''SECONDARY_MODEL_REGISTER_VALUE_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_secondary_model_register_value_binding_is_capability_specific_and_evidence_backed"\n)\n''',1)
          text=text.replace('def test_current_matrix_has_eight_candidates_and_no_parity_promotion', 'def test_current_matrix_has_nine_candidates_and_no_parity_promotion', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 8)', 'self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 9)', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 39)', 'self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 38)', 1)
          old='{SEED_CAPABILITY_ID, OLLAMA_CAPABILITY_ID, LITELLM_CAPABILITY_ID, CLOUD_CAPABILITY_ID, NIM_CAPABILITY_ID, GEMMA_CPP_CAPABILITY_ID, OPENAI_COMPAT_REGISTER_CAPABILITY_ID, MODEL_REGISTER_VALUE_CAPABILITY_ID}'
          assert old in text
          text=text.replace(old,'{SEED_CAPABILITY_ID, OLLAMA_CAPABILITY_ID, LITELLM_CAPABILITY_ID, CLOUD_CAPABILITY_ID, NIM_CAPABILITY_ID, GEMMA_CPP_CAPABILITY_ID, OPENAI_COMPAT_REGISTER_CAPABILITY_ID, MODEL_REGISTER_VALUE_CAPABILITY_ID, SECONDARY_MODEL_REGISTER_VALUE_CAPABILITY_ID}',1)
          anchor='''        model_register_value = candidates[MODEL_REGISTER_VALUE_CAPABILITY_ID]\n        self.assertEqual(model_register_value["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(model_register_value["binding"]["terminal"])\n'''
          assert anchor in text
          text=text.replace(anchor,anchor+'''        secondary_model_register_value = candidates[SECONDARY_MODEL_REGISTER_VALUE_CAPABILITY_ID]\n        self.assertEqual(secondary_model_register_value["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(secondary_model_register_value["binding"]["terminal"])\n''',1)
          marker='    def test_graph_projects_all_four_planes_without_promotion(self) -> None:\n'
          assert marker in text
          method='''    def test_secondary_model_register_value_binding_is_capability_specific_and_evidence_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == SECONDARY_MODEL_REGISTER_VALUE_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "registry_registration")\n        self.assertEqual(row["source_path"], "src/openjarvis/intelligence/model_catalog.py")\n        self.assertEqual(row["source_line"], 1088)\n        self.assertEqual(row["name"], "register_value")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding = row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(binding["test_id"], SECONDARY_MODEL_REGISTER_VALUE_TEST_ID)\n        self.assertFalse(binding["terminal"])\n\n        obligations=[json.loads(line) for line in (ROOT / "inventory/cp03/openjarvis_obligations.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]\n        obligation=next(item for item in obligations if item["capability_id"] == SECONDARY_MODEL_REGISTER_VALUE_CAPABILITY_ID)\n        self.assertEqual(obligation["source_path"], "src/openjarvis/intelligence/model_catalog.py")\n        self.assertEqual(obligation["source_line"], 1088)\n        self.assertEqual(obligation["name"], "register_value")\n        self.assertEqual(obligation["interface"]["registrar"], "ModelRegistry.register_value")\n\n        evidence = graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")\n        receipt = evidence["EVID-W02-MODEL-BRIDGE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(receipt["native_model_count"], 69)\n        self.assertEqual(receipt["model_executions"], 0)\n        self.assertEqual(receipt["provider_egress_executions"], 0)\n        self.assertEqual(receipt["parity_promotions"], 0)\n\n        bridge_source = (ROOT / "adapters/openjarvis/model_bridge.py").read_text(encoding="utf-8")\n        self.assertIn('register_builtin = getattr(module, "register_builtin_models", None)', bridge_source)\n        self.assertIn("register_builtin()", bridge_source)\n        catalog=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-08/native_catalog.json").read_text(encoding="utf-8"))\n        self.assertEqual(catalog["model_count"], 69)\n        self.assertEqual(len(catalog["models"]), 69)\n        self.assertEqual(catalog["import_failures"], [])\n        self.assertTrue(all(model["state"] == "REGISTERED" for model in catalog["models"]))\n        self.assertTrue(all(model["native_type"] == "ModelSpec" for model in catalog["models"]))\n        self.assertEqual(catalog["model_executions"], 0)\n        self.assertEqual(catalog["provider_egress_executions"], 0)\n        self.assertEqual(catalog["parity_promotions"], 0)\n\n'''
          text=text.replace(marker,method+marker,1)
          p.write_text(text,encoding='utf-8')
          PY
          set +e
          python -m unittest -v "$TEST_ID" > /tmp/g6-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/g6-red.log
          test "$red_rc" -ne 0

      - name: Add exact secondary register_value binding and turn RED green
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['BINDINGS_PATH'])
          rows=[json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows)==8, rows
          cid=os.environ['CAPABILITY_ID']
          assert not any(row.get('capability_id')==cid for row in rows)
          rows.append({
              'capability_id':cid,
              'evidence_id':os.environ['SOURCE_EVIDENCE'],
              'test_id':os.environ['TEST_ID'],
              'validated_head':os.environ['SOURCE_HEAD'],
              'expected_fields':{
                  'status':'VERIFIED',
                  'native_engine_count':15,
                  'native_import_failure_count':0,
                  'native_model_count':69,
                  'model_executions':0,
                  'provider_egress_executions':0,
                  'parity_promotions':0,
              },
              'terminal':False,
          })
          p.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows),encoding='utf-8')
          PY
          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':38,'EVIDENCE_BACKED_CANDIDATE':9}, summary
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          row=next(x for x in rows if x['capability_id']=='cap_d0bb7e74057a2b59835f2143')
          assert row['source_path']=='src/openjarvis/intelligence/model_catalog.py'
          assert row['source_line']==1088 and row['name']=='register_value'
          assert row['canonical_parity_status']=='UNVERIFIED'
          assert row['verified'] is False and row['parity_promotion'] is False
          assert row['binding']['evidence_id']=='EVID-W02-MODEL-BRIDGE-20260921'
          assert row['binding']['validated_head']=='a866c335a0f9cad75122c8eb7c5310d358f6aad4'
          assert row['binding']['terminal'] is False
          PY
          git diff --check

      - name: Regression and G6 gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-SECONDARY-20260923'
          decision_id='DEC-W02-G6-MODEL-REGISTER-VALUE-SECONDARY-BINDING-20260923'
          risk_id='RISK-W02-G6-K47-BINDINGS-PENDING-20260922'
          main=os.environ['EXPECTED_MAIN']; run_id=int(os.environ['GITHUB_RUN_ID']); cid=os.environ['CAPABILITY_ID']
          source_evidence=os.environ['SOURCE_EVIDENCE']; source_head=os.environ['SOURCE_HEAD']; test_id=os.environ['TEST_ID']
          def rows(path):
              p=Path(path)
              return [json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(x.get(key)==value for x in rows(path)): return
              with Path(path).open('a',encoding='utf-8') as f: f.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text(encoding='utf-8'))
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=main
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id','CLAIM-CONT-W02-G6-MODEL-REGISTER-VALUE-SECONDARY-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':'CLAIM-CONT-W02-G6-MODEL-REGISTER-VALUE-SECONDARY-20260923','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':main,'scope':claim['scope'],'coordination':'Continue sole W02-17 G6 claim from exact main. Bind exactly the second frozen ModelRegistry.register_value proof unit to W02-08 executed registry-population evidence; no parity promotion, denominator mutation, W02-18 opening, provider egress or tool execution.'})
          result={'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-17','gate':'G6','status':'PASS','evidence_id':evidence_id,'claim_id':os.environ['CLAIM_ID'],'github_actions_run_id':run_id,'bindings_validated_total':9,'bindings_added_this_slice':1,'binding_capability_id':cid,'binding_capability_name':'register_value','binding_source_evidence_id':source_evidence,'binding_source_validated_head':source_head,'binding_source_run_id':35552788123,'executed_test_id':test_id,'source_artifact_path':'evidence/cp03/cp03-w02/W02-08/native_catalog.json','source_artifact_match':{'source_path':'src/openjarvis/intelligence/model_catalog.py','source_line':1088,'native_model_count':69,'native_type':'ModelSpec'},'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN','next_slice':'Bind the next W02 capability only when a capability-specific executed test and exact completed-task evidence receipt can be named.'}
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('evidence/cp03/cp03-w02/W02-17/binding_model_register_value_secondary_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',evidence_id,{'schema_version':1,'date':'2026-09-23','evidence_id':evidence_id,'status':'VERIFIED','type':'cp03_w02_g6_capability_specific_secondary_model_register_value_binding','wave_id':'CP03-W02','support_wave':'CP03-W02-PARITY-GRAPH-20260922','claim':'The second frozen OWNED ModelRegistry.register_value proof unit at model_catalog.py:1088 is bound to W02-08 exact-head evidence that executed register_builtin_models and persisted 69 registered ModelSpec entries. This is an EVIDENCE_BACKED_CANDIDATE only; canonical parity remains UNVERIFIED.','binding_capability_id':cid,'binding_source_evidence_id':source_evidence,'binding_source_validated_head':source_head,'executed_test_id':test_id,'bindings_validated_total':9,'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN'})
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-SECONDARY-20260923',{'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_SECONDARY_MODEL_REGISTER_VALUE_BINDING_ADVANCED','event_id':'RUN-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-SECONDARY-20260923','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'evidence_id':evidence_id,'status':'ADVANCED','bindings_validated_total':9,'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-SECONDARY-20260923',{'schema_version':1,'date':'2026-09-23','event':'IMPLEMENTATION_VERIFICATION','event_id':'WAVE-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-SECONDARY-20260923','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':evidence_id,'status':'IN_PROGRESS','bindings_validated_total':9,'unbound_remaining':38,'parity_promotions':0})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',decision_id,{'schema_version':1,'date':'2026-09-23','decision_id':decision_id,'status':'ACCEPTED','task':'W02-17','evidence_id':evidence_id,'decision':'Bind the second frozen ModelRegistry.register_value obligation only to completed W02-08 registry-population evidence and a capability-specific RED-to-green G6 test. Keep it non-terminal and parity-unverified.','context':'The exact W02-08 bridge invokes register_builtin_models and persisted all 69 registered ModelSpec entries without model/provider/tool execution.'})
          risk={'schema_version':1,'date':'2026-09-23','risk_id':risk_id,'severity':'P1','status':'OPEN','evidence_id':evidence_id,'risk':'W02-17 still has 38/47 proof units without explicit capability-to-test-to-evidence bindings; task-level PASS, catalog membership, NOT_RUN/BLOCKED/PLATFORM_GATED and waivers must not be widened into capability parity.','mitigation':'Continue capability-specific executed-test bindings with exact evidence SHA and expectations. Keep canonical parity UNVERIFIED, denominators frozen and W02-18 BLOCKED until G6 completes.'}
          if not any(x.get('risk_id')==risk_id and x.get('evidence_id')==evidence_id for x in rows('ledgers/RISK_LEDGER.ndjson')):
              with Path('ledgers/RISK_LEDGER.ndjson').open('a',encoding='utf-8') as f: f.write(json.dumps(risk,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          state=Path('STATE.md'); lines=[line for line in state.read_text(encoding='utf-8').splitlines() if not line.startswith('- G6 explicit binding progress:')]
          idx=next(i for i,line in enumerate(lines) if line.startswith('- Canonical task frontier:'))+1
          lines.insert(idx,'- G6 explicit binding progress: `9/47` evidence-backed candidates; `38` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.')
          state.write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')
          handoff=Path('HANDOFF.md'); text=handoff.read_text(encoding='utf-8').rstrip(); marker='## W02-17 secondary model register_value binding — partial verified'
          if marker not in text:
              text += f'''\n\n{marker}\n\n- `{evidence_id}` binds `{cid}` (`register_value`, OWNED, `src/openjarvis/intelligence/model_catalog.py:1088`) to completed W02-08 evidence `{source_evidence}` at exact SHA `{source_head}`.\n- Capability-specific RED→green test: `{test_id}`; it cross-checks the frozen obligation registrar `ModelRegistry.register_value`, the executed bridge call to `register_builtin_models`, and all 69 persisted registered `ModelSpec` entries.\n- G6 is now 9 `EVIDENCE_BACKED_CANDIDATE` / 38 `UNBOUND`; VERIFIED remains 0 and parity promotions remain 0. Denominator 7565 and OpenJarvis obligations 646 are unchanged.\n- `NOT_RUN`, `BLOCKED`, `PLATFORM_GATED` and waivers remain non-proof. Real OpenJarvis fallback model execution remains `NOT_RUN`. W02-17 stays `IN_PROGRESS`; W02-18/W02-19 stay `BLOCKED`.\n- Exact next slice: bind the next W02 capability only when its own executed test can be traced to an exact completed-task receipt.\n'''
              handoff.write_text(text+'\n',encoding='utf-8')
          PY
          python scripts/cp03/w02_parity_graph.py --write
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check

      - name: Exact-head CAS commit and persist
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git checkout "$EXPECTED_MAIN" -- .github/workflows/cp03-w02-parity-graph.yml
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
