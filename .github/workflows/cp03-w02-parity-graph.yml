name: CP03 W02 G6 Model Register Value 1088 Binding

on:
  push:
    branches: [wave/cp03/w02-parity-model-register-value-1088-binding-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 066c4a339f7c0dd5a96fac44ddabf5f02b0ded4a
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl
  CAPABILITY_ID: cap_d0bb7e74057a2b59835f2143
  SOURCE_EVIDENCE: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_model_register_value_1088_binding_is_capability_specific_and_evidence_backed

jobs:
  verify-bind-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          for path in ['inventory/cp03/w02_evidence_bindings.jsonl','tests/test_cp03_w02_parity_graph.py','.github/workflows/cp03-w02-parity-graph.yml']:
              assert path in claim['scope'], path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          bindings=[json.loads(line) for line in Path('inventory/cp03/w02_evidence_bindings.jsonl').read_text().splitlines() if line.strip()]
          assert len(bindings)==8, len(bindings)
          assert not any(row.get('capability_id')=='cap_d0bb7e74057a2b59835f2143' for row in bindings)
          proof=[json.loads(line) for line in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if line.strip()]
          target=next(row for row in proof if row['capability_id']=='cap_d0bb7e74057a2b59835f2143')
          assert target['ownership']=='OWNED'
          assert target['surface_kind']=='registry_registration'
          assert target['source_path']=='src/openjarvis/intelligence/model_catalog.py'
          assert target['source_line']==1088
          assert target['name']=='register_value'
          assert target['w02_evidence_state']=='UNBOUND'
          assert target['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Add exact ModelRegistry register_value 1088 binding and capability-specific test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          bindings_path=Path(os.environ['BINDINGS_PATH'])
          capability_id=os.environ['CAPABILITY_ID']
          rows=[json.loads(line) for line in bindings_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows)==8, rows
          assert not any(row.get('capability_id')==capability_id for row in rows)
          rows.append({
              'capability_id': capability_id,
              'evidence_id': os.environ['SOURCE_EVIDENCE'],
              'test_id': os.environ['TEST_ID'],
              'validated_head': os.environ['SOURCE_HEAD'],
              'expected_fields': {
                  'status':'VERIFIED',
                  'native_engine_count':15,
                  'native_import_failure_count':0,
                  'native_model_count':69,
                  'model_executions':0,
                  'provider_egress_executions':0,
                  'parity_promotions':0,
              },
              'terminal': False,
          })
          bindings_path.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows),encoding='utf-8')

          test_path=Path('tests/test_cp03_w02_parity_graph.py')
          text=test_path.read_text(encoding='utf-8')
          needle='MODEL_REGISTER_VALUE_CAPABILITY_ID = "cap_1d68bea6da6cb4c552cee405"\n'
          assert needle in text
          text=text.replace(needle,needle+'MODEL_REGISTER_VALUE_1088_CAPABILITY_ID = "cap_d0bb7e74057a2b59835f2143"\n',1)
          prior_test='''MODEL_REGISTER_VALUE_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_model_register_value_binding_is_capability_specific_and_evidence_backed"\n)\n'''
          assert prior_test in text
          text=text.replace(prior_test,prior_test+'''MODEL_REGISTER_VALUE_1088_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_model_register_value_1088_binding_is_capability_specific_and_evidence_backed"\n)\n''',1)
          text=text.replace('def test_current_matrix_has_eight_candidates_and_no_parity_promotion', 'def test_current_matrix_has_nine_candidates_and_no_parity_promotion', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 8)', 'self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 9)', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 39)', 'self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 38)', 1)
          old_set='{SEED_CAPABILITY_ID, OLLAMA_CAPABILITY_ID, LITELLM_CAPABILITY_ID, CLOUD_CAPABILITY_ID, NIM_CAPABILITY_ID, GEMMA_CPP_CAPABILITY_ID, OPENAI_COMPAT_REGISTER_CAPABILITY_ID, MODEL_REGISTER_VALUE_CAPABILITY_ID}'
          assert old_set in text
          text=text.replace(old_set,'{SEED_CAPABILITY_ID, OLLAMA_CAPABILITY_ID, LITELLM_CAPABILITY_ID, CLOUD_CAPABILITY_ID, NIM_CAPABILITY_ID, GEMMA_CPP_CAPABILITY_ID, OPENAI_COMPAT_REGISTER_CAPABILITY_ID, MODEL_REGISTER_VALUE_CAPABILITY_ID, MODEL_REGISTER_VALUE_1088_CAPABILITY_ID}',1)
          prior_candidate='''        model_register_value = candidates[MODEL_REGISTER_VALUE_CAPABILITY_ID]\n        self.assertEqual(model_register_value["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(model_register_value["binding"]["terminal"])\n'''
          assert prior_candidate in text
          text=text.replace(prior_candidate,prior_candidate+'''        model_register_value_1088 = candidates[MODEL_REGISTER_VALUE_1088_CAPABILITY_ID]\n        self.assertEqual(model_register_value_1088["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(model_register_value_1088["binding"]["terminal"])\n''',1)
          marker='    def test_graph_projects_all_four_planes_without_promotion(self) -> None:\n'
          assert marker in text
          method='''    def test_model_register_value_1088_binding_is_capability_specific_and_evidence_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == MODEL_REGISTER_VALUE_1088_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "registry_registration")\n        self.assertEqual(row["source_path"], "src/openjarvis/intelligence/model_catalog.py")\n        self.assertEqual(row["source_line"], 1088)\n        self.assertEqual(row["name"], "register_value")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding = row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(binding["test_id"], MODEL_REGISTER_VALUE_1088_TEST_ID)\n        self.assertFalse(binding["terminal"])\n\n        obligation = next(\n            item for item in graph.read_jsonl(ROOT / graph.OBLIGATIONS_PATH)\n            if item["capability_id"] == MODEL_REGISTER_VALUE_1088_CAPABILITY_ID\n        )\n        self.assertEqual(obligation["interface"]["registrar"], "ModelRegistry.register_value")\n        self.assertEqual(obligation["runtime_owner"], "openjarvis:intelligence")\n        self.assertEqual(obligation["source_path"], "src/openjarvis/intelligence/model_catalog.py")\n        self.assertEqual(obligation["source_line"], 1088)\n\n        evidence = graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")\n        receipt = evidence["EVID-W02-MODEL-BRIDGE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(receipt["native_engine_count"], 15)\n        self.assertEqual(receipt["native_import_failure_count"], 0)\n        self.assertEqual(receipt["native_model_count"], 69)\n        self.assertEqual(receipt["model_executions"], 0)\n        self.assertEqual(receipt["provider_egress_executions"], 0)\n        self.assertEqual(receipt["parity_promotions"], 0)\n\n        bridge_source = (ROOT / "adapters/openjarvis/model_bridge.py").read_text(encoding="utf-8")\n        self.assertIn('register_builtin = getattr(module, "register_builtin_models", None)', bridge_source)\n        self.assertIn("register_builtin()", bridge_source)\n        catalog = json.loads((ROOT / "evidence/cp03/cp03-w02/W02-08/native_catalog.json").read_text(encoding="utf-8"))\n        self.assertEqual(catalog["model_count"], 69)\n        self.assertEqual(len(catalog["models"]), 69)\n        self.assertEqual(catalog["import_failures"], [])\n        self.assertTrue(all(model["state"] == "REGISTERED" for model in catalog["models"]))\n        self.assertTrue(all(model["native_type"] == "ModelSpec" for model in catalog["models"]))\n        self.assertTrue(all(model["implementation"] == "openjarvis.core.types.ModelSpec" for model in catalog["models"]))\n        self.assertEqual(catalog["model_executions"], 0)\n        self.assertEqual(catalog["provider_egress_executions"], 0)\n        self.assertEqual(catalog["parity_promotions"], 0)\n\n'''
          text=text.replace(marker,method+marker,1)
          test_path.write_text(text,encoding='utf-8')
          PY

          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':38,'EVIDENCE_BACKED_CANDIDATE':9}, summary
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          row=next(x for x in rows if x['capability_id']=='cap_d0bb7e74057a2b59835f2143')
          assert row['ownership']=='OWNED' and row['name']=='register_value'
          assert row['surface_kind']=='registry_registration'
          assert row['source_path']=='src/openjarvis/intelligence/model_catalog.py' and row['source_line']==1088
          assert row['canonical_parity_status']=='UNVERIFIED'
          assert row['verified'] is False and row['parity_promotion'] is False
          assert row['binding']['evidence_id']=='EVID-W02-MODEL-BRIDGE-20260921'
          assert row['binding']['validated_head']=='a866c335a0f9cad75122c8eb7c5310d358f6aad4'
          assert row['binding']['terminal'] is False
          PY
          git diff --check

      - name: Regression and G6 adversarial gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Commit binding under exact-head CAS
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BINDINGS_PATH" tests/test_cp03_w02_parity_graph.py reports/cp03/w02_parity graphs/cp03/w02_parity
          git commit -m 'CP03 W02-17: add model register_value 1088 G6 binding'
          binding_head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$binding_head"
          echo "head=$binding_head" >> "$GITHUB_OUTPUT"

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        env:
          BINDING_HEAD: ${{ steps.binding.outputs.head }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-1088-20260923'
          decision_id='DEC-W02-G6-MODEL-REGISTER-VALUE-1088-BINDING-20260923'
          risk_id='RISK-W02-G6-K47-BINDINGS-PENDING-20260922'
          head=os.environ['BINDING_HEAD']; main=os.environ['EXPECTED_MAIN']; run_id=int(os.environ['GITHUB_RUN_ID'])
          test_id=os.environ['TEST_ID']; source_evidence=os.environ['SOURCE_EVIDENCE']; source_head=os.environ['SOURCE_HEAD']; capability_id=os.environ['CAPABILITY_ID']
          def read_rows(path):
              p=Path(path)
              return [json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()] if p.exists() else []
          def append_once(path, key, value, row):
              if any(existing.get(key)==value for existing in read_rows(path)): return False
              with Path(path).open('a',encoding='utf-8') as handle: handle.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
              return True
          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text(encoding='utf-8'))
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=main
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          claim_event={'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':'CLAIM-CONT-W02-G6-MODEL-REGISTER-VALUE-1088-20260923','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':main,'scope':claim['scope'],'coordination':'Continue the sole W02-17 G6 claim from exact main. Add exactly one capability-specific ModelRegistry.register_value binding for frozen model_catalog.py:1088 from completed W02-08 evidence. No parity promotion, denominator mutation, W02-18 opening, provider egress or tool execution.'}
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',claim_event['event_id'],claim_event)
          result={'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-17','gate':'G6','status':'PASS','evidence_id':evidence_id,'claim_id':os.environ['CLAIM_ID'],'validated_head':head,'github_actions_run_id':run_id,'bindings_validated_total':9,'bindings_added_this_slice':1,'binding_capability_id':capability_id,'binding_capability_name':'register_value','binding_source_evidence_id':source_evidence,'binding_source_validated_head':source_head,'binding_source_run_id':35552788123,'executed_test_id':test_id,'source_artifact_path':'evidence/cp03/cp03-w02/W02-08/native_catalog.json','source_artifact_match':{'source_path':'src/openjarvis/intelligence/model_catalog.py','source_line':1088,'registrar':'ModelRegistry.register_value','native_model_count':69,'native_type':'ModelSpec'},'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN','next_slice':'Bind the next W02 capability only when a capability-specific executed test and exact completed-task evidence receipt can be named.'}
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('evidence/cp03/cp03-w02/W02-17/binding_model_register_value_1088_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          evidence={'schema_version':1,'date':'2026-09-23','evidence_id':evidence_id,'status':'VERIFIED','type':'cp03_w02_g6_capability_specific_model_register_value_1088_binding','wave_id':'CP03-W02','support_wave':'CP03-W02-PARITY-GRAPH-20260922','validated_head':head,'github_actions_run_id':run_id,'claim':'The owned OpenJarvis ModelRegistry.register_value proof unit at model_catalog.py:1088 is bound to the completed exact-head W02-08 model bridge receipt and a capability-specific G6 test. The frozen obligation identifies ModelRegistry.register_value and the executed bridge receipt persists 69 registered ModelSpec entries. This creates only an EVIDENCE_BACKED_CANDIDATE; canonical parity remains UNVERIFIED.','binding_capability_id':capability_id,'binding_source_evidence_id':source_evidence,'binding_source_validated_head':source_head,'executed_test_id':test_id,'bindings_validated_total':9,'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN'}
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',evidence_id,evidence)
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-1088-20260923',{'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_MODEL_REGISTER_VALUE_1088_BINDING_ADVANCED','event_id':'RUN-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-1088-20260923','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'evidence_id':evidence_id,'status':'ADVANCED','bindings_validated_total':9,'unbound_remaining':38,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-1088-20260923',{'schema_version':1,'date':'2026-09-23','event':'IMPLEMENTATION_VERIFICATION','event_id':'WAVE-W02-PARITY-BINDING-MODEL-REGISTER-VALUE-1088-20260923','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':evidence_id,'status':'IN_PROGRESS','bindings_validated_total':9,'unbound_remaining':38,'parity_promotions':0})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',decision_id,{'schema_version':1,'date':'2026-09-23','decision_id':decision_id,'status':'ACCEPTED','task':'W02-17','evidence_id':evidence_id,'decision':'Bind only the frozen ModelRegistry.register_value surface at model_catalog.py:1088 through the completed W02-08 native-catalog receipt plus a capability-specific executed G6 test that checks the exact obligation registrar and source line. Keep the binding non-terminal and parity-unverified.','context':'The W02-08 adapter calls register_builtin_models before reading ModelRegistry and its exact-head receipt persists 69 registered ModelSpec entries with zero inference/provider/tool execution.'})
          risk={'schema_version':1,'date':'2026-09-23','risk_id':risk_id,'severity':'P1','status':'OPEN','evidence_id':evidence_id,'risk':'W02-17 still has 38/47 proof units without explicit capability-to-test-to-evidence bindings; task-level PASS receipts, catalog membership, NOT_RUN/BLOCKED/PLATFORM_GATED fields and waivers must not be widened into capability parity.','mitigation':'Continue one capability-specific executed-test binding at a time with exact source/evidence SHA and field expectations. Keep canonical parity UNVERIFIED, shared capabilities non-terminal, denominators frozen and W02-18 BLOCKED until G6 is actually complete.'}
          if not any(r.get('risk_id')==risk_id and r.get('evidence_id')==evidence_id for r in read_rows('ledgers/RISK_LEDGER.ndjson')):
              with Path('ledgers/RISK_LEDGER.ndjson').open('a',encoding='utf-8') as handle: handle.write(json.dumps(risk,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          state_path=Path('STATE.md')
          lines=[line for line in state_path.read_text(encoding='utf-8').splitlines() if not line.startswith('- G6 explicit binding progress:')]
          insert_at=next(i for i,line in enumerate(lines) if line.startswith('- Canonical task frontier:'))+1
          lines.insert(insert_at,'- G6 explicit binding progress: `9/47` evidence-backed candidates; `38` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.')
          state_path.write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')
          handoff_path=Path('HANDOFF.md'); handoff=handoff_path.read_text(encoding='utf-8').rstrip(); marker='## W02-17 model register_value:1088 binding — partial verified'
