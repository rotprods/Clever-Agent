name: CP03 W02 G6 CLI model pull binding

on:
  push:
    branches: [wave/cp03/w02-parity-cli-model-pull-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 786d933e602dcd142b6ece3a84a82d0d74312a86
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_69723ff5986f70a048ed98fe
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-CLI-MODEL-PULL-COMMAND-20260923
  DECISION_ID: DEC-W02-G6-CLI-MODEL-PULL-COMMAND-BINDING-20260923
  SOURCE_EVIDENCE_ID: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_EVIDENCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_cli_model_pull_command_binding_is_capability_specific_and_source_backed

jobs:
  bind-cli-model-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head, claim, DAG and durable-state preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os
          from pathlib import Path

          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47

          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']==os.environ['CLAIM_ID']
          assert claim['wave_id']==os.environ['WAVE_ID']
          assert claim['canonical_task']=='W02-17'
          assert claim['status']=='ACTIVE'
          for required in ('tests/test_cp03_w02_parity_graph.py','inventory/cp03/w02_evidence_bindings.jsonl','evidence/cp03/cp03-w02/W02-17/**','STATE.md','HANDOFF.md'):
              assert required in claim['scope']

          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=latest[os.environ['CLAIM_ID']]
          assert active['status']=='ACTIVE'
          assert active['wave_id']==os.environ['WAVE_ID']

          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':18,'UNBOUND':29}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646

          matrix=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in matrix if x['capability_id']==os.environ['CAPABILITY_ID'])
          assert target['name']=='pull' and target['surface_kind']=='cli_command'
          assert target['source_path']=='src/openjarvis/cli/model.py' and target['source_line']==226
          assert target['ownership']=='OWNED'
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None
          assert target['canonical_parity_status']=='UNVERIFIED' and target['verified'] is False
          afm=next(x for x in matrix if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check

      - name: Probe exact pinned source and add capability-specific RED test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"

          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path

          source_path=Path('/tmp/openjarvis/src/openjarvis/cli/model.py')
          raw=source_path.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='4b8efbf289b2aad39d0996df3ecc5182d613ea51b72ad52e47b722323dfa73af', sha
          tree=ast.parse(raw.decode('utf-8'))
          fn=next(node for node in tree.body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name=='pull')
          assert fn.lineno==226
          assert len(fn.decorator_list)==3
          command,arg,option=fn.decorator_list
          assert isinstance(command,ast.Call) and isinstance(command.func,ast.Attribute)
          assert isinstance(command.func.value,ast.Name) and command.func.value.id=='model' and command.func.attr=='command'
          assert command.lineno==223 and not command.args and not command.keywords
          assert isinstance(arg,ast.Call) and isinstance(arg.func,ast.Attribute)
          assert isinstance(arg.func.value,ast.Name) and arg.func.value.id=='click' and arg.func.attr=='argument'
          assert arg.lineno==224 and len(arg.args)==1 and isinstance(arg.args[0],ast.Constant) and arg.args[0].value=='model_name'
          assert isinstance(option,ast.Call) and isinstance(option.func,ast.Attribute)
          assert isinstance(option.func.value,ast.Name) and option.func.value.id=='click' and option.func.attr=='option'
          assert option.lineno==225 and isinstance(option.args[0],ast.Constant) and option.args[0].value=='--engine'
          probe={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6',
              'capability_id':os.environ['CAPABILITY_ID'],'capability_name':'pull','surface_kind':'cli_command',
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],'source_path':'src/openjarvis/cli/model.py','source_line':226,
              'source_sha256':sha,'source_probe':'PASS','source_execution':False,'function':'pull',
              'model_command_decorator_line':223,'model_name_argument_line':224,'engine_option_line':225,
              'pull_command_execution':'NOT_RUN','network_acquisition_execution':'NOT_RUN','canonical_parity_status':'UNVERIFIED',
              'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'parity_promotions':0,
          }
          out=Path('evidence/cp03/cp03-w02/W02-17/binding_cli_model_pull_command_source_probe.json')
          out.write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          p=Path('tests/test_cp03_w02_parity_graph.py')
          text=p.read_text(encoding='utf-8')
          assert 'CLI_MODEL_PULL_COMMAND_CAPABILITY_ID' not in text
          text=text.replace(
              'CLI_MODEL_GROUP_COMMAND_CAPABILITY_ID = "cap_263641071dc7bb5251e3339b"\n',
              'CLI_MODEL_GROUP_COMMAND_CAPABILITY_ID = "cap_263641071dc7bb5251e3339b"\nCLI_MODEL_PULL_COMMAND_CAPABILITY_ID = "cap_69723ff5986f70a048ed98fe"\n',1)
          marker='CLI_MODEL_GROUP_COMMAND_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_model_group_command_binding_is_capability_specific_and_source_backed"\n)\n'
          assert marker in text
          text=text.replace(marker, marker+'CLI_MODEL_PULL_COMMAND_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_model_pull_command_binding_is_capability_specific_and_source_backed"\n)\n',1)
          text=text.replace('def test_current_matrix_has_eighteen_candidates_and_no_parity_promotion', 'def test_current_matrix_has_nineteen_candidates_and_no_parity_promotion',1)
          text=text.replace('== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 18)', '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 19)',1)
          text=text.replace('== "UNBOUND" for row in rows), 29)', '== "UNBOUND" for row in rows), 28)',1)
          text=text.replace('CLI_MODEL_GROUP_COMMAND_CAPABILITY_ID},', 'CLI_MODEL_GROUP_COMMAND_CAPABILITY_ID, CLI_MODEL_PULL_COMMAND_CAPABILITY_ID},',1)
          block='''        cli_model_group_command = candidates[CLI_MODEL_GROUP_COMMAND_CAPABILITY_ID]\n        self.assertEqual(cli_model_group_command["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_model_group_command["binding"]["terminal"])\n'''
          assert block in text
          text=text.replace(block,block+'''        cli_model_pull_command = candidates[CLI_MODEL_PULL_COMMAND_CAPABILITY_ID]\n        self.assertEqual(cli_model_pull_command["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_model_pull_command["binding"]["terminal"])\n''',1)
          method='''    def test_cli_model_pull_command_binding_is_capability_specific_and_source_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == CLI_MODEL_PULL_COMMAND_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "cli_command")\n        self.assertEqual(row["source_path"], "src/openjarvis/cli/model.py")\n        self.assertEqual(row["source_line"], 226)\n        self.assertEqual(row["name"], "pull")\n        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(row["w02_evidence_state"], "EVIDENCE_BACKED_CANDIDATE")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding=row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(binding["test_id"], CLI_MODEL_PULL_COMMAND_TEST_ID)\n        self.assertFalse(binding["terminal"])\n        receipt=graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")["EVID-W02-MODEL-BRIDGE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(receipt["native_engine_count"],15)\n        self.assertEqual(receipt["native_import_failure_count"],0)\n        self.assertEqual(receipt["native_model_count"],69)\n        self.assertEqual(receipt["model_executions"],0)\n        self.assertEqual(receipt["provider_egress_executions"],0)\n        self.assertEqual(receipt["parity_promotions"],0)\n        probe=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_cli_model_pull_command_source_probe.json").read_text(encoding="utf-8"))\n        self.assertEqual(probe["capability_id"], CLI_MODEL_PULL_COMMAND_CAPABILITY_ID)\n        self.assertEqual(probe["upstream_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(probe["source_path"], "src/openjarvis/cli/model.py")\n        self.assertEqual(probe["source_line"],226)\n        self.assertEqual(probe["source_probe"],"PASS")\n        self.assertFalse(probe["source_execution"])\n        self.assertEqual(probe["function"],"pull")\n        self.assertEqual(probe["model_command_decorator_line"],223)\n        self.assertEqual(probe["model_name_argument_line"],224)\n        self.assertEqual(probe["engine_option_line"],225)\n        self.assertEqual(probe["pull_command_execution"],"NOT_RUN")\n        self.assertEqual(probe["network_acquisition_execution"],"NOT_RUN")\n        self.assertEqual(probe["model_executions"],0)\n        self.assertEqual(probe["provider_egress_executions"],0)\n        self.assertEqual(probe["tool_executions"],0)\n        self.assertEqual(probe["parity_promotions"],0)\n\n'''
          insert='    def test_cli_model_group_command_binding_is_capability_specific_and_source_backed(self) -> None:\n'
          assert insert in text
          text=text.replace(insert,method+insert,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Prove RED before binding
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest -v "$TEST_ID" > /tmp/red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq 'AssertionError|TypeError|EVIDENCE_BACKED_CANDIDATE' /tmp/red.log

      - name: Add non-terminal evidence binding and prove narrow GREEN
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('inventory/cp03/w02_evidence_bindings.jsonl')
          rows=[json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==18
          assert all(row['capability_id'] != os.environ['CAPABILITY_ID'] for row in rows)
          binding={
              'capability_id':os.environ['CAPABILITY_ID'],
              'evidence_id':os.environ['SOURCE_EVIDENCE_ID'],
              'test_id':os.environ['TEST_ID'],
              'validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],
              'expected_fields':{
                  'status':'VERIFIED','native_engine_count':15,'native_import_failure_count':0,'native_model_count':69,
                  'model_executions':0,'provider_egress_executions':0,'parity_promotions':0,
              },
              'terminal':False,
          }
          rows.append(binding)
          path.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows),encoding='utf-8')
          PY
          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':19,'UNBOUND':28}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646
          PY

      - name: Persist evidence, decisions, risks, state, handoff and ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def append_once(path,key,value,row):
              p=Path(path)
              rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              assert all(existing.get(key)!=value for existing in rows), (path,key,value)
              with p.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')

          probe_path=Path('evidence/cp03/cp03-w02/W02-17/binding_cli_model_pull_command_source_probe.json')
          probe_sha=hashlib.sha256(probe_path.read_bytes()).hexdigest()
          report={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6',
              'claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'PASS',
              'validated_base_head':os.environ['EXPECTED_MAIN'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
              'binding_capability_id':os.environ['CAPABILITY_ID'],'binding_capability_name':'pull','binding_surface_kind':'cli_command',
              'binding_source_evidence_id':os.environ['SOURCE_EVIDENCE_ID'],'binding_source_validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],
              'binding_source_run_id':35552788123,'executed_test_id':os.environ['TEST_ID'],'source_probe_path':str(probe_path),
              'source_probe_sha256':probe_sha,'source_execution':False,'pull_command_execution':'NOT_RUN','network_acquisition_execution':'NOT_RUN',
              'bindings_added_this_slice':1,'bindings_validated_total':19,'unbound_remaining':28,
              'global_denominator':7565,'openjarvis_obligations':646,'verified_capabilities':0,'parity_promotions':0,
              'model_executions':0,'provider_egress_executions':0,'tool_executions':0,
              'afm_inprocess_execution':'NOT_RUN','real_openjarvis_fallback_model_execution':'NOT_RUN',
              'next_slice':'Continue W02-17 with another proof unit only when capability-specific executed or exact pinned-source evidence can be paired with an existing completed-task PASS receipt. AFM remains blocked pending compatible-host proof.',
          }
          report_path=Path('evidence/cp03/cp03-w02/W02-17/binding_cli_model_pull_command_report.json')
          report_path.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',os.environ['EVIDENCE_ID'],{
              **report,'type':'CP03_W02_G6_CAPABILITY_BINDING','path':str(report_path),
          })
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',os.environ['DECISION_ID'],{
              'schema_version':1,'date':'2026-09-23','decision_id':os.environ['DECISION_ID'],'status':'ACCEPTED','checkpoint':'CP03','task':'W02-17',
              'decision':'Bind the frozen OpenJarvis CLI model pull command as a non-terminal EVIDENCE_BACKED_CANDIDATE only.',
              'context':'Exact pinned source proves the pull command declaration and arguments at model.py:223-226. W02-08 supplies an exact completed-task PASS receipt for the model registry bridge. Direct pull/network acquisition execution remains NOT_RUN and no runtime parity is inferred.',
              'evidence_id':os.environ['EVIDENCE_ID'],'parity_promotions':0,
          })
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-CLI-MODEL-PULL-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_CAPABILITY_BINDING','event_id':'RUN-W02-G6-CLI-MODEL-PULL-20260923',
              'goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'ADVANCED',
              'bindings_validated_total':19,'unbound_remaining':28,'verified_capabilities':0,'parity_promotions':0,
          })
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-CLI-MODEL-PULL-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'WAVE_PROGRESS','event_id':'WAVE-W02-G6-CLI-MODEL-PULL-20260923',
              'checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':os.environ['WAVE_ID'],'canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':os.environ['EVIDENCE_ID'],'status':'IN_PROGRESS',
              'bindings_validated_total':19,'unbound_remaining':28,'parity_promotions':0,
          })
          append_once('ledgers/RISK_LEDGER.ndjson','event_id','RISK-UPDATE-W02-G6-K47-BINDINGS-CLI-MODEL-PULL-20260923',{
              'schema_version':1,'date':'2026-09-23','event_id':'RISK-UPDATE-W02-G6-K47-BINDINGS-CLI-MODEL-PULL-20260923',
              'risk_id':'RISK-W02-G6-K47-BINDINGS-PENDING-20260922','severity':'P1','status':'OPEN','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],
              'risk':'G6 remains incomplete: 28/47 frozen W02 proof units are still UNBOUND; source-backed CLI pull evidence does not prove download/network behavior or runtime behavioral parity.',
              'mitigation':'Keep W02-17 IN_PROGRESS, verified parity at 0 and W02-18 BLOCKED. Bind proof units only with capability-specific executed or exact-source evidence plus exact completed-task PASS receipts; preserve pull acquisition, AFM and other NOT_RUN/platform-gated states.',
          })
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id','CLAIM-CONTINUE-W02-G6-CLI-MODEL-PULL-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CONTINUE','event_id':'CLAIM-CONTINUE-W02-G6-CLI-MODEL-PULL-20260923',
              'claim_id':os.environ['CLAIM_ID'],'checkpoint':'CP03','canonical_task':'W02-17','wave_id':os.environ['WAVE_ID'],
              'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':os.environ['EXPECTED_MAIN'],
              'coordination':'Continue the existing non-conflicting W02-17 G6 claim for one CLI model-pull source proof unit only; no command/network execution, parity promotion or denominator mutation.',
          })

          state=Path('STATE.md')
          s=state.read_text(encoding='utf-8')
          old='- G6 explicit binding progress: `18/47` evidence-backed candidates; `29` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'
          new='- G6 explicit binding progress: `19/47` evidence-backed candidates; `28` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'
          assert old in s
          state.write_text(s.replace(old,new,1),encoding='utf-8')

          hand=Path('HANDOFF.md')
          h=hand.read_text(encoding='utf-8').rstrip()
          marker='## W02-17 CLI model pull command binding — source-backed partial verified'
          assert marker not in h
