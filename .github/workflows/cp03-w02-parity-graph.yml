name: CP03 W02 G6 Parity Proof Plane Continuation

on:
  push:
    branches: [wave/cp03/w02-parity-graph-20260922]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'
      - 'inventory/cp03/w02_evidence_bindings.jsonl'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ab1f7665682cffe960906e8a6c1808f14acd9318
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if not line.strip(): continue
              row=json.loads(line); cid=row.get('claim_id')
              if cid: latest[cid]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Amend active claim before binding mutation
        id: amend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          binding='inventory/cp03/w02_evidence_bindings.jsonl'
          if binding in claim['scope']:
              Path('/tmp/amended').write_text('false')
              raise SystemExit(0)
          claim['scope'].append(binding)
          claim['continuation_base_head']=os.environ['EXPECTED_MAIN']
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n')
          amendment={
            'schema_version':1,'date':'2026-09-22','event':'SCOPE_AMENDED',
            'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02',
            'canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922',
            'claim_id':'CLAIM-CP03-W02-PARITY-GRAPH-20260922','owner':'chatgpt-gpt-5.6-sol',
            'status':'ACTIVE','base_head':os.environ['EXPECTED_MAIN'],
            'coordination':'Expand W02-17 G6 only to the compiler-declared explicit evidence-binding input. Bindings remain evidence-backed candidates only: no parity promotion, denominator/obligation mutation, shared terminal attribution, W02-18 opening, provider egress or tool execution.',
            'scope':[binding]
          }
          with Path('ledgers/CLAIM_LEDGER.ndjson').open('a',encoding='utf-8') as f:
              f.write(json.dumps(amendment,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          handoff=Path('HANDOFF.md')
          text=handoff.read_text()
          note='- Claim scope amended at exact continuation base `'+os.environ['EXPECTED_MAIN']+'` to include `inventory/cp03/w02_evidence_bindings.jsonl`; this authorizes explicit G6 bindings only and does not promote parity.\n'
          if note not in text:
              handoff.write_text(text.rstrip()+'\n'+note)
          Path('/tmp/amended').write_text('true')
          PY
          echo "amended=$(cat /tmp/amended)" >> "$GITHUB_OUTPUT"

      - name: Validate and CAS-persist claim amendment
        if: steps.amend.outputs.amended == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260922-w02-parity-graph/CLAIM.json ledgers/CLAIM_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: amend claim for explicit evidence bindings'
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Stop after amendment-only run
        if: steps.amend.outputs.amended == 'true'
        run: echo 'Claim amendment persisted; binding mutation is intentionally deferred to a later exact-head push.'

      - name: Compile and test explicit evidence bindings
        if: steps.amend.outputs.amended == 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BINDINGS_PATH"
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_plan tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':46,'EVIDENCE_BACKED_CANDIDATE':1}, summary
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          row=next(x for x in rows if x['capability_id']=='cap_49014a3c03b104c8ec2f4ca1')
          assert row['ownership']=='OWNED'
          assert row['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE'
          assert row['canonical_parity_status']=='UNVERIFIED'
          assert row['verified'] is False and row['parity_promotion'] is False
          assert row['binding']['evidence_id']=='EVID-W02-UNARY-INFERENCE-20260921'
          assert row['binding']['validated_head']=='a29389d41642ca74ed9c09ccfb9ec9f1725b48d7'
          assert row['binding']['terminal'] is False
          assert sum(x['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE' for x in rows)==1
          assert sum(x['w02_evidence_state']=='UNBOUND' for x in rows)==46
          PY
          git diff --check

      - name: Persist binding-slice evidence and ContextPack
        if: steps.amend.outputs.amended == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-PARITY-BINDING-SEED-20260922'
          head=os.environ['GITHUB_SHA']
          result={
            'schema_version':1,'date':'2026-09-22','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03',
            'parent_wave':'CP03-W02','task':'W02-17','gate':'G6','status':'PASS',
            'evidence_id':evidence_id,'claim_id':'CLAIM-CP03-W02-PARITY-GRAPH-20260922',
            'validated_head':head,'bindings_validated':1,'binding_capability_id':'cap_49014a3c03b104c8ec2f4ca1',
            'binding_source_evidence_id':'EVID-W02-UNARY-INFERENCE-20260921',
            'binding_source_validated_head':'a29389d41642ca74ed9c09ccfb9ec9f1725b48d7',
            'unbound_remaining':46,'verified_capabilities':0,'parity_promotions':0,
            'global_denominator':7565,'openjarvis_obligations':646,
            'provider_egress_executions':0,'tool_executions':0,
            'real_openjarvis_fallback_model_execution':'NOT_RUN',
            'next_slice':'Bind the next evidence-supported W02 capability; do not widen task-level PASS into capability parity.'
          }
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          Path('evidence/cp03/cp03-w02/W02-17/binding_seed_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          evidence={
            'schema_version':1,'date':'2026-09-22','evidence_id':evidence_id,'status':'VERIFIED',
            'type':'cp03_w02_g6_explicit_capability_binding_seed','wave_id':'CP03-W02',
            'support_wave':'CP03-W02-PARITY-GRAPH-20260922','validated_head':head,
            'claim':'One owned W02 capability is explicitly bound to an exact completed-task PASS receipt, real executed unary-inference test selector, exact validated SHA and field-level expectations. The binding is only an EVIDENCE_BACKED_CANDIDATE; canonical parity remains UNVERIFIED.',
            'bindings_validated':1,'unbound_remaining':46,'verified_capabilities':0,'parity_promotions':0,
            'global_denominator':7565,'openjarvis_obligations':646,
            'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN'
          }
          with Path('ledgers/EVIDENCE_LEDGER.ndjson').open('a',encoding='utf-8') as f:
              f.write(json.dumps(evidence,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          run={
            'schema_version':1,'date':'2026-09-22','event':'CP03_W02_G6_BINDING_SLICE_ADVANCED',
            'event_id':'RUN-W02-PARITY-BINDING-SEED-20260922','goal_id':'CLEVER-JARVIS-001',
            'checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17',
            'claim_id':'CLAIM-CP03-W02-PARITY-GRAPH-20260922','evidence_id':evidence_id,
            'status':'ADVANCED','bindings_validated':1,'unbound_remaining':46,'parity_promotions':0
          }
          wave={
            'schema_version':1,'date':'2026-09-22','event':'IMPLEMENTATION_VERIFICATION',
            'event_id':'WAVE-W02-PARITY-BINDING-SEED-20260922','checkpoint':'CP03','iteration':'I03',
            'parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17',
            'claim_id':'CLAIM-CP03-W02-PARITY-GRAPH-20260922','gate':'G6','evidence_id':evidence_id,
            'status':'IN_PROGRESS','bindings_validated':1,'unbound_remaining':46,'parity_promotions':0
          }
          risk={
            'schema_version':1,'date':'2026-09-22','risk_id':'RISK-W02-G6-K47-BINDINGS-PENDING-20260922',
            'severity':'P1','status':'OPEN','evidence_id':evidence_id,
            'risk':'W02-17 still has 46/47 proof units without explicit capability-to-test-to-evidence bindings; task-level PASS receipts must not be widened into capability parity.',
            'mitigation':'Continue one evidence-supported capability binding at a time, exact-SHA and field-expectation checked; keep canonical parity UNVERIFIED and shared capabilities non-terminal until all required facets are proven.'
          }
          for rel,row in [('ledgers/RUN_LOG.ndjson',run),('ledgers/WAVE_LEDGER.ndjson',wave),('ledgers/RISK_LEDGER.ndjson',risk)]:
              with Path(rel).open('a',encoding='utf-8') as f:
                  f.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          handoff=Path('HANDOFF.md')
          text=handoff.read_text().rstrip()
          note='''\n\n## W02-17 explicit binding seed — partial verified\n\n- `EVID-W02-PARITY-BINDING-SEED-20260922`: `cap_49014a3c03b104c8ec2f4ca1` (`InferenceEngine`, OWNED) is explicitly bound to the real unary-inference test `adapter_supervisor::real_openjarvis_unary_inference_uses_pinned_llamacpp_lane`, completed-task evidence `EVID-W02-UNARY-INFERENCE-20260921`, exact evidence SHA `a29389d41642ca74ed9c09ccfb9ec9f1725b48d7`, and field-level runtime expectations.\n- Binding state only: 1 `EVIDENCE_BACKED_CANDIDATE`, 46 `UNBOUND`, VERIFIED capabilities 0, parity promotions 0. Denominator 7565 and OpenJarvis obligations 646 unchanged.\n- Real OpenJarvis fallback model execution remains `NOT_RUN`; W02-18/W02-19 remain `BLOCKED`; W02-17 remains `IN_PROGRESS`.\n- Exact next slice: bind the next W02 capability that has capability-specific executed test evidence; never infer a binding from task-level PASS alone.\n'''
          if '## W02-17 explicit binding seed — partial verified' not in text:
              handoff.write_text(text+note)
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/cp03/w02_parity graphs/cp03/w02_parity evidence/cp03/cp03-w02/W02-17 sessions/20260922-w02-parity-graph/RESULT.json HANDOFF.md ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: persist explicit G6 binding seed'
          git push origin HEAD:"${GITHUB_REF_NAME}"
