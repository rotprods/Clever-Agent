name: CP03 W02 G6 core server health exact-head qualification

on:
  push:
    branches: [wave/cp03/w02-parity-server-health-20260924]

permissions:
  contents: read

concurrency:
  group: cp03-w02-parity-graph-qualify
  cancel-in-progress: false

env:
  EXPECTED_MAIN: a0d10061e96f8a42e622945a9d73c3297352c405
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CAPABILITY_ID: cap_575541e84f43f012a9239ad2
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_server_health_binding_is_capability_specific_and_source_backed

jobs:
  qualify-server-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head durable preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check

      - name: Fetch exact pinned upstream and verify source probe digest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          probe = json.loads(Path('evidence/cp03/cp03-w02/W02-17/binding_server_health_source_probe.json').read_text())
          assert probe['capability_id'] == 'cap_575541e84f43f012a9239ad2'
          assert probe['upstream_commit'] == '72033b8ec288aa067ce4530ff9d96bf231e9c4e5'
          source = Path('/tmp/openjarvis') / probe['source_path']
          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest == probe['source_sha256'], (digest, probe['source_sha256'])
          assert probe['canonical_parity_status'] == 'UNVERIFIED'
          assert probe['server_health_runtime_execution'] == 'NOT_RUN'
          assert probe['engine_health_execution'] == 'NOT_RUN'
          assert probe['http_listener_execution'] == 'NOT_RUN'
          assert probe['parity_promotions'] == 0
          PY

      - name: Capability-specific regression and G6 gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v "$TEST_ID"
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check
          test -z "$(git status --porcelain)"
