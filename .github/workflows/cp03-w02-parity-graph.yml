name: CP03 W02 G6 cloud reload route binding

on:
  push:
    branches: [wave/cp03/w02-parity-cloud-reload-20260924]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 8b2873e16c99a6969a810344a026a75012462d39
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_098f4d18aa8447bd4e8150ab
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-CLOUD-RELOAD-ROUTE-20260924
  DECISION_ID: DEC-W02-G6-CLOUD-RELOAD-ROUTE-BINDING-20260924
  SOURCE_EVIDENCE_ID: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_EVIDENCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_cloud_reload_route_binding_is_capability_specific_and_source_backed

jobs:
  bind-cloud-reload-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
