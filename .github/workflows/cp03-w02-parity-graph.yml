          assert sha=='45e499e92306e7387ab99b2ee52f89fe18a63dd3f8bc8d33b7325582bf24e242'
          line=next(i+1 for i,x in enumerate(text.splitlines()) if x.strip()=='export interface InferenceEndEvent {')
          assert line==19
