name: CP03 W02 G6 Ollama Capability Binding

on:
  push:
    branches: [wave/cp03/w02-parity-ollama-binding-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'
      - 'inventory/cp03/w02_evidence_bindings.jsonl'
      - 'tests/test_cp03_w02_parity_graph.py'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 36918de85bfa045756ae5a62369e36299c1365b1
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl
  OLLAMA_CAPABILITY_ID: cap_a5ae164f941b35e6fafd357c
  OLLAMA_SOURCE_EVIDENCE: EVID-W02-MODEL-BRIDGE-20260921
  OLLAMA_SOURCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  OLLAMA_TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_ollama_registry_binding_is_capability_specific_and_evidence_backed

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          assert 'inventory/cp03/w02_evidence_bindings.jsonl' in claim['scope']
          assert 'tests/test_cp03_w02_parity_graph.py' in claim['scope']
          assert '.github/workflows/cp03-w02-parity-graph.yml' in claim['scope']
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if not line.strip():
                  continue
              row=json.loads(line)
              cid=row.get('claim_id')
              if cid:
                  latest[cid]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Capability-specific RED-to-GREEN binding proof
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BINDINGS_PATH"
          python -m unittest -v "$OLLAMA_TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':45,'EVIDENCE_BACKED_CANDIDATE':2}, summary
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          candidates={x['capability_id']:x for x in rows if x['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE'}
          assert set(candidates)=={'cap_49014a3c03b104c8ec2f4ca1','cap_a5ae164f941b35e6fafd357c'}
          row=candidates['cap_a5ae164f941b35e6fafd357c']
          assert row['ownership']=='OWNED'
          assert row['name']=='ollama'
          assert row['surface_kind']=='registry_registration'
          assert row['source_path']=='src/openjarvis/engine/ollama.py'
          assert row['source_line']==106
          assert row['canonical_parity_status']=='UNVERIFIED'
          assert row['verified'] is False and row['parity_promotion'] is False
          assert row['binding']['evidence_id']=='EVID-W02-MODEL-BRIDGE-20260921'
          assert row['binding']['validated_head']=='a866c335a0f9cad75122c8eb7c5310d358f6aad4'
          assert row['binding']['terminal'] is False
          catalog=json.loads(Path('evidence/cp03/cp03-w02/W02-08/native_catalog.json').read_text())
          match=[x for x in catalog['engines'] if x['key']=='ollama']
          assert match==[{'implementation':'openjarvis.engine.ollama.OllamaEngine','key':'ollama','native_type':'ABCMeta','state':'REGISTERED'}]
          assert catalog['model_executions']==0
          assert catalog['provider_egress_executions']==0
          assert catalog['parity_promotions']==0
          PY
          git diff --check

      - name: Regression and G6 gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Persist evidence decision risk state handoff and ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence_id='EVID-W02-PARITY-BINDING-OLLAMA-20260923'
          decision_id='DEC-W02-G6-OLLAMA-CAPABILITY-BINDING-20260923'
          risk_id='RISK-W02-G6-K47-BINDINGS-PENDING-20260922'
          head=os.environ['GITHUB_SHA']
          main=os.environ['EXPECTED_MAIN']
          run_id=int(os.environ['GITHUB_RUN_ID'])
          test_id=os.environ['OLLAMA_TEST_ID']
          source_evidence=os.environ['OLLAMA_SOURCE_EVIDENCE']
          source_head=os.environ['OLLAMA_SOURCE_HEAD']
          capability_id=os.environ['OLLAMA_CAPABILITY_ID']

          def read_rows(path):
              p=Path(path)
              if not p.exists():
                  return []
              return [json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]

          def append_once(path, key, value, row):
              rows=read_rows(path)
              if any(existing.get(key)==value for existing in rows):
                  return False
              with Path(path).open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
              return True

          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text(encoding='utf-8'))
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=main
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          claim_event={
              'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':'CLAIM-CONT-W02-G6-OLLAMA-20260923',
              'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-17',
              'wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol',
              'status':'ACTIVE','base_head':main,'scope':claim['scope'],
              'coordination':'Continue the existing non-conflicting W02-17 G6 claim from exact main. Add exactly one capability-specific Ollama registry binding; no parity promotion, denominator mutation, W02-18 opening, provider egress or tool execution.'
          }
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',claim_event['event_id'],claim_event)

          result={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03',
              'parent_wave':'CP03-W02','task':'W02-17','gate':'G6','status':'PASS','evidence_id':evidence_id,
              'claim_id':os.environ['CLAIM_ID'],'validated_head':head,'github_actions_run_id':run_id,
              'bindings_validated_total':2,'bindings_added_this_slice':1,'binding_capability_id':capability_id,
              'binding_capability_name':'ollama','binding_source_evidence_id':source_evidence,
              'binding_source_validated_head':source_head,'binding_source_run_id':35552788123,
              'executed_test_id':test_id,'source_artifact_path':'evidence/cp03/cp03-w02/W02-08/native_catalog.json',
              'source_artifact_match':{'key':'ollama','implementation':'openjarvis.engine.ollama.OllamaEngine','state':'REGISTERED'},
              'unbound_remaining':45,'verified_capabilities':0,'parity_promotions':0,
              'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,
              'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN',
              'next_slice':'Bind the next W02 capability only when a capability-specific executed test and exact completed-task evidence receipt can be named.'
          }
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          report=Path('evidence/cp03/cp03-w02/W02-17/binding_ollama_report.json')
          report.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          evidence={
              'schema_version':1,'date':'2026-09-23','evidence_id':evidence_id,'status':'VERIFIED',
              'type':'cp03_w02_g6_capability_specific_ollama_binding','wave_id':'CP03-W02',
              'support_wave':'CP03-W02-PARITY-GRAPH-20260922','validated_head':head,'github_actions_run_id':run_id,
              'claim':'The owned OpenJarvis ollama registry-registration proof unit is bound to the completed exact-head W02-08 bridge receipt and a capability-specific G6 test that verifies the exact persisted native-catalog row. This creates only an EVIDENCE_BACKED_CANDIDATE; canonical parity remains UNVERIFIED.',
              'binding_capability_id':capability_id,'binding_source_evidence_id':source_evidence,
              'binding_source_validated_head':source_head,'executed_test_id':test_id,
              'bindings_validated_total':2,'unbound_remaining':45,'verified_capabilities':0,'parity_promotions':0,
              'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,
              'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN'
          }
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',evidence_id,evidence)

          run={
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_OLLAMA_BINDING_ADVANCED',
              'event_id':'RUN-W02-PARITY-BINDING-OLLAMA-20260923','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03',
              'iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],
              'evidence_id':evidence_id,'status':'ADVANCED','bindings_validated_total':2,'unbound_remaining':45,
              'verified_capabilities':0,'parity_promotions':0
          }
          append_once('ledgers/RUN_LOG.ndjson','event_id',run['event_id'],run)

          wave={
              'schema_version':1,'date':'2026-09-23','event':'IMPLEMENTATION_VERIFICATION',
              'event_id':'WAVE-W02-PARITY-BINDING-OLLAMA-20260923','checkpoint':'CP03','iteration':'I03',
              'parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':evidence_id,'status':'IN_PROGRESS',
              'bindings_validated_total':2,'unbound_remaining':45,'parity_promotions':0
          }
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id',wave['event_id'],wave)

          decision={
              'schema_version':1,'date':'2026-09-23','decision_id':decision_id,'status':'ACCEPTED','task':'W02-17',
              'evidence_id':evidence_id,
              'decision':'A W02-17 registry-registration binding requires both an exact completed-task evidence receipt and a capability-specific executed G6 test that resolves the concrete upstream source surface to preserved runtime/catalog evidence. Registry presence remains a candidate mapping, not parity.',
              'context':'The W02-08 native catalog contains the exact ollama registration at the pinned OpenJarvis source and proves zero model/provider execution. This prevents a generic task-level PASS from being widened across unrelated registry capabilities.'
          }
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',decision_id,decision)

          risk={
              'schema_version':1,'date':'2026-09-23','risk_id':risk_id,'severity':'P1','status':'OPEN','evidence_id':evidence_id,
              'risk':'W02-17 still has 45/47 proof units without explicit capability-to-test-to-evidence bindings; task-level PASS receipts, catalog membership, NOT_RUN/BLOCKED/PLATFORM_GATED fields and waivers must not be widened into capability parity.',
              'mitigation':'Continue one capability-specific executed-test binding at a time with exact source/evidence SHA and field expectations. Keep canonical parity UNVERIFIED, shared capabilities non-terminal, denominators frozen and W02-18 BLOCKED until G6 is actually complete.'
          }
          rows=read_rows('ledgers/RISK_LEDGER.ndjson')
          if not any(r.get('risk_id')==risk_id and r.get('evidence_id')==evidence_id for r in rows):
              with Path('ledgers/RISK_LEDGER.ndjson').open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(risk,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          state_path=Path('STATE.md')
          state=state_path.read_text(encoding='utf-8')
          progress='- G6 explicit binding progress: `2/47` evidence-backed candidates; `45` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'
          lines=[line for line in state.splitlines() if not line.startswith('- G6 explicit binding progress:')]
          insert_at=next(i for i,line in enumerate(lines) if line.startswith('- Canonical task frontier:'))+1
          lines.insert(insert_at,progress)
          state_path.write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')

          handoff_path=Path('HANDOFF.md')
          handoff=handoff_path.read_text(encoding='utf-8').rstrip()
          marker='## W02-17 Ollama registry binding — partial verified'
          note=f'''\n\n{marker}\n\n- `{evidence_id}`: `{capability_id}` (`ollama`, OWNED registry registration) is bound to completed W02-08 evidence `{source_evidence}` at exact SHA `{source_head}`.\n- Capability-specific executed test: `{test_id}`; the test resolves the frozen source surface `src/openjarvis/engine/ollama.py:106` to the exact preserved native-catalog row `openjarvis.engine.ollama.OllamaEngine`, state `REGISTERED`, with zero model/provider execution.\n- G6 binding state is now 2 `EVIDENCE_BACKED_CANDIDATE` / 45 `UNBOUND`; VERIFIED capabilities remain 0 and parity promotions remain 0. Denominator 7565 and OpenJarvis obligations 646 are unchanged.\n- `NOT_RUN`, `BLOCKED`, `PLATFORM_GATED` and waiver states remain non-proof. Real OpenJarvis fallback model execution remains `NOT_RUN`. W02-17 stays `IN_PROGRESS`; W02-18/W02-19 stay `BLOCKED`.\n- Exact next slice: bind the next W02 capability only when its own executed test can be named and traced to an exact completed-task receipt; do not infer parity from task-level PASS or catalog membership alone.\n'''
          if marker not in handoff:
              handoff_path.write_text(handoff+note,encoding='utf-8')
          PY

          python scripts/cp03/w02_parity_graph.py --write
          python scripts/cp03/w02_parity_graph.py --check
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python -m unittest -v "$OLLAMA_TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          git diff --check

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            sessions/20260922-w02-parity-graph/CLAIM.json \
            sessions/20260922-w02-parity-graph/RESULT.json \
            evidence/cp03/cp03-w02/W02-17/binding_ollama_report.json \
            reports/cp03/w02_parity \
            graphs/cp03/w02_parity \
            STATE.md HANDOFF.md \
            ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson \
            .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: persist Ollama capability binding evidence'
          git push origin HEAD:"${GITHUB_REF_NAME}"
