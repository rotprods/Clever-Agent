              'capability_id':os.environ['CAPABILITY_ID'],'capability_name':'InferenceEndEvent','surface_kind':'protocol_contract','ownership':'OWNED','terminal_eligible_in_w02':True,
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],'source_path':'frontend/src/types/index.ts','source_line':line,'source_sha256':sha,
              'source_probe':'PASS','source_execution':False,'interface_fields':fields,'inference_end_event_runtime_execution':'NOT_RUN',
              'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'canonical_parity_status':'UNVERIFIED','parity_promotions':0,
