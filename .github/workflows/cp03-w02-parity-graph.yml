name: CP03 W02 G6 claim ContextPack repair

on:
  push:
    branches: [wave/cp03/w02-parity-modelinfo-protocol-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 972ccd482edf63bc5300f90bc751d3c24a4ae583
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  EVIDENCE_ID: EVID-W02-G6-CLAIM-CONTEXT-WAVE-ID-REPAIR-20260923

jobs:
  red-green-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head recovery preflight and characterize durable RED
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json,os
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['wave_id']==os.environ['WAVE_ID'] and claim['status']=='ACTIVE'
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          row=latest[os.environ['CLAIM_ID']]
          assert row['status']=='ACTIVE'
          assert row.get('wave_id') is None, row
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          active=next(x for x in ctx['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert active['wave_id'] is None, active
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['w02_proof_units']==47 and summary['verified_capabilities']==0 and summary['parity_promotions']==0
          matrix=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          assert sum(x['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE' for x in matrix)==16
          assert sum(x['w02_evidence_state']=='UNBOUND' for x in matrix)==31
          afm=next(x for x in matrix if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Add invariant regression and prove it RED before repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_cp03_w02_parity_graph.py')
          text=p.read_text(encoding='utf-8')
          marker='    def test_frozen_scope_and_denominators_are_preserved(self) -> None:\n'
          assert marker in text
          method='''    def test_context_pack_preserves_active_claim_wave_id(self) -> None:\n        context = json.loads((ROOT / ".agentic/context/CURRENT_CONTEXT.json").read_text(encoding="utf-8"))\n        claims = [row for row in context["active_claims"] if row["claim_id"] == "CLAIM-CP03-W02-PARITY-GRAPH-20260922"]\n        self.assertEqual(len(claims), 1)\n        self.assertEqual(claims[0]["status"], "ACTIVE")\n        self.assertEqual(claims[0]["wave_id"], "CP03-W02-PARITY-GRAPH-20260922")\n\n'''
          assert 'def test_context_pack_preserves_active_claim_wave_id' not in text
          p.write_text(text.replace(marker,method+marker,1),encoding='utf-8')
          PY
          set +e
          python -m unittest -v tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_context_pack_preserves_active_claim_wave_id > /tmp/red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "AssertionError" /tmp/red.log
          grep -q "CP03-W02-PARITY-GRAPH-20260922" /tmp/red.log

      - name: Repair claim ledger projection and regenerate derived proof plane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          def rows(path):
              p=Path(path)
              return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(x.get(key)==value for x in rows(path)): return
              with Path(path).open('a',encoding='utf-8') as h:
                  h.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id','CLAIM-REPAIR-W02-G6-WAVE-ID-20260923',{
              'schema_version':1,'date':'2026-09-23','event_id':'CLAIM-REPAIR-W02-G6-WAVE-ID-20260923','event':'CLAIM_CONTEXT_REPAIRED',
              'claim_id':os.environ['CLAIM_ID'],'wave_id':os.environ['WAVE_ID'],'status':'ACTIVE','owner':'chatgpt-gpt-5.6-sol',
              'checkpoint':'CP03','canonical_task':'W02-17','base_head':os.environ['EXPECTED_MAIN'],
              'coordination':'Restore canonical wave_id on the latest active-claim ledger projection after the ModelInfo persistence slice omitted it. Claim scope and task frontier are unchanged.'})
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',os.environ['EVIDENCE_ID'],{
              'schema_version':1,'date':'2026-09-23','evidence_id':os.environ['EVIDENCE_ID'],'status':'VERIFIED','type':'claim_context_projection_repair',
              'wave_id':'CP03-W02','support_wave':os.environ['WAVE_ID'],'claim_id':os.environ['CLAIM_ID'],
              'claim':'A RED regression proved the generated ContextPack projected the active W02-17 claim with wave_id=null because the latest CLAIM_CONTINUED ledger row omitted wave_id. A new append-only claim repair event restores the canonical wave_id. The repair also regenerates the W02 proof plane because EVIDENCE_LEDGER.ndjson is a hashed compiler input.',
              'red_reproduced':True,'context_wave_id_after':'CP03-W02-PARITY-GRAPH-20260922','global_denominator':7565,'openjarvis_obligations':646,
              'verified_capabilities':0,'parity_promotions':0,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,
              'real_openjarvis_fallback_model_execution':'NOT_RUN','afm_inprocess_execution':'NOT_RUN','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'validated_pre_repair_head':os.environ['GITHUB_SHA']})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id','DEC-W02-G6-CLAIM-CONTEXT-WAVE-ID-REPAIR-20260923',{
              'schema_version':1,'date':'2026-09-23','decision_id':'DEC-W02-G6-CLAIM-CONTEXT-WAVE-ID-REPAIR-20260923','status':'ACCEPTED','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],
              'decision':'Treat missing wave_id on an ACTIVE claim projection as a durable-state integrity defect. Repair append-only at the claim ledger and retain a regression that requires ContextPack to preserve the canonical wave_id.',
              'context':'The existing context validators accepted wave_id=null, so exact PR diff review caught a metadata-loss gap not covered by prior gates.'})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id','DEC-W02-G6-REGENERATE-PROOF-PLANE-AFTER-EVIDENCE-WRITE-20260923',{
              'schema_version':1,'date':'2026-09-23','decision_id':'DEC-W02-G6-REGENERATE-PROOF-PLANE-AFTER-EVIDENCE-WRITE-20260923','status':'ACCEPTED','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],
              'decision':'Any W02-17 write to EVIDENCE_LEDGER.ndjson must regenerate the derived W02 parity proof plane before its --check gate.',
              'context':'The failed repair run reached the full gauntlet with a stale reports/cp03/w02_parity/SUMMARY.json because its input_sha256 includes EVIDENCE_LEDGER.ndjson.'})
          append_once('ledgers/RISK_LEDGER.ndjson','risk_id','RISK-W02-G6-CLAIM-PROJECTION-METADATA-LOSS-20260923',{
              'schema_version':1,'date':'2026-09-23','risk_id':'RISK-W02-G6-CLAIM-PROJECTION-METADATA-LOSS-20260923','severity':'P1','status':'MITIGATED','evidence_id':os.environ['EVIDENCE_ID'],
              'risk':'Append-only claim continuation events can shadow earlier claim metadata in ContextPack when required projection fields are omitted.',
              'mitigation':'This wave adds a RED-GREEN regression for active claim wave_id and repairs the current projection append-only. Future claim continuation writers must carry canonical wave_id.'})
          append_once('ledgers/RISK_LEDGER.ndjson','risk_id','RISK-W02-G6-DERIVED-PROOF-PLANE-STALE-20260923',{
              'schema_version':1,'date':'2026-09-23','risk_id':'RISK-W02-G6-DERIVED-PROOF-PLANE-STALE-20260923','severity':'P1','status':'MITIGATED','evidence_id':os.environ['EVIDENCE_ID'],
              'risk':'Appending valid evidence can stale the generated W02 proof-plane summary because the evidence ledger digest is part of its deterministic input set.',
              'mitigation':'Characterize the stale --check as RED, then run w02_parity_graph.py --write followed by --check before any durable commit.'})
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-CLAIM-CONTEXT-REPAIR-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_CLAIM_CONTEXT_REPAIR','event_id':'RUN-W02-G6-CLAIM-CONTEXT-REPAIR-20260923','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'ADVANCED','bindings_validated_total':16,'unbound_remaining':31,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-CLAIM-CONTEXT-REPAIR-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'STATE_INTEGRITY_REPAIR','event_id':'WAVE-W02-G6-CLAIM-CONTEXT-REPAIR-20260923','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':os.environ['WAVE_ID'],'canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':os.environ['EVIDENCE_ID'],'status':'IN_PROGRESS','bindings_validated_total':16,'unbound_remaining':31,'parity_promotions':0})
          report={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6',
              'evidence_id':os.environ['EVIDENCE_ID'],'status':'PASS','red_reproduced':True,'root_cause':'Latest CLAIM_CONTINUED ledger event omitted wave_id; ContextPack latest-by-claim projection therefore emitted null. The first repair attempt then appended EVIDENCE_LEDGER without regenerating the hashed W02 proof plane, so the full gauntlet correctly failed on generated product drift.',
              'repair':'Append-only CLAIM_CONTEXT_REPAIRED event carries canonical wave_id; proof plane regenerated after evidence append; ContextPack rebuilt; both regressions retained.',
              'claim_id':os.environ['CLAIM_ID'],'wave_id':os.environ['WAVE_ID'],'bindings_validated_total':16,'unbound_remaining':31,
              'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,
              'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN','afm_inprocess_execution':'NOT_RUN','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'validated_pre_repair_head':os.environ['GITHUB_SHA']}
          Path('evidence/cp03/cp03-w02/W02-17/claim_context_wave_id_repair_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          hand=Path('HANDOFF.md'); text=hand.read_text().rstrip(); marker='## W02-17 active-claim ContextPack integrity repair — COMPLETE'
          note=f'''\n\n{marker}\n\n- `{os.environ['EVIDENCE_ID']}` records a durable-state defect found during exact PR review: the latest claim continuation event omitted `wave_id`, causing generated ContextPack to project the sole ACTIVE claim with `wave_id=null`.\n- A retained regression was RED before repair and GREEN after an append-only `CLAIM_CONTEXT_REPAIRED` event restored `{os.environ['WAVE_ID']}`.\n- The first repair run then failed its own full gauntlet because `EVIDENCE_LEDGER.ndjson` is hashed into `reports/cp03/w02_parity/SUMMARY.json` and the derived proof plane had not been regenerated. The corrected gate now proves that stale state RED, runs `w02_parity_graph.py --write`, then requires `--check` GREEN before CAS commit.\n- No claim scope, DAG status, denominator, obligations or parity state changed. W02-17 remains `IN_PROGRESS` at 16/47 evidence-backed candidates / 31 UNBOUND; VERIFIED 0; parity promotions 0. AFM and real fallback execution remain `NOT_RUN`; W02-18/W02-19 remain `BLOCKED`.\n'''
          if marker not in text: hand.write_text(text+note,encoding='utf-8')
          PY

          set +e
          python scripts/cp03/w02_parity_graph.py --check > /tmp/proof-plane-red.log 2>&1
          proof_code=$?
          set -e
          test "$proof_code" -ne 0
          grep -q 'generated product drift: reports/cp03/w02_parity/SUMMARY.json' /tmp/proof-plane-red.log
          python scripts/cp03/w02_parity_graph.py --write
          python scripts/cp03/w02_parity_graph.py --check
          python scripts/context/build_context_pack.py
          python -m unittest -v tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_context_pack_preserves_active_claim_wave_id
          python - <<'PY'
          import json,os
          from pathlib import Path
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          active=next(x for x in ctx['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert active['wave_id']==os.environ['WAVE_ID'] and active['status']=='ACTIVE'
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':16,'UNBOUND':31}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          PY

      - name: Full targeted regression and gauntlet after repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_model_bridge tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert s['global_denominator']==7565 and s['openjarvis_obligations']==646 and s['w02_proof_units']==47
          assert s['verified_capabilities']==0 and s['parity_promotions']==0
          m=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          assert sum(x['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE' for x in m)==16
          assert sum(x['w02_evidence_state']=='UNBOUND' for x in m)==31
          afm=next(x for x in m if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          g=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text()); t={x['id']:x for x in g['tasks']}
          assert t['W02-17']['status']=='IN_PROGRESS' and t['W02-18']['status']=='BLOCKED' and t['W02-19']['status']=='BLOCKED'
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text()); active=next(x for x in ctx['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert active['wave_id']==os.environ['WAVE_ID']
          PY
          git diff --check

      - name: Commit repaired durable state under exact-head CAS
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_cp03_w02_parity_graph.py \
            ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson \
            evidence/cp03/cp03-w02/W02-17/claim_context_wave_id_repair_report.json \
            reports/cp03/w02_parity graphs/cp03/w02_parity \
            HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'CP03 W02-17: repair claim projection and derived proof plane'
          head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Final exact-head regression
        shell: bash
        env:
          FINAL_HEAD: ${{ steps.repair.outputs.head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json,os
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text()); tasks={x['id']:x for x in graph['tasks']}
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text()); active=next(x for x in context['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert active['wave_id']==os.environ['WAVE_ID'] and active['status']=='ACTIVE'
          PY
          git diff --check
          printf 'FINAL_HEAD=%s\n' "$FINAL_HEAD" >> "$GITHUB_STEP_SUMMARY"
