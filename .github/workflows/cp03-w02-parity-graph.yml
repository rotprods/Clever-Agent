name: CP03 W02 G6 AFM blocker recovery v2

on:
  push:
    branches: [wave/cp03/w02-parity-afm-negative-guard-20260923]
    paths: ['.github/workflows/cp03-w02-parity-graph.yml']

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 42ea953f7a9bc36faa8ea4ff04b7ed296e5f5010
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_ac38bf813e130d14927723d8
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_afm_inprocess_registry_remains_unbound_when_only_shim_catalog_is_observed

jobs:
  recover-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and RED guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922' and claim['status']=='ACTIVE'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          latest={}
          for raw in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if raw.strip():
                  row=json.loads(raw)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=[r['claim_id'] for r in latest.values() if r.get('status')=='ACTIVE']
          assert active==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          bindings=[json.loads(x) for x in Path('inventory/cp03/w02_evidence_bindings.jsonl').read_text().splitlines() if x.strip()]
          assert len(bindings)==14 and not any(x.get('capability_id')=='cap_ac38bf813e130d14927723d8' for x in bindings)
          probe=json.loads(Path('evidence/cp03/cp03-w02/W02-17/afm_optional_engine_source_probe.json').read_text())
          assert probe['capability_status']=='BLOCKED_UNOBSERVABLE_OPTIONAL_IMPORT'
          assert probe['decorator_registry_key']=='afm' and probe['w02_catalog_has_afm'] is False and probe['w02_catalog_has_apple_fm'] is True
          assert probe['afm_engine_execution']=='NOT_RUN' and probe['binding_created'] is False and probe['parity_promotions']==0
          PY
          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_model_bridge tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Persist blocker and regenerate derived truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-PARITY-BLOCKER-AFM-OPTIONAL-20260923'
          decision_id='DEC-W02-G6-AFM-OPTIONAL-UNBOUND-20260923'
          risk_id='RISK-W02-G6-AFM-OPTIONAL-ENGINE-UNPROVEN-20260923'
          continuation_id='CLAIM-CONT-W02-G6-AFM-OPTIONAL-20260923'
          base=os.environ['EXPECTED_MAIN']; validated_head=os.environ['GITHUB_SHA']; run_id=int(os.environ['GITHUB_RUN_ID'])
          def rows(path):
              p=Path(path)
              return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(x.get(key)==value for x in rows(path)): return
              with Path(path).open('a',encoding='utf-8') as h: h.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=base
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n')
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',continuation_id,{
              'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':continuation_id,'project_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922',
              'claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':base,'scope':claim['scope'],
              'coordination':'Continue sole W02-17 G6 claim from exact main; preserve AFM negative binding guard. No parity promotion, denominator mutation, W02-18 opening, or blocked/NOT_RUN reinterpretation.'})
          probe=json.loads(Path('evidence/cp03/cp03-w02/W02-17/afm_optional_engine_source_probe.json').read_text())
          report={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-17','gate':'G6',
              'status':'BLOCKED_SUBSLICE','evidence_id':evidence_id,'claim_id':os.environ['CLAIM_ID'],'validated_head':validated_head,'github_actions_run_id':run_id,
              'capability_id':os.environ['CAPABILITY_ID'],'capability_name':'afm','capability_status':'BLOCKED_UNOBSERVABLE_OPTIONAL_IMPORT',
              'source_probe_path':'evidence/cp03/cp03-w02/W02-17/afm_optional_engine_source_probe.json','source_sha256':probe['source_sha256'],
              'optional_loader_sha256':probe['optional_loader_sha256'],'binding_created':False,'bindings_validated_total':14,'unbound_remaining':33,
              'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'source_execution':False,
              'afm_engine_execution':'NOT_RUN','model_executions':0,'provider_egress_executions':0,'tool_executions':0,'real_openjarvis_fallback_model_execution':'NOT_RUN',
              'next_slice':'Do not bind cap_ac38 from W02-08. Require direct in-process afm registration/execution evidence on a compatible Apple Foundation Models host, or continue W02-17 with another proof unit only when its own executed test and exact completed-task evidence exist.'}
          Path('evidence/cp03/cp03-w02/W02-17/afm_optional_engine_blocker_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',evidence_id,{
              'schema_version':1,'date':'2026-09-23','evidence_id':evidence_id,'status':'RECORDED','type':'cp03_w02_g6_negative_binding_guard','wave_id':'CP03-W02',
              'support_wave':'CP03-W02-PARITY-GRAPH-20260922','validated_head':validated_head,'github_actions_run_id':run_id,'capability_id':os.environ['CAPABILITY_ID'],
              'capability_status':'BLOCKED_UNOBSERVABLE_OPTIONAL_IMPORT','binding_created':False,'source_execution':False,'afm_engine_execution':'NOT_RUN',
              'bindings_validated_total':14,'unbound_remaining':33,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,
              'claim':'Pinned source registers in-process key afm; W02-08 observed only distinct apple_fm and upstream optional loading swallows ImportError/OSError. This records a blocker only, never capability verification or parity.'})
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-PARITY-BLOCKER-AFM-OPTIONAL-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_AFM_NEGATIVE_BINDING_GUARD','event_id':'RUN-W02-PARITY-BLOCKER-AFM-OPTIONAL-20260923',
              'goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],
              'evidence_id':evidence_id,'status':'ADVANCED_WITH_BLOCKER','bindings_validated_total':14,'unbound_remaining':33,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-PARITY-BLOCKER-AFM-OPTIONAL-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'BLOCKER_CLASSIFICATION','event_id':'WAVE-W02-PARITY-BLOCKER-AFM-OPTIONAL-20260923',
              'checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':'CP03-W02-PARITY-GRAPH-20260922','canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':evidence_id,'status':'IN_PROGRESS','capability_id':os.environ['CAPABILITY_ID'],
              'capability_status':'BLOCKED_UNOBSERVABLE_OPTIONAL_IMPORT','bindings_validated_total':14,'unbound_remaining':33,'parity_promotions':0})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',decision_id,{
              'schema_version':1,'date':'2026-09-23','decision_id':decision_id,'status':'ACCEPTED','task':'W02-17','evidence_id':evidence_id,
              'decision':'Keep cap_ac38 in-process AFM UNBOUND; never reinterpret apple_fm shim evidence as proof of distinct afm registration.',
              'context':'Pinned AppleFMEngine uses EngineRegistry.register("afm"); W02-08 has apple_fm but no afm and upstream swallows optional ImportError/OSError.'})
          append_once('ledgers/RISK_LEDGER.ndjson','risk_id',risk_id,{
              'schema_version':1,'date':'2026-09-23','risk_id':risk_id,'severity':'P1','status':'OPEN','evidence_id':evidence_id,
              'risk':'In-process AFM cap_ac38 is unproven by current W02-08 Linux catalog evidence; apple_fm is a distinct shim and optional import failures are swallowed upstream.',
              'mitigation':'Require direct afm registration/execution evidence on a compatible Apple Foundation Models host; retain negative regression guard against apple_fm aliasing.'})

          state=Path('STATE.md'); lines=[x for x in state.read_text().splitlines() if not x.startswith('- G6 explicit blocker:')]
          msg='- G6 explicit blocker: `cap_ac38bf813e130d14927723d8` (`afm`) remains `UNBOUND`; W02-08 observed only distinct `apple_fm`, while optional `apple_fm` import failures are swallowed upstream. Direct compatible-host AFM proof is still required.'
          pos=next((i for i,x in enumerate(lines) if x.startswith('- G6 explicit binding progress:')),None)
          lines.insert(pos+1,msg) if pos is not None else lines.append(msg)
          state.write_text('\n'.join(lines).rstrip()+'\n')

          handoff=Path('HANDOFF.md'); current=handoff.read_text().rstrip(); marker='## W02-17 AFM optional-engine negative guard — blocker recorded'
          if marker not in current:
              current += '\n\n'+marker+'\n\n'
              current += f'- `{evidence_id}` records the false-binding hazard for `{os.environ["CAPABILITY_ID"]}`: pinned source key is `afm`; W02-08 observed only distinct `apple_fm`.\n'
              current += '- Upstream optional loading swallows `ImportError`/`OSError`, so `import_failures=[]` does not prove `afm` loaded.\n'
              current += '- Regression guard requires `UNBOUND`, absent binding and canonical parity `UNVERIFIED`; `afm` execution remains `NOT_RUN`, never PASS.\n'
              current += '- G6 stays 14 candidates / 33 UNBOUND; VERIFIED 0; parity promotions 0; denominator 7565; OpenJarvis obligations 646. W02-17 remains IN_PROGRESS; W02-18/W02-19 remain BLOCKED.\n'
              current += '- Next: direct compatible-host `afm` proof, or another W02-17 proof unit only with its own executed test and exact completed-task evidence.\n'
          handoff.write_text(current.rstrip()+'\n')
          PY

          python scripts/cp03/w02_parity_graph.py --write
          python scripts/cp03/w02_parity_graph.py --check
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python -m unittest -v "$TEST_ID" tests.test_cp03_w02_parity_graph tests.test_cp03_w02_plan
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':33,'EVIDENCE_BACKED_CANDIDATE':14}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646
          proof=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in proof if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None
          assert target['canonical_parity_status']=='UNVERIFIED' and not target['verified'] and not target['parity_promotion']
          PY
          git diff --check

      - name: Final exact-head CAS commit and workflow restore
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git checkout origin/main -- .github/workflows/cp03-w02-parity-graph.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cp03-w02-parity-graph.yml sessions/20260922-w02-parity-graph/CLAIM.json \
            evidence/cp03/cp03-w02/W02-17/afm_optional_engine_source_probe.json evidence/cp03/cp03-w02/W02-17/afm_optional_engine_blocker_report.json \
            STATE.md HANDOFF.md ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson \
            ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson reports/cp03/w02_parity graphs/cp03/w02_parity \
            .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git diff --cached --check
          git commit -m 'CP03 W02-17: persist AFM optional-engine blocker'
          final_head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$final_head"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          echo "FINAL_HEAD=$final_head"
