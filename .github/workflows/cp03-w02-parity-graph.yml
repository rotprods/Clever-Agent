name: CP03 W02 G6 core server health source binding

on:
  push:
    branches: [wave/cp03/w02-parity-server-health-20260924]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: a0d10061e96f8a42e622945a9d73c3297352c405
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_575541e84f43f012a9239ad2
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-SERVER-HEALTH-20260924
  DECISION_ID: DEC-W02-G6-SERVER-HEALTH-BINDING-20260924
  SOURCE_EVIDENCE_ID: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_EVIDENCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_server_health_binding_is_capability_specific_and_source_backed

jobs:
  bind-server-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head durable preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph
          git diff --check

      - name: Fetch exact pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: RED GREEN persist and gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python sessions/20260922-w02-parity-graph/run_server_health_wave.py
          git diff --check
          test -n "$(git status --porcelain)"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"

          rm sessions/20260922-w02-parity-graph/run_server_health_wave.py
          git config user.name 'clever-agent-wave'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'CP03 W02-17: bind core server health source proof'
          git push origin "HEAD:${GITHUB_REF_NAME}"
