name: CP03 W02 G6 cloud reload route binding

on:
  push:
    branches: [wave/cp03/w02-parity-cloud-reload-20260924]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 8b2873e16c99a6969a810344a026a75012462d39
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_098f4d18aa8447bd4e8150ab
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-CLOUD-RELOAD-ROUTE-20260924
  DECISION_ID: DEC-W02-G6-CLOUD-RELOAD-ROUTE-BINDING-20260924
  SOURCE_EVIDENCE_ID: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_EVIDENCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_cloud_reload_route_binding_is_capability_specific_and_source_backed

jobs:
  bind-cloud-reload-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head claim DAG and durable-state preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import json, os
          from pathlib import Path
          g=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          t={x['id']:x for x in g['tasks']}
          assert g['first_executable_task']=='W02-17'
          assert t['W02-17']['status']=='IN_PROGRESS'
          assert t['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(t[d]['status']=='COMPLETE' and t[d]['proof'] for d in t['W02-17']['depends_on'])
          assert t['W02-18']['status']=='BLOCKED' and t['W02-19']['status']=='BLOCKED'
          assert g['global_denominator']==7565 and g['openjarvis_obligations']==646 and g['w02_obligation_count']==47
          c=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert c['claim_id']==os.environ['CLAIM_ID'] and c['wave_id']==os.environ['WAVE_ID'] and c['canonical_task']=='W02-17' and c['status']=='ACTIVE'
          for p in ('.github/workflows/cp03-w02-parity-graph.yml','tests/test_cp03_w02_parity_graph.py','inventory/cp03/w02_evidence_bindings.jsonl','evidence/cp03/cp03-w02/W02-17/**','STATE.md','HANDOFF.md'):
              assert p in c['scope']
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=latest[os.environ['CLAIM_ID']]
          assert active['status']=='ACTIVE' and active['wave_id']==os.environ['WAVE_ID'] and active['owner']=='chatgpt-gpt-5.6-sol'
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          cctx=next(x for x in ctx['active_claims'] if x['claim_id']==os.environ['CLAIM_ID'])
          assert cctx['status']=='ACTIVE' and cctx['wave_id']==os.environ['WAVE_ID']
          s=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert s['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':22,'UNBOUND':25}
          assert s['verified_capabilities']==0 and s['parity_promotions']==0 and s['global_denominator']==7565 and s['openjarvis_obligations']==646
          m=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in m if x['capability_id']==os.environ['CAPABILITY_ID'])
          assert target['name']=='POST /v1/cloud/reload' and target['surface_kind']=='http_route'
          assert target['source_path']=='src/openjarvis/server/routes.py' and target['source_line']==1219
          assert target['ownership']=='OWNED' and target['terminal_eligible_in_w02'] is True
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None and target['canonical_parity_status']=='UNVERIFIED' and target['verified'] is False
          afm=next(x for x in m if x['capability_id']=='cap_ac38bf813e130d14927723d8'); assert afm['w02_evidence_state']=='UNBOUND'
          start=next(x for x in m if x['capability_id']=='cap_a97068215f50aeff0353f6e9'); assert start['w02_evidence_state']=='UNBOUND' and start['binding'] is None
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          python -m unittest -v tests.test_cp03_w02_parity_graph
          git diff --check

      - name: Source probe RED binding GREEN and persistence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          python - <<'PY'
          import ast
          import hashlib
          import json
          import os
          from pathlib import Path

          src=Path('/tmp/openjarvis/src/openjarvis/server/routes.py')
          raw=src.read_bytes()
          text=raw.decode('utf-8')
          source_sha=hashlib.sha256(raw).hexdigest()
          tree=ast.parse(text)
          target=None
          for node in tree.body:
              if isinstance(node, ast.AsyncFunctionDef) and node.name=='reload_cloud_engine':
                  target=node
                  break
          assert target is not None
          assert target.lineno==1219
          route=None
          for dec in target.decorator_list:
              if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Attribute):
                  if isinstance(dec.func.value, ast.Name) and dec.func.value.id=='router' and dec.func.attr=='post':
                      if dec.args and isinstance(dec.args[0], ast.Constant):
                          route=dec.args[0].value
          assert route=='/v1/cloud/reload'
          decorator_line=target.decorator_list[0].lineno
          assert decorator_line==1218
          segment=ast.get_source_segment(text,target) or ''
          required_markers=[
              'submitted_keys',
              'os.environ',
              'CloudEngine',
              'cloud.health()',
              'MultiEngine',
              'inner._engines',
              'inner._refresh_map()',
              'request.app.state.engine_name = "multi"',
          ]
          assert all(marker in segment for marker in required_markers)
          probe={
              'schema_version':1,
              'date':'2026-09-24',
              'project_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03',
              'task':'W02-17',
              'gate':'G6',
              'capability_id':os.environ['CAPABILITY_ID'],
              'capability_name':'POST /v1/cloud/reload',
              'surface_kind':'http_route',
              'ownership':'OWNED',
              'terminal_eligible_in_w02':True,
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],
              'source_path':'src/openjarvis/server/routes.py',
              'source_line':target.lineno,
              'decorator_line':decorator_line,
              'function_line':target.lineno,
              'function':'reload_cloud_engine',
              'http_method':'POST',
              'route_path':route,
              'source_sha256':source_sha,
              'source_probe':'PASS',
              'source_execution':False,
              'route_runtime_execution':'NOT_RUN',
              'cloud_engine_execution':'NOT_RUN',
              'credential_injection_execution':'NOT_RUN',
              'required_source_markers':required_markers,
              'model_executions':0,
              'provider_egress_executions':0,
              'tool_executions':0,
              'canonical_parity_status':'UNVERIFIED',
              'parity_promotions':0,
          }
          Path('evidence/cp03/cp03-w02/W02-17/binding_cloud_reload_route_source_probe.json').write_text(
              json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )

          p=Path('tests/test_cp03_w02_parity_graph.py')
          t=p.read_text(encoding='utf-8')
          assert 'CLOUD_RELOAD_ROUTE_CAPABILITY_ID' not in t
          old='PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID = "cap_56d79a86da34eeeacdf49427"\n'
          assert old in t
          t=t.replace(old,old+'CLOUD_RELOAD_ROUTE_CAPABILITY_ID = "cap_098f4d18aa8447bd4e8150ab"\n',1)
          marker=(
              'PROVIDER_SAVINGS_PROTOCOL_TEST_ID = (\n'
              '    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n'
              '    "test_provider_savings_protocol_binding_is_capability_specific_and_source_backed"\n'
              ')\n'
          )
          assert marker in t
          t=t.replace(
              marker,
              marker+
              'CLOUD_RELOAD_ROUTE_TEST_ID = (\n'
              '    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n'
              '    "test_cloud_reload_route_binding_is_capability_specific_and_source_backed"\n'
              ')\n',
              1,
          )
          assert 'def test_current_matrix_has_twenty_two_candidates_and_no_parity_promotion' in t
          t=t.replace(
              'def test_current_matrix_has_twenty_two_candidates_and_no_parity_promotion',
              'def test_current_matrix_has_twenty_three_candidates_and_no_parity_promotion',
              1,
          )
          assert '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 22)' in t
          assert '== "UNBOUND" for row in rows), 25)' in t
          t=t.replace(
              '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 22)',
              '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 23)',
              1,
          ).replace(
              '== "UNBOUND" for row in rows), 25)',
              '== "UNBOUND" for row in rows), 24)',
              1,
          )
          tail='CLI_MODEL_CONVERT_COMMAND_CAPABILITY_ID, CLI_SERVE_COMMAND_CAPABILITY_ID, PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID},'
          assert tail in t
          t=t.replace(
              tail,
              'CLI_MODEL_CONVERT_COMMAND_CAPABILITY_ID, CLI_SERVE_COMMAND_CAPABILITY_ID, PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID, CLOUD_RELOAD_ROUTE_CAPABILITY_ID},',
              1,
          )
          block=(
              '        provider_savings_protocol = candidates[PROVIDER_SAVINGS_PROTOCOL_CAPABILITY_ID]\n'
              '        self.assertEqual(provider_savings_protocol["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n'
              '        self.assertFalse(provider_savings_protocol["binding"]["terminal"])\n'
          )
          assert block in t
          t=t.replace(
              block,
              block+
              '        cloud_reload_route = candidates[CLOUD_RELOAD_ROUTE_CAPABILITY_ID]\n'
              '        self.assertEqual(cloud_reload_route["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n'
              '        self.assertFalse(cloud_reload_route["binding"]["terminal"])\n',
              1,
          )
          method_lines=[
              '    def test_cloud_reload_route_binding_is_capability_specific_and_source_backed(self) -> None:',
              '        row = next(row for row in self.result["rows"] if row["capability_id"] == CLOUD_RELOAD_ROUTE_CAPABILITY_ID)',
              '        self.assertEqual(row["ownership"], "OWNED")',
              '        self.assertEqual(row["surface_kind"], "http_route")',
              '        self.assertEqual(row["source_path"], "src/openjarvis/server/routes.py")',
              '        self.assertEqual(row["source_line"], 1219)',
              '        self.assertEqual(row["name"], "POST /v1/cloud/reload")',
              '        self.assertTrue(row["terminal_eligible_in_w02"])',
              '        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")',
              '        self.assertEqual(row["w02_evidence_state"], "EVIDENCE_BACKED_CANDIDATE")',
              '        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")',
              '        self.assertFalse(row["verified"])',
              '        self.assertFalse(row["parity_promotion"])',
              '        binding=row["binding"]',
              '        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")',
              '        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")',
              '        self.assertEqual(binding["test_id"], CLOUD_RELOAD_ROUTE_TEST_ID)',
              '        self.assertFalse(binding["terminal"])',
              '        receipt=graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")["EVID-W02-MODEL-BRIDGE-20260921"]',
              '        self.assertEqual(receipt["status"], "VERIFIED")',
              '        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")',
              '        self.assertEqual(receipt["native_engine_count"],15)',
              '        self.assertEqual(receipt["native_import_failure_count"],0)',
              '        self.assertEqual(receipt["native_model_count"],69)',
              '        self.assertEqual(receipt["model_executions"],0)',
              '        self.assertEqual(receipt["provider_egress_executions"],0)',
              '        self.assertEqual(receipt["parity_promotions"],0)',
              '        probe=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_cloud_reload_route_source_probe.json").read_text(encoding="utf-8"))',
              '        self.assertEqual(probe["capability_id"], CLOUD_RELOAD_ROUTE_CAPABILITY_ID)',
              '        self.assertEqual(probe["source_line"],1219)',
              '        self.assertEqual(probe["function_line"],1219)',
              '        self.assertEqual(probe["decorator_line"],1218)',
              '        self.assertEqual(probe["function"],"reload_cloud_engine")',
              '        self.assertEqual(probe["http_method"],"POST")',
              '        self.assertEqual(probe["route_path"],"/v1/cloud/reload")',
              '        self.assertEqual(probe["source_probe"],"PASS")',
              '        self.assertFalse(probe["source_execution"])',
              '        self.assertEqual(probe["route_runtime_execution"],"NOT_RUN")',
              '        self.assertEqual(probe["cloud_engine_execution"],"NOT_RUN")',
              '        self.assertEqual(probe["credential_injection_execution"],"NOT_RUN")',
              '        self.assertEqual(probe["model_executions"],0)',
              '        self.assertEqual(probe["provider_egress_executions"],0)',
              '        self.assertEqual(probe["tool_executions"],0)',
              '        self.assertEqual(probe["parity_promotions"],0)',
              '',
          ]
          method='\n'.join(method_lines)+'\n'
          insert='    def test_cli_model_list_command_binding_is_capability_specific_and_source_backed(self) -> None:\n'
          assert insert in t
          t=t.replace(insert,method+insert,1)
          p.write_text(t,encoding='utf-8')
          PY

          set +e
          python -m unittest -v "$TEST_ID" > /tmp/red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          grep -Eq 'AssertionError|EVIDENCE_BACKED_CANDIDATE|NoneType' /tmp/red.log

          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('inventory/cp03/w02_evidence_bindings.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)==22 and all(x['capability_id']!=os.environ['CAPABILITY_ID'] for x in rows)
          rows.append({
              'capability_id':os.environ['CAPABILITY_ID'],
              'evidence_id':os.environ['SOURCE_EVIDENCE_ID'],
              'test_id':os.environ['TEST_ID'],
              'validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],
              'expected_fields':{
                  'status':'VERIFIED',
                  'native_engine_count':15,
                  'native_import_failure_count':0,
                  'native_model_count':69,
                  'model_executions':0,
                  'provider_egress_executions':0,
                  'parity_promotions':0,
              },
              'terminal':False,
          })
          p.write_text(''.join(json.dumps(x,separators=(',',':'))+'\n' for x in rows),encoding='utf-8')
          PY

          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def append_once(path,key,value,row):
              p=Path(path)
              rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
              assert all(x.get(key)!=value for x in rows), (path,key,value)
              with p.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')

          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':23,'UNBOUND':24}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646

          probe=Path('evidence/cp03/cp03-w02/W02-17/binding_cloud_reload_route_source_probe.json')
          report={
              'schema_version':1,
              'date':'2026-09-24',
              'project_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03',
              'task':'W02-17',
              'gate':'G6',
              'claim_id':os.environ['CLAIM_ID'],
              'evidence_id':os.environ['EVIDENCE_ID'],
              'status':'PASS',
              'validated_base_head':os.environ['EXPECTED_MAIN'],
              'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
              'binding_capability_id':os.environ['CAPABILITY_ID'],
              'binding_capability_name':'POST /v1/cloud/reload',
              'binding_surface_kind':'http_route',
              'binding_ownership':'OWNED',
              'terminal_eligible_in_w02':True,
              'binding_source_evidence_id':os.environ['SOURCE_EVIDENCE_ID'],
              'binding_source_validated_head':os.environ['SOURCE_EVIDENCE_HEAD'],
              'binding_source_run_id':35552788123,
              'executed_test_id':os.environ['TEST_ID'],
              'source_probe_path':str(probe),
              'source_probe_sha256':hashlib.sha256(probe.read_bytes()).hexdigest(),
              'source_execution':False,
              'route_runtime_execution':'NOT_RUN',
              'cloud_engine_execution':'NOT_RUN',
              'credential_injection_execution':'NOT_RUN',
              'bindings_added_this_slice':1,
              'bindings_validated_total':23,
              'unbound_remaining':24,
              'global_denominator':7565,
              'openjarvis_obligations':646,
              'verified_capabilities':0,
              'parity_promotions':0,
              'model_executions':0,
              'provider_egress_executions':0,
              'tool_executions':0,
              'afm_inprocess_execution':'NOT_RUN',
              'real_openjarvis_fallback_model_execution':'NOT_RUN',
              'inference_start_event_binding':'UNBOUND_UNTOUCHED',
              'next_proof_unit':'cap_188be06cddde484a5bb440c7 — GET /v1/models',
              'next_slice':'Continue W02-17 with cap_188be06cddde484a5bb440c7 only if capability-specific exact pinned-source or executed runtime evidence can be paired with a completed-task PASS receipt; preserve any platform gate as PLATFORM_GATED/UNBOUND rather than PASS.',
          }
          rp=Path('evidence/cp03/cp03-w02/W02-17/binding_cloud_reload_route_report.json')
          rp.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')

          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',os.environ['EVIDENCE_ID'],{**report,'type':'CP03_W02_G6_CAPABILITY_BINDING','path':str(rp)})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',os.environ['DECISION_ID'],{
              'schema_version':1,
              'date':'2026-09-24',
              'decision_id':os.environ['DECISION_ID'],
              'status':'ACCEPTED',
              'checkpoint':'CP03',
              'task':'W02-17',
              'decision':'Bind the frozen OpenJarvis POST /v1/cloud/reload HTTP route as a non-terminal EVIDENCE_BACKED_CANDIDATE only.',
              'context':'Exact pinned source proves the route identity and source-level CloudEngine/MultiEngine reload path. W02-08 supplies the completed model/engine bridge receipt used by the G6 compiler. The route, credential injection and cloud engine were not executed in this slice, so runtime behavior and parity remain unverified.',
              'evidence_id':os.environ['EVIDENCE_ID'],
              'parity_promotions':0,
          })
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-CLOUD-RELOAD-ROUTE-20260924',{
              'schema_version':1,
              'date':'2026-09-24',
              'event':'CP03_W02_G6_CAPABILITY_BINDING',
              'event_id':'RUN-W02-G6-CLOUD-RELOAD-ROUTE-20260924',
              'goal_id':'CLEVER-JARVIS-001',
              'checkpoint':'CP03',
              'iteration':'I03',
              'wave_id':'CP03-W02',
              'canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],
              'evidence_id':os.environ['EVIDENCE_ID'],
              'status':'ADVANCED',
              'bindings_validated_total':23,
              'unbound_remaining':24,
              'verified_capabilities':0,
              'parity_promotions':0,
          })
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-CLOUD-RELOAD-ROUTE-20260924',{
              'schema_version':1,
              'date':'2026-09-24',
              'event':'WAVE_PROGRESS',
              'event_id':'WAVE-W02-G6-CLOUD-RELOAD-ROUTE-20260924',
              'checkpoint':'CP03',
              'iteration':'I03',
              'parent_wave':'CP03-W02',
              'wave_id':os.environ['WAVE_ID'],
              'canonical_task':'W02-17',
              'claim_id':os.environ['CLAIM_ID'],
              'gate':'G6',
              'evidence_id':os.environ['EVIDENCE_ID'],
              'status':'IN_PROGRESS',
              'bindings_validated_total':23,
              'unbound_remaining':24,
              'parity_promotions':0,
          })
          append_once('ledgers/RISK_LEDGER.ndjson','event_id','RISK-UPDATE-W02-G6-K47-BINDINGS-CLOUD-RELOAD-20260924',{
              'schema_version':1,
              'date':'2026-09-24',
              'event_id':'RISK-UPDATE-W02-G6-K47-BINDINGS-CLOUD-RELOAD-20260924',
              'risk_id':'RISK-W02-G6-K47-BINDINGS-PENDING-20260922',
              'severity':'P1',
              'status':'OPEN',
