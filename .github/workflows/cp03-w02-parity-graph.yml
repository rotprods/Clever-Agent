name: CP03 W02 G6 InferenceStartEvent protocol binding

on:
  push:
    branches: [wave/cp03/w02-parity-inference-start-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: c06e34cb118b620f6018147c26981a045ef31b24
  UPSTREAM_COMMIT: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  WAVE_ID: CP03-W02-PARITY-GRAPH-20260922
  CAPABILITY_ID: cap_a97068215f50aeff0353f6e9
  EVIDENCE_ID: EVID-W02-PARITY-BINDING-INFERENCE-START-EVENT-20260923
  DECISION_ID: DEC-W02-G6-INFERENCE-START-EVENT-BINDING-20260923

jobs:
  bind-inference-start-event:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head, claim, DAG and durable-state preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json, os
          from pathlib import Path

          state=Path('STATE.md').read_text(encoding='utf-8')
          assert 'W02-17 — Paridad y grafo W02` (`IN_PROGRESS`)' in state
          assert '`17/47` evidence-backed candidates; `30` UNBOUND' in state
          assert 'VERIFIED capabilities `0`; parity promotions `0`' in state

          execution=json.loads(Path('EXECUTION_STATE.json').read_text())
          assert execution['current_checkpoint']=='CP03'
          assert execution['active_iteration']=='I03'
          assert execution['next_wave']=='CP03-W02'

          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS'
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and tasks['W02-19']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47

          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']==os.environ['CLAIM_ID']
          assert claim['wave_id']==os.environ['WAVE_ID']
          assert claim['status']=='ACTIVE'
          for path in ['inventory/cp03/w02_evidence_bindings.jsonl','tests/test_cp03_w02_parity_graph.py','evidence/cp03/cp03-w02/W02-17/**','STATE.md','HANDOFF.md']:
              assert path in claim['scope']

          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'): latest[row['claim_id']]=row
          active=latest[os.environ['CLAIM_ID']]
          assert active['status']=='ACTIVE'
          assert active['wave_id']==os.environ['WAVE_ID']

          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'EVIDENCE_BACKED_CANDIDATE':17,'UNBOUND':30}
          assert summary['verified_capabilities']==0 and summary['parity_promotions']==0
          assert summary['global_denominator']==7565 and summary['openjarvis_obligations']==646

          matrix=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          target=next(x for x in matrix if x['capability_id']==os.environ['CAPABILITY_ID'])
          assert target['name']=='InferenceStartEvent' and target['surface_kind']=='protocol_contract'
          assert target['source_path']=='frontend/src/types/index.ts' and target['source_line']==13
          assert target['ownership']=='OWNED'
          assert target['w02_evidence_state']=='UNBOUND' and target['binding'] is None
          assert target['canonical_parity_status']=='UNVERIFIED' and target['verified'] is False
          afm=next(x for x in matrix if x['capability_id']=='cap_ac38bf813e130d14927723d8')
          assert afm['w02_evidence_state']=='UNBOUND' and afm['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/w02_parity_graph.py --check
          git diff --check

      - name: Probe exact pinned InferenceStartEvent source and add RED regression
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_COMMIT"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_COMMIT"

          python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          source_path=Path('/tmp/openjarvis/frontend/src/types/index.ts')
          raw=source_path.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          assert sha=='45e499e92306e7387ab99b2ee52f89fe18a63dd3f8bc8d33b7325582bf24e242', sha
          source=raw.decode('utf-8')
          match=re.search(r'export interface InferenceStartEvent \{\n(?P<body>.*?)\n\}', source, re.S)
          assert match
          line=source[:match.start()].count('\n')+1
          assert line==13, line
          fields=[]
          for raw_line in match.group('body').splitlines():
              m=re.match(r'\s*([A-Za-z_][A-Za-z0-9_]*):\s*([^;]+);\s*$', raw_line)
              if m: fields.append({'name':m.group(1),'type':m.group(2)})
          assert fields==[
              {'name':'model','type':'string'},
              {'name':'engine','type':'string'},
              {'name':'turn','type':'number'},
          ], fields

          probe={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','task':'W02-17','gate':'G6',
              'capability_id':os.environ['CAPABILITY_ID'],'capability_name':'InferenceStartEvent','surface_kind':'protocol_contract',
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],'source_path':'frontend/src/types/index.ts','source_line':13,
              'source_sha256':sha,'source_probe':'PASS','source_execution':False,'interface_fields':fields,
              'inference_start_event_runtime_emission':'NOT_RUN','canonical_parity_status':'UNVERIFIED',
              'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'parity_promotions':0,
          }
          out=Path('evidence/cp03/cp03-w02/W02-17/binding_inference_start_event_protocol_source_probe.json')
          out.write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          p=Path('tests/test_cp03_w02_parity_graph.py')
          text=p.read_text(encoding='utf-8')
          assert 'INFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID' not in text
          text=text.replace(
              'CLI_MODEL_LIST_COMMAND_CAPABILITY_ID = "cap_0ca72684c7cad5e160373532"\n',
              'CLI_MODEL_LIST_COMMAND_CAPABILITY_ID = "cap_0ca72684c7cad5e160373532"\nINFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID = "cap_a97068215f50aeff0353f6e9"\n',1)
          marker='CLI_MODEL_LIST_COMMAND_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_model_list_command_binding_is_capability_specific_and_source_backed"\n)\n'
          assert marker in text
          text=text.replace(marker, marker+'INFERENCE_START_EVENT_PROTOCOL_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed"\n)\n',1)
          text=text.replace('def test_current_matrix_has_seventeen_candidates_and_no_parity_promotion', 'def test_current_matrix_has_eighteen_candidates_and_no_parity_promotion',1)
          text=text.replace('== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 17)', '== "EVIDENCE_BACKED_CANDIDATE" for row in rows), 18)',1)
          text=text.replace('== "UNBOUND" for row in rows), 30)', '== "UNBOUND" for row in rows), 29)',1)
          text=text.replace('MODEL_INFO_PROTOCOL_CAPABILITY_ID, CLI_MODEL_LIST_COMMAND_CAPABILITY_ID},', 'MODEL_INFO_PROTOCOL_CAPABILITY_ID, CLI_MODEL_LIST_COMMAND_CAPABILITY_ID, INFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID},',1)
          block='''        cli_model_list_command = candidates[CLI_MODEL_LIST_COMMAND_CAPABILITY_ID]\n        self.assertEqual(cli_model_list_command["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_model_list_command["binding"]["terminal"])\n'''
          assert block in text
          text=text.replace(block,block+'''        inference_start_event_protocol = candidates[INFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID]\n        self.assertEqual(inference_start_event_protocol["binding"]["evidence_id"], "EVID-W02-UNARY-INFERENCE-20260921")\n        self.assertFalse(inference_start_event_protocol["binding"]["terminal"])\n''',1)
          method='''    def test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == INFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "protocol_contract")\n        self.assertEqual(row["source_path"], "frontend/src/types/index.ts")\n        self.assertEqual(row["source_line"], 13)\n        self.assertEqual(row["name"], "InferenceStartEvent")\n        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(row["w02_evidence_state"], "EVIDENCE_BACKED_CANDIDATE")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding=row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-UNARY-INFERENCE-20260921")\n        self.assertEqual(binding["validated_head"], "a29389d41642ca74ed9c09ccfb9ec9f1725b48d7")\n        self.assertEqual(binding["test_id"], INFERENCE_START_EVENT_PROTOCOL_TEST_ID)\n        self.assertFalse(binding["terminal"])\n        receipt=graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")["EVID-W02-UNARY-INFERENCE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a29389d41642ca74ed9c09ccfb9ec9f1725b48d7")\n        self.assertTrue(receipt["runtime_executed"])\n        self.assertEqual(receipt["model_executions"],1)\n        self.assertTrue(receipt["correlated_chunk_terminal"])\n        self.assertEqual(receipt["engine"],"llamacpp")\n        self.assertEqual(receipt["model_id"],"qwen3:0.6b")\n        self.assertEqual(receipt["provider_egress_executions"],0)\n        self.assertEqual(receipt["tool_executions"],0)\n        self.assertEqual(receipt["parity_promotions"],0)\n        probe=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_inference_start_event_protocol_source_probe.json").read_text(encoding="utf-8"))\n        self.assertEqual(probe["capability_id"], INFERENCE_START_EVENT_PROTOCOL_CAPABILITY_ID)\n        self.assertEqual(probe["upstream_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(probe["source_path"], "frontend/src/types/index.ts")\n        self.assertEqual(probe["source_line"],13)\n        self.assertEqual(probe["source_probe"],"PASS")\n        self.assertFalse(probe["source_execution"])\n        self.assertEqual(probe["interface_fields"],[{"name":"model","type":"string"},{"name":"engine","type":"string"},{"name":"turn","type":"number"}])\n        self.assertEqual(probe["inference_start_event_runtime_emission"],"NOT_RUN")\n        self.assertEqual(probe["canonical_parity_status"],"UNVERIFIED")\n        self.assertEqual(probe["provider_egress_executions"],0)\n        self.assertEqual(probe["tool_executions"],0)\n        self.assertEqual(probe["parity_promotions"],0)\n\n'''
          insert='    def test_ollama_registry_binding_is_capability_specific_and_evidence_backed(self) -> None:\n'
          assert insert in text
          text=text.replace(insert,method+insert,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Prove RED before creating the binding
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python -m unittest -v tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed > /tmp/red.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq 'AssertionError|TypeError|EVIDENCE_BACKED_CANDIDATE' /tmp/red.log

      - name: Bind proof unit, run narrow GREEN and parity regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('inventory/cp03/w02_evidence_bindings.jsonl')
          rows=[json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert all(row['capability_id'] != os.environ['CAPABILITY_ID'] for row in rows)
          binding={
              'capability_id':os.environ['CAPABILITY_ID'],
              'evidence_id':'EVID-W02-UNARY-INFERENCE-20260921',
              'test_id':'tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed',
              'validated_head':'a29389d41642ca74ed9c09ccfb9ec9f1725b48d7',
              'expected_fields':{'status':'VERIFIED','runtime_executed':True,'model_executions':1,'correlated_chunk_terminal':True,'engine':'llamacpp','model_id':'qwen3:0.6b','artifact_sha256':'9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14','provider_egress_executions':0,'tool_executions':0,'parity_promotions':0},
              'terminal':False,
          }
          with path.open('a',encoding='utf-8') as h:
              h.write(json.dumps(binding,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check

      - name: Persist evidence, decision, risk delta, state, handoff and ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def rows(path):
              p=Path(path)
              return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(x.get(key)==value for x in rows(path)): return
              with Path(path).open('a',encoding='utf-8') as h:
                  h.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          probe_path=Path('evidence/cp03/cp03-w02/W02-17/binding_inference_start_event_protocol_source_probe.json')
          probe_sha=hashlib.sha256(probe_path.read_bytes()).hexdigest()
          report={
              'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-17','gate':'G6',
              'claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'PASS','binding_capability_id':os.environ['CAPABILITY_ID'],
              'binding_capability_name':'InferenceStartEvent','binding_surface_kind':'protocol_contract','binding_source_evidence_id':'EVID-W02-UNARY-INFERENCE-20260921',
              'binding_source_run_id':35574901192,'binding_source_validated_head':'a29389d41642ca74ed9c09ccfb9ec9f1725b48d7',
              'executed_test_id':'tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed',
              'source_probe_path':str(probe_path),'source_probe_sha256':probe_sha,'source_execution':False,'inference_start_event_runtime_emission':'NOT_RUN',
              'bindings_added_this_slice':1,'bindings_validated_total':18,'unbound_remaining':29,'verified_capabilities':0,'parity_promotions':0,
              'global_denominator':7565,'openjarvis_obligations':646,'provider_egress_executions':0,'tool_executions':0,
              'real_openjarvis_fallback_model_execution':'NOT_RUN','afm_inprocess_execution':'NOT_RUN','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
              'validated_base_head':os.environ['EXPECTED_MAIN'],
              'next_slice':'Continue W02-17 with another proof unit only when capability-specific executed or exact pinned-source evidence can be paired with an existing completed-task PASS receipt. AFM remains blocked pending compatible-host proof.',
          }
          Path('evidence/cp03/cp03-w02/W02-17/binding_inference_start_event_protocol_report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id','CLAIM-CONTINUE-W02-G6-INFERENCE-START-EVENT-20260923',{
              'schema_version':1,'date':'2026-09-23','event_id':'CLAIM-CONTINUE-W02-G6-INFERENCE-START-EVENT-20260923','event':'CLAIM_CONTINUED',
              'claim_id':os.environ['CLAIM_ID'],'wave_id':os.environ['WAVE_ID'],'status':'ACTIVE','owner':'chatgpt-gpt-5.6-sol','checkpoint':'CP03','canonical_task':'W02-17',
              'base_head':os.environ['EXPECTED_MAIN'],'coordination':'Continue the existing non-conflicting W02-17 G6 claim on exact canonical main. Bind only cap_a97068215f50aeff0353f6e9 as a non-terminal source-backed protocol candidate using exact pinned source plus completed W02-10 evidence; no parity promotion or denominator mutation.'})
          append_once('ledgers/EVIDENCE_LEDGER.ndjson','evidence_id',os.environ['EVIDENCE_ID'],{
              'schema_version':1,'date':'2026-09-23','evidence_id':os.environ['EVIDENCE_ID'],'status':'VERIFIED','type':'w02_g6_capability_binding_candidate','task':'W02-17','gate':'G6',
              'claim_id':os.environ['CLAIM_ID'],'capability_id':os.environ['CAPABILITY_ID'],'source_evidence_id':'EVID-W02-UNARY-INFERENCE-20260921',
              'source_validated_head':'a29389d41642ca74ed9c09ccfb9ec9f1725b48d7','source_probe_path':str(probe_path),'source_probe_sha256':probe_sha,
              'executed_test_id':'tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_inference_start_event_protocol_binding_is_capability_specific_and_source_backed',
              'binding_state':'EVIDENCE_BACKED_CANDIDATE','source_execution':False,'inference_start_event_runtime_emission':'NOT_RUN','bindings_validated_total':18,'unbound_remaining':29,
              'global_denominator':7565,'openjarvis_obligations':646,'verified_capabilities':0,'parity_promotions':0,'provider_egress_executions':0,'tool_executions':0,
              'real_openjarvis_fallback_model_execution':'NOT_RUN','afm_inprocess_execution':'NOT_RUN','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'validated_base_head':os.environ['EXPECTED_MAIN']})
          append_once('ledgers/DECISION_LEDGER.ndjson','decision_id',os.environ['DECISION_ID'],{
              'schema_version':1,'date':'2026-09-23','decision_id':os.environ['DECISION_ID'],'status':'ACCEPTED','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],
              'decision':'Bind the OWNED OpenJarvis InferenceStartEvent protocol contract as a non-terminal G6 evidence-backed candidate using its exact pinned TypeScript schema plus the completed W02-10 real-inference PASS receipt. Do not infer frontend event emission or parity verification.',
              'context':'Pinned source proves the protocol contract fields model:string, engine:string and turn:number at frontend/src/types/index.ts:13. The source contract was not executed and runtime InferenceStartEvent emission remains NOT_RUN.'})
          append_once('ledgers/RISK_LEDGER.ndjson','event_id','RISK-UPDATE-W02-G6-K47-BINDINGS-INFERENCE-START-20260923',{
              'schema_version':1,'date':'2026-09-23','event_id':'RISK-UPDATE-W02-G6-K47-BINDINGS-INFERENCE-START-20260923','risk_id':'RISK-W02-G6-K47-BINDINGS-PENDING-20260922','severity':'P1','status':'OPEN','task':'W02-17','evidence_id':os.environ['EVIDENCE_ID'],
              'risk':'G6 remains incomplete: 29/47 frozen W02 proof units are still UNBOUND; source-backed candidate evidence must not be mistaken for runtime behavioral parity.',
              'mitigation':'Keep W02-17 IN_PROGRESS, verified parity at 0 and W02-18 BLOCKED. Bind one proof unit at a time only with capability-specific executed or exact-source evidence plus an exact completed-task PASS receipt; preserve AFM, event-emission and fallback NOT_RUN states.'})
          append_once('ledgers/RUN_LOG.ndjson','event_id','RUN-W02-G6-INFERENCE-START-EVENT-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'CP03_W02_G6_CAPABILITY_BINDING','event_id':'RUN-W02-G6-INFERENCE-START-EVENT-20260923','goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','wave_id':'CP03-W02','canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'evidence_id':os.environ['EVIDENCE_ID'],'status':'ADVANCED','bindings_validated_total':18,'unbound_remaining':29,'verified_capabilities':0,'parity_promotions':0})
          append_once('ledgers/WAVE_LEDGER.ndjson','event_id','WAVE-W02-G6-INFERENCE-START-EVENT-20260923',{
              'schema_version':1,'date':'2026-09-23','event':'WAVE_PROGRESS','event_id':'WAVE-W02-G6-INFERENCE-START-EVENT-20260923','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','wave_id':os.environ['WAVE_ID'],'canonical_task':'W02-17','claim_id':os.environ['CLAIM_ID'],'gate':'G6','evidence_id':os.environ['EVIDENCE_ID'],'status':'IN_PROGRESS','bindings_validated_total':18,'unbound_remaining':29,'parity_promotions':0})

          state=Path('STATE.md')
          s=state.read_text(encoding='utf-8')
          old='- G6 explicit binding progress: `17/47` evidence-backed candidates; `30` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'
          new='- G6 explicit binding progress: `18/47` evidence-backed candidates; `29` UNBOUND; VERIFIED capabilities `0`; parity promotions `0`.'
          assert old in s
          state.write_text(s.replace(old,new,1),encoding='utf-8')

          hand=Path('HANDOFF.md')
          h=hand.read_text(encoding='utf-8').rstrip()
          marker='## W02-17 InferenceStartEvent protocol binding — source-backed partial verified'
