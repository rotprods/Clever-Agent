name: CP03 W02 G6 CLI chat register_builtin_models binding

on:
  push:
    branches: [wave/cp03/w02-parity-cli-chat-register-builtins-20260923]
    paths:
      - '.github/workflows/cp03-w02-parity-graph.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-parity-graph
  cancel-in-progress: false

env:
  EXPECTED_MAIN: c371fb1dbadc4be34079fac55fadc3324ee5fafb
  CLAIM_ID: CLAIM-CP03-W02-PARITY-GRAPH-20260922
  BINDINGS_PATH: inventory/cp03/w02_evidence_bindings.jsonl
  CAPABILITY_ID: cap_63d29e906eae343ae8c88a05
  SOURCE_EVIDENCE: EVID-W02-MODEL-BRIDGE-20260921
  SOURCE_HEAD: a866c335a0f9cad75122c8eb7c5310d358f6aad4
  UPSTREAM_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  TEST_ID: tests.test_cp03_w02_parity_graph.W02ParityGraphTests.test_cli_chat_register_builtin_binding_is_capability_specific_and_evidence_backed
  PROBE_PATH: evidence/cp03/cp03-w02/W02-17/binding_cli_chat_register_builtin_source_probe.json

jobs:
  verify-bind-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Exact-head boot claim DAG and non-conflict guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-parity-graph/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-PARITY-GRAPH-20260922'
          assert claim['status']=='ACTIVE'
          for path in ['inventory/cp03/w02_evidence_bindings.jsonl','tests/test_cp03_w02_parity_graph.py','.github/workflows/cp03-w02-parity-graph.yml','evidence/cp03/cp03-w02/W02-17/**']:
              assert path in claim['scope'], path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-17'
          assert tasks['W02-17']['status']=='IN_PROGRESS' and not tasks['W02-17']['proof']
          assert tasks['W02-17']['depends_on']==['W02-01','W02-13','W02-14','W02-16']
          assert all(tasks[x]['status']=='COMPLETE' for x in tasks['W02-17']['depends_on'])
          assert tasks['W02-18']['status']=='BLOCKED' and not tasks['W02-18']['proof']
          assert tasks['W02-19']['status']=='BLOCKED' and not tasks['W02-19']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          active=[r for r in latest.values() if r.get('status')=='ACTIVE']
          assert [r['claim_id'] for r in active]==['CLAIM-CP03-W02-PARITY-GRAPH-20260922'], active
          bindings=[json.loads(line) for line in Path('inventory/cp03/w02_evidence_bindings.jsonl').read_text().splitlines() if line.strip()]
          assert len(bindings)==11, len(bindings)
          assert not any(row.get('capability_id')=='cap_63d29e906eae343ae8c88a05' for row in bindings)
          proof=[json.loads(line) for line in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if line.strip()]
          target=next(row for row in proof if row['capability_id']=='cap_63d29e906eae343ae8c88a05')
          assert target['ownership']=='OWNED'
          assert target['surface_kind']=='registry_registration'
          assert target['source_path']=='src/openjarvis/cli/chat_cmd.py'
          assert target['source_line']==130
          assert target['name']=='register_builtin_models'
          assert target['w02_evidence_state']=='UNBOUND'
          assert target['canonical_parity_status']=='UNVERIFIED'
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Verify exact pinned upstream CLI chat registration call-site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis
          git init -q /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch -q --depth=1 origin "$UPSTREAM_SHA"
          git -C /tmp/openjarvis checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$UPSTREAM_SHA"
          python - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          path=Path('/tmp/openjarvis/src/openjarvis/cli/chat_cmd.py')
          raw=path.read_bytes(); text=raw.decode('utf-8')
          tree=ast.parse(text)
          fn=next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name=='chat')
          calls=[]
          for node in ast.walk(fn):
              if not isinstance(node, ast.Call):
                  continue
              if isinstance(node.func, ast.Name): name=node.func.id
              elif isinstance(node.func, ast.Attribute): name=node.func.attr
              else: continue
              calls.append((node.lineno,name))
          reg=next(line for line,name in calls if name=='register_builtin_models')
          resolve=next(line for line,name in calls if name=='get_engine')
          assert reg==130, reg
          assert reg < resolve, (reg,resolve)
          probe={
              'schema_version':1,
              'date':'2026-09-23',
              'upstream_repository':'https://github.com/open-jarvis/OpenJarvis.git',
              'upstream_commit':os.environ['UPSTREAM_SHA'],
              'source_path':'src/openjarvis/cli/chat_cmd.py',
              'source_sha256':hashlib.sha256(raw).hexdigest(),
              'function':'chat',
              'registrar_call':'register_builtin_models',
              'registrar_call_line':reg,
              'get_engine_call_line':resolve,
              'registration_precedes_get_engine':True,
              'source_execution':False,
              'chat_command_execution':'NOT_RUN',
              'parity_promotion':False,
          }
          out=Path(os.environ['PROBE_PATH']); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(probe,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Add CLI chat registration binding and capability-specific test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          bindings_path=Path(os.environ['BINDINGS_PATH'])
          capability_id=os.environ['CAPABILITY_ID']
          rows=[json.loads(line) for line in bindings_path.read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows)==11, rows
          assert not any(row.get('capability_id')==capability_id for row in rows)
          rows.append({
              'capability_id': capability_id,
              'evidence_id': os.environ['SOURCE_EVIDENCE'],
              'test_id': os.environ['TEST_ID'],
              'validated_head': os.environ['SOURCE_HEAD'],
              'expected_fields': {
                  'status':'VERIFIED',
                  'native_engine_count':15,
                  'native_import_failure_count':0,
                  'native_model_count':69,
                  'model_executions':0,
                  'provider_egress_executions':0,
                  'parity_promotions':0,
              },
              'terminal': False,
          })
          bindings_path.write_text(''.join(json.dumps(row,separators=(',',':'))+'\n' for row in rows),encoding='utf-8')

          test_path=Path('tests/test_cp03_w02_parity_graph.py')
          text=test_path.read_text(encoding='utf-8')
          needle='CLI_MODEL_INFO_REGISTER_BUILTIN_CAPABILITY_ID = "cap_bdc045630a6fcf4735394782"\n'
          assert needle in text
          text=text.replace(needle,needle+'CLI_CHAT_REGISTER_BUILTIN_CAPABILITY_ID = "cap_63d29e906eae343ae8c88a05"\n',1)
          prior_test='''CLI_MODEL_INFO_REGISTER_BUILTIN_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_model_info_register_builtin_binding_is_capability_specific_and_evidence_backed"\n)\n'''
          assert prior_test in text
          text=text.replace(prior_test,prior_test+'''CLI_CHAT_REGISTER_BUILTIN_TEST_ID = (\n    "tests.test_cp03_w02_parity_graph.W02ParityGraphTests."\n    "test_cli_chat_register_builtin_binding_is_capability_specific_and_evidence_backed"\n)\n''',1)
          text=text.replace('def test_current_matrix_has_eleven_candidates_and_no_parity_promotion', 'def test_current_matrix_has_twelve_candidates_and_no_parity_promotion', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 11)', 'self.assertEqual(sum(row["w02_evidence_state"] == "EVIDENCE_BACKED_CANDIDATE" for row in rows), 12)', 1)
          text=text.replace('self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 36)', 'self.assertEqual(sum(row["w02_evidence_state"] == "UNBOUND" for row in rows), 35)', 1)
          old_set='{SEED_CAPABILITY_ID, OLLAMA_CAPABILITY_ID, LITELLM_CAPABILITY_ID, CLOUD_CAPABILITY_ID, NIM_CAPABILITY_ID, GEMMA_CPP_CAPABILITY_ID, OPENAI_COMPAT_REGISTER_CAPABILITY_ID, MODEL_REGISTER_VALUE_CAPABILITY_ID, MODEL_REGISTER_VALUE_1088_CAPABILITY_ID, CLI_MODEL_LIST_REGISTER_BUILTIN_CAPABILITY_ID, CLI_MODEL_INFO_REGISTER_BUILTIN_CAPABILITY_ID}'
          assert old_set in text
          text=text.replace(old_set,old_set[:-1]+', CLI_CHAT_REGISTER_BUILTIN_CAPABILITY_ID}',1)
          prior_candidate='''        cli_model_info_register_builtin = candidates[CLI_MODEL_INFO_REGISTER_BUILTIN_CAPABILITY_ID]\n        self.assertEqual(cli_model_info_register_builtin["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_model_info_register_builtin["binding"]["terminal"])\n'''
          assert prior_candidate in text
          text=text.replace(prior_candidate,prior_candidate+'''        cli_chat_register_builtin = candidates[CLI_CHAT_REGISTER_BUILTIN_CAPABILITY_ID]\n        self.assertEqual(cli_chat_register_builtin["binding"]["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertFalse(cli_chat_register_builtin["binding"]["terminal"])\n''',1)
          marker='    def test_graph_projects_all_four_planes_without_promotion(self) -> None:\n'
          assert marker in text
          method='''    def test_cli_chat_register_builtin_binding_is_capability_specific_and_evidence_backed(self) -> None:\n        row = next(row for row in self.result["rows"] if row["capability_id"] == CLI_CHAT_REGISTER_BUILTIN_CAPABILITY_ID)\n        self.assertEqual(row["ownership"], "OWNED")\n        self.assertEqual(row["surface_kind"], "registry_registration")\n        self.assertEqual(row["source_path"], "src/openjarvis/cli/chat_cmd.py")\n        self.assertEqual(row["source_line"], 130)\n        self.assertEqual(row["name"], "register_builtin_models")\n        self.assertEqual(row["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(row["canonical_parity_status"], "UNVERIFIED")\n        self.assertFalse(row["verified"])\n        self.assertFalse(row["parity_promotion"])\n        binding = row["binding"]\n        self.assertEqual(binding["evidence_id"], "EVID-W02-MODEL-BRIDGE-20260921")\n        self.assertEqual(binding["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(binding["test_id"], CLI_CHAT_REGISTER_BUILTIN_TEST_ID)\n        self.assertFalse(binding["terminal"])\n\n        obligation = next(\n            item for item in graph.read_jsonl(ROOT / graph.OBLIGATIONS_PATH)\n            if item["capability_id"] == CLI_CHAT_REGISTER_BUILTIN_CAPABILITY_ID\n        )\n        self.assertEqual(obligation["source_path"], "src/openjarvis/cli/chat_cmd.py")\n        self.assertEqual(obligation["source_line"], 130)\n        self.assertEqual(obligation["name"], "register_builtin_models")\n        self.assertEqual(obligation["source_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n\n        probe=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-17/binding_cli_chat_register_builtin_source_probe.json").read_text(encoding="utf-8"))\n        self.assertEqual(probe["upstream_commit"], "72033b8ec288aa067ce4530ff9d96bf231e9c4e5")\n        self.assertEqual(probe["source_path"], "src/openjarvis/cli/chat_cmd.py")\n        self.assertEqual(probe["function"], "chat")\n        self.assertEqual(probe["registrar_call"], "register_builtin_models")\n        self.assertEqual(probe["registrar_call_line"], 130)\n        self.assertTrue(probe["registration_precedes_get_engine"])\n        self.assertFalse(probe["source_execution"])\n        self.assertEqual(probe["chat_command_execution"], "NOT_RUN")\n        self.assertFalse(probe["parity_promotion"])\n\n        evidence = graph.latest_by(graph.read_jsonl(ROOT / graph.EVIDENCE_LEDGER_PATH), "evidence_id")\n        receipt = evidence["EVID-W02-MODEL-BRIDGE-20260921"]\n        self.assertEqual(receipt["status"], "VERIFIED")\n        self.assertEqual(receipt["validated_head"], "a866c335a0f9cad75122c8eb7c5310d358f6aad4")\n        self.assertEqual(receipt["native_engine_count"], 15)\n        self.assertEqual(receipt["native_import_failure_count"], 0)\n        self.assertEqual(receipt["native_model_count"], 69)\n        self.assertEqual(receipt["model_executions"], 0)\n        self.assertEqual(receipt["provider_egress_executions"], 0)\n        self.assertEqual(receipt["parity_promotions"], 0)\n\n        catalog=json.loads((ROOT / "evidence/cp03/cp03-w02/W02-08/native_catalog.json").read_text(encoding="utf-8"))\n        self.assertEqual(catalog["model_count"],69)\n        self.assertEqual(len(catalog["models"]),69)\n        self.assertEqual(catalog["import_failures"],[])\n        self.assertTrue(all(model["state"] == "REGISTERED" for model in catalog["models"]))\n        self.assertEqual(catalog["model_executions"],0)\n        self.assertEqual(catalog["provider_egress_executions"],0)\n        self.assertEqual(catalog["parity_promotions"],0)\n\n'''
          text=text.replace(marker,method+marker,1)
          test_path.write_text(text,encoding='utf-8')
          PY

          python -m unittest -v "$TEST_ID"
          python scripts/cp03/w02_parity_graph.py --write
          python -m unittest -v tests.test_cp03_w02_parity_graph
          python scripts/cp03/w02_parity_graph.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('reports/cp03/w02_parity/SUMMARY.json').read_text())
          assert summary['binding_counts']=={'UNBOUND':35,'EVIDENCE_BACKED_CANDIDATE':12}, summary
          assert summary['verified_capabilities']==0
          assert summary['parity_promotions']==0
          assert summary['global_denominator']==7565
          assert summary['openjarvis_obligations']==646
          rows=[json.loads(x) for x in Path('reports/cp03/w02_parity/PROOF_MATRIX.jsonl').read_text().splitlines() if x.strip()]
          row=next(x for x in rows if x['capability_id']=='cap_63d29e906eae343ae8c88a05')
          assert row['w02_evidence_state']=='EVIDENCE_BACKED_CANDIDATE'
          assert row['canonical_parity_status']=='UNVERIFIED'
          assert row['verified'] is False and row['parity_promotion'] is False
          assert row['binding']['terminal'] is False
          PY
          git diff --check

      - name: Regression and G6 adversarial gauntlet
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_w02_parity_graph \
            tests.test_cp03_w02_plan \
            tests.test_cp03_w02_unary_release_regressions
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Commit binding under exact-head CAS
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$BINDINGS_PATH" "$PROBE_PATH" tests/test_cp03_w02_parity_graph.py reports/cp03/w02_parity graphs/cp03/w02_parity
          git commit -m 'CP03 W02-17: add CLI chat registration G6 binding'
          binding_head="$(git rev-parse HEAD)"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$binding_head"
          echo "head=$binding_head" >> "$GITHUB_OUTPUT"

      - name: Persist evidence decisions risks state handoff and ContextPack
        shell: bash
        env:
          BINDING_HEAD: ${{ steps.binding.outputs.head }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence_id='EVID-W02-PARITY-BINDING-CLI-CHAT-REGISTER-BUILTIN-20260923'
          decision_id='DEC-W02-G6-CLI-CHAT-REGISTER-BUILTIN-BINDING-20260923'
          risk_id='RISK-W02-G6-K47-BINDINGS-PENDING-20260922'
          head=os.environ['BINDING_HEAD']; main=os.environ['EXPECTED_MAIN']; run_id=int(os.environ['GITHUB_RUN_ID'])
          test_id=os.environ['TEST_ID']; source_evidence=os.environ['SOURCE_EVIDENCE']; source_head=os.environ['SOURCE_HEAD']; capability_id=os.environ['CAPABILITY_ID']
          def read_rows(path):
              p=Path(path)
              return [json.loads(line) for line in p.read_text(encoding='utf-8').splitlines() if line.strip()] if p.exists() else []
          def append_once(path,key,value,row):
              if any(existing.get(key)==value for existing in read_rows(path)): return False
              with Path(path).open('a',encoding='utf-8') as handle: handle.write(json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
              return True
          claim_path=Path('sessions/20260922-w02-parity-graph/CLAIM.json')
          claim=json.loads(claim_path.read_text(encoding='utf-8'))
          assert claim['claim_id']==os.environ['CLAIM_ID'] and claim['status']=='ACTIVE'
          claim['continuation_base_head']=main
          claim_path.write_text(json.dumps(claim,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          claim_event={'schema_version':1,'date':'2026-09-23','event':'CONTINUATION','event_id':'CLAIM-CONT-W02-G6-CLI-CHAT-REGISTER-BUILTIN-20260923','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-17','wave_id':'CP03-W02-PARITY-GRAPH-20260922','claim_id':os.environ['CLAIM_ID'],'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','base_head':main,'scope':claim['scope'],'coordination':'Continue the sole W02-17 G6 claim from exact main. Add exactly one capability-specific binding for the frozen CLI chat register_builtin_models call site at src/openjarvis/cli/chat_cmd.py:130, backed by exact pinned-source call-order evidence plus completed W02-08 registration evidence. Do not treat the chat command itself as executed and do not promote parity.'}
          append_once('ledgers/CLAIM_LEDGER.ndjson','event_id',claim_event['event_id'],claim_event)
          probe=json.loads(Path(os.environ['PROBE_PATH']).read_text(encoding='utf-8'))
          result={'schema_version':1,'date':'2026-09-23','project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-17','gate':'G6','status':'PASS','evidence_id':evidence_id,'claim_id':os.environ['CLAIM_ID'],'validated_head':head,'github_actions_run_id':run_id,'bindings_validated_total':12,'bindings_added_this_slice':1,'binding_capability_id':capability_id,'binding_capability_name':'register_builtin_models','binding_source_evidence_id':source_evidence,'binding_source_validated_head':source_head,'binding_source_run_id':35552788123,'executed_test_id':test_id,'source_probe_path':os.environ['PROBE_PATH'],'source_probe_sha256':probe['source_sha256'],'source_artifact_path':'evidence/cp03/cp03-w02/W02-08/native_catalog.json','source_artifact_match':{'source_path':'src/openjarvis/cli/chat_cmd.py','source_line':130,'function':'chat','registrar_call':'register_builtin_models','registration_precedes_get_engine':True,'native_model_count':69},'unbound_remaining':35,'verified_capabilities':0,'parity_promotions':0,'global_denominator':7565,'openjarvis_obligations':646,'model_executions':0,'provider_egress_executions':0,'tool_executions':0,'source_execution':False,'chat_command_execution':'NOT_RUN','real_openjarvis_fallback_model_execution':'NOT_RUN','next_slice':'Bind the next W02 capability only when a capability-specific executed test and exact completed-task evidence receipt can be named.'}
          Path('sessions/20260922-w02-parity-graph/RESULT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          report_path=Path('evidence/cp03/cp03-w02/W02-17/binding_cli_chat_register_builtin_report.json')
          report_path.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
