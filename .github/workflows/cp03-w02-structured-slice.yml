name: CP03 W02 Structured Slice

on:
  push:
    branches: [wave/cp03/w02-structured-output-20260921]
    paths:
      - '.github/workflows/cp03-w02-structured-slice.yml'
      - 'sessions/20260921-w02-structured/**'
      - 'adapters/openjarvis/structured_inference.py'
      - 'tests/test_cp03_w02_structured.py'
      - 'ledgers/CLAIM_LEDGER.ndjson'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cp03-w02-structured-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-claim:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact base and active W02-13 claim
        run: |
          set -euo pipefail
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260921-w02-structured/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-13'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646
          assert tasks['W02-13']['status']=='READY' and not tasks['W02-13']['proof']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-13']['depends_on'])
          assert tasks['W02-14']['status']=='BLOCKED'
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          active={row['claim_id'] for row in context['active_claims']}
          assert active in (set(), {claim['claim_id']}), context['active_claims']
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          matching=[row for row in rows if row.get('claim_id')==claim['claim_id']]
          latest=matching[-1].get('status') if matching else None
          if latest is None:
              row=dict(claim); row['event']='CLAIM'
              with ledger.open('a',encoding='utf-8') as h:
                  h.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          elif latest != 'ACTIVE':
              raise SystemExit(f'unexpected W02-13 claim state: {latest!r}')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist claim reconciliation
        run: |
          set -euo pipefail
          if git diff --quiet -- ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md; then exit 0; fi
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-structured-output-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'claim(cp03-w02): register active W02-13 claim'
          git push origin HEAD:wave/cp03/w02-structured-output-20260921

  verify-structured:
    if: github.event_name == 'push'
    needs: reconcile-claim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'jsonschema>=4.23,<5'
      - name: Targeted structured-data adversarials
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m py_compile adapters/openjarvis/structured_inference.py tests/test_cp03_w02_structured.py
          python -m unittest -v tests.test_cp03_w02_structured
      - name: Touched-family regression
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_plan
      - name: Durable-state and parity gauntlet
        run: |
          set -euo pipefail
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
