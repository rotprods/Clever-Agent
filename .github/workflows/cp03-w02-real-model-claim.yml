name: CP03 W02 Real Model Claim

on:
  push:
    branches: [wave/cp03/w02-real-model-lane-20260921]
    paths:
      - 'sessions/20260921-w02-real-model/CLAIM.json'
      - '.github/workflows/cp03-w02-real-model-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-real-model-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact W02-09 frontier
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={t['id']:t for t in graph['tasks']}
          assert graph['first_executable_task']=='W02-09', graph['first_executable_task']
          assert tasks['W02-09']['status']=='READY', tasks['W02-09']['status']
          for dep in tasks['W02-09']['depends_on']:
              assert tasks[dep]['status']=='COMPLETE', (dep,tasks[dep]['status'])
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          assert ctx.get('active_claims')==[], ctx.get('active_claims')
          claim=json.loads(Path('sessions/20260921-w02-real-model/CLAIM.json').read_text())
          assert claim['base_head']=='74cc4e01d1443bac41427b9e91b38ef7337e2520'
          assert claim['canonical_task']=='W02-09'
          PY
      - name: Persist ACTIVE claim and regenerate ContextPack
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim_path=Path('sessions/20260921-w02-real-model/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          claim['status']='ACTIVE'
          claim_path.write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          cid=claim['claim_id']
          rows=[json.loads(x) for x in ledger.read_text().splitlines() if x.strip()]
          if not any(r.get('claim_id')==cid and r.get('status')=='ACTIVE' for r in rows):
              entry={
                'schema_version':1,'date':'2026-09-21','claim_id':cid,
                'wave_id':claim['wave_id'],'parent_wave':'CP03-W02',
                'canonical_task':'W02-09','owner':claim['owner'],
                'scope':claim['scope'],'coordination':claim['coordination'],'status':'ACTIVE'
              }
              with ledger.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(entry,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/validate_agentic_state.py
          git diff --check
      - name: CAS commit claim
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-real-model-lane-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-real-model/CLAIM.json ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): activate W02-09 claim'
          git push origin HEAD:wave/cp03/w02-real-model-lane-20260921
