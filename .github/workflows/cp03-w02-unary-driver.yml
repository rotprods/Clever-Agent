name: CP03 W02 Unary Inference Driver

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-driver.yml'
      - 'scripts/cp03/w02_unary_patch.py'
      - 'adapters/openjarvis/unary_inference.py'
      - 'adapters/openjarvis/sidecar.py'
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'tests/test_cp03_w02_unary_inference.py'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cp03/w02_unary_patch.py'
      - 'adapters/openjarvis/unary_inference.py'
      - 'adapters/openjarvis/sidecar.py'
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'tests/test_cp03_w02_unary_inference.py'
      - '.github/workflows/cp03-w02-unary-driver.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-unary-driver-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENJARVIS_PIN: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  LLAMACPP_PIN: 391fac16460f15233a7740550d858ac96df3419d
  MODEL_PATH: /tmp/clever-w02-10/Qwen_Qwen3-0.6B-Q4_K_M.gguf

jobs:
  execute_push:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install lightweight dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1'
      - name: Materialize deterministic W02-10 source slice
        run: |
          set -euo pipefail
          python scripts/cp03/w02_unary_patch.py --apply
          cargo fmt --manifest-path kernel/Cargo.toml --all
          python scripts/cp03/w02_unary_patch.py --check
          python -m py_compile adapters/openjarvis/unary_inference.py adapters/openjarvis/sidecar.py scripts/cp03/w02_unary_patch.py sessions/20260921-w02-unary-inference/finalize.py
          git diff --check
      - name: Targeted RED/GREEN and regression gauntlet
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/contracts/sdk/python/gen" python -m unittest tests.test_cp03_w02_unary_inference -v
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor --no-run
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - id: source
        name: Detect materialized source delta
        run: |
          set -euo pipefail
          if git diff --quiet -- adapters/openjarvis/sidecar.py kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_supervisor.rs; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restrict and CAS-persist source slice
        if: steps.source.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={'adapters/openjarvis/sidecar.py','kernel/crates/clever-kernel/src/adapter.rs','kernel/crates/clever-kernel/tests/adapter_supervisor.rs'}
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          assert paths == allowed, (paths, allowed)
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adapters/openjarvis/sidecar.py kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_supervisor.rs
          git commit -m 'feat(cp03-w02): materialize unary inference transport'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
      - name: Reacquire exact W02-09 real weights
        if: steps.source.outputs.changed == 'false'
        env:
          CLEVER_ALLOW_MODEL_ACQUISITION: '1'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          python scripts/cp03/w02_real_model.py acquire --artifact "$MODEL_PATH" --receipt /tmp/w02-10-model.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/w02-10-model.json'))
          assert row['status']=='PASS', row
          assert row['observed_size_bytes']==484220320
          assert row['observed_sha256']=='9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14'
          assert row['observed_magic_hex']=='47475546'
          assert row['model_executions']==0 and row['provider_egress_executions']==0 and row['parity_promotions']==0
          PY
      - name: Materialize exact runtime pins
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis-w02-10 /tmp/llama-w02-10
          git init -q /tmp/openjarvis-w02-10
          git -C /tmp/openjarvis-w02-10 remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis-w02-10 fetch -q --depth=1 origin "$OPENJARVIS_PIN"
          git -C /tmp/openjarvis-w02-10 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis-w02-10 rev-parse HEAD)" = "$OPENJARVIS_PIN"
          git init -q /tmp/llama-w02-10
          git -C /tmp/llama-w02-10 remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama-w02-10 fetch -q --depth=1 origin "$LLAMACPP_PIN"
          git -C /tmp/llama-w02-10 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/llama-w02-10 rev-parse HEAD)" = "$LLAMACPP_PIN"
          grep -q -- '--alias' /tmp/llama-w02-10/tools/server/README.md
      - name: Build exact CPU llama-server
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          cmake -S /tmp/llama-w02-10 -B /tmp/llama-w02-10/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama-w02-10/build --target llama-server -j2
          test -x /tmp/llama-w02-10/build/bin/llama-server
      - name: Execute real Rust to OpenJarvis unary inference
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          export CLEVER_OPENJARVIS_SRC=/tmp/openjarvis-w02-10/src
          export CLEVER_W02_MODEL_PATH="$MODEL_PATH"
          export LLAMACPP_HOST=http://127.0.0.1:8080
          /tmp/llama-w02-10/build/bin/llama-server --model "$MODEL_PATH" --alias qwen3:0.6b --host 127.0.0.1 --port 8080 --ctx-size 2048 --threads 2 --n-gpu-layers 0 > /tmp/w02-10-llama.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          python - <<'PY'
          import time, urllib.request
          deadline=time.time()+120
          last=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/v1/models', timeout=2) as response:
                      if response.status==200: raise SystemExit(0)
              except Exception as exc:
                  last=exc; time.sleep(1)
          raise SystemExit(f'llama-server readiness timeout: {last}')
          PY
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor real_openjarvis_unary_inference_uses_pinned_llamacpp_lane -- --exact --nocapture
      - name: Full post-execution regression and gauntlet
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/contracts/sdk/python/gen" python -m unittest tests.test_cp03_w02_unary_inference tests.test_cp03_openjarvis_sidecar tests.test_cp03_w02_model_bridge -v
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Build exact-head G3 receipt
        if: steps.source.outputs.changed == 'false'
        run: |
          python - <<'PY'
          import json, os
          model=json.load(open('/tmp/w02-10-model.json'))
          receipt={
            'schema_version':1,'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-10','gate':'G3','status':'PASS',
            'validated_head':os.environ['GITHUB_SHA'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'openjarvis_commit':os.environ['OPENJARVIS_PIN'],'engine':'llamacpp','runtime_commit':os.environ['LLAMACPP_PIN'],'model_id':'qwen3:0.6b',
            'artifact_filename':model['artifact_filename'],'artifact_size_bytes':model['observed_size_bytes'],'artifact_sha256':model['observed_sha256'],
            'pipeline':['rust','protobuf','openjarvis-sidecar','openjarvis-native-engine','llama.cpp','qwen3:0.6b'],
            'correlated_chunk_terminal':True,'invalid_input_pre_engine_test':'PASS','runtime_executed':True,'model_executions':1,
            'provider_egress_executions':0,'tool_executions':0,'streaming_executions':0,'parity_promotions':0,'verified_capabilities':0,
            'global_denominator':7565,'openjarvis_obligations':646,'w02_proof_units':47,
          }
          open('/tmp/w02-10-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Exact-head durable transition
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python sessions/20260921-w02-unary-inference/finalize.py --receipt /tmp/w02-10-receipt.json
          python scripts/context/build_context_pack.py
          python -m unittest tests.test_cp03_w02_plan -v
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          plan=json.load(open('iterations/03/waves/CP03-W02/TASK_GRAPH.json')); tasks={x['id']:x for x in plan['tasks']}
          assert plan['first_executable_task']=='W02-11'
          assert tasks['W02-10']['status']=='COMPLETE' and tasks['W02-10']['proof']
          assert tasks['W02-11']['status']=='READY' and not tasks['W02-11']['proof']
          assert all(tasks[x]['status']=='BLOCKED' for x in ('W02-12','W02-13','W02-14'))
          assert plan['global_denominator']==7565 and plan['openjarvis_obligations']==646
          PY
          git diff --check
      - name: Restrict and CAS-persist W02-10 state
        if: steps.source.outputs.changed == 'false'
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          prefixes=('evidence/cp03/cp03-w02/W02-10/','sessions/20260921-w02-unary-inference/')
          exact={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','tests/test_cp03_w02_plan.py','ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson','HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected={p for p in paths if p not in exact and not p.startswith(prefixes)}
          assert not unexpected, sorted(unexpected)
          required={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','tests/test_cp03_w02_plan.py','ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson','HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json'}
          assert not (required-paths), sorted(required-paths)
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json tests/test_cp03_w02_plan.py evidence/cp03/cp03-w02/W02-10 sessions/20260921-w02-unary-inference ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): complete W02-10 real unary inference'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921

  validate_pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only source and regression validation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1'
          python scripts/cp03/w02_unary_patch.py --check
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/contracts/sdk/python/gen" python -m unittest tests.test_cp03_w02_unary_inference tests.test_cp03_openjarvis_sidecar tests.test_cp03_w02_model_bridge -v
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
