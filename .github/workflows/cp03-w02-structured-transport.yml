name: CP03 W02 Structured Transport

on:
  push:
    branches: [wave/cp03/w02-structured-transport-20260921]
    paths:
      - '.github/workflows/cp03-w02-structured-transport.yml'
      - 'sessions/20260921-w02-structured-transport/**'
      - 'ledgers/CLAIM_LEDGER.ndjson'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cp03-w02-structured-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile durable W02-13 residual and claim
        run: |
          set -euo pipefail
          git fetch origin main wave/cp03/w02-structured-output-20260921
          test "$(git rev-parse origin/main)" = 'c46aca03854e227e236f421d784c05e50691aee9'
          test "$(git merge-base HEAD origin/main)" = 'c46aca03854e227e236f421d784c05e50691aee9'
          test "$(git merge-base HEAD origin/wave/cp03/w02-structured-output-20260921)" = '17c80a1f87d4b38415d9d661fd51b584b1c62cbb'
          python - <<'PY'
          import json
          from pathlib import Path
          claim_path=Path('sessions/20260921-w02-structured-transport/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          extra='kernel/crates/clever-kernel/tests/inference_security.rs'
          scope_amended=False
          if extra not in claim['scope']:
              claim['scope'].append(extra)
              claim_path.write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
              scope_amended=True
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-13']['status']=='IN_PROGRESS'
          assert tasks['W02-13']['depends_on']==['W02-11']
          assert tasks['W02-11']['status']=='COMPLETE' and tasks['W02-11']['proof']
          assert tasks['W02-13']['proof'] and tasks['W02-13']['proof'][-1]['canonical_transport_exposure']=='NOT_RUN'
          assert tasks['W02-14']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          active=context['active_claims']
          if active not in ([], [{'claim_id':claim['claim_id'],'owner':claim['owner'],'status':'ACTIVE','wave_id':claim['wave_id']}]):
              raise SystemExit(f'conflicting active claims: {active!r}')
          ledger=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in ledger.read_text().splitlines() if line.strip()]
          matching=[row for row in rows if row.get('claim_id')==claim['claim_id']]
          latest=matching[-1].get('status') if matching else None
          if latest is None:
              row=dict(claim)
              row['event']='CLAIM'
              row['status']='ACTIVE'
              with ledger.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
              claim['status']='ACTIVE'
              claim_path.write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
          elif latest != 'ACTIVE':
              raise SystemExit(f'unexpected W02-13 transport claim state: {latest!r}')
          if scope_amended:
              event={
                  'schema_version':1,
                  'date':'2026-09-21',
                  'event':'SCOPE_AMENDED',
                  'claim_id':claim['claim_id'],
                  'canonical_task':'W02-13',
                  'checkpoint':'CP03',
                  'parent_wave':'CP03-W02',
                  'owner':claim['owner'],
                  'wave_id':claim['wave_id'],
                  'status':'ACTIVE',
                  'scope':[extra],
                  'coordination':'Compile-regression scope only: add the existing Rust inference-security fixture because additive InferenceConfig fields require explicit zero-value initialization. No security-policy semantic change, provider egress, parity promotion, denominator mutation, or W02-14 work.'
              }
              with ledger.open('a',encoding='utf-8') as handle:
                  handle.write(json.dumps(event,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: CAS persist active claim
        run: |
          set -euo pipefail
          if git diff --quiet -- sessions/20260921-w02-structured-transport/CLAIM.json ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md; then exit 0; fi
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-structured-transport-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-structured-transport/CLAIM.json ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'claim(cp03-w02): amend W02-13 compile-regression scope'
          git push origin HEAD:wave/cp03/w02-structured-transport-20260921
