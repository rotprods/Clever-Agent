name: CP03 W02 Control RED GREEN
on:
  push:
    branches: [wave/cp03/w02-control-guards]
    paths:
      - 'scripts/cp03/*control*'
      - 'kernel/crates/clever-kernel/tests/control_guards.rs'
      - 'kernel/crates/clever-kernel/tests/fixtures/control_guard_peer.py'
      - 'tests/test_control_guard_gate.py'
      - '.github/workflows/cp03-w02-control-repair.yml'
permissions:
  contents: read
concurrency:
  group: w02-control-repair
  cancel-in-progress: false
jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: test-canary-not-a-real-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Boot and claim before product mutation
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/cp03/record_control_guards.py begin
          python -m pip install -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Reproduce runtime failures then repair and retest
        run: python scripts/cp03/control_guard_gate.py --repair
      - name: Build exact native registry lane
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f scripts/cp03/Dockerfile.baseline -t clever-control-base /tmp/openjarvis
          mkdir -p /tmp/sidecar-build
          docker build --build-arg BASE_IMAGE=clever-control-base -f "$PWD/scripts/cp03/Dockerfile.openjarvis-sidecar" -t clever-control-native /tmp/sidecar-build
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CLEVER_OPENJARVIS_IMAGE=clever-control-native" >> "$GITHUB_ENV"
      - name: Mandatory real pinned native test
        run: python scripts/cp03/control_guard_gate.py --native
      - name: Persist scoped evidence and retest task transition
        run: |
          python scripts/cp03/record_control_guards.py finish
          python -m unittest discover -s tests -p 'test_cp03_w02_plan.py' -v
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python -m scripts.contracts.generated_manifest --check
          git diff --check
      - name: Retain successful and failing logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w02-control-red-green-${{ github.sha }}
          include-hidden-files: true
          path: .cache/control-guards/
          if-no-files-found: error
      - name: Commit only approved slice with compare-and-swap guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          exact={'kernel/crates/clever-kernel/src/adapter.rs','kernel/crates/clever-kernel/tests/adapter_supervisor.rs','kernel/crates/clever-kernel/tests/control_guards.rs','adapters/openjarvis/sidecar.py','tests/test_cp03_w02_plan.py','iterations/03/waves/CP03-W02/TASK_GRAPH.json','TASKS.md','HANDOFF.md','.github/workflows/cp03-w02-control-repair.yml'}
          prefixes=('ledgers/', '.agentic/context/', 'evidence/cp03/cp03-w02/control-guards/', 'graphs/cp03/', 'sessions/20260907-w02-control-guards/')
          raw=subprocess.check_output(['git','status','--porcelain','-z']).decode().split('\0')
          for item in raw:
              if not item: continue
              path=item[3:]
              assert path in exact or path.startswith(prefixes), f'out-of-scope mutation: {path}'
          PY
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-control-guards | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f evidence/cp03/cp03-w02/control-guards/*.log
          git commit -m 'fix(cp03): prove atomic correlated control guards with RED GREEN evidence'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:wave/cp03/w02-control-guards
