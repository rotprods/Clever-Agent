name: CP03 W02 Scope Lock Finalize

on:
  push:
    branches: [wave/cp03/w02-scope-lock]
    paths:
      - 'scripts/cp03/finalize_w02_scope_lock.py'
      - '.github/workflows/cp03-w02-scope-lock-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w02-scope-lock-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Re-prove scope lock before transition
        run: |
          python scripts/cp03/w02_scope.py --write
          python -m scripts.cp03.w02_facets --write
          python -m scripts.cp03.w02_scope_lock
          python -m unittest discover -s tests -p 'test_cp03_w02_scope_lock.py' -v
      - name: Apply evidence-backed subordinate transition
        run: |
          python -m scripts.cp03.finalize_w02_scope_lock
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Restrict durable mutation surface
        run: |
          python - <<'PY'
          import subprocess
          allowed={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/CLAIM_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}
          raw=subprocess.check_output(['git','status','--porcelain=v1','-unormal'],text=True).splitlines()
          paths={line[3:] for line in raw if line}
          assert paths <= allowed, f'out-of-scope finalizer mutation: {sorted(paths-allowed)}'
          assert paths, 'finalizer produced no durable transition'
          PY
      - name: Compare-and-swap commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-scope-lock | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): persist K=47 scope lock and open W02-02'
          git push origin HEAD:wave/cp03/w02-scope-lock
