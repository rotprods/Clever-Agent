name: CP03 W02 Structured Transport Scope Amendment

on:
  push:
    branches:
      - wave/cp03-w02-structured-typed-transport-20260921

permissions:
  contents: write

concurrency:
  group: cp03-w02-structured-typed-transport-scope
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Exact-head guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-typed-transport-20260921 | cut -f1)" = "$GITHUB_SHA"
      - name: Persist scope amendment and WORK_STARTED
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          claim_id = "CLAIM-CP03-W02-STRUCTURED-20260921"
          wave_id = "CP03-W02-STRUCTURED-20260921"
          additions = [
              "contracts/proto/clever/v1/inference.proto",
              "contracts/jsonschema/inference.schema.json",
              "contracts/sdk/python/gen/**",
              "contracts/sdk/typescript/src/gen/**",
              "contracts/sdk/rust/src/gen/**",
              "contracts/sdk/swift/Sources/CleverContracts/Gen/**",
              "contracts/generated_manifest.json",
              "adapters/openjarvis/sidecar.py",
              "kernel/crates/clever-kernel/src/adapter.rs",
              "kernel/crates/clever-kernel/tests/adapter_supervisor.rs",
              "kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py",
              "tests/test_cp03_openjarvis_sidecar.py",
              "tests/test_cp03_w02_inference_contract.py",
              "tests/test_cp03_w02_structured_transport.py",
              "docs/adr/ADR-CP03-W02-013-STRUCTURED-TRANSPORT.md",
              "scripts/cp03/finalize_w02_structured_transport.py",
          ]
          claim_path = Path("sessions/20260921-w02-structured/CLAIM.json")
          claim = json.loads(claim_path.read_text(encoding="utf-8"))
          if claim.get("claim_id") != claim_id or claim.get("status") != "ACTIVE":
              raise SystemExit("canonical W02-13 claim is not ACTIVE")
          scope = list(claim.get("scope", []))
          for item in additions:
              if item not in scope:
                  scope.append(item)
          claim["scope"] = scope
          claim["transport_base_head"] = "2b1c6d19ae1e6cee08381c993855dfcd813ddd68"
          claim["transport_branch"] = "wave/cp03-w02-structured-typed-transport-20260921"
          claim_path.write_text(json.dumps(claim, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          claim_ledger = Path("ledgers/CLAIM_LEDGER.ndjson")
          claim_text = claim_ledger.read_text(encoding="utf-8")
          marker = '"event":"SCOPE_AMENDED","owner":"chatgpt-gpt-5.6-sol","parent_wave":"CP03-W02","schema_version":1,"scope":["contracts/proto/clever/v1/inference.proto"'
          if marker not in claim_text:
              row = {
                  "canonical_task": "W02-13",
                  "checkpoint": "CP03",
                  "claim_id": claim_id,
                  "coordination": "W02-13 canonical typed transport only. Extend the inference wire additively so validated structured JSON and assembled model-emitted tool calls cross AdapterFrame/sidecar/kernel as inert typed data. No tool execution, W02-14 fallback/retry, provider egress, parity promotion, denominator mutation, or W02 closure without exact-head G4 evidence.",
                  "date": "2026-09-21",
                  "event": "SCOPE_AMENDED",
                  "owner": "chatgpt-gpt-5.6-sol",
                  "parent_wave": "CP03-W02",
                  "schema_version": 1,
                  "scope": additions,
                  "status": "ACTIVE",
                  "wave_id": wave_id,
              }
              with claim_ledger.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")

          run_log = Path("ledgers/RUN_LOG.ndjson")
          run_text = run_log.read_text(encoding="utf-8")
          event_id = "RUN-W02-STRUCTURED-TRANSPORT-20260921-START"
          if event_id not in run_text:
              row = {
                  "base_head": "2b1c6d19ae1e6cee08381c993855dfcd813ddd68",
                  "branch": "wave/cp03-w02-structured-typed-transport-20260921",
                  "canonical_task": "W02-13",
                  "checkpoint": "CP03",
                  "date": "2026-09-21",
                  "event": "WORK_STARTED",
                  "event_id": event_id,
                  "goal_id": "CLEVER-JARVIS-001",
                  "iteration": "I03",
                  "parity_promotions": 0,
                  "schema_version": 1,
                  "support_wave": wave_id,
                  "wave_id": "CP03-W02",
              }
              with run_log.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          git diff --check
      - name: Scope-only mutation guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              "ledgers/CLAIM_LEDGER.ndjson",
              "ledgers/RUN_LOG.ndjson",
              "sessions/20260921-w02-structured/CLAIM.json",
          }
          changed = {line[3:] for line in subprocess.check_output(["git", "status", "--porcelain=v1", "-uall"], text=True).splitlines() if line}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"scope amendment mutated unexpected files: {sorted(unexpected)}")
          PY
      - name: CAS persist scope amendment
        run: |
          set -euo pipefail
          if git diff --quiet && test -z "$(git status --porcelain=v1 -uall)"; then
            echo "scope amendment already durable"
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-typed-transport-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson sessions/20260921-w02-structured/CLAIM.json
          git commit -m 'coord(cp03-w02): amend W02-13 typed transport scope'
          git push origin HEAD:wave/cp03-w02-structured-typed-transport-20260921
