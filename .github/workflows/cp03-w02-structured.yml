name: CP03 W02 Structured Scope Amend

on:
  push:
    branches:
      - wave/cp03-w02-structured-20260921

permissions:
  contents: write

concurrency:
  group: cp03-w02-structured-scope-amend
  cancel-in-progress: false

jobs:
  amend-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact frontier and active claims
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-20260921 | cut -f1)" = "$GITHUB_SHA"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-13']['status']=='IN_PROGRESS'
          assert tasks['W02-11']['status']=='COMPLETE'
          assert tasks['W02-14']['status']=='BLOCKED'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in rows:
              if row.get('claim_id') and row.get('status'):
                  latest[row['claim_id']]=row['status']
          active=[cid for cid,status in latest.items() if status=='ACTIVE']
          assert active==['CLAIM-CP03-W02-STRUCTURED-20260921'], active
          PY
      - name: Amend W02-13 claim before contract mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          claim_path=Path('sessions/20260921-w02-structured/CLAIM.json')
          ledger_path=Path('ledgers/CLAIM_LEDGER.ndjson')
          claim=json.loads(claim_path.read_text())
          additions=[
            'contracts/proto/clever/v1/inference.proto',
            'contracts/proto/clever/v1/adapter.proto',
            'contracts/sdk/python/gen/**',
            'contracts/sdk/typescript/src/gen/**',
            'contracts/sdk/rust/src/gen/**',
            'contracts/sdk/swift/Sources/CleverContracts/Gen/**',
            'contracts/fixtures/wire/**',
            'contracts/generated_manifest.json',
            'scripts/contracts/build_wire_fixture.py',
            'tests/test_cp03_w02_inference_contract.py',
            'docs/adr/ADR-CP03-W02-013-TYPED-STRUCTURED-TRANSPORT.md',
          ]
          scope=list(claim['scope'])
          for item in additions:
              if item not in scope:
                  scope.append(item)
          claim['scope']=scope
          claim['coordination']='W02-13 only. Scope amended before mutation to add canonical typed AdapterFrame transport and generated bindings/fixtures. Model-emitted tool calls and structured output remain inert data; no execution authority, provider egress, W02-14 fallback, parity promotion, denominator mutation or W02 closure.'
          claim['scope_amended_head']=__import__('os').environ['GITHUB_SHA']
          claim_path.write_text(json.dumps(claim,indent=2,sort_keys=True)+'\n')
          rows=ledger_path.read_text().splitlines()
          if not any('CLAIM-CP03-W02-STRUCTURED-20260921' in row and 'SCOPE_AMENDED' in row and 'contracts/proto/clever/v1/inference.proto' in row for row in rows):
              event={
                'canonical_task':'W02-13','checkpoint':'CP03','claim_id':'CLAIM-CP03-W02-STRUCTURED-20260921',
                'coordination':claim['coordination'],'date':'2026-09-22','event':'SCOPE_AMENDED','owner':'chatgpt-gpt-5.6-sol',
                'parent_wave':'CP03-W02','project_id':'CLEVER-JARVIS-001','schema_version':1,'scope':additions,
                'status':'ACTIVE','wave_id':'CP03-W02-STRUCTURED-20260921'
              }
              with ledger_path.open('a',encoding='utf-8') as fh:
                  fh.write(json.dumps(event,separators=(',',':'),sort_keys=True)+'\n')
          PY
          git diff --check
      - name: Validate amendment and CAS persist
        run: |
          set -euo pipefail
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-20260921 | cut -f1)" = "$GITHUB_SHA"
          changed="$(git status --porcelain=v1 | sed 's/^...//' | sort)"
          expected=$'ledgers/CLAIM_LEDGER.ndjson\nsessions/20260921-w02-structured/CLAIM.json'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson sessions/20260921-w02-structured/CLAIM.json
          git commit -m 'coord(cp03-w02): amend W02-13 typed transport scope'
          git push origin HEAD:wave/cp03-w02-structured-20260921
