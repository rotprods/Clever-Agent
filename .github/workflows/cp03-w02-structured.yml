name: CP03 W02 Structured Output

on:
  push:
    branches:
      - wave/cp03-w02-structured-20260921
      - wave/cp03-w02-structured-transport-20260922
  pull_request:
    branches: [main]
    paths:
      - 'contracts/proto/clever/v1/inference.proto'
      - 'contracts/proto/clever/v1/adapter.proto'
      - 'contracts/sdk/**'
      - 'contracts/generated_manifest.json'
      - 'adapters/openjarvis/sidecar.py'
      - 'adapters/openjarvis/streaming_inference.py'
      - 'adapters/openjarvis/structured_output.py'
      - 'tests/test_cp03_w02_structured_transport.py'
      - 'tests/test_cp03_w02_structured_output.py'
      - 'tests/test_cp03_w02_streaming.py'
      - 'tests/test_cp03_w02_cancellation.py'
      - 'tests/test_cp03_w02_inference_contract.py'
      - 'tests/test_cp03_adapter_contract.py'
      - 'tests/test_cp03_w02_plan.py'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
      - 'evidence/cp03/cp03-w02/W02-13/**'
      - 'sessions/20260921-w02-structured/**'
      - 'ledgers/**'
      - 'STATE.md'
      - 'HANDOFF.md'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
      - '.github/workflows/cp03-w02-structured.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-structured-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope_amendment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-transport-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head pre-amendment guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-13']['depends_on'])
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          assert claim['claim_id']=='CLAIM-CP03-W02-STRUCTURED-20260921' and claim['status']=='ACTIVE'
          PY
      - name: Confirm active claim covers typed transport
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          required={
            'contracts/proto/clever/v1/inference.proto',
            'contracts/proto/clever/v1/adapter.proto',
            'contracts/sdk/python/gen/**',
            'contracts/sdk/typescript/src/gen/**',
            'contracts/sdk/rust/src/gen/**',
            'contracts/sdk/swift/Sources/CleverContracts/Gen/**',
            'contracts/generated_manifest.json',
            'adapters/openjarvis/sidecar.py',
            'tests/test_cp03_w02_structured_transport.py',
            'tests/test_cp03_w02_inference_contract.py',
            'tests/test_cp03_adapter_contract.py',
          }
          missing=sorted(required-set(claim.get('scope', [])))
          assert not missing, f'active W02-13 claim missing typed-transport scope: {missing}'
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in rows:
              if row.get('claim_id') and row.get('status'):
                  latest[row['claim_id']]=row['status']
          conflicts=sorted(cid for cid,status in latest.items() if status=='ACTIVE' and cid!='CLAIM-CP03-W02-STRUCTURED-20260921')
          assert not conflicts, f'conflicting active claims: {conflicts}'
          PY

  repair_transport:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-transport-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.72.0'
      - name: Exact-head guard and apply RED fixes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch anchor, found {count}')
              p.write_text(text.replace(old,new,1), encoding='utf-8')

          old_regex='self.assertIsNone(re.search(r"metadata.*(tool|structured)|(?:tool|structured).*metadata", inference, re.I | re.S))'
          new_regex='self.assertIsNone(re.search(r"(?mi)^\\s*(?:optional\\s+)?(?:string|bytes|map<[^>]+>)\\s+\\w*metadata\\w*\\s*=", inference))'
          for path in ('tests/test_cp03_w02_structured_output.py','tests/test_cp03_w02_structured_transport.py'):
              replace_once(path, old_regex, new_regex)

          sidecar='adapters/openjarvis/sidecar.py'
          replace_once(
              sidecar,
              'from adapters.openjarvis.streaming_inference import execute_stream\nfrom adapters.openjarvis.unary_inference import UnaryInferenceRejected, execute_unary\n',
              'from adapters.openjarvis.structured_output import ToolCallData\nfrom adapters.openjarvis.streaming_inference import execute_stream\nfrom adapters.openjarvis.unary_inference import UnaryInferenceRejected, execute_unary\n',
          )
          helpers='''def _response_schema(request: inference_pb2.InferenceRequest) -> dict[str, object] | None:\n    if not request.HasField("response_schema_json"):\n        return None\n    raw = request.response_schema_json.strip()\n    if not raw:\n        return None\n    if len(raw.encode("utf-8")) > 64 * 1024:\n        raise UnaryInferenceRejected(\n            inference_pb2.INFERENCE_ERROR_CODE_INVALID_REQUEST,\n            "response_schema_json exceeds the W02-13 64 KiB bound",\n            retryable=False,\n        )\n    try:\n        value = json.loads(raw)\n    except json.JSONDecodeError as exc:\n        raise UnaryInferenceRejected(\n            inference_pb2.INFERENCE_ERROR_CODE_INVALID_REQUEST,\n            f"response_schema_json is not valid JSON: {exc.msg}",\n            retryable=False,\n        ) from exc\n    if not isinstance(value, dict):\n        raise UnaryInferenceRejected(\n            inference_pb2.INFERENCE_ERROR_CODE_INVALID_REQUEST,\n            "response_schema_json must encode a JSON object schema",\n            retryable=False,\n        )\n    return value\n\n\ndef _tool_call_frame(request: adapter_pb2.AdapterFrame, call: ToolCallData) -> adapter_pb2.AdapterFrame:\n    native = request.inference_request\n    body = inference_pb2.InferenceToolCall(\n        contract_version=common_pb2.ContractVersion(major=1, minor=2),\n        request_id=native.request_id,\n        attempt_id=native.attempt_id,\n        index=call.index,\n        call_id=call.call_id,\n        name=call.name,\n        arguments_json=call.arguments_json,\n    )\n    return _frame(\n        f"inference-tool-call:{request.frame_id}:{call.index}",\n        "inference_tool_call",\n        body,\n        correlation_id=request.frame_id,\n    )\n\n\ndef _structured_output_frame(request: adapter_pb2.AdapterFrame, value: object) -> adapter_pb2.AdapterFrame:\n    native = request.inference_request\n    try:\n        encoded = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)\n    except (TypeError, ValueError) as exc:\n        raise UnaryInferenceRejected(\n            inference_pb2.INFERENCE_ERROR_CODE_INTERNAL,\n            f"validated structured output is not canonical JSON data: {exc}",\n            retryable=False,\n        ) from exc\n    body = inference_pb2.InferenceStructuredOutput(\n        contract_version=common_pb2.ContractVersion(major=1, minor=2),\n        request_id=native.request_id,\n        attempt_id=native.attempt_id,\n        json_value=encoded,\n    )\n    return _frame(\n        f"inference-structured-output:{request.frame_id}",\n        "inference_structured_output",\n        body,\n        correlation_id=request.frame_id,\n    )\n'''
          replace_once(
              sidecar,
              '    getattr(frame, body_name).CopyFrom(body)\n    return frame\n\n\ndef hello_frame() -> adapter_pb2.AdapterFrame:\n',
              '    getattr(frame, body_name).CopyFrom(body)\n    return frame\n\n\n'+helpers+'\n\ndef hello_frame() -> adapter_pb2.AdapterFrame:\n',
          )
          replace_once(
              sidecar,
              '            "streaming-cancellation",\n        ],\n',
              '            "streaming-cancellation",\n            "structured-inference-transport",\n        ],\n',
          )
          replace_once(
              sidecar,
              '    def start_stream(request: adapter_pb2.AdapterFrame) -> bool:\n        native_request = request.inference_request\n        state = coordinator.begin(native_request.request_id, native_request.attempt_id, request.frame_id)\n',
              '    def start_stream(request: adapter_pb2.AdapterFrame) -> bool:\n        native_request = request.inference_request\n        try:\n            response_schema = _response_schema(native_request)\n        except UnaryInferenceRejected as exc:\n            inference_error(request, exc.code, str(exc))\n            return False\n        state = coordinator.begin(native_request.request_id, native_request.attempt_id, request.frame_id)\n',
          )
          replace_once(
              sidecar,
              '                execute_stream(\n                    native_request,\n                    emit_chunk=emit_chunk,\n                    emit_terminal=emit_terminal,\n                    cancel_requested=state.cancel_requested.is_set,\n                    wait_for_cancel_ack=state.cancel_acknowledged.wait,\n                )\n',
              '                execute_stream(\n                    native_request,\n                    emit_chunk=emit_chunk,\n                    emit_terminal=emit_terminal,\n                    emit_tool_call=lambda call: send(_tool_call_frame(request, call)),\n                    response_schema=response_schema,\n                    emit_structured_output=(\n                        (lambda value: send(_structured_output_frame(request, value)))\n                        if response_schema is not None\n                        else None\n                    ),\n                    cancel_requested=state.cancel_requested.is_set,\n                    wait_for_cancel_ack=state.cancel_acknowledged.wait,\n                )\n',
          )
          replace_once(
              sidecar,
              '            if native_request.HasField("config") and native_request.config.stream:\n                start_stream(request)\n                continue\n            if coordinator.busy():\n',
              '            if native_request.HasField("config") and native_request.config.stream:\n                start_stream(request)\n                continue\n            try:\n                response_schema = _response_schema(native_request)\n            except UnaryInferenceRejected as exc:\n                inference_error(request, exc.code, str(exc))\n                continue\n            if response_schema is not None:\n                inference_error(\n                    request,\n                    inference_pb2.INFERENCE_ERROR_CODE_INVALID_REQUEST,\n                    "response_schema_json is supported only by the streaming W02-13 lane",\n                )\n                continue\n            if coordinator.busy():\n',
          )
          PY
      - name: Regenerate canonical SDK bindings
        run: |
          set -euo pipefail
          buf format -d --exit-code
          buf lint
          buf generate
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
          python -m scripts.contracts.generated_manifest
          git diff --check
      - name: Prove typed transport and regressions before persistence
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m py_compile adapters/openjarvis/sidecar.py adapters/openjarvis/structured_output.py adapters/openjarvis/streaming_inference.py tests/test_cp03_w02_structured_output.py tests/test_cp03_w02_structured_transport.py
          python -m unittest -v tests.test_cp03_w02_structured_output tests.test_cp03_w02_structured_transport tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_adapter_contract tests.test_cp03_w02_plan
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.generated_manifest --check
          cargo test --locked --manifest-path contracts/sdk/rust/Cargo.toml
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cd contracts/sdk/typescript
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Prove durable invariants remain frozen
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          PY
      - name: Restrict implementation mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_prefixes=(
            'contracts/sdk/python/gen/',
            'contracts/sdk/typescript/src/gen/',
            'contracts/sdk/rust/src/gen/',
            'contracts/sdk/swift/Sources/CleverContracts/Gen/',
          )
          allowed_exact={
            'contracts/generated_manifest.json',
            'adapters/openjarvis/sidecar.py',
            'tests/test_cp03_w02_structured_output.py',
            'tests/test_cp03_w02_structured_transport.py',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected={path for path in paths if path not in allowed_exact and not path.startswith(allowed_prefixes)}
          assert not unexpected, f'out-of-scope W02-13 transport mutation: {sorted(unexpected)}'
          PY
      - name: CAS persist typed transport implementation
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adapters/openjarvis/sidecar.py tests/test_cp03_w02_structured_output.py tests/test_cp03_w02_structured_transport.py contracts/sdk/python/gen contracts/sdk/typescript/src/gen contracts/sdk/rust/src/gen contracts/sdk/swift/Sources/CleverContracts/Gen contracts/generated_manifest.json
          git commit -m 'feat(cp03-w02): wire typed structured sidecar transport'
          git push origin HEAD:wave/cp03-w02-structured-transport-20260922

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
      - name: Compile and test W02-13 typed transport
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m py_compile adapters/openjarvis/sidecar.py adapters/openjarvis/structured_output.py adapters/openjarvis/streaming_inference.py tests/test_cp03_w02_structured_output.py tests/test_cp03_w02_structured_transport.py
          python -m unittest -v tests.test_cp03_w02_structured_output tests.test_cp03_w02_structured_transport tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_adapter_contract tests.test_cp03_w02_plan
          git diff --check
      - name: Generated SDK regressions
        run: |
          set -euo pipefail
          python -m scripts.contracts.validate_manifest
          python -m scripts.contracts.generated_manifest --check
          cargo test --locked --manifest-path contracts/sdk/rust/Cargo.toml
          cd contracts/sdk/typescript
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Kernel security and library gauntlet
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Durable-state parity and ContextPack gauntlet
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
      - name: Assert frozen denominators and legal frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          if tasks['W02-13']['status']=='COMPLETE':
              assert tasks['W02-13']['proof']
              assert graph['first_executable_task']=='W02-14'
              assert tasks['W02-14']['status'] in {'READY','IN_PROGRESS'} and not tasks['W02-14']['proof']
          else:
              assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
              assert graph['first_executable_task']=='W02-13'
              assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          PY

  swift_transport:
    needs: repair_transport
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-transport-20260922'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Swift generated-contract regression
        run: swift test --package-path contracts/sdk/swift

  finalize_transport:
    needs: [repair_transport, verify, swift_transport]
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-transport-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head completion guard and re-prove G4
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
          python -m unittest -v tests.test_cp03_w02_structured_output tests.test_cp03_w02_structured_transport tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_adapter_contract tests.test_cp03_w02_plan
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
          assert tasks['W02-11']['status']=='COMPLETE' and tasks['W02-11']['proof']
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert claim['claim_id']=='CLAIM-CP03-W02-STRUCTURED-20260921' and claim['status']=='ACTIVE'
          PY
      - name: Persist W02-13 completion state in working tree
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          DATE='2026-09-22'
          TASK='W02-13'
          NEXT='W02-14'
          CLAIM='CLAIM-CP03-W02-STRUCTURED-20260921'
