name: CP03 W02 Structured Transport Dependency Scope

on:
  push:
    branches:
      - wave/cp03-w02-structured-typed-transport-20260921

permissions:
  contents: write

concurrency:
  group: cp03-w02-structured-typed-transport-dependency-scope
  cancel-in-progress: false

jobs:
  amend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Exact-head guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-typed-transport-20260921 | cut -f1)" = "$GITHUB_SHA"
      - name: Amend generated-code regression scope before mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          claim_id = "CLAIM-CP03-W02-STRUCTURED-20260921"
          dependency = "kernel/crates/clever-kernel/tests/inference_security.rs"
          claim_path = Path("sessions/20260921-w02-structured/CLAIM.json")
          claim = json.loads(claim_path.read_text(encoding="utf-8"))
          if claim.get("claim_id") != claim_id or claim.get("status") != "ACTIVE":
              raise SystemExit("canonical W02-13 claim is not ACTIVE")
          scope = list(claim.get("scope", []))
          if dependency not in scope:
              scope.append(dependency)
              claim["scope"] = scope
              claim_path.write_text(json.dumps(claim, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          ledger = Path("ledgers/CLAIM_LEDGER.ndjson")
          marker = "W02-13 generated Rust regression dependency scope"
          ledger_text = ledger.read_text(encoding="utf-8")
          if marker not in ledger_text:
              row = {
                  "canonical_task": "W02-13",
                  "checkpoint": "CP03",
                  "claim_id": claim_id,
                  "coordination": marker + ": inference.proto additive fields require updating the existing inference_security.rs InferenceConfig literal so the kernel security gauntlet remains compilable. No behavioral expansion, provider egress, tool execution, parity promotion, denominator mutation, or W02-14 work.",
                  "date": "2026-09-22",
                  "event": "SCOPE_AMENDED",
                  "owner": "chatgpt-gpt-5.6-sol",
                  "parent_wave": "CP03-W02",
                  "project_id": "CLEVER-JARVIS-001",
                  "schema_version": 1,
                  "scope": [dependency],
                  "status": "ACTIVE",
                  "wave_id": "CP03-W02-STRUCTURED-20260921",
              }
              with ledger.open("a", encoding="utf-8") as handle:
                  handle.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          git diff --check
      - name: Scope-only mutation guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={"sessions/20260921-w02-structured/CLAIM.json","ledgers/CLAIM_LEDGER.ndjson"}
          changed={line[3:] for line in subprocess.check_output(["git","status","--porcelain=v1","-uall"],text=True).splitlines() if line}
          unexpected=changed-allowed
          if unexpected:
              raise SystemExit(f"unexpected dependency-scope mutation: {sorted(unexpected)}")
          PY
      - name: CAS persist dependency scope
        run: |
          set -euo pipefail
          if git diff --quiet && test -z "$(git status --porcelain=v1 -uall)"; then
            echo "dependency scope already durable"
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-typed-transport-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-structured/CLAIM.json ledgers/CLAIM_LEDGER.ndjson
          git commit -m 'coord(cp03-w02): add generated Rust regression scope'
          git push origin HEAD:wave/cp03-w02-structured-typed-transport-20260921
