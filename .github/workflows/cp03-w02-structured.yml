name: CP03 W02 Structured Output

on:
  push:
    branches:
      - wave/cp03-w02-structured-20260921
      - wave/cp03-w02-structured-transport-20260922
  pull_request:
    branches: [main]
    paths:
      - 'contracts/proto/clever/v1/inference.proto'
      - 'contracts/proto/clever/v1/adapter.proto'
      - 'contracts/sdk/**'
      - 'contracts/generated_manifest.json'
      - 'adapters/openjarvis/sidecar.py'
      - 'adapters/openjarvis/streaming_inference.py'
      - 'adapters/openjarvis/structured_output.py'
      - 'tests/test_cp03_w02_structured_transport.py'
      - 'tests/test_cp03_w02_structured_output.py'
      - 'tests/test_cp03_w02_streaming.py'
      - 'tests/test_cp03_w02_cancellation.py'
      - 'tests/test_cp03_w02_inference_contract.py'
      - 'tests/test_cp03_adapter_contract.py'
      - 'tests/test_cp03_w02_plan.py'
      - 'scripts/cp03/finalize_w02_structured.py'
      - 'iterations/03/waves/CP03-W02/TASK_GRAPH.json'
      - 'evidence/cp03/cp03-w02/W02-13/**'
      - 'sessions/20260921-w02-structured/**'
      - 'ledgers/**'
      - 'STATE.md'
      - 'HANDOFF.md'
      - '.agentic/context/CURRENT_CONTEXT.json'
      - '.agentic/context/CURRENT_CONTEXT.md'
      - '.github/workflows/cp03-w02-structured.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-structured-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope_amendment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-transport-20260922'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head pre-amendment guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-13']['depends_on'])
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          assert claim['claim_id']=='CLAIM-CP03-W02-STRUCTURED-20260921' and claim['status']=='ACTIVE'
          PY
      - name: Amend active claim before new canonical surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          claim_path=Path('sessions/20260921-w02-structured/CLAIM.json')
          claim=json.loads(claim_path.read_text())
          required=[
            'contracts/proto/clever/v1/inference.proto',
            'contracts/proto/clever/v1/adapter.proto',
            'contracts/sdk/python/gen/**',
            'contracts/sdk/typescript/src/gen/**',
            'contracts/sdk/rust/src/gen/**',
            'contracts/sdk/swift/Sources/CleverContracts/Gen/**',
            'contracts/generated_manifest.json',
            'adapters/openjarvis/sidecar.py',
            'tests/test_cp03_w02_structured_transport.py',
            'tests/test_cp03_w02_inference_contract.py',
            'tests/test_cp03_adapter_contract.py',
          ]
          if all(path in claim.get('scope', []) for path in required):
              raise SystemExit(0)
          claim['scope']=list(dict.fromkeys([*claim.get('scope', []), *required]))
          claim['coordination']=(
            'W02-13 only. Existing structured decoder/validator claim expanded before mutation to the canonical typed '
            'AdapterFrame/sidecar transport, generated SDK bindings and transport tests. Tool calls remain inert model data; '
            'structured output must be schema-validated before transport. Zero shell/MCP/browser/tool execution, no W02-14 '
            'fallback/retry implementation, no provider egress, no parity promotion, no denominator mutation, no W02 closure. '
            'State transition remains exact-head evidence gated and may open only W02-14.'
          )
          claim['scope_amended_at']='2026-09-22'
          claim['scope_amended_from_head']=os.environ['GITHUB_SHA']
          claim_path.write_text(json.dumps(claim, indent=2, sort_keys=True)+'\n')

          amendment={
            'schema_version':1,'date':'2026-09-22','event':'SCOPE_AMENDED','project_id':'CLEVER-JARVIS-001',
            'checkpoint':'CP03','parent_wave':'CP03-W02','canonical_task':'W02-13',
            'claim_id':'CLAIM-CP03-W02-STRUCTURED-20260921','wave_id':'CP03-W02-STRUCTURED-20260921',
            'owner':'chatgpt-gpt-5.6-sol','status':'ACTIVE','scope':required,
            'coordination':'Typed AdapterFrame/sidecar transport + generated bindings only; no execution authority, fallback, provider egress, parity promotion, denominator mutation or W02 closure.',
            'base_head':os.environ['GITHUB_SHA'],
          }
          with Path('ledgers/CLAIM_LEDGER.ndjson').open('a', encoding='utf-8') as fh:
              fh.write(json.dumps(amendment, sort_keys=True, separators=(',',':'))+'\n')
          started={
            'schema_version':1,'date':'2026-09-22','event':'WORK_STARTED','event_id':'RUN-W02-STRUCTURED-TRANSPORT-START-20260922',
            'goal_id':'CLEVER-JARVIS-001','checkpoint':'CP03','iteration':'I03','parent_wave':'CP03-W02','canonical_task':'W02-13',
            'claim_id':'CLAIM-CP03-W02-STRUCTURED-20260921','branch':'wave/cp03-w02-structured-transport-20260922',
            'head':os.environ['GITHUB_SHA'],'owner':'chatgpt-gpt-5.6-sol',
            'objective':'Carry assembled tool calls and schema-validated structured output over explicit canonical AdapterFrame bodies as inert typed data.',
          }
          with Path('ledgers/RUN_LOG.ndjson').open('a', encoding='utf-8') as fh:
              fh.write(json.dumps(started, sort_keys=True, separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/validate_agentic_state.py
          git diff --check
      - name: CAS persist scope amendment
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-transport-20260922 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          allowed={
            'sessions/20260921-w02-structured/CLAIM.json','ledgers/CLAIM_LEDGER.ndjson','ledgers/RUN_LOG.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          assert paths <= allowed, f'out-of-scope scope-amendment mutation: {sorted(paths-allowed)}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260921-w02-structured/CLAIM.json ledgers/CLAIM_LEDGER.ndjson ledgers/RUN_LOG.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): amend W02-13 claim for typed transport'
          git push origin HEAD:wave/cp03-w02-structured-transport-20260922

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
      - name: Compile W02-13 Python slice
        run: |
          set -euo pipefail
          python -m py_compile adapters/openjarvis/structured_output.py adapters/openjarvis/streaming_inference.py tests/test_cp03_w02_structured_output.py scripts/cp03/finalize_w02_structured.py
          git diff --check
      - name: Targeted structured-output and tool-fragment tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_structured_output
      - name: Streaming cancellation and contract regression
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_w02_plan
      - name: Kernel security and library gauntlet
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Durable-state parity and ContextPack gauntlet
        run: |
          set -euo pipefail
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
      - name: Assert frozen denominators and no parity promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          assert goal['parity']['total']==7565
          assert goal['parity']['verified']==0
          assert tasks['W02-13']['status'] in {'READY','IN_PROGRESS'}
          assert tasks['W02-14']['status']=='BLOCKED'
          PY

  finalize_partial:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/wave/cp03-w02-structured-20260921'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1' 'jsonschema==4.25.1'
      - name: Exact-head and pre-transition guard
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-20260921 | cut -f1)" = "$GITHUB_SHA"
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          claim=json.loads(Path('sessions/20260921-w02-structured/CLAIM.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert tasks['W02-13']['status']=='READY' and not tasks['W02-13']['proof']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in tasks['W02-13']['depends_on'])
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert claim['claim_id']=='CLAIM-CP03-W02-STRUCTURED-20260921' and claim['status']=='ACTIVE'
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in rows:
              if row.get('claim_id') and row.get('status'):
                  latest[row['claim_id']]=row['status']
          active=[cid for cid,status in latest.items() if status=='ACTIVE' and cid!='CLAIM-CP03-W02-STRUCTURED-20260921']
          assert not active, f'conflicting active claims: {active}'
          PY
      - name: Re-prove W02-13 exact-head behavior
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_structured_output tests.test_cp03_w02_streaming tests.test_cp03_w02_cancellation tests.test_cp03_w02_inference_contract tests.test_cp03_openjarvis_sidecar tests.test_cp03_w02_plan
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Build exact-head partial evidence receipt
        run: |
          python - <<'PY'
          import json, os
          receipt={
            'project_id':'CLEVER-JARVIS-001','checkpoint':'CP03','parent_wave':'CP03-W02','task':'W02-13','gate':'G4','status':'PARTIAL_PASS',
            'validated_head':os.environ['GITHUB_SHA'],'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'red_run_id':35648078142,
            'fragmented_tool_arguments':'PASS','invalid_tool_arguments':'FAIL_CLOSED','malicious_tool_name_execution':'ZERO_EXECUTION',
            'structured_json_schema_validation':'PASS','invalid_structured_json':'FAIL_CLOSED','canonical_typed_transport':'NOT_RUN',
            'provider_egress_executions':0,'tool_executions':0,'parity_promotions':0,'verified_capabilities':0,
            'global_denominator':7565,'openjarvis_obligations':646,'w02_proof_units':47,
          }
          open('/tmp/w02-13-partial-receipt.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Exact-head partial transition and durable persistence
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-20260921 | cut -f1)" = "$GITHUB_SHA"
          python scripts/cp03/finalize_w02_structured.py --receipt /tmp/w02-13-partial-receipt.json
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          assert graph['first_executable_task']=='W02-13'
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646 and graph['w02_obligation_count']==47
          assert tasks['W02-13']['status']=='IN_PROGRESS' and not tasks['W02-13']['proof']
          assert tasks['W02-14']['status']=='BLOCKED' and not tasks['W02-14']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          assert 'D-0019' in context['accepted_decision_ids']
          assert 'EVID-W02-STRUCTURED-CORE-20260921' in context['evidence_ids']
          assert any(r['risk_id']=='RISK-0013' and r['status']=='OPEN' for r in context['open_risks'])
          assert any(c['claim_id']=='CLAIM-CP03-W02-STRUCTURED-20260921' and c['status']=='ACTIVE' for c in context['active_claims'])
          PY
          git diff --check
      - name: Restrict finalization mutation
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'evidence/cp03/cp03-w02/W02-13/partial_receipt.json','evidence/cp03/cp03-w02/W02-13/report.json',
            'sessions/20260921-w02-structured/RESULT.json','sessions/20260921-w02-structured/CLAIM.json',
            'ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson','ledgers/WAVE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson','ledgers/CLAIM_LEDGER.ndjson',
            'HANDOFF.md','STATE.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-13 finalization mutation: {sorted(unexpected)}'
          required={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/CLAIM_LEDGER.ndjson','HANDOFF.md','STATE.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}
          assert required.issubset(paths), f'missing durable W02-13 mutation: {sorted(required-paths)}'
          PY
      - name: CAS persist W02-13 partial state without opening W02-14
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-20260921 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git ls-remote origin refs/heads/wave/cp03-w02-structured-finalize-20260921 | cut -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c wave/cp03-w02-structured-finalize-20260921
          git add iterations/03/waves/CP03-W02/TASK_GRAPH.json evidence/cp03/cp03-w02/W02-13 sessions/20260921-w02-structured/RESULT.json sessions/20260921-w02-structured/CLAIM.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson ledgers/CLAIM_LEDGER.ndjson HANDOFF.md STATE.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): persist W02-13 structured core partial evidence'
          git push origin HEAD:wave/cp03-w02-structured-finalize-20260921
