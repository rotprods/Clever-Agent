name: CP03 W02 Scope Compiler

on:
  push:
    branches: [wave/cp03/w02-obligation-scope]
    paths:
      - 'scripts/cp03/w02_scope.py'
      - 'tests/test_cp03_w02_scope.py'
      - 'inventory/cp03/w02_scope_policy.json'
      - 'reports/cp03/w02_scope/**'
      - 'graphs/cp03/w02_scope/**'
      - 'sessions/20260907-w02-scope/**'
      - '.github/workflows/cp03-w02-scope.yml'
  pull_request:
    paths:
      - 'scripts/cp03/w02_scope.py'
      - 'tests/test_cp03_w02_scope.py'
      - 'inventory/cp03/w02_scope_policy.json'
      - 'reports/cp03/w02_scope/**'
      - 'graphs/cp03/w02_scope/**'
      - 'sessions/20260907-w02-scope/**'
      - '.github/workflows/cp03-w02-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild deterministic scope outputs
        run: python scripts/cp03/w02_scope.py --write
      - name: Run adversarial compiler suite
        run: python -m unittest discover -s tests -p 'test_cp03_w02_scope.py' -v
      - name: Recheck generated scope bytes
        run: python scripts/cp03/w02_scope.py --check
      - name: Verify canonical state remains unchanged
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_context_pack.py
          python scripts/context/validate_next_actions.py
          git diff --check
