name: CP03 W02 Control Guard Regression
on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'adapters/openjarvis/**'
      - 'scripts/cp03/*control*'
      - 'tests/test_control_guard_gate.py'
      - '.github/workflows/cp03-w02-control-check.yml'
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - 'adapters/openjarvis/**'
      - 'scripts/cp03/*control*'
      - '.github/workflows/cp03-w02-control-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-guard-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/contracts/sdk/python/gen
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      CLEVER_TEST_SECRET: test-canary-not-a-real-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Required contract runtime
        run: |
          python -m pip install -r contracts/sdk/python/requirements.txt
          echo "CLEVER_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Exact checked-out source regression
        run: python scripts/cp03/control_guard_gate.py
      - name: Build pinned OpenJarvis
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f scripts/cp03/Dockerfile.baseline -t clever-control-base /tmp/openjarvis
          mkdir -p /tmp/sidecar-build
          docker build --build-arg BASE_IMAGE=clever-control-base -f "$PWD/scripts/cp03/Dockerfile.openjarvis-sidecar" -t clever-control-native /tmp/sidecar-build
          echo "CLEVER_DOCKER_BIN=$(command -v docker)" >> "$GITHUB_ENV"
          echo "CLEVER_REPO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CLEVER_OPENJARVIS_IMAGE=clever-control-native" >> "$GITHUB_ENV"
      - name: Explicit native lane cannot silently skip
        run: python scripts/cp03/control_guard_gate.py --native
      - name: State parity and source immutability
        run: |
          python scripts/validate_agentic_state.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --exit-code
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w02-control-checked-${{ github.sha }}
          include-hidden-files: true
          path: .cache/control-guards/
          if-no-files-found: error
