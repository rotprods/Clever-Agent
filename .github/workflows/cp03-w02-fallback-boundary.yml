name: CP03 W02 Fallback Boundary

on:
  push:
    branches:
      - wave/cp03/w02-fallback-20260922
    paths:
      - '.github/workflows/cp03-w02-fallback-boundary.yml'
      - 'scripts/cp03/finalize_w02_fallback_boundary.py'
      - 'sessions/20260922-w02-fallback/CLAIM_AMENDMENT-003.json'
      - 'kernel/crates/clever-kernel/src/inference_fallback.rs'
      - 'kernel/crates/clever-kernel/src/lib.rs'
      - 'kernel/crates/clever-kernel/tests/inference_fallback.rs'

permissions:
  contents: write

concurrency:
  group: cp03-w02-fallback-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head, base and claim guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          claim_base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-fallback/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$claim_base"
          test "$(git merge-base HEAD origin/main)" = "$claim_base"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          active={row['claim_id']:row.get('status') for row in rows if row.get('claim_id') and row.get('status')}
          assert active.get('CLAIM-CP03-W02-FALLBACK-20260922')=='ACTIVE'
          assert not [claim_id for claim_id,status in active.items() if status=='ACTIVE' and claim_id!='CLAIM-CP03-W02-FALLBACK-20260922']
          assert any(
              row.get('claim_id')=='CLAIM-CP03-W02-FALLBACK-20260922'
              and row.get('event')=='SCOPE_AMENDED'
              and row.get('red_run_id')==35707116490
              and '.github/workflows/cp03-w02-fallback-boundary.yml' in row.get('scope',[])
              and 'scripts/cp03/finalize_w02_fallback_boundary.py' in row.get('scope',[])
              and row.get('status')=='ACTIVE'
              for row in rows
          )
          PY
      - name: Baseline durable-state guard
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Targeted fallback boundary tests
        run: |
          set -euo pipefail
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_fallback
      - name: Kernel regression and adversarial gauntlet
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Persist partial boundary evidence in working tree
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/cp03/finalize_w02_fallback_boundary.py
          python scripts/context/build_context_pack.py
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          assert graph['first_executable_task']=='W02-14'
          assert tasks['W02-14']['status']=='IN_PROGRESS' and not tasks['W02-14']['proof']
          assert tasks['W02-15']['status']=='BLOCKED' and not tasks['W02-15']['proof']
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          report=json.loads(Path('evidence/cp03/cp03-w02/W02-14/boundary_state_machine_report.json').read_text())
          assert report['supervised_boundary_state_machine']=='PASS'
          assert report['adapter_supervisor_f01_f02']=='NOT_RUN'
          assert report['openjarvis_sidecar_f01_f02']=='NOT_RUN'
          assert report['parity_promotions']==0
          PY
      - name: Restrict durable mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
            'sessions/20260922-w02-fallback/CLAIM.json',
            'sessions/20260922-w02-fallback/RESULT.json',
            'HANDOFF.md',
            'evidence/cp03/cp03-w02/W02-14/boundary_state_machine_report.json',
            'ledgers/EVIDENCE_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson',
            'ledgers/DECISION_LEDGER.ndjson',
            'ledgers/RISK_LEDGER.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-14 boundary persistence mutation: {sorted(unexpected)}'
          required={
            'sessions/20260922-w02-fallback/CLAIM.json',
            'sessions/20260922-w02-fallback/RESULT.json',
            'HANDOFF.md',
            'evidence/cp03/cp03-w02/W02-14/boundary_state_machine_report.json',
            'ledgers/EVIDENCE_LEDGER.ndjson',
            'ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson',
            'ledgers/DECISION_LEDGER.ndjson',
            'ledgers/RISK_LEDGER.ndjson',
            '.agentic/context/CURRENT_CONTEXT.json',
            '.agentic/context/CURRENT_CONTEXT.md',
          }
          missing=required-paths
          assert not missing, f'missing expected W02-14 boundary persistence delta: {sorted(missing)}'
          PY
      - name: CAS persist exact verified boundary state
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-fallback-20260922 | cut -f1)" = "$expected_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sessions/20260922-w02-fallback/CLAIM.json sessions/20260922-w02-fallback/RESULT.json HANDOFF.md evidence/cp03/cp03-w02/W02-14/boundary_state_machine_report.json ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): persist supervised fallback boundary evidence'
          git push origin HEAD:wave/cp03/w02-fallback-20260922
