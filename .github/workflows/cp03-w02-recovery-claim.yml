name: CP03 W02 Recovery Retest Claim

on:
  push:
    branches:
      - wave/cp03/w02-recovery-performance-20260922
    paths:
      - 'sessions/20260922-w02-recovery-performance/CLAIM.json'
      - '.github/workflows/cp03-w02-recovery-claim.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-recovery-claim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head, DAG and non-overlap guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-recovery-performance-20260922 | cut -f1)" = "$GITHUB_SHA"
          git fetch origin main
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-recovery-performance/CLAIM.json').read_text())
          assert claim['claim_id']=='CLAIM-CP03-W02-RECOVERY-PERF-20260922'
          assert claim['canonical_task']=='W02-16' and claim['status']=='ACTIVE'
          assert claim['base_head']=='4b8923973a3d6bb2a74d8d846e00db79c8aabec3'
          assert claim['dependencies']==['W02-15']
          rows=[json.loads(line) for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines() if line.strip()]
          latest={}
          for row in rows:
              latest[row['claim_id']]=row
          new_scope=set(claim['scope'])
          conflicts=[]
          for claim_id,row in latest.items():
              if row.get('status')!='ACTIVE' or claim_id==claim['claim_id']:
                  continue
              overlap=new_scope.intersection(row.get('scope',[]))
              if overlap:
                  conflicts.append((claim_id,sorted(overlap)))
          assert not conflicts, f'active overlapping claim(s): {conflicts}'
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-16'
          assert tasks['W02-16']['status']=='READY' and not tasks['W02-16']['proof']
          assert tasks['W02-16']['depends_on']==['W02-15']
          assert tasks['W02-15']['status']=='COMPLETE'
          assert tasks['W02-17']['status']=='BLOCKED' and not tasks['W02-17']['proof']
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['w02_obligation_count']==47
          goal=json.loads(Path('GOAL_STATE.json').read_text())
          assert goal['parity']['total']==7565 and goal['parity']['verified']==0
          PY
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-recovery-performance/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"
      - name: Append canonical claim and rebuild ContextPack
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          claim=json.loads(Path('sessions/20260922-w02-recovery-performance/CLAIM.json').read_text())
          path=Path('ledgers/CLAIM_LEDGER.ndjson')
          rows=[json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          if not any(row.get('claim_id')==claim['claim_id'] and row.get('event')=='CLAIM' for row in rows):
              record={k:claim[k] for k in ('schema_version','project_id','checkpoint','parent_wave','wave_id','canonical_task','claim_id','owner','date','event','status','base_head','coordination','scope')}
              with path.open('a',encoding='utf-8') as fh:
                  fh.write(json.dumps(record,sort_keys=True,separators=(',',':'))+'\n')
          PY
          python scripts/context/build_context_pack.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m unittest -v tests.test_cp03_w02_plan
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          ctx=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          active=[row for row in ctx['active_claims'] if row.get('claim_id')=='CLAIM-CP03-W02-RECOVERY-PERF-20260922']
          assert len(active)==1, active
          PY
          git diff --check
      - name: Restrict claim mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={'ledgers/CLAIM_LEDGER.ndjson','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md'}
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          assert changed <= allowed, f'out-of-scope claim mutation: {sorted(changed-allowed)}'
          assert 'ledgers/CLAIM_LEDGER.ndjson' in changed
          PY
      - name: CAS persist claim
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-recovery-performance-20260922 | cut -f1)" = "$expected_head"
          git fetch origin main
          base="$(python -c "import json; print(json.load(open('sessions/20260922-w02-recovery-performance/CLAIM.json'))['base_head'])")"
          test "$(git rev-parse origin/main)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ledgers/CLAIM_LEDGER.ndjson .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'coord(cp03-w02): claim W02-16 recovery retest'
          git push origin HEAD:wave/cp03/w02-recovery-performance-20260922
