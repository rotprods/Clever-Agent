name: CP03 W00 Hermetic OpenJarvis Baseline

on:
  push:
    branches:
      - wave/cp03/openjarvis-adapter
    paths:
      - 'scripts/cp03/baseline.py'
      - 'scripts/cp03/Dockerfile.baseline'
      - 'scripts/agentic/advance.py'
      - 'tests/test_cp03_baseline.py'
      - 'tests/test_agentic_claim_release.py'
      - '.github/workflows/cp03-w00-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cp03-w00-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.sha }}
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
      MARKERS: not live and not cloud and not hub and not docker and not apple and not nvidia and not amd and not live_channel and not live_external and not modal and not macos15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test baseline compiler and claim reconciler before upstream execution
        run: |
          python -m compileall -q scripts/cp03 scripts/agentic tests/test_cp03_baseline.py tests/test_agentic_claim_release.py
          python -m unittest discover -s tests -p 'test_cp03_baseline.py' -v
          python -m unittest discover -s tests -p 'test_agentic_claim_release.py' -v
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Acquire exact pinned OpenJarvis source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          test "$(git -C /tmp/openjarvis remote get-url origin)" = 'https://github.com/open-jarvis/OpenJarvis.git'
      - name: Build dependency-frozen test image
        shell: bash
        run: |
          set -euo pipefail
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-openjarvis-baseline:$SOURCE_SHA" /tmp/openjarvis
          docker image inspect "clever-openjarvis-baseline:$SOURCE_SHA" --format '{{.Id}}' > /tmp/image-id
      - name: Select pure hermetic reference tests
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            tests/core/test_events.py
            tests/core/test_registry.py
            tests/core/test_types.py
            tests/memory/test_fact_store.py
            tests/traces
            tests/scheduler
          )
          : > /tmp/selected-tests
          for path in "${candidates[@]}"; do
            if test -e "/tmp/openjarvis/$path"; then echo "$path" >> /tmp/selected-tests; fi
          done
          test -s /tmp/selected-tests
          cat /tmp/selected-tests
      - name: Execute upstream tests with network and host privileges removed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cp03/baseline
          mapfile -t selected < /tmp/selected-tests
          container="cp03-w00-${GITHUB_RUN_ID}"
          volume="cp03-w00-evidence-${GITHUB_RUN_ID}"
          docker volume create "$volume" >/dev/null
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker create --name "$container" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 4g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            -v "$volume:/evidence" \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/config \
            -e XDG_DATA_HOME=/tmp/data \
            -e PYTHONHASHSEED=0 \
            -e PYTHONPATH=/src/src \
            -e MARKERS="$MARKERS" \
            "clever-openjarvis-baseline:$SOURCE_SHA" \
            'mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" && /src/.venv/bin/python -m pytest "$@" -p no:cacheprovider -q --tb=short -m "$MARKERS" --junitxml=/evidence/junit.xml' sh "${selected[@]}" >/tmp/container-id
          set +e
          docker start -a "$container"
          rc=$?
          set -e
          docker run --rm \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            -v "$volume:/evidence:ro" \
            --entrypoint /bin/cat \
            "clever-openjarvis-baseline:$SOURCE_SHA" /evidence/junit.xml \
            > evidence/cp03/baseline/junit.xml 2>/dev/null || true
          test -s evidence/cp03/baseline/junit.xml || true
          echo "$rc" > evidence/cp03/baseline/pytest-exit-code.txt
          printf '%s\n' "${selected[@]}" > evidence/cp03/baseline/selected-tests.txt
      - name: Compile hermetic baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              'source_commit': os.environ['OPENJARVIS_SHA'],
              'container_image_id': Path('/tmp/image-id').read_text().strip(),
              'python': '3.12',
              'network_mode': 'none',
              'read_only_root': True,
              'cap_drop_all': True,
              'no_new_privileges': True,
              'secrets_forwarded': False,
              'pythonpath': '/src/src',
              'selected_tests': Path('evidence/cp03/baseline/selected-tests.txt').read_text().splitlines(),
              'marker_expression': os.environ['MARKERS'],
          }
          Path('/tmp/baseline-metadata.json').write_text(json.dumps(metadata))
          PY
          rc="$(cat evidence/cp03/baseline/pytest-exit-code.txt)"
          python -m scripts.cp03.baseline --junit evidence/cp03/baseline/junit.xml --metadata /tmp/baseline-metadata.json --exit-code "$rc"
      - name: Advance W00 only from passing baseline evidence
        run: |
          python -m scripts.agentic.advance \
            --checkpoint CP03 --iteration I03 \
            --complete-task CP03-000 --complete-wave CP03-W00 --complete-subcheckpoint I03.0 \
            --next-task CP03-001 --next-wave CP03-W01 --next-wave-name 'Transport lifecycle and registry bridge' --next-subcheckpoint I03.1 \
            --evidence-id EVID-0013 \
            --evidence-claim 'Pinned OpenJarvis core registry/memory/trace/scheduler baseline executed inside a network-disabled read-only secret-free container; gated suites remain explicitly NOT_RUN.' \
            --run-id "$GITHUB_RUN_ID" --head-sha "$SOURCE_SHA"
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          latest={}
          for raw in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if raw.strip():
                  row=json.loads(raw); latest[row['claim_id']]=row
          assert not any(row.get('wave_id') == 'CP03-W00' and row.get('status') == 'ACTIVE' for row in latest.values())
          PY
          git diff --check
      - name: Upload W00 evidence whether pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp03-w00-openjarvis-baseline-${{ env.SOURCE_SHA }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/cp03/baseline/**
            reports/cp03/OPENJARVIS_BASELINE.*
            reports/cp03/OPENJARVIS_PLATFORM_GAPS.json
      - name: Persist W00 evidence and transition
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/cp03/baseline reports/cp03/OPENJARVIS_BASELINE.* reports/cp03/OPENJARVIS_PLATFORM_GAPS.json \
            GOAL_STATE.json EXECUTION_STATE.json STATE.md HANDOFF.md TASKS.md iterations/03/STATE.json \
            .agentic/CONFIG.yaml .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md .agentic/context/NEXT_ACTIONS.json \
            ledgers/EVIDENCE_LEDGER.ndjson ledgers/WAVE_LEDGER.ndjson ledgers/RUN_LOG.ndjson ledgers/CLAIM_LEDGER.ndjson
          git commit -m 'test(cp03): persist hermetic OpenJarvis baseline and open W01'
          git push origin "HEAD:${GITHUB_REF_NAME}"
