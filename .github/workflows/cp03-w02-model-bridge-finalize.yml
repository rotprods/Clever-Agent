name: CP03 W02 Model Bridge Finalize

on:
  push:
    branches: [wave/cp03/w02-model-engine-bridge-20260921]
    paths:
      - 'scripts/cp03/finalize_w02_model_bridge.py'
      - 'tests/test_cp03_w02_model_bridge_finalizer.py'
      - 'tests/test_cp03_w02_plan.py'
      - '.github/workflows/cp03-w02-model-bridge-finalize.yml'

permissions:
  contents: write

concurrency:
  group: cp03-w02-model-bridge-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact-head and claim preflight
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-model-engine-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']: row for row in graph['tasks']}
          assert graph['first_executable_task']=='W02-08'
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert tasks['W02-06']['status']=='COMPLETE' and tasks['W02-06']['proof']
          assert tasks['W02-07']['status']=='COMPLETE' and tasks['W02-07']['proof']
          assert tasks['W02-08']['status']=='READY' and not tasks['W02-08']['proof']
          assert tasks['W02-09']['status']=='BLOCKED' and not tasks['W02-09']['proof']
          assert tasks['W02-10']['status']=='BLOCKED'
          latest={}
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              if line.strip():
                  row=json.loads(line)
                  if row.get('claim_id'):
                      latest[row['claim_id']]=row
          claim=latest['CLAIM-CP03-W02-MODEL-BRIDGE-20260921']
          assert claim['status']=='ACTIVE'
          assert not [row for cid,row in latest.items() if cid != claim['claim_id'] and row.get('status')=='ACTIVE']
          PY
      - name: Install deterministic Python prerequisites
        run: python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'jsonschema==4.25.1'
      - name: Re-prove W02-08 lifecycle and finalizer RED GREEN contracts
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_cp03_w02_model_bridge \
            tests.test_cp03_openjarvis_sidecar \
            tests.test_cp03_w02_model_bridge_finalizer \
            tests.test_cp03_w02_plan
          python -m py_compile adapters/openjarvis/model_bridge.py scripts/cp03/finalize_w02_model_bridge.py
      - name: Build exact pinned OpenJarvis image
        run: |
          set -euo pipefail
          git init /tmp/openjarvis
          git -C /tmp/openjarvis remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis fetch --depth 1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis checkout --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis rev-parse HEAD)" = "$OPENJARVIS_SHA"
          docker build -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.baseline" -t "clever-openjarvis-w02-08-finalize-base:$GITHUB_SHA" /tmp/openjarvis
          mkdir -p /tmp/openjarvis-w02-08-finalize-context
          docker build \
            --build-arg "BASE_IMAGE=clever-openjarvis-w02-08-finalize-base:$GITHUB_SHA" \
            -f "$GITHUB_WORKSPACE/scripts/cp03/Dockerfile.openjarvis-sidecar" \
            -t "clever-openjarvis-w02-08-finalize:$GITHUB_SHA" \
            /tmp/openjarvis-w02-08-finalize-context
      - name: Re-prove native catalog without network or inference
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -e HOME=/tmp/home \
            -e XDG_CONFIG_HOME=/tmp/config \
            -e XDG_DATA_HOME=/tmp/data \
            -e PYTHONHASHSEED=0 \
            -e PYTHONPATH=/clever:/src/src \
            -v "$GITHUB_WORKSPACE:/clever:ro" \
            "clever-openjarvis-w02-08-finalize:$GITHUB_SHA" \
            'exec /src/.venv/bin/python /clever/adapters/openjarvis/model_bridge.py --dump-catalog' \
            > /tmp/w02-08-native-catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/w02-08-native-catalog.json').read_text())
          assert data['upstream_commit']=='72033b8ec288aa067ce4530ff9d96bf231e9c4e5'
          assert data['engine_count'] > 0
          assert data['model_count'] > 0
          assert data['upstream_execution'] is False
          assert data['model_executions'] == 0
          assert data['provider_egress_executions'] == 0
          assert data['parity_promotions'] == 0
          assert all(row['state']=='REGISTERED' for row in data['engines'])
          assert all(row['state']=='REGISTERED' for row in data['models'])
          print(json.dumps({'engine_count':data['engine_count'],'model_count':data['model_count'],'import_failures':data['import_failures']},sort_keys=True))
          PY
      - name: Exact-head regression and W02-07 security gauntlet
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_cp03_w02_inference_contract tests.test_cp03_w02_egress
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security -- --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel -- --skip real_openjarvis_sidecar_is_supervised_and_bridged_without_promotion
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m scripts.parity.ledger --check --source-repo openjarvis
      - name: Finalize W02-08 durable state
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-model-engine-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          python scripts/cp03/finalize_w02_model_bridge.py \
            --run-id "$GITHUB_RUN_ID" \
            --validated-head "$GITHUB_SHA" \
            --catalog-path /tmp/w02-08-native-catalog.json
          python scripts/context/build_context_pack.py
          python -m unittest -v tests.test_cp03_w02_model_bridge_finalizer tests.test_cp03_w02_plan
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/context/validate_next_actions.py
          python -m scripts.parity.ledger --check --source-repo openjarvis
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          assert graph['global_denominator']==7565
          assert graph['openjarvis_obligations']==646
          assert graph['first_executable_task']=='W02-09'
          assert tasks['W02-08']['status']=='COMPLETE' and tasks['W02-08']['proof']
          assert tasks['W02-08']['proof'][-1]['parity_promotions']==0
          assert tasks['W02-08']['proof'][-1]['model_executions']==0
          assert tasks['W02-08']['proof'][-1]['provider_egress_executions']==0
          assert tasks['W02-09']['status']=='READY' and not tasks['W02-09']['proof']
          assert tasks['W02-10']['status']=='BLOCKED'
          context=json.loads(Path('.agentic/context/CURRENT_CONTEXT.json').read_text())
          assert not context['active_claims']
          assert 'D-0013' in context['accepted_decision_ids']
          PY
          git diff --check
      - name: Compare-and-swap persist W02-08 completion
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-model-engine-bridge-20260921 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            iterations/03/waves/CP03-W02/TASK_GRAPH.json \
            evidence/cp03/cp03-w02/W02-08 \
            ledgers/CLAIM_LEDGER.ndjson \
            ledgers/EVIDENCE_LEDGER.ndjson \
            ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson \
            ledgers/DECISION_LEDGER.ndjson \
            ledgers/RISK_LEDGER.ndjson \
            HANDOFF.md \
            .agentic/context/CURRENT_CONTEXT.json \
            .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'chore(cp03-w02): finalize W02-08 model engine bridge'
          git push origin HEAD:wave/cp03/w02-model-engine-bridge-20260921
