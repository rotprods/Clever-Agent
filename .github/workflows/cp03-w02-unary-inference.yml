name: CP03 W02 Unary Inference G3

on:
  push:
    branches: [wave/cp03/w02-unary-inference-20260921]
    paths:
      - '.github/workflows/cp03-w02-unary-inference.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-unary-g3-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENJARVIS_SHA: 72033b8ec288aa067ce4530ff9d96bf231e9c4e5
  LLAMACPP_SHA: 391fac16460f15233a7740550d858ac96df3419d
  MODEL_PATH: /tmp/clever-w02-10/Qwen_Qwen3-0.6B-Q4_K_M.gguf
  LLAMACPP_HOST: http://127.0.0.1:8080

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile exact frontier and active claim
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('iterations/03/waves/CP03-W02/TASK_GRAPH.json').read_text())
          tasks={row['id']:row for row in graph['tasks']}
          task=tasks['W02-10']
          assert graph['first_executable_task']=='W02-10'
          assert task['status']=='READY' and not task['proof']
          assert all(tasks[d]['status']=='COMPLETE' and tasks[d]['proof'] for d in task['depends_on'])
          assert graph['global_denominator']==7565 and graph['openjarvis_obligations']==646
          latest=None
          for line in Path('ledgers/CLAIM_LEDGER.ndjson').read_text().splitlines():
              row=json.loads(line)
              if row.get('claim_id')=='CLAIM-CP03-W02-UNARY-INFERENCE-20260921' and row.get('status'):
                  latest=row['status']
          assert latest=='ACTIVE', latest
          PY
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python scripts/cp03/validate_w02_plan.py
          python -m scripts.parity.ledger --check --source-repo openjarvis

      - name: Install bounded Python runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt 'httpx>=0.27,<1'

      - name: Fetch exact pinned OpenJarvis source
        run: |
          set -euo pipefail
          rm -rf /tmp/openjarvis-w02-10
          git init -q /tmp/openjarvis-w02-10
          git -C /tmp/openjarvis-w02-10 remote add origin https://github.com/open-jarvis/OpenJarvis.git
          git -C /tmp/openjarvis-w02-10 fetch -q --depth=1 origin "$OPENJARVIS_SHA"
          git -C /tmp/openjarvis-w02-10 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/openjarvis-w02-10 rev-parse HEAD)" = "$OPENJARVIS_SHA"
          PYTHONPATH=/tmp/openjarvis-w02-10/src python - <<'PY'
          import openjarvis.engine
          import openjarvis.intelligence as intelligence
          from openjarvis.core.registry import EngineRegistry, ModelRegistry
          intelligence.register_builtin_models()
          assert EngineRegistry.contains('llamacpp')
          spec=ModelRegistry.get('qwen3:0.6b')
          assert 'llamacpp' in tuple(spec.supported_engines)
          PY

      - name: Fetch and build exact pinned llama.cpp runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/llama.cpp-w02-10
          git init -q /tmp/llama.cpp-w02-10
          git -C /tmp/llama.cpp-w02-10 remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp-w02-10 fetch -q --depth=1 origin "$LLAMACPP_SHA"
          git -C /tmp/llama.cpp-w02-10 checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp-w02-10 rev-parse HEAD)" = "$LLAMACPP_SHA"
          cmake -S /tmp/llama.cpp-w02-10 -B /tmp/llama.cpp-w02-10/build -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp-w02-10/build --target llama-server -j2
          test -x /tmp/llama.cpp-w02-10/build/bin/llama-server
          sha256sum /tmp/llama.cpp-w02-10/build/bin/llama-server > /tmp/llama-server.sha256

      - name: Controlled acquire and re-attest exact W02-09 model
        env:
          CLEVER_ALLOW_MODEL_ACQUISITION: '1'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_PATH")"
          python scripts/cp03/w02_real_model.py acquire --artifact "$MODEL_PATH" --receipt /tmp/w02-10-acquire.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/w02-10-acquire.json'))
          assert row['status']=='PASS', row
          assert row['observed_size_bytes']==484220320
          assert row['observed_sha256']=='9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14'
          assert row['observed_magic_hex']=='47475546'
          assert row['model_executions']==0 and row['parity_promotions']==0
          PY

      - name: Start exact local llama.cpp server
        run: |
          set -euo pipefail
          /tmp/llama.cpp-w02-10/build/bin/llama-server \
            --model "$MODEL_PATH" \
            --alias 'qwen3:0.6b' \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 2048 \
            --threads 2 \
            --parallel 1 \
            >/tmp/w02-10-llama-server.log 2>&1 &
          echo $! >/tmp/w02-10-llama-server.pid
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/v1/models >/tmp/w02-10-models.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/w02-10-llama-server.log
            exit 1
          fi
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/w02-10-models.json'))
          ids={row.get('id') for row in payload.get('data',[])}
          assert 'qwen3:0.6b' in ids, ids
          PY

      - name: RED guard — malformed and unapproved requests stop before engine creation
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/contracts/sdk/python/gen" python -m unittest tests.test_cp03_w02_unary_inference -v

      - name: GREEN — one real Rust to OpenJarvis unary inference
        env:
          CLEVER_OPENJARVIS_SRC: /tmp/openjarvis-w02-10/src
          CLEVER_W02_MODEL_PATH: /tmp/clever-w02-10/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          LLAMACPP_HOST: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor real_openjarvis_unary_inference_uses_pinned_llamacpp_lane -- --exact --nocapture

      - name: Regression and gauntlet
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test inference_security
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --lib
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check

      - name: Build exact G3 evidence receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          binary='/tmp/llama.cpp-w02-10/build/bin/llama-server'
          h=hashlib.sha256(open(binary,'rb').read()).hexdigest()
          out={
            'schema_version':1,
            'project_id':'CLEVER-JARVIS-001',
            'checkpoint':'CP03',
            'parent_wave':'CP03-W02',
            'task':'W02-10',
            'gate':'G3',
            'status':'PASS',
            'validated_head':os.environ['GITHUB_SHA'],
            'github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),
            'openjarvis_commit':os.environ['OPENJARVIS_SHA'],
            'engine':'llamacpp',
            'runtime_commit':os.environ['LLAMACPP_SHA'],
            'runtime_binary_sha256':h,
            'model_id':'qwen3:0.6b',
            'artifact_filename':'Qwen_Qwen3-0.6B-Q4_K_M.gguf',
            'artifact_size_bytes':484220320,
            'artifact_sha256':'9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14',
            'correlated_chunk_terminal':True,
            'invalid_input_pre_engine_test':'PASS',
            'runtime_executed':True,
            'model_executions':1,
            'provider_egress_executions':0,
            'tool_executions':0,
            'streaming_executions':0,
            'parity_promotions':0,
            'verified_capabilities':0,
            'global_denominator':7565,
            'openjarvis_obligations':646,
            'w02_proof_units':47,
          }
          open('/tmp/w02-10-receipt.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload proof receipt and bounded runtime logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp03-w02-unary-g3-${{ github.sha }}
          path: |
            /tmp/w02-10-receipt.json
            /tmp/w02-10-llama-server.log
            /tmp/w02-10-models.json
            /tmp/llama-server.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Stop local runtime
        if: always()
        run: |
          if [ -f /tmp/w02-10-llama-server.pid ]; then
            kill "$(cat /tmp/w02-10-llama-server.pid)" 2>/dev/null || true
          fi

  finalize:
    if: github.event_name == 'push'
    needs: prove
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cp03-w02-unary-g3-${{ github.sha }}
          path: /tmp/w02-10-evidence
      - name: Exact-head durable W02-10 transition
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)" = "$GITHUB_SHA"
          python sessions/20260921-w02-unary-inference/finalize.py --receipt /tmp/w02-10-evidence/w02-10-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('sessions/20260921-w02-unary-inference/CLAIM.json')
          row=json.loads(p.read_text())
          row['status']='RELEASED'
          row['release_evidence_id']='EVID-W02-UNARY-INFERENCE-20260921'
          p.write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          PY
          python scripts/context/build_context_pack.py
      - name: Post-transition regression and gauntlet
        run: |
          set -euo pipefail
          python -m unittest tests.test_cp03_w02_plan tests.test_cp03_w02_unary_inference -v
          python scripts/cp03/validate_w02_plan.py
          python scripts/validate_agentic_state.py
          python scripts/context/validate_context_pack.py
          python scripts/context/build_context_pack.py --check
          python -m scripts.parity.ledger --check --source-repo openjarvis
          git diff --check
      - name: Restrict durable transition mutation
        run: |
          python - <<'PY'
          import subprocess
          allowed_prefixes=('evidence/cp03/cp03-w02/W02-10/','sessions/20260921-w02-unary-inference/')
          allowed_exact={
            'iterations/03/waves/CP03-W02/TASK_GRAPH.json',
            'tests/test_cp03_w02_plan.py',
            'ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/RUN_LOG.ndjson',
            'ledgers/WAVE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson',
            'HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json','.agentic/context/CURRENT_CONTEXT.md',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected={p for p in paths if p not in allowed_exact and not p.startswith(allowed_prefixes)}
          assert not unexpected, sorted(unexpected)
          required={'iterations/03/waves/CP03-W02/TASK_GRAPH.json','tests/test_cp03_w02_plan.py','ledgers/CLAIM_LEDGER.ndjson','ledgers/EVIDENCE_LEDGER.ndjson','ledgers/DECISION_LEDGER.ndjson','ledgers/RISK_LEDGER.ndjson','HANDOFF.md','.agentic/context/CURRENT_CONTEXT.json'}
          missing=required-paths
          assert not missing, sorted(missing)
          PY
      - name: CAS persist evidence, state, handoff and ContextPack
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/wave/cp03/w02-unary-inference-20260921 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            iterations/03/waves/CP03-W02/TASK_GRAPH.json \
            tests/test_cp03_w02_plan.py \
            evidence/cp03/cp03-w02/W02-10 \
            sessions/20260921-w02-unary-inference \
            ledgers/CLAIM_LEDGER.ndjson ledgers/EVIDENCE_LEDGER.ndjson ledgers/RUN_LOG.ndjson \
            ledgers/WAVE_LEDGER.ndjson ledgers/DECISION_LEDGER.ndjson ledgers/RISK_LEDGER.ndjson \
            HANDOFF.md .agentic/context/CURRENT_CONTEXT.json .agentic/context/CURRENT_CONTEXT.md
          git commit -m 'state(cp03-w02): complete W02-10 real unary inference'
          git push origin HEAD:wave/cp03/w02-unary-inference-20260921
