name: CP03 W02 IO Backpressure

on:
  push:
    branches: [wave/cp03/w02-io-backpressure]
    paths:
      - 'scripts/cp03/w02_io_harness.py'
      - '.github/workflows/cp03-w02-io-backpressure.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kernel/crates/clever-kernel/src/adapter.rs'
      - 'kernel/crates/clever-kernel/tests/adapter_supervisor.rs'
      - 'kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py'
      - 'scripts/cp03/w02_io_harness.py'
      - '.github/workflows/cp03-w02-io-backpressure.yml'

permissions:
  contents: read

concurrency:
  group: cp03-w02-io-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply deterministic bounded-I/O slice
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('scripts/cp03/w02_io_harness.py'); t=p.read_text(encoding='utf-8'); old='                    Err(error) => {\\n                        if let Err(TrySendError::Full(_)) = sender.try_send(Err(error.clone())) {\\n                            reader_state.poison(error);\\n                        }\\n                        break;\\n                    }\\n'; new='                    Err(error) => {\\n                        reader_state.poison(error.clone());\\n                        let _ = sender.try_send(Err(error));\\n                        break;\\n                    }\\n'; assert new in t or t.count(old)==1, 'reader-error compiler block mismatch'; p.write_text(t if new in t else t.replace(old,new,1), encoding='utf-8')"
          python scripts/cp03/w02_io_harness.py --apply
          cargo fmt --manifest-path kernel/Cargo.toml --all
          python scripts/cp03/w02_io_harness.py --check
          python -m py_compile scripts/cp03/w02_io_harness.py kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py
          git diff --check
      - name: Prove fake adversarial I/O cases
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor outbound_write_timeout_poison_session_when_peer_stops_reading -- --exact --nocapture
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Restrict generated source mutation
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'kernel/crates/clever-kernel/src/adapter.rs',
            'kernel/crates/clever-kernel/tests/adapter_supervisor.rs',
            'kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py',
            'scripts/cp03/w02_io_harness.py',
          }
          paths={line[3:] for line in subprocess.check_output(['git','status','--porcelain=v1','-uall'],text=True).splitlines() if line}
          unexpected=paths-allowed
          assert not unexpected, f'out-of-scope W02-03 source mutation: {sorted(unexpected)}'
          assert paths, 'deterministic compiler produced no source delta'
          PY
      - name: Compare-and-swap persist bounded-I/O slice
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/wave/cp03/w02-io-backpressure | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/crates/clever-kernel/src/adapter.rs kernel/crates/clever-kernel/tests/adapter_supervisor.rs kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py scripts/cp03/w02_io_harness.py
          git commit -m 'feat(cp03-w02): bound adapter I/O and write completion'
          git push origin HEAD:wave/cp03/w02-io-backpressure

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate W02-03 source contract
        run: |
          set -euo pipefail
          python scripts/cp03/w02_io_harness.py --check
          python -m py_compile scripts/cp03/w02_io_harness.py kernel/crates/clever-kernel/tests/fixtures/fake_adapter_sidecar.py
          cargo fmt --manifest-path kernel/Cargo.toml --all -- --check
          git diff --check
      - name: Re-prove bounded I/O behavior
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r contracts/sdk/python/requirements.txt
          export CLEVER_TEST_PYTHON="$(command -v python)"
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_frame_queue_is_bounded_under_flood -- --exact --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor inbound_wire_byte_budget_is_enforced_before_decode -- --exact --nocapture
          cargo test --locked --manifest-path kernel/Cargo.toml -p clever-kernel --test adapter_supervisor outbound_write_timeout_poison_session_when_peer_stops_reading -- --exact --nocapture
          cargo clippy --locked --manifest-path kernel/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          python -m scripts.parity.ledger --check --source-repo openjarvis
