syntax = "proto3";

package clever.v1;

import "google/protobuf/timestamp.proto";
import "clever/v1/common.proto";

message TraceMetric {
  string name = 1;
  double value = 2;
  string unit = 3;
}

message TraceSpan {
  ContractVersion contract_version = 1;
  string trace_id = 2;
  string span_id = 3;
  string parent_span_id = 4;
  string correlation_id = 5;
  string runtime_id = 6;
  string capability_id = 7;
  string operation = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp ended_at = 10;
  repeated TraceMetric metrics = 11;
  repeated EvidenceRef evidence = 12;
  string outcome = 13;
  string promotion_candidate_id = 14;
}
