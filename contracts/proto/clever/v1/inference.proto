syntax = "proto3";

package clever.v1;

import "clever/v1/common.proto";
import "clever/v1/identity.proto";
import "google/protobuf/timestamp.proto";

// Inference messages carry cognition data only. They cannot grant egress,
// budget, tool-execution or parity authority.
enum InferenceRole {
  INFERENCE_ROLE_UNSPECIFIED = 0;
  INFERENCE_ROLE_SYSTEM = 1;
  INFERENCE_ROLE_USER = 2;
  INFERENCE_ROLE_ASSISTANT = 3;
  INFERENCE_ROLE_TOOL = 4;
}

enum InferenceFinishReason {
  INFERENCE_FINISH_REASON_UNSPECIFIED = 0;
  INFERENCE_FINISH_REASON_STOP = 1;
  INFERENCE_FINISH_REASON_LENGTH = 2;
  INFERENCE_FINISH_REASON_CANCELLED = 3;
  INFERENCE_FINISH_REASON_CONTENT_FILTER = 4;
  INFERENCE_FINISH_REASON_TOOL_CALL = 5;
  INFERENCE_FINISH_REASON_ERROR = 6;
}

enum InferenceErrorCode {
  INFERENCE_ERROR_CODE_UNSPECIFIED = 0;
  INFERENCE_ERROR_CODE_INVALID_REQUEST = 1;
  INFERENCE_ERROR_CODE_ENGINE_UNAVAILABLE = 2;
  INFERENCE_ERROR_CODE_MODEL_UNAVAILABLE = 3;
  INFERENCE_ERROR_CODE_DEADLINE_EXCEEDED = 4;
  INFERENCE_ERROR_CODE_BUDGET_EXCEEDED = 5;
  INFERENCE_ERROR_CODE_CANCELLED = 6;
  INFERENCE_ERROR_CODE_BUSY = 7;
  INFERENCE_ERROR_CODE_INTERNAL = 8;
}

enum InferenceUsageMeasurement {
  INFERENCE_USAGE_MEASUREMENT_UNSPECIFIED = 0;
  INFERENCE_USAGE_MEASUREMENT_UNKNOWN = 1;
  INFERENCE_USAGE_MEASUREMENT_ESTIMATED = 2;
  INFERENCE_USAGE_MEASUREMENT_EXACT = 3;
}

message InferenceInput {
  InferenceRole role = 1;
  string content = 2;
  string name = 3;
}

message InferenceConfig {
  uint64 max_output_tokens = 1;
  optional float temperature = 2;
  optional float top_p = 3;
  repeated string stop_sequences = 4;
  bool stream = 5;
}

message InferenceUsage {
  InferenceUsageMeasurement measurement = 1;
  optional uint64 input_tokens = 2;
  optional uint64 output_tokens = 3;
  optional uint64 total_tokens = 4;
}

message InferenceRequest {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  PrincipalRef principal = 4;
  string session_id = 5;
  string engine_id = 6;
  string model_id = 7;
  repeated InferenceInput inputs = 8;
  InferenceConfig config = 9;
  google.protobuf.Timestamp deadline_at = 10;
  string idempotency_key = 11;
  // Caller-supplied JSON Schema. It is validation data only and carries no
  // execution, policy, egress or capability authority.
  optional string response_schema_json = 12;
}

message InferenceChunk {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  uint64 sequence = 4;
  string text_delta = 5;
}

// A fully assembled native model tool-call. This is inert cognition data: the
// contract deliberately contains no execution target, grant, capability token
// or transport metadata that can authorize a tool invocation.
message InferenceToolCall {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  uint32 index = 4;
  string call_id = 5;
  string name = 6;
  string arguments_json = 7;
}

// A schema-validated structured value serialized as canonical JSON data.
message InferenceStructuredOutput {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  string json_value = 4;
}

message InferenceTerminal {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  uint64 final_sequence = 4;
  InferenceFinishReason finish_reason = 5;
  InferenceUsage usage = 6;
}

message InferenceError {
  ContractVersion contract_version = 1;
  string request_id = 2;
  string attempt_id = 3;
  InferenceErrorCode code = 4;
  string message = 5;
  bool retryable = 6;
}

message InferenceCancel {
  ContractVersion contract_version = 1;
  string target_request_id = 2;
  string target_attempt_id = 3;
  string reason = 4;
}
